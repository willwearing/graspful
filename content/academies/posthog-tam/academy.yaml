academy:
  id: posthog-tam
  name: PostHog TAM Academy
  description: 'A data and identity foundation for PostHog TAMs: inspect tracking contracts, trace identity and
    group attribution, validate SQL metrics, and plan bounded ingestion recovery.'
  version: '1.2'
parts:
- id: foundations
  name: Foundations
  description: Core data modeling and pipeline concepts, then PostHog-specific model and ingestion.
courses:
- id: data-models
  name: Data Models
  description: 'Generic data modeling concepts: entities, attributes, keys, relationships, cardinality, join tables,
    and the design process.'
  part: foundations
  file: courses/data-models.yaml
- id: data-pipelines
  name: Data Pipelines
  description: 'Generic pipeline concepts: ingestion patterns, storage layers, transformation, orchestration,
    serving, and operational tradeoffs.'
  part: foundations
  file: courses/data-pipelines.yaml
- id: posthog-data-model
  name: PostHog Data Model
  description: Events, person-property time semantics, identity transitions, account attribution, cohorts, CDP
    delivery, and scaffolded SQL with join and denominator fixtures.
  part: foundations
  file: courses/posthog-data-model.yaml
- id: posthog-ingestion-pipeline
  name: PostHog Ingestion Pipeline
  description: Capture contracts and lifecycle delivery, acceptance versus ingestion, scoped distributed-storage
    reasoning, person-processing cost rules, and bounded quota/recovery diagnosis.
  part: foundations
  file: courses/posthog-ingestion-pipeline.yaml
