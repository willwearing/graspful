concepts:
- id: ph-events
  name: 'PostHog Events: The Atomic Unit'
  difficulty: 3
  estimatedMinutes: 18
  tags:
  - posthog
  - data-model
  section: posthog-data-model
  prerequisites:
  - data-pipelines:pipeline-tradeoffs
  encompassing:
  - concept: data-models:entities
    weight: 0.35
  knowledgePoints:
  - id: what-is-a-posthog-event
    instruction: 'A **PostHog event** records an occurrence with an event name, a distinct ID, properties, and
      a timestamp. The stored record and the capture request have different contracts. For direct capture, supply
      the project token, event name, and distinct ID. The capture API can assign a timestamp when you omit one.


      Use an explicit occurrence timestamp for delayed historical events. A project token routes capture to a
      project; it is different from a personal API key used for administrative access.


      Application boundary: Capture time defaults cannot recover the actual occurrence. Preserve each source timestamp
      and verify units, timezone, and bounded search.'
    workedExample: A server reports invoice_paid for user_42 with amount_cents = 2500. If it sends the event hours
      later, it supplies the actual payment time so time-based analysis reflects the occurrence.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/api/capture
      title: 'PostHog Events: The Atomic Unit: what is a posthog event'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: Capture time defaults cannot recover the actual occurrence. Preserve each source timestamp and verify
        units, timezone, and bounded search.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: A server reports invoice_paid for user_42 with amount_cents = 2500. If it sends the event hours later,
        it supplies the actual payment time so time-based analysis reflects the occurrence.
    problems:
    - question: Which statement correctly distinguishes a stored event from a direct capture request?
      options:
      - Stored events can omit timestamps entirely.
      - Stored time; request can use default.
      - The project token supplies occurrence time.
      - Every capture request requires an explicit timestamp.
      correct: 1
      explanation: Check the request contract separately from the stored model. The API can supply a timestamp,
        but delayed events usually need their real occurrence time.
      id: 9a61d61e-5ab2-4e50-9474-4e31bbd42bdd
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: A direct capture payload includes event = invoice_paid and properties.distinct_id = user_42, but
        no project token. Which required routing information is missing?
      options:
      - A company group key.
      - A profile email address.
      - Destination project token.
      - A browser session ID.
      correct: 2
      explanation: The project token identifies the capture destination. Email, recordings, and group membership
        are not universal requirements for an event.
      id: 41a171ca-893c-49a1-9d8f-7d14424fd73c
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: A direct capture sends yesterday's invoice_paid today without timestamp. The event appears today.
        Which change preserves occurrence-time reporting?
      options:
      - Use timezone changes to move delayed data.
      - Stamp each batch at its upload time.
      - Assign midnight to all historical purchases.
      - Send/test occurrence timestamps.
      correct: 3
      explanation: Capture time defaults cannot recover the actual occurrence. Preserve each source timestamp
        and verify units, timezone, and bounded search.
      type: scenario
      difficulty: 4
      id: 568c617d-9cbf-4ec2-ad06-16c32363f8f2
      purpose: practice
      isTransfer: true
    - question: A payload has api_key and event, but distinct_id is absent at both supported locations. Which
        field is missing from the capture contract?
      options:
      - Actor distinct_id.
      - Profile email.
      - Company group key.
      - Browser session ID.
      correct: 0
      explanation: Capture needs an actor identifier. A stored person profile, company key, and replay URL are
        not required substitutes.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-events-what-is-a-posthog-event-exam-1
      purpose: exam
      isTransfer: true
    - question: A payload has top-level distinct_id=user_9 and properties.distinct_id=user_8. The integration
        intended user_8. Which contract issue must be corrected?
      options:
      - Property actor wins over top-level.
      - Conflicting actor fields; top-level wins.
      - Each field creates an independent event copy.
      - Both IDs link automatically from this capture.
      correct: 1
      explanation: Use one explicit actor representation consistently. The documented top-level field wins when
        both locations exist.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-events-what-is-a-posthog-event-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: data-pipelines:what-is-a-pipeline
  - id: immutable-facts-and-default-events
    instruction: 'Treat **event facts** as records of what happened. A later state change should normally produce
      a new event or a separate current-state update. Do not assume an old event will silently change with the
      application record.


      Reserved names such as $pageview have defined SDK meanings. A capture plan should define custom business
      events and avoid double-counting the same occurrence through automatic and manual capture.


      Application boundary: Observe the actual duplicate capture paths. URL equality cannot distinguish legitimate
      repeat visits, and a fixed divisor hides variable duplication.'
    workedExample: An order is submitted and later canceled. order_submitted and order_canceled preserve the sequence.
      A current order-status field can separately show canceled.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/api/capture
      title: 'PostHog Events: The Atomic Unit: immutable facts and default events'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: Observe the actual duplicate capture paths. URL equality cannot distinguish legitimate repeat visits,
        and a fixed divisor hides variable duplication.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: An order is submitted and later canceled. order_submitted and order_canceled preserve the sequence.
        A current order-status field can separately show canceled.
    problems:
    - question: Which event name commonly represents a page view captured by the web SDK?
      options:
      - $set
      - $groupidentify
      - $pageview
      - $identify
      correct: 2
      explanation: Reserved event names have specific meanings. Page views, identity transitions, and property
        updates should not be substituted for each other.
      id: 5deab952-8c8e-4647-bb93-01a131680581
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: An order was submitted at 09:00 and canceled at 10:00. You need to analyze both actions. Which
        event design preserves that history?
      options:
      - Keep only nightly current status.
      - Rewrite submitted to canceled.
      - Change actor ID on cancellation.
      - Separate submitted/canceled occurrences.
      correct: 3
      explanation: Separate events preserve each occurrence and its time. Current state alone cannot reconstruct
        the action sequence.
      id: 5a3763a9-452d-47cf-80f7-b4328c1d1cd8
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: One navigation produces two $pageview requests, one automatic and one manual. Repeated visits
        must remain countable. Which repair fits?
      options:
      - One navigation owner; test occurrence count.
      - Deduplicate every repeated page URL.
      - Keep both paths and divide all counts by two.
      - Rename one duplicate and sum both as visits.
      correct: 0
      explanation: Observe the actual duplicate capture paths. URL equality cannot distinguish legitimate repeat
        visits, and a fixed divisor hides variable duplication.
      type: scenario
      difficulty: 4
      id: 5a65d373-a75c-42cc-b6b3-e441f9d9b805
      purpose: practice
      isTransfer: true
    - question: Order 18 was paid, then refunded. A report needs the two event times and the amount at each occurrence.
        Which design preserves the evidence?
      options:
      - Overwrite paid with the latest refund state.
      - Separate refund occurrence referencing the order.
      - Store only net amount on the current order.
      - Copy current refund status onto all historical events.
      correct: 1
      explanation: Business-state changes are separate occurrences. Reference the same order while retaining each
        fact and timestamp.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-events-immutable-facts-and-default-events-exam-1
      purpose: exam
      isTransfer: true
    - question: A team wants to correct an accidentally stored event property. What should the tracking review
        separate?
      options:
      - Every new capture replaces matching old rows.
      - Actions permanently rewrite matched payloads.
      - Occurrence model versus supported correction operations.
      - Event facts mean supported deletion/correction never exists.
      correct: 2
      explanation: An event models a historical fact, but operational correction uses the documented product contract.
        A new capture or action is not a general row-update API.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-events-immutable-facts-and-default-events-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: data-pipelines:what-is-a-pipeline
  - id: custom-vs-autocapture
    instruction: '**Autocapture** records supported user interactions when enabled. A **custom event** names a
      business action that your code explicitly reports. DOM activity can show a button click, but the application
      must establish whether a business operation succeeded.


      Choose a stable semantic event for important outcomes. Verify SDK configuration and supported surfaces before
      relying on automatic collection.


      Application boundary: Business semantics should survive DOM changes. Compare known successful and unsuccessful
      cases, and bound duplicate counting during migration.'
    workedExample: A checkout click can fail validation. Capture purchase_completed only after confirmed success,
      with an order ID that permits reconciliation against the source system.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/api/capture
      title: 'PostHog Events: The Atomic Unit: custom vs autocapture'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: Business semantics should survive DOM changes. Compare known successful and unsuccessful cases, and
        bound duplicate counting during migration.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: A checkout click can fail validation. Capture purchase_completed only after confirmed success, with
        an order ID that permits reconciliation against the source system.
    problems:
    - question: Which event is the clearest semantic measure of a completed purchase?
      options:
      - A pricing pageview.
      - A payment-input focus.
      - A Buy-button click.
      - Confirmed purchase_completed.
      correct: 3
      explanation: Completion requires business confirmation. UI interactions alone can occur before a failed
        or abandoned purchase.
      id: 5cc4694f-ca8d-4b49-89bb-41536c371a44
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: An autocaptured submit click appears, but the API rejected the form. Which conclusion is supported?
      options:
      - Click proved; success unproved.
      - The API rejection disproves the click.
      - A click proves the form saved.
      - Autocapture retries the business operation.
      correct: 0
      explanation: Use the interaction event for interaction evidence. Check the application result or a success
        event before counting completion.
      id: 997aff43-bef9-4a8a-ad16-8fba10d07237
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: A redesign changes the activation button selector. The backend milestone is unchanged. Which migration
        check supports a stable activation metric?
      options:
      - Update selectors and assume equivalence.
      - Validated semantic milestone.
      - Count every new-screen click as activation.
      - Keep old/new capture paths without overlap tests.
      correct: 1
      explanation: Business semantics should survive DOM changes. Compare known successful and unsuccessful cases,
        and bound duplicate counting during migration.
      type: scenario
      difficulty: 4
      id: 61b606d7-5cb1-4a12-be0c-264a17ca1d2c
      purpose: practice
      isTransfer: true
    - question: Checkout autocapture shows clicks for ten orders. Seven have authoritative payment confirmations.
        Which count is supported for completed purchases?
      options:
      - Ten clicks as confirmed purchases.
      - Three failures as purchases.
      - Seven confirmed purchases.
      - Seventeen attempts plus confirmations.
      correct: 2
      explanation: Intent and outcome are separate facts. Failed or abandoned attempts cannot be counted as successful
        transactions.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-events-custom-vs-autocapture-exam-1
      purpose: exam
      isTransfer: true
    - question: Both UI and webhook capture order_paid. Webhook retries are possible. What contract should define
        the success measure?
      options:
      - UI and webhook summed as independent purchases.
      - New event identity for each webhook delivery.
      - Fixed divisor for all completion paths.
      - Authoritative success with stable identity/retry handling.
      correct: 3
      explanation: Choose an authoritative success boundary and preserve traceable identity. Delivery retries
        are not new purchases.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-events-custom-vs-autocapture-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: data-pipelines:what-is-a-pipeline
  sourceRef: https://posthog.com/docs/api/capture; relevant named topic/contract in this concept; verified 2026-10-07.
- id: ph-event-properties
  name: 'Event Properties: Metadata on Events'
  difficulty: 3
  estimatedMinutes: 12
  tags:
  - posthog
  - data-model
  section: posthog-data-model
  prerequisites:
  - ph-events
  encompassing: []
  knowledgePoints:
  - id: default-vs-custom-properties
    instruction: '**Event properties** add context to an occurrence. SDKs can add default properties, while application
      code adds custom ones. Available defaults depend on the SDK and configuration. For web events, $current_url
      describes the full URL and $pathname describes its path.


      Define custom names, types, and units. A property with an inconsistent type is harder to filter and aggregate
      reliably. Property names are exact keys, so plan and Plan are different properties. Keep spelling and case
      consistent with the tracking contract.


      Application boundary: Type consistency does not establish unit consistency. A contract and examples must
      define the conversion boundary.'
    workedExample: For https://app.example.com/pricing?plan=team, the path is /pricing. Use the full URL when
      the host or query string matters, and check that collection is appropriate for the data involved.
    instructionContent:
    - type: link
      url: https://github.com/PostHog/posthog/blob/master/docs/published/handbook/engineering/person-processing.md
      title: 'Event Properties: Metadata on Events: default vs custom properties'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: Type consistency does not establish unit consistency. A contract and examples must define the conversion
        boundary.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: For https://app.example.com/pricing?plan=team, the path is /pricing. Use the full URL when the host
        or query string matters, and check that collection is appropriate for the data involved.
    problems:
    - question: For a web event, which property should you inspect when you need the full URL including host and
        query string?
      options:
      - $current_url
      - $title
      - $host
      - $pathname
      correct: 0
      explanation: The full URL and path serve different needs. A path alone does not contain the host or query
        string.
      id: 7667be7a-70df-4446-bf77-977e6af19aa7
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: You want one report row for /pricing across several hosts and query strings. Which available web
        property most directly represents that path?
      options:
      - $host
      - $pathname
      - $title
      - $current_url without normalization
      correct: 1
      explanation: Use the property whose scope matches the question. Full URLs would split the path by host and
        query parameters unless normalized.
      id: e7be8f7a-c579-4685-ac4e-be6b57fe2e07
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: Backend amount=2000 means cents; browser amount=20 means dollars. Both are numeric. What validation
        prevents a mixed-unit sum?
      options:
      - Numeric-type check without a unit contract.
      - Source-specific unit meanings in one metric.
      - Shared units/types with fixtures.
      - Display-formatted dollars in the numeric field.
      correct: 2
      explanation: Type consistency does not establish unit consistency. A contract and examples must define the
        conversion boundary.
      type: scenario
      difficulty: 4
      id: c2e2f384-f03f-4c7a-a84f-5cfa97fa3a5a
      purpose: practice
      isTransfer: true
    - question: URLs /pricing?campaign=A and /pricing?campaign=B should share a page-path bucket but retain campaign
        attribution. Which property design fits?
      options:
      - Full URL as the only page bucket.
      - Host alone as page identity.
      - Discard campaign before collecting attribution.
      - Path bucket plus separate campaign attribution.
      correct: 3
      explanation: Choose a field at the required grain and retain distinct attribution facts separately. Host
        does not distinguish paths.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-event-properties-default-vs-custom-properties-exam-1
      purpose: exam
      isTransfer: true
    - question: An order property alternates between numeric 42 and string "42". A join to billing fails for one
        source. What should be checked?
      options:
      - Typed identifier mapping across sources.
      - Row-count equality alone.
      - Numeric display equality without typed keys.
      - Source-specific key coercion without fixtures.
      correct: 0
      explanation: Equal-looking strings and numbers can behave differently. Define and test one key representation
        before diagnosing missing relationships.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-event-properties-default-vs-custom-properties-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: ph-events
  - id: event-vs-person-properties
    instruction: '**Event properties** describe the occurrence. **Person properties** describe a person profile
      and can change. Store an explicit event-time snapshot when analysis must use the value at that moment. Person-property
      query behavior can depend on how properties are stored and selected, so inspect the actual query field.


      Account-level facts may belong to a group. Decide the owner and time meaning before choosing where to set
      a property.


      Application boundary: In the documented HogQL event query, person.properties reads the ingestion-time person-property
      snapshot, while pdi.person.properties joins current profile state. Neither automatically proves the state
      at an earlier occurrence uploaded later. Use an explicit occurrence snapshot or authoritative time-aware
      history for that requirement. These examples assume default PoE behavior with no query/team override. An
      override can redirect person.properties to current PDI. Use poe.properties for an explicit ingestion snapshot
      and pdi.person.properties for current state; verify the query/team setting.'
    workedExample: A purchase event includes plan_at_purchase = free. The person's current plan later becomes
      paid. A report of purchase-time plan uses the explicit event property.
    instructionContent:
    - type: link
      url: https://github.com/PostHog/posthog/blob/master/docs/published/handbook/engineering/person-processing.md
      title: 'Event Properties: Metadata on Events: event vs person properties'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: In the documented HogQL event query, person.properties reads the ingestion-time person-property snapshot,
        while pdi.person.properties joins current profile state. Neither automatically proves the state at an
        earlier occurrence uploaded later. Use an explicit occurrence snapshot or authoritative time-aware history
        for that requirement. These examples assume default PoE behavior with no query/team override. An override
        can redirect person.properties to current PDI. Use poe.properties for an explicit ingestion snapshot and
        pdi.person.properties for current state; verify the query/team setting.
    workedExampleContent:
    - type: callout
      title: Three different times
      body: 'Assume default PoE with no override.


        | Boundary | Value | Query source |

        |---|---|---|

        | Purchase occurrence | free | properties.plan_at_purchase, explicitly captured |

        | Later event ingestion | paid | poe.properties.plan, explicit snapshot |

        | Current profile | enterprise | pdi.person.properties.plan |


        A query/team override can change person.properties behavior. Verify it before interpreting that field.'
    problems:
    - question: Which field unambiguously represents the plan used when a particular purchase occurred?
      options:
      - The latest person display name.
      - Captured plan_at_purchase.
      - A mutable current-plan value without a time contract.
      - The report creation date.
      correct: 1
      explanation: An explicit event-time snapshot gives the required time meaning. Inspect the field used rather
        than assuming all person-property queries mean current or historical state.
      id: 64dc7e9b-f753-4b63-bd58-5e9b28c0410d
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: A person bought on the free plan, then upgraded. The event stores plan_at_purchase = free and
        the current profile says paid. Which value should a purchase-time segmentation use?
      options:
      - A later purchase's plan.
      - Current profile paid for every old purchase.
      - Captured free snapshot.
      - The most common plan in the period.
      correct: 2
      explanation: The analysis asks about the occurrence, so use the recorded event-time value. The two fields
        answer different time questions.
      id: 5306cf66-5714-4259-90bf-e150cdb37889
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: Assume default PoE with no query/team override. A January purchase records plan_at_purchase=free.
        It arrives in February when person plan=paid. In March the profile is enterprise. Which field answers
        plan at purchase?
      options:
      - 'person.properties.plan: paid at ingestion.'
      - 'pdi.person.properties.plan: enterprise now.'
      - 'Latest subsequent purchase plan: enterprise.'
      - 'properties.plan_at_purchase: free.'
      correct: 3
      explanation: Occurrence, ingestion, and current time are different. The explicit occurrence snapshot answers
        the requested historical question. The question assumes default PoE and no query/team override; use poe.properties
        when explicitly requiring the ingestion snapshot.
      type: scenario
      difficulty: 4
      id: 73900918-abb3-4f8c-bb63-405131072a7e
      purpose: practice
      isTransfer: true
    - question: Assume default PoE with no query/team override. An event is ingested with person plan=basic. A
        later profile update sets pro. A query uses pdi.person.properties.plan. Which value is it designed to
        read?
      options:
      - 'Current joined profile: pro.'
      - The event's captured plan_at_purchase if present.
      - Always the first plan the user ever had.
      - Always the plan at event ingestion basic.
      correct: 0
      explanation: The pdi path joins current person data. The event-query person.properties path reads ingestion
        snapshot data; a separately captured property has its own contract. The question assumes default PoE and
        no query/team override; use poe.properties when explicitly requiring the ingestion snapshot.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-event-properties-event-vs-person-properties-exam-1
      purpose: exam
      isTransfer: true
    - question: A delayed event has no historical plan snapshot. Its ingestion profile is paid and current profile
        is enterprise. The analyst needs the earlier occurrence plan. What is defensible?
      options:
      - Use paid as proved occurrence state.
      - Authoritative history or explicit unknown.
      - Use enterprise as proved occurrence state.
      - Infer free from the delivery delay alone.
      correct: 1
      explanation: Neither ingestion nor current state proves earlier business state. Missing evidence needs an
        authoritative history, with a clear join-time rule. The question assumes default PoE and no query/team
        override; use poe.properties when explicitly requiring the ingestion snapshot.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-event-properties-event-vs-person-properties-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: ph-events
  sourceRef: https://github.com/PostHog/posthog/blob/master/docs/published/handbook/engineering/person-processing.md;
