    - question: A company changes plan after a purchase. The report needs company plan at purchase. Which evidence
        is sufficient?
      options:
      - Only the company's current plan.
      - Explicit captured purchase-plan snapshot.
      - Only the user's current personal plan.
      - Only the group type name.
      correct: 1
      explanation: Group properties can be mutable. A historical business question needs explicitly defined historical
        evidence.
      type: scenario
      difficulty: 4
      id: posthog-data-model-group-types-modeling-with-groups-exam-2
      purpose: exam
