    concept; verified 2026-10-07.
- id: linking-events-to-groups
  name: Linking Events to Groups
  difficulty: 5
  estimatedMinutes: 15
  tags:
  - posthog
  - groups
  section: group-analytics
  prerequisites:
  - group-identify
  encompassing:
  - concept: group-identify
    weight: 0.55
  knowledgePoints:
  - id: frontend-vs-backend-patterns
    instruction: '**Frontend group context** can persist for subsequent captures after the web group helper. Backend
      SDKs use explicit group context per event. Keep these patterns distinct when sharing utility code.


      For a frontend workspace switch, update or clear the relevant context before the next action is captured.
      Test that the emitted event contains the intended group key.


      Application boundary: Attribution uses context at capture. Test the transition, not only the final UI state.'
    workedExample: A browser switches from org_A to org_B. The group state changes before project_opened is captured.
      A server job independently supplies org_B from the job payload.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/group-analytics
      title: 'Linking Events to Groups: frontend vs backend patterns'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: Attribution uses context at capture. Test the transition, not only the final UI state.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: A browser switches from org_A to org_B. The group state changes before project_opened is captured.
        A server job independently supplies org_B from the job payload.
    problems:
    - question: Which implementation detail requires attention when porting web group-tracking code to a backend
        service?
      options:
      - Backend context is not web persistence.
      - Create a group type per request.
      - Infer every group from the event name.
      - Use person email as every group key.
      correct: 0
      explanation: SDK state behavior differs by environment. Preserve the intended attribution explicitly when
        moving capture code.
      id: 8f5648eb-4c3a-4e56-9179-74c2e3dc2136
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: A browser was associated with org_A. The user switches to org_B, but project_opened is captured
        before group context changes. Which company can receive the event?
      options:
      - Both companies receive all events.
      - orgA at capture time.
      - OrgB because the UI title changed.
      - Neither because web context never persists.
      correct: 1
      explanation: Capture uses the context present at that moment. Update the context before capturing the action
        for the new workspace.
      id: e73c5ebc-cb6f-4df4-80b4-6b58fd4dc451
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: The user selects orgB. project_opened captures before posthog.group updates from orgA. What ordering
        should the integration verify?
      options:
      - Update context after project_opened captures.
      - Change the UI title but retain orgA context.
      - Set context before capture; verify its key.
      - Reassign all old orgA events to orgB.
      correct: 2
      explanation: Attribution uses context at capture. Test the transition, not only the final UI state.
      type: scenario
      difficulty: 4
      id: bf6d64c6-20cf-4180-beb2-ca8e428b38e2
      purpose: practice
      isTransfer: true
    - question: A single-page app logs out a user with company context, then permits an unrelated account login.
        Which regression trace is necessary?
      options:
      - Repeated same-account helper call only.
      - Logout UI disappearance without capture checks.
      - Current display-name state without lifecycle trace.
      - Cleared/reset context and next-account captures.
      correct: 3
      explanation: Account switching can retain stale actor or group state. Verify exact capture payloads through
        the lifecycle boundary.
      type: scenario
      difficulty: 4
      id: posthog-data-model-linking-events-to-groups-frontend-vs-backend-patterns-exam-1
      purpose: exam
      isTransfer: true
    - question: A backend copied a browser group helper pattern and assumes later invoice events inherit its state.
        Which test exposes the assumption?
      options:
      - Two accounts; explicit per-capture group assertions.
      - Property updates on only one account.
      - HTTP acceptance without key assertions.
      - People screenshot without event payloads.
      correct: 0
      explanation: A multi-account fixture tests request-local attribution. Browser persistence and backend event
        context have different contracts.
      type: scenario
      difficulty: 4
      id: posthog-data-model-linking-events-to-groups-frontend-vs-backend-patterns-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: group-identify
  - id: group-linking-constraints
    instruction: '**Group attribution is attached to events.** An event can contain keys for several group types,
      such as company and project. Within one type, its group context identifies one key. A person can emit different
      events for different groups of the same type.


      Group context is not retroactively inferred from a later membership change. Validate it at capture.


      Application boundary: A key identifies one instance of its type. Different dimensions need different declared
      group types.'
    workedExample: 'An event can carry company: org_8 and project: project_2. Another event by the same person
      can carry company: org_9 when that action concerns another organization.'
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/group-analytics
      title: 'Linking Events to Groups: group linking constraints'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: A key identifies one instance of its type. Different dimensions need different declared group types.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: 'An event can carry company: org_8 and project: project_2. Another event by the same person can carry
        company: org_9 when that action concerns another organization.'
    problems:
    - question: Which group context fits one event that belongs to company org_8 and project project_2?
      options:
      - One comma-packed company value for two companies.
      - One key per respective group type.
      - Company name as the user actor ID.
      - No group context because membership is permanent.
      correct: 1
      explanation: Different group types can coexist on one event. Each type's key should identify the intended
        instance.
      id: 78e16a0d-4647-4052-9e4d-99cec1ff7415
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: 'An event carries company: "org_A,org_B" as one string. The author intended it to count independently
        for both company keys. What is the issue?'
      options:
      - A property change to person email only.
      - Automatic copies to every company.
      - One literal key, not two links.
      - Two associations guaranteed by the comma.
      correct: 2
      explanation: A group key is an identifier. Define the analytical requirement explicitly instead of encoding
        multiple same-type groups in a string.
      id: d5a28e20-14f6-4471-a6d1-e30943ad627b
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: A job concerns companyA and projectP. A capture sends company:"A,P" intending both dimensions.
        Which shape reflects the contract?
      options:
      - One company key containing A,P.
      - One combined person ID replacing group context.
      - Separate project tokens as group dimensions.
      - Separate company:A and project:P dimensions.
      correct: 3
      explanation: A key identifies one instance of its type. Different dimensions need different declared group
        types.
      type: scenario
      difficulty: 4
      id: aa4ee5ee-8eda-4fa8-ad74-d52a70ad17bc
      purpose: practice
      isTransfer: true
    - question: One event must be reported independently for two companies under the same type. The code passes
        one comma-separated key. What must the design review establish?
      options:
      - One-key-per-type constraint and explicit measurement design.
      - Comma splitting implicitly supplies both links.
      - Group update duplicates every later event.
      - User identity substitutes for two group associations.
      correct: 0
      explanation: Do not invent multi-membership semantics for a single key. Define separate facts or another
        validated representation without inflating outcomes.
      type: scenario
      difficulty: 4
      id: posthog-data-model-linking-events-to-groups-group-linking-constraints-exam-1
      purpose: exam
      isTransfer: true
    - question: An event has company:A and project:P. A report counts company types instead of company keys. Which
        error does this make?
      options:
      - Event-row count as company count.
      - Category versus instance-count confusion.
      - Person count as company count.
      - Group-type count as company count.
      correct: 1
      explanation: The event can carry multiple dimensions. Each KPI must select the key and grain matching its
        population.
      type: scenario
      difficulty: 4
      id: posthog-data-model-linking-events-to-groups-group-linking-constraints-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: group-identify
