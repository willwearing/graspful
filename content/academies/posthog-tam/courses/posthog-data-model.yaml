- id: person-modes
  name: 'Person Modes: identified_only vs Always'
  difficulty: 5
  estimatedMinutes: 15
  tags:
  - posthog
  - identification
  section: identification
  prerequisites:
  - anonymous-vs-identified
  encompassing: []
  knowledgePoints:
  - id: choosing-a-mode
    instruction: 'The web **person_profiles** setting controls profile creation policy. identified_only limits
      automatic profiles until a qualifying action. always creates profiles for ordinary captures. never prevents
      person-profile processing and excludes features that require it.


      Choose the mode from the required analyses and identity operations. Verify the actual SDK version and configuration
      before assuming a default.


      Application boundary: Separate event capture from profile-dependent features. Choose or revise the policy
      explicitly rather than promising incompatible behavior.'
    workedExample: A site needs event-level page analytics but no saved profiles. It can evaluate a restricted
      profile mode, while checking separately whether planned group or profile-based features need person processing.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data/anonymous-vs-identified-events
      title: 'Person Modes: identified_only vs Always: choosing a mode'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: Separate event capture from profile-dependent features. Choose or revise the policy explicitly rather
        than promising incompatible behavior.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: A site needs event-level page analytics but no saved profiles. It can evaluate a restricted profile
        mode, while checking separately whether planned group or profile-based features need person processing.
    problems:
    - question: Which web person_profiles mode is intended to prevent person-profile processing?
      options:
      - never
      - identified_only
      - always
      - SDK default when unspecified
      correct: 0
      explanation: The mode controls profile policy. Confirm the consequences for the features the application
        intends to use.
      id: 7ba753cf-5408-4c9d-b834-ed05a7349a65
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: A customer needs known-user profiles after login but wants ordinary fresh anonymous pageviews
        to avoid automatic profile creation. Which web mode fits that policy?
      options:
      - never while expecting identify-created profiles.
      - identified_only with valid login flow.
      - Switch project token per pageview.
      - always for every fresh anonymous capture.
      correct: 1
      explanation: identified_only supports this boundary. The application still needs an explicit, valid profile-triggering
        transition.
      id: c467dd49-369a-4ca3-ad9d-e504a81d7ce5
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: A site must avoid stored profiles entirely. It also expects People filters by saved tier after
        identify. What is the requirement conflict?
      options:
      - never prevents every ordinary event capture.
      - identified_only ignores every login transition.
      - never conflicts with stored-profile features.
      - always proves every visitor authenticated.
      correct: 2
      explanation: Separate event capture from profile-dependent features. Choose or revise the policy explicitly
        rather than promising incompatible behavior.
      type: scenario
      difficulty: 4
      id: 2c153648-0bc1-490e-9ad6-d05e871078e7
      purpose: practice
      isTransfer: true
    - question: A fresh site uses always. Ordinary anonymous pageviews create profiles. The desired policy creates
        profiles only after approved triggers. What should be evaluated?
      options:
      - A shared anonymous actor in always mode.
      - A People filter hiding already-created profiles.
      - Mode choice based only on visible login controls.
      - identified_only plus audited triggers.
      correct: 3
      explanation: Mode controls processing policy. Audit helpers as well as login so unintended triggers do not
        defeat the requirement.
      type: scenario
      difficulty: 4
      id: posthog-data-model-person-modes-choosing-a-mode-exam-1
      purpose: exam
      isTransfer: true
    - question: Two SDK versions are deployed with different mode initialization. A cost estimate assumes the
        default everywhere. Which evidence is needed?
      options:
      - Actual source versions/configurations and traces.
      - Signed-in user counts alone.
      - Event-name counts alone.
      - Assumed default across both deployed versions.
      correct: 0
      explanation: Version and explicit initialization determine the integration policy. Defaults must be verified
        in the deployed sources.
      type: scenario
      difficulty: 4
      id: posthog-data-model-person-modes-choosing-a-mode-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: anonymous-vs-identified
  - id: mode-gotchas
    instruction: '**Profile-triggering helpers** matter when estimating identified_only behavior. In the web SDK,
      helpers such as identify, alias, group, and setPersonProperties can enable person processing. Inline $set
      on a fresh anonymous capture does not itself do so.


      If a flag needs properties without a saved profile, use the supported flag-property input path and test
      the actual payloads. Do not substitute a profile-writing helper without considering its side effects.


      Application boundary: For the inspected current browser SDK, setPersonPropertiesForFlags supplies evaluation
      input without itself proving profile persistence. Do not generalize this to group-property helpers or every
      SDK version. Inspect the final transmitted processing flag: reserved values can be computed from person_profiles
      mode rather than taken from arbitrary capture properties.'
    workedExample: A team wants anonymous flag targeting by a supplied country value. It uses the supported flag-property
      setter instead of creating stored person properties solely for that evaluation.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data/anonymous-vs-identified-events
      title: 'Person Modes: identified_only vs Always: mode gotchas'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: 'For the inspected current browser SDK, setPersonPropertiesForFlags supplies evaluation input without
        itself proving profile persistence. Do not generalize this to group-property helpers or every SDK version.
        Inspect the final transmitted processing flag: reserved values can be computed from person_profiles mode
        rather than taken from arbitrary capture properties.'
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: A team wants anonymous flag targeting by a supplied country value. It uses the supported flag-property
        setter instead of creating stored person properties solely for that evaluation.
    problems:
    - question: Which distinction matters in identified_only mode for a fresh anonymous web visitor?
      options:
      - Any property object identifies the visitor.
      - Inline versus helper triggering differs.
      - Flag name becomes person ID.
      - Only authentication can trigger profiles.
      correct: 1
      explanation: The helper operation matters. Identified-only does not mean that login is the sole possible
        profile trigger.
      id: d0238a42-ca54-4b3f-8019-fab8270553c5
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: A page only needs an anonymous flag rule with an explicitly supplied country. It must avoid creating
        a stored profile solely for this input. Which approach should it evaluate?
      options:
      - Fabricated-email identify.
      - Country used as every visitor's actor ID.
      - Verified flag-only property input.
      - Stored-person helper used solely for transient flag input.
      correct: 2
      explanation: Supply the flag input through the intended evaluation path. Profile writes and identity changes
        introduce separate effects.
      id: 6cadcb36-7e40-4e56-acfe-85fea3712abf
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: A fresh identified_only browser sends inline $set without other triggers, then another fresh test
        calls setPersonProperties. What should the regression compare?
      options:
      - Equal event counts prove equal profile behavior.
      - Inline capture $set always creates a profile.
      - Helper name alone proves persistence is disabled.
      - Delivery, creation, and persistence per path.
      correct: 3
      explanation: The helper can enable processing where an inline capture alone does not. Validate both the
        processing decision and resulting state.
      type: scenario
      difficulty: 4
      id: cc475376-2ade-49ee-9bec-1e3740633231
      purpose: practice
      isTransfer: true
    - question: A flag needs country for an anonymous visitor. The app uses setPersonPropertiesForFlags. Which
        claim requires separate evidence?
      options:
      - Persistence to People.
      - Override availability for supported evaluation.
      - Helper presence in inspected SDK.
      - Stable anonymous ID retention.
      correct: 0
      explanation: An evaluation override is not by itself proof of stored profile state. Inspect the exact SDK
        helper and verify the required behavior.
      type: scenario
      difficulty: 4
      id: posthog-data-model-person-modes-mode-gotchas-exam-1
      purpose: exam
      isTransfer: true
    - question: A developer puts $process_person_profile=true inside browser capture properties to override person_profiles=never.
        What should be tested first?
      options:
      - Caller payload before SDK calculation.
      - Final computed flag and SDK mode contract.
      - Boolean input type without final payload checks.
      - Event-name inference instead of the mode contract.
      correct: 1
      explanation: The SDK can calculate reserved processing fields from its mode. Application input is not proof
        of the final transmitted behavior.
      type: scenario
      difficulty: 4
      id: posthog-data-model-person-modes-mode-gotchas-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: anonymous-vs-identified
