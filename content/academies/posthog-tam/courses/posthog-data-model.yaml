- id: anonymous-vs-identified
  name: Anonymous vs Identified Events
  difficulty: 4
  estimatedMinutes: 16
  tags:
  - posthog
  - identification
  section: identification
  prerequisites:
  - ph-person-properties
  encompassing: []
  knowledgePoints:
  - id: two-modes-of-events
    instruction: '**Anonymous and identified event processing** have different capabilities and costs. Anonymous
      events can support event-based analysis without a stored person profile. Person processing supports identity
      resolution and stored person properties.


      A human can still be unknown by name while an SDK action triggers person processing. Inspect configuration
      and event flags instead of assuming that every event before login is anonymous.


      Anonymous analysis can still use a stable browser distinct ID. A new ID on every event prevents repeat-browser
      counts, while one shared ID for all browsers collapses visitors.


      Application boundary: Known-ID exception: setting $process_person_profile=false skips profile processing
      but does not erase an existing person link. An event whose distinct ID already belongs to a person still
      counts as identified and cannot apply person-property updates. A fresh unlinked ID can be anonymous under
      the documented contract. Check actual linkage and operations rather than ID prefixes or application login
      state.'
    workedExample: A public-page event can be analyzed by event URL without creating a person profile. A helper
      that explicitly sets person properties can change how subsequent events are processed.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data/anonymous-vs-identified-events
      title: 'Anonymous vs Identified Events: two modes of events'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: 'Known-ID exception: setting $process_person_profile=false skips profile processing but does not erase
        an existing person link. An event whose distinct ID already belongs to a person still counts as identified
        and cannot apply person-property updates. A fresh unlinked ID can be anonymous under the documented contract.
        Check actual linkage and operations rather than ID prefixes or application login state.'
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: A public-page event can be analyzed by event URL without creating a person profile. A helper that
        explicitly sets person properties can change how subsequent events are processed.
    problems:
    - question: Which statement correctly distinguishes human login state from PostHog person processing?
      options:
      - A stored profile proves authenticated login.
      - A login event name proves trusted identity.
      - Processing can begin before login.
      - All pre-login events necessarily skip profiles.
      correct: 2
      explanation: Authentication and analytics processing are different signals. Inspect the SDK operations and
        configuration instead of inferring one from the other.
      id: 2b74e627-e9ba-479f-93fc-e9e52fb67126
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: A visitor has not logged in, but application code has called a profile-triggering person-property
        helper. Is login status alone enough to classify all later events as anonymous processing?
      options:
      - Yes, helpers cannot affect profiles.
      - Yes, every pre-login event skips processing.
      - No, every pre-login event requires email.
      - No; check mode and triggers.
      correct: 3
      explanation: Human recognition and processing mode are different dimensions. Check what the SDK actually
        sends and what operations have run.
      id: d2d8d895-290f-4ead-9563-c00b9bdf7711
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: Backend capture sets $process_person_profile=false for user42, which already has a profile. Which
        effect matches the documented exception?
      options:
      - A remains identified; profile update skipped.
      - A becomes anonymous; profile update skipped.
      - A remains identified; profile update applied.
      - A becomes anonymous; profile update applied.
      correct: 0
      explanation: Skipping person processing does not erase an existing person association. Separate write work,
        stored linkage, and billing classification.
      type: scenario
      difficulty: 4
      id: 8f8b2dd5-5258-49ce-9e1d-07850033bd8d
      purpose: practice
      isTransfer: true
    - question: A fresh unlinked backend ID has no profile and captures with processing=false. Which observation
        supports anonymous classification?
      options:
      - Only the absence of an email property.
      - No existing link or triggering identity operation.
      - Only the actor ID containing anon.
      - Only the application login button being visible.
      correct: 1
      explanation: Names and login UI do not establish PostHog processing state. Check the ID linkage and operations
        under the capture contract.
      type: scenario
      difficulty: 4
      id: posthog-data-model-anonymous-vs-identified-two-modes-of-events-exam-1
      purpose: exam
      isTransfer: true
    - question: A user is logged out, but a stored profile-triggering helper ran earlier. A customer labels every
        subsequent event anonymous by UI login state. What must the audit trace?
      options:
      - Only whether the page has a Login button.
      - Only whether the event name contains anonymous.
      - SDK mode, links, operations, classification.
      - Only whether a password field was used.
      correct: 2
      explanation: Human authentication and analytics processing state are different systems. Trace the actual
        SDK and ingestion evidence.
      type: scenario
      difficulty: 4
      id: posthog-data-model-anonymous-vs-identified-two-modes-of-events-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: ph-person-properties
  - id: choosing-when-to-identify
    instruction: '**Identify when a trusted stable user identity becomes available**, such as after successful
      login or account creation. Delay is appropriate when the application still lacks a valid ID. Avoid identifying
      with empty values, form guesses, or shared placeholders.


      For an existing authenticated session on a page load, identify once the trusted user record is available.
      Decide separately what anonymous analysis and flag evaluation need.


      Application boundary: The logout boundary separates actors; failed authentication does not establish userB.
      Test the actual reset and login sequence.'
    workedExample: A login request succeeds and returns user_64. The application then identifies user_64. A failed
      login supplies no trusted identity and should not identify the typed email as a verified account.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data/anonymous-vs-identified-events
      title: 'Anonymous vs Identified Events: choosing when to identify'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: The logout boundary separates actors; failed authentication does not establish userB. Test the actual
        reset and login sequence.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: A login request succeeds and returns user_64. The application then identifies user_64. A failed login
        supplies no trusted identity and should not identify the typed email as a verified account.
    problems:
    - question: Which event provides a sound trigger for identifying a user?
      options:
      - An unverified typed email.
      - A visible signup button.
      - A failed request without a user record.
      - Trusted authentication and stable ID.
      correct: 3
      explanation: Identify from a trusted identity transition. User input alone can be incomplete, invalid, or
        belong to someone else.
      id: bc90673c-ddb8-4a8c-828d-8d0184568ff1
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: A login form contains pat@example.com, but authentication fails. What should the client do with
        respect to identification?
      options:
      - Retain valid anonymous state.
      - Reuse the previous signed-in user after logout.
      - Identify every failure as user_unknown.
      - Identify with any typed email before validation.
      correct: 0
      explanation: A failed login does not prove identity. Avoid creating links from unverified form data or stale
        account state.
      id: 8a5f91c4-f7ab-4079-86be-e0b6348d3a3d
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: A shared tablet has userA signed in. Logout succeeds, then userB types an email but authentication
        fails. What sequence preserves trustworthy attribution?
      options:
      - Identify the typed email before validation.
      - Reset, then trusted identification.
      - RetainA until B completes a purchase.
      - Use one shared logged_out actor.
      correct: 1
      explanation: The logout boundary separates actors; failed authentication does not establish userB. Test
        the actual reset and login sequence.
      type: scenario
      difficulty: 4
      id: 5e60b2fb-3202-4ca6-9347-b5c659315c0d
      purpose: practice
      isTransfer: true
    - question: A password reset form accepts an email but does not authenticate. Which ID should analytics use
        before a valid account session exists?
      options:
      - Typed email as a proved account identity.
      - Shared reset-flow actor for all visitors.
      - Legitimately established current actor state.
      - Last successful user retained across logout.
      correct: 2
      explanation: Input is not proof of ownership. Preserve the current legitimate state and instrument the attempt
        separately.
      type: scenario
      difficulty: 4
      id: posthog-data-model-anonymous-vs-identified-choosing-when-to-identify-exam-1
      purpose: exam
      isTransfer: true
    - question: A backend validates a signup and returns canonical userID; the browser still holds anonymous a8.
        Which transition should be tested?
      options:
      - Identify from an unverified display name.
      - Rotate actor after each pageview.
      - Identify before the server confirms signup.
      - Accepted identify to the canonical returned ID.
      correct: 3
      explanation: The trusted application result supplies the stable identity. Verify pre-success events connect
        through the supported transition.
      type: scenario
      difficulty: 4
      id: posthog-data-model-anonymous-vs-identified-choosing-when-to-identify-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: ph-person-properties
