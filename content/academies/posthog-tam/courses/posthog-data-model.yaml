    concept; verified 2026-10-07.
- id: group-gotchas
  name: Group Analytics Gotchas
  difficulty: 5
  estimatedMinutes: 15
  tags:
  - posthog
  - groups
  section: group-analytics
  prerequisites:
  - linking-events-to-groups
  - person-modes
  encompassing: []
  knowledgePoints:
  - id: important-limitations
    instruction: '**Group troubleshooting** separates group properties, event attribution, processing mode, and
      UI visibility. A group can be absent from a list when it has no descriptive properties. The current documentation
      requires at least one property for a group to appear in People and groups.


      In a profile-restricted setup, check the supported group helper and person-processing behavior. Inspect
      payloads and warnings before assuming the group key alone proves success.


      Application boundary: Historical event attribution and current related-group UI visibility have different
      scopes. The documented related-groups view uses a recent activity window. Inspect exact stored event context
      and the applicable view scope before declaring historical events lost.'
    workedExample: An event contains a company key, but the group list is empty. Inspect the group-identify operation
      and its properties, then confirm the event's processing path and project.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/group-analytics
      title: 'Group Analytics Gotchas: important limitations'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: Historical event attribution and current related-group UI visibility have different scopes. The documented
        related-groups view uses a recent activity window. Inspect exact stored event context and the applicable
        view scope before declaring historical events lost.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: An event contains a company key, but the group list is empty. Inspect the group-identify operation
        and its properties, then confirm the event's processing path and project.
    problems:
    - question: Which documented condition can explain why a group with a known key does not appear in the People
        and groups list?
      options:
      - Fewer than ten users.
      - Event attribution creates every descriptive property automatically.
      - No group property set.
      - Key differs from its display name.
      correct: 2
      explanation: Check the group's property record and the documented visibility requirement. A list view alone
        is not a full test of event attribution.
      id: cf1d8b06-cabc-4924-a2c0-331715015625
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: A group-identify payload sets company org_8 with name = Acme, but the event being investigated
        carries company org_9. What should be checked first?
      options:
      - Rename org8 so org9 inherits it.
      - Assume all keys of one type share properties.
      - Use whichever group was updated most recently.
      - Same intended key on both paths.
      correct: 3
      explanation: Compare identifiers across the two operations. Properties written to org_8 do not describe
        org_9.
      id: 935a2bdd-0532-4813-b2be-56149b5a291b
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: An org8 property update exists; investigated event has org9. The customer sees no expected tier
        for that event. What should be checked first?
      options:
      - Account mapping and exact payload keys.
      - Same type proves keys share properties.
      - Rename org8 to make org9 inherit it.
      - Latest group update supplies every event's state.
      correct: 0
      explanation: Different keys represent different groups. Do not infer association from category or display-name
        equality.
      type: scenario
      difficulty: 4
      id: 4808769f-3ac6-4ea7-97f4-c0a322819507
      purpose: practice
      isTransfer: true
    - question: A company appears in an old event but not the current related-groups view. What must the TAM distinguish?
      options:
      - Absent recent UI row proves historical deletion.
      - Historical attribution versus current view scope.
      - Every UI view has unlimited history.
      - Current group properties prove each old association.
      correct: 1
      explanation: The documented UI has its own scope and visibility behavior. Query the bounded historical event
        evidence before concluding loss.
      type: scenario
      difficulty: 4
      id: posthog-data-model-group-gotchas-important-limitations-exam-1
      purpose: exam
      isTransfer: true
    - question: A group list is empty although event $groups has company:org7. No properties are set. Which observation
        is insufficient to prove ingestion failure?
      options:
      - Bounded event query finding the capture.
      - The transmitted company key.
      - An empty descriptive group list.
      - Correct project routing evidence.
      correct: 2
      explanation: Event attribution and group-list visibility are separate. Set supported group properties and
        verify the intended UI contract.
      type: scenario
      difficulty: 4
      id: posthog-data-model-group-gotchas-important-limitations-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: linking-events-to-groups
  - id: limits-and-feature-constraints
    instruction: '**Group type limits** apply to categories, rather than the number of individual companies. Current
      documentation permits up to five group types per project. Use one company type with many stable company
      keys instead of a type per customer.


      Group analytics also has product and billing requirements. Check current availability and pricing for a
      customer rather than promising a fixed cost from a training example.


      Application boundary: Do not assume group processing is preserved by an anonymous/skip-processing configuration.
      Verify the current supported group and identified-event contract for the payload. Group categories and individual
      keys consume different kinds of capacity.'
    workedExample: A SaaS product models company and workspace as two types. Thousands of company keys still use
      one company type.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/group-analytics
      title: 'Group Analytics Gotchas: limits and feature constraints'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: Do not assume group processing is preserved by an anonymous/skip-processing configuration. Verify
        the current supported group and identified-event contract for the payload. Group categories and individual
        keys consume different kinds of capacity.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: A SaaS product models company and workspace as two types. Thousands of company keys still use one
        company type.
    problems:
    - question: Under the documented five-group-type limit, what consumes one type?
      options:
      - An attributed event.
      - An individual company key.
      - A related person.
      - Group category/type.
      correct: 3
      explanation: The limit is on entity categories. Many instances can share the same group type.
      id: 64b60793-04cf-42f2-a71f-e9b8d5c9555b
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: A project has company and project group types, with 4,000 company keys. How many group types does
        that design use? Enter the number only.
      options: []
      correct: '2'
      explanation: Count categories, not instances. The number of company keys does not create additional group
        types.
      type: fill_blank
      id: 264303c5-2169-4753-9fd8-3b7c5bab1bc5
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: A design creates a group type for every customer account. The project supports five types. Which
        model scales under that limit?
      options:
      - One company type; stable per-account keys.
      - One type per individual company.
      - One combined group key for every account.
      - One event name per account instead of group identity.
      correct: 0
      explanation: Types model categories; keys model instances. Instance count is not the same as type budget.
      type: scenario
      difficulty: 4
      id: 615b043a-4cc6-4323-a733-5d1847a9dd1d
      purpose: practice
      isTransfer: true
    - question: Five group types already exist. A new requirement proposes a sixth category. What should precede
        instrumentation?
      options:
      - Create sixth type and assume one disappears safely.
      - Supported limits and validated dimensional model.
      - Reuse a type with unrelated meaning without migration.
      - Comma-pack keys and claim independent associations.
      correct: 1
      explanation: Limits are a design constraint, not permission to silently change meaning. Confirm current
        product support and migration impact.
      type: scenario
      difficulty: 4
      id: posthog-data-model-group-gotchas-limits-and-feature-constraints-exam-1
      purpose: exam
      isTransfer: true
    - question: A group event uses company:org8, but $process_person_profile=false. The customer expects ordinary
        group processing and anonymous billing. Which contract needs checking?
      options:
      - Event count alone proves group processing.
      - Company display name proves anonymous classification.
      - Supported processing and classification contract.
      - Absent login implies group events are anonymous.
      correct: 2
      explanation: Groups have processing requirements; do not assume every skip-processing configuration retains
        group behavior or anonymous pricing. Verify the documented capture contract.
      type: scenario
      difficulty: 4
      id: posthog-data-model-group-gotchas-limits-and-feature-constraints-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: linking-events-to-groups
  sourceRef: https://posthog.com/docs/product-analytics/group-analytics; relevant named topic/contract in this
    concept; verified 2026-10-07.
- id: ph-cdp-overview
  name: 'PostHog CDP: Sources, Transformations, Destinations'
  difficulty: 4
  estimatedMinutes: 16
  tags:
  - posthog
  - cdp
  section: posthog-cdp
  prerequisites:
  - data-pipelines:transformation-etl-elt
  encompassing:
  - concept: data-pipelines:transformation-etl-elt
    weight: 0.4
  knowledgePoints:
  - id: three-pieces
    instruction: 'PostHog''s **customer data platform workflow** connects sources, transformations, and destinations.
      Sources bring data in, transformations prepare events, and destinations send data to other systems. Warehouse
      connectors and event destinations solve different timing and data-shape needs.


      Name the required source, output, and latency before choosing a surface.


      Application boundary: A transform definition is not proof of delivered shape. Test both the mapping and
      the consumer output.'
    workedExample: A product event enters from an SDK, receives an allowed-field transformation, and is sent to
      a support destination. A nightly warehouse sync is a separate data movement use case.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/cdp
      title: 'PostHog CDP: Sources, Transformations, Destinations: three pieces'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: A transform definition is not proof of delivered shape. Test both the mapping and the consumer output.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: A product event enters from an SDK, receives an allowed-field transformation, and is sent to a support
        destination. A nightly warehouse sync is a separate data movement use case.
    problems:
    - question: Which part of a data flow sends processed events to another system?
      options:
      - Transformation only.
      - Insight query only.
      - External source.
      - Destination.
      correct: 3
      explanation: The destination is the outbound surface. Source access and transformation have different roles.
      id: 211ef168-460a-4d72-8993-6e678986dd9e
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: A flow receives a signup event, removes an unnecessary property, then sends it to a CRM. Which
        step is the transformation?
      options:
      - Property removal.
      - Receiving at CRM.
      - Choosing a password.
      - Emitting signup.
      correct: 0
      explanation: Identify the step that changes the payload. Ingestion and outbound delivery are separate boundaries.
      id: 2f0c54e1-7537-40e8-9a6b-9b6bfd61da3d
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: A signup is captured, email is removed, and a notification sends to a webhook. Which validation
        proves removal at the destination boundary?
      options:
      - Only the source payload before transformation.
      - Outgoing payload and accepted destination record.
      - Only the transform configuration exists.
      - Only the destination toggle is enabled.
      correct: 1
      explanation: A transform definition is not proof of delivered shape. Test both the mapping and the consumer
        output.
      type: scenario
      difficulty: 4
      id: ce2f18ff-0b3c-4764-b9cb-ed5336a51156
      purpose: practice
      isTransfer: true
    - question: A flow needs billing tables inside PostHog and signup alerts outside PostHog. Which distinction
        matters?
      options:
      - Treat both directions as event push automatically.
      - Treat both directions as batch export automatically.
      - Separate inbound and outbound directions.
      - Assume either flow performs identity linking.
      correct: 2
      explanation: Identify direction, data shape, and consumer deadline before choosing a surface.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-cdp-overview-three-pieces-exam-1
      purpose: exam
      isTransfer: true
    - question: A destination rejects payloads missing account_id after a transform removes it. What boundary
        should be corrected?
      options:
      - Keep the removal and let consumers infer account_id.
      - Retry the unchanged invalid output indefinitely.
      - Change only source display labels.
      - Transform output versus consumer-required schema.
      correct: 3
      explanation: A transform can make a valid input invalid for a consumer. Check the outgoing schema and test
        required fields.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-cdp-overview-three-pieces-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: data-pipelines:transformation-etl-elt
  - id: choosing-the-cdp-surface
    instruction: '**Surface selection** follows direction, shape, and timing. Event destinations deliver selected
      events outward. Batch exports move event data in scheduled batches to supported storage or warehouse targets.
      Warehouse sources import external data for analysis.


      Confirm the supported connector, fields, update behavior, and failure handling for the concrete use case.


      Application boundary: The requirement is outbound interval delivery. Confirm the actual supported destination
      and operational contract.'
    workedExample: A team wants daily event files in its own storage. It evaluates a batch export. A team wants
      external billing tables available for joins in PostHog and evaluates a warehouse source.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/cdp
      title: 'PostHog CDP: Sources, Transformations, Destinations: choosing the cdp surface'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: The requirement is outbound interval delivery. Confirm the actual supported destination and operational
        contract.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: A team wants daily event files in its own storage. It evaluates a batch export. A team wants external
        billing tables available for joins in PostHog and evaluates a warehouse source.
    problems:
    - question: Which use case fits an external warehouse source into PostHog?
      options:
      - Inbound billing-table analysis.
      - Send signup alerts outward.
      - Rename a profile.
      - Export events to customer storage.
      correct: 0
      explanation: A source brings external data into the analysis environment. Destinations and exports move
        data outward.
      id: a738fc7b-cc49-4d35-9fa4-452c022c8e54
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: A data team wants scheduled batches of PostHog events in its own supported storage destination.
        Which surface should it evaluate first?
      options:
      - Cohort rename.
      - Batch exports.
      - Person identify.
      - Flag-input override.
      correct: 1
      explanation: Batch exports match scheduled outbound data movement. Confirm the destination and delivery
        contract before setup.
      id: 26df5030-ea2e-457b-897d-75d9d5cde92e
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: Finance needs PostHog event files in supported object storage each hour. Which initial evaluation
        fits?
      options:
      - Inbound warehouse source as outbound export.
      - Event destination without checking interval completeness.
      - Supported batch-export delivery contract.
      - Private-query polling without export recovery design.
      correct: 2
      explanation: The requirement is outbound interval delivery. Confirm the actual supported destination and
        operational contract.
      type: scenario
      difficulty: 4
      id: db80a5a8-877a-4077-b768-eac38e788318
      purpose: practice
      isTransfer: true
    - question: A customer wants existing CRM account tables available for joining with product usage. What should
        be evaluated?
      options:
      - Outbound alerts alone as complete CRM-table sync.
      - Cohort display names as authoritative account records.
      - Browser interactions as complete CRM row history.
      - Warehouse source sync and key/freshness mapping.
      correct: 3
      explanation: Table ingestion and event notification serve different requirements. Verify authoritative keys
        and table-sync behavior.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-cdp-overview-choosing-the-cdp-surface-exam-1
      purpose: exam
      isTransfer: true
    - question: A sales alert must arrive shortly after an event; finance also needs complete daily files. Which
        design question should guide the surfaces?
      options:
      - Separate alert latency and interval completeness.
      - Choose one label without measuring either need.
      - Use only a static list for both delivery contracts.
      - Use identity calls as outbound notifications.
      correct: 0
      explanation: Consumer needs can justify different delivery mechanisms. Labels alone do not prove latency
        or completeness.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-cdp-overview-choosing-the-cdp-surface-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: data-pipelines:transformation-etl-elt
  sourceRef: https://posthog.com/docs/cdp; relevant named topic/contract in this concept; verified 2026-10-07.
- id: ph-destinations-exports
  name: Destinations & Batch Exports
  difficulty: 4
  estimatedMinutes: 15
  tags:
  - posthog
  - cdp
  section: posthog-cdp
  prerequisites:
  - ph-cdp-overview
  encompassing:
  - concept: ph-cdp-overview
    weight: 0.55
  knowledgePoints:
  - id: realtime-vs-batch
    instruction: '**Delivery latency** describes how quickly data becomes usable downstream. Event-driven delivery
      can serve timely operational reactions. Batch export supports bounded data windows and bulk processing.
      Neither label alone guarantees end-to-end freshness or exactly-once effects.


      Account for queueing, retries, destination processing, and late events. Define the measurable deadline at
      the consumer.


      Application boundary: Measure the whole required path, including destination processing. A fast first stage
      does not certify consumer freshness.'
    workedExample: A support notification must appear within two minutes of a signup. Measure the time from event
      occurrence through destination acceptance and final visibility, including retry cases.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/cdp/batch-exports
      title: 'Destinations & Batch Exports: realtime vs batch'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: Measure the whole required path, including destination processing. A fast first stage does not certify
        consumer freshness.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: A support notification must appear within two minutes of a signup. Measure the time from event occurrence
        through destination acceptance and final visibility, including retry cases.
    problems:
    - question: Which measurement establishes end-to-end delivery freshness?
      options:
      - Dashboard query duration alone.
      - Occurrence-to-consumer usability.
      - Schedule label alone.
      - Outbound enqueue time alone.
      correct: 1
      explanation: The consumer deadline includes every stage. Queue acceptance or a schedule name alone is incomplete
        evidence.
      id: b8d6fc9c-1c0e-4ec5-ad03-e009dcd4f993
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: Events enter an outbound queue within one second, but the destination processes them ten minutes
        later. A two-minute consumer deadline is required. Does queue speed prove the requirement is met?
      options:
      - Yes, destination processing is always instant.
      - No, remove the event timestamp.
      - No; minute 10 misses minute 2.
      - Yes, enqueue time is the universal contract.
      correct: 2
      explanation: Measure the whole path against the defined deadline. The downstream processing stage currently
        prevents compliance.
      id: 5698e50c-cf7c-46b4-9be6-32f495e3a988
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: An alert queues at 12:00:01 and becomes usable at 12:04. The deadline is two minutes after 12:00.
        Which observed boundary violates the contract?
      options:
      - Queue acceptance at one second.
      - Configured two-minute schedule label.
      - Destination request duration alone.
      - Consumer usability at four minutes.
      correct: 3
      explanation: Measure the whole required path, including destination processing. A fast first stage does
        not certify consumer freshness.
      type: scenario
      difficulty: 4
      id: 10e5b3f9-cda0-4d87-81ec-8265892019df
      purpose: practice
      isTransfer: true
    - question: Hourly exports run on time but retry for 45 minutes. Consumer usable age reaches 100 minutes;
        permitted age is 90. What should the SLO include?
      options:
      - Measured scheduling-through-usability age.
      - Configured schedule without measured age.
      - Connection handshake without consumer checks.
      - Query duration without input freshness.
      correct: 0
      explanation: A schedule is a plan rather than a measured delivery result. Include the operating path that
        determines usable age.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-destinations-exports-realtime-vs-batch-exam-1
      purpose: exam
      isTransfer: true
    - question: The source event time is 12:00 but its clock is known to be wrong by an hour. What must be established
        before reporting end-to-end latency?
      options:
      - Shorten schedule without correcting source clock.
      - Trustworthy time boundary and clock convention.
      - Treat successful responses as zero latency.
      - Subtract a guessed offset without clock evidence.
      correct: 1
      explanation: Latency arithmetic needs trustworthy timestamps. Diagnose clock and definition before claiming
        delivery performance.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-destinations-exports-realtime-vs-batch-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: ph-cdp-overview
  - id: operating-exports
    instruction: '**Export operations** require more than an enabled configuration. Inspect run status, covered
      time windows, destination records, and errors. A successful retry can repeat delivery, so downstream processing
      should handle duplicates according to the connector''s actual guarantees.


      For a backfill, define the missing interval and compare source and destination evidence. Do not claim a
      complete repair from a green status alone.


      Application boundary: Fix access, then recover and reconcile the actual missing interval. Success elsewhere
      does not fill Tuesday.'
    workedExample: A daily export fails for Tuesday. After credentials are repaired, the team reruns the Tuesday
      interval and reconciles stable event IDs or equivalent completeness checks at the destination.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/cdp/batch-exports
      title: 'Destinations & Batch Exports: operating exports'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: Fix access, then recover and reconcile the actual missing interval. Success elsewhere does not fill
        Tuesday.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: A daily export fails for Tuesday. After credentials are repaired, the team reruns the Tuesday interval
        and reconciles stable event IDs or equivalent completeness checks at the destination.
    problems:
    - question: Which evidence most directly shows that an expected export interval reached its destination?
      options:
      - A destination in a menu.
      - An enabled toggle.
      - Expected destination interval records.
      - An unrelated prior success.
      correct: 2
      explanation: Configuration is intent. Verify the relevant run and destination data for the interval being
        investigated.
      id: f2490af0-0da1-40a9-ab2b-64a062b00037
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: Monday and Wednesday exports exist, while Tuesday failed with an expired credential. After fixing
        access, what should the recovery target?
      options:
      - Change only the failed status label.
      - Replay every historical interval.
      - Wait only for Thursday's schedule.
      - Tuesday recovery and verification.
      correct: 3
      explanation: Repair the access cause and the actual coverage gap. Future success does not fill a past missing
        interval automatically.
      id: 7dc192d1-4d03-439a-b2fd-5b9ac149d44d
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: Tuesday failed on expired credentials. Monday and Wednesday are complete. After restoring access,
        what bounded recovery should be validated?
      options:
      - Bounded Tuesday recovery and destination reconciliation.
      - Future runs only, leaving Tuesday missing.
      - Replay all history without duplicate policy.
      - Change status to success without delivery.
      correct: 0
      explanation: Fix access, then recover and reconcile the actual missing interval. Success elsewhere does
        not fill Tuesday.
      type: scenario
      difficulty: 4
      id: 41fe76ab-35e4-4925-bb8c-0faed53e2499
      purpose: practice
      isTransfer: true
    - question: A rerun delivers the same interval to a destination that appends records. Which evidence is needed
        before retry?
      options:
      - Only the enabled toggle.
      - Destination replay/idempotency contract.
      - Only the interval label.
      - Only a fast consumer query.
      correct: 1
      explanation: Retries can create repeated effects. The destination publication contract must define how replay
        is reconciled.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-destinations-exports-operating-exports-exam-1
      purpose: exam
      isTransfer: true
    - question: The run is marked successful, but destination records omit the final hour. Which acceptance check
        is missing?
      options:
      - Credential existence alone.
      - A future run success alone.
      - Expected interval/identity/output reconciliation.
      - An unrelated earlier interval success.
      correct: 2
      explanation: Run status is evidence of task execution, not complete consumer coverage. Check the exact time
        and record scope.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-destinations-exports-operating-exports-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: ph-cdp-overview
  sourceRef: https://posthog.com/docs/cdp/batch-exports; relevant named topic/contract in this concept; verified
    2026-10-07.
- id: cohorts
  name: 'Cohorts: Static and Dynamic User Groups'
  difficulty: 4
  estimatedMinutes: 15
  tags:
  - posthog
  - querying
  section: querying
  prerequisites:
  - ph-person-properties
  - ph-event-properties
  encompassing:
  - concept: ph-person-properties
    weight: 0.45
  knowledgePoints:
  - id: static-vs-dynamic
    instruction: 'A **static cohort** is a selected set of people. A **dynamic cohort** computes membership from
      rules. Stored cohort membership can take time to refresh, so the visible list need not react instantly to
      a new event.


      Choose a fixed list for a defined invitation group and a rule-based cohort for a changing analytical population.
      Check refresh behavior when diagnosing membership.


      Application boundary: The requirement is an approved population, not a changing eligibility computation.
      Keep updates auditable.'
    workedExample: A pilot invitation list uses a static cohort. A report of people active during a rolling period
      uses a dynamic rule whose computed membership changes as the window moves.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data/cohorts
      title: 'Cohorts: Static and Dynamic User Groups: static vs dynamic'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: The requirement is an approved population, not a changing eligibility computation. Keep updates auditable.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: A pilot invitation list uses a static cohort. A report of people active during a rolling period uses
        a dynamic rule whose computed membership changes as the window moves.
    problems:
    - question: What distinguishes a dynamic cohort from a static one?
      options:
      - Static lists include every future rule match.
      - Dynamic cohorts always contain companies.
      - Both refresh at the same instant.
      - Rule-reevaluated membership.
      correct: 3
      explanation: The membership mechanism differs. Refresh behavior is a separate operational property to check.
      id: 12330d24-c94e-4327-bf93-f22d66fa81d3
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: A team must invite exactly the 150 people approved for a pilot, even if their later behavior changes.
        Which cohort approach fits?
      options:
      - Static approved list.
      - Company group as invitation list.
      - Rolling activity rule adding future matches.
      - Every visitor in the project.
      correct: 0
      explanation: The requirement is a fixed selected population. A dynamic behavior rule could change that population.
      id: 9f083b10-cc09-4fb2-9319-f5d8aae1988e
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: A pilot must remain exactly the approved150 people. New users matching behavior must not join
        automatically. Which membership contract fits?
      options:
      - Rolling behavior rule adding future matches.
      - Controlled static list and update policy.
      - Dynamic all-users rule without approval.
      - Company membership as the fixed invitation list.
      correct: 1
      explanation: The requirement is an approved population, not a changing eligibility computation. Keep updates
        auditable.
      type: scenario
      difficulty: 4
      id: 8476bbac-8759-43ab-addf-d1ab8db7e6d0
      purpose: practice
      isTransfer: true
    - question: A campaign targets people active in the last seven days. Membership should change as the window
        moves. What must be checked?
      options:
      - Fixed upload that never updates.
      - Display-name change without membership logic.
      - Dynamic rule plus refresh-delay contract.
      - Group category replacing user eligibility.
      correct: 2
      explanation: Rule meaning and refresh behavior both affect membership. A rolling window does not guarantee
        instantaneous updates.
      type: scenario
      difficulty: 4
      id: posthog-data-model-cohorts-static-vs-dynamic-exam-1
      purpose: exam
      isTransfer: true
    - question: Two dynamic cohort checks disagree just after a new event. Which evidence can explain the difference
        without assuming loss?
      options:
      - Profile name equality.
      - Cohort icon state.
      - Event count without rule/refresh evidence.
      - Rule inputs and availability/refresh timing.
      correct: 3
      explanation: Asynchronous evaluation and different evidence scopes can produce temporary differences. Check
        documented timing and the exact rule.
      type: scenario
      difficulty: 4
      id: posthog-data-model-cohorts-static-vs-dynamic-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: ph-person-properties
  - id: cohorts-for-analysis-vs-rollout
    instruction: '**Analysis cohorts and rollout targeting** have different support rules. Standard dynamic behavioral
      or lifecycle cohorts are not generally supported for flag targeting. Person-property cohort conditions can
      be supported. An early real-time-cohort feature can support some event conditions, so check availability
      and exact restrictions.


      For an immediate rollout condition, use a supported targeting input with a clear update path instead of
      assuming every analysis cohort is eligible.


      Application boundary: Analysis membership and supported flag evaluation are different contracts. Use an
      eligible supported input and test when it updates.'
    workedExample: A project without the real-time-cohort feature analyzes people who purchased yesterday. Before
      using that segment for a flag, the team checks supported targeting conditions and may maintain an authoritative
      eligibility property.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data/cohorts
      title: 'Cohorts: Static and Dynamic User Groups: cohorts for analysis vs rollout'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: Analysis membership and supported flag evaluation are different contracts. Use an eligible supported
        input and test when it updates.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: A project without the real-time-cohort feature analyzes people who purchased yesterday. Before using
        that segment for a flag, the team checks supported targeting conditions and may maintain an authoritative
        eligibility property.
    problems:
    - question: In a project without the real-time-cohort feature, which assumption about standard behavioral
        cohorts is unsafe?
      options:
      - Universal behavioral-cohort flag support.
      - Person inputs can support flag rules.
      - Saved cohorts can have refresh delays.
      - Targeting support must be checked.
      correct: 0
      explanation: Analysis support does not imply rollout support. Check current cohort and flag constraints
        for the project.
      id: 47963eac-bfa4-453e-9bd9-d3a02bd428e6
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: A project has no real-time-cohort feature and wants a flag for people who completed an event.
        It already has a trustworthy eligibility property updated by the application. Which approach should it
        evaluate?
      options:
      - Rename the event to the flag key.
      - Verified supported eligibility-property rule.
      - Assume a chart filter becomes targeting.
      - Use any behavioral cohort without support checks.
      correct: 1
      explanation: Use an input supported by the flag system. Verify that its value and identity reach evaluation
        in time.
      id: 4ff336ee-2aad-46a1-b1d6-2384a9dcf3f6
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: A project has no realtime-cohort feature. An analysis cohort means completed_payment. The app
        maintains a trusted payment_eligible property. What should rollout evaluate?
      options:
      - Direct use of any standard behavioral cohort.
      - Assume a chart filter becomes targeting.
      - Supported property rule with verified input freshness.
      - Rename the event to the flag key.
      correct: 2
      explanation: Analysis membership and supported flag evaluation are different contracts. Use an eligible
        supported input and test when it updates.
      type: scenario
      difficulty: 4
      id: 0873bfa2-4f01-464e-9387-ebde167d139b
      purpose: practice
      isTransfer: true
    - question: A limited realtime-cohort beta is enabled. A proposed rule combines unsupported behavioral conditions.
        What should precede rollout?
      options:
      - Beta implies support for every behavioral rule.
      - Realtime label guarantees instant complete membership.
      - Chart results become permanent targeting facts.
      - Exact supported beta criteria and limits.
      correct: 3
      explanation: Limited feature support cannot be generalized to every rule. Check the actual criteria, version,
        and evaluation path.
      type: scenario
      difficulty: 4
      id: posthog-data-model-cohorts-cohorts-for-analysis-vs-rollout-exam-1
      purpose: exam
      isTransfer: true
    - question: A server evaluates a flag for user8 but supplies eligibility for user9. The rule is supported.
        What failure is likely?
      options:
      - Eligibility input belongs to the wrong actor.
      - Correct rule support guarantees correct actor inputs.
      - Backend flags always require a browser session.
      - Flag key itself determines eligibility identity.
      correct: 0
      explanation: Supported rules still require correct identity and property inputs. Test them together under
        the intended contract.
      type: scenario
      difficulty: 4
