    concept; verified 2026-10-07.
- id: identify-call
  name: The Identify Call
  difficulty: 5
  estimatedMinutes: 18
  tags:
  - posthog
  - identification
  section: identification
  prerequisites:
  - anonymous-vs-identified
  encompassing:
  - concept: anonymous-vs-identified
    weight: 0.6
  knowledgePoints:
  - id: how-identify-works
    instruction: 'A valid web **identify transition** links the current anonymous browser ID to a known user ID.
      Later events use the identified state. Identity safeguards restrict invalid merges, so identify is not a
      general command for combining any two established people.


      Inspect the anonymous ID, known ID, and emitted transition when a journey fails to connect.


      Application boundary: A valid transition can join the journey without changing every original raw identifier.
      Test the intended identity grain.'
    workedExample: A browser captures signup_started under anonymous ID a7, then identifies user_70 after signup.
      The valid transition supplies the evidence connecting a7 with user_70.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/identify
      title: 'The Identify Call: how identify works'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: A valid transition can join the journey without changing every original raw identifier. Test the intended
        identity grain.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: A browser captures signup_started under anonymous ID a7, then identifies user_70 after signup. The
        valid transition supplies the evidence connecting a7 with user_70.
    problems:
    - question: What link does the normal web identify transition establish?
      options:
      - Anonymous-to-known identity link.
      - Every project session to one user.
      - Any two established people without restriction.
      - Everyone with the same plan to one profile.
      correct: 0
      explanation: The normal transition has a specific identity context. Safeguards prevent arbitrary merges
        of established people.
      id: a20f1cc8-8ac6-4036-983d-7f3a34610d57
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: A browser captures signup_started as a7, then validly identifies user_70 and captures signup_finished.
        Which evidence connects the two stages?
      options:
      - Equal email-shaped properties alone.
      - Accepted a7-to-user70 transition.
      - An event-name prefix alone.
      - A shared URL and nearby timestamps alone.
      correct: 1
      explanation: The identity transition provides the link. Similar event metadata alone is not reliable identity
        evidence.
      id: e8eb7162-b15b-437d-a064-5372457ae0c6
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: a7 captures signup_started; identify(a7,user70) is accepted; user70 captures finished. A raw-ID
        query finds two IDs. Which validation fits the desired person funnel?
      options:
      - Require stored raw IDs to be rewritten.
      - Count all raw IDs as separate users.
      - Resolved-actor funnel validation.
      - Match the two stages by URL/time alone.
      correct: 2
      explanation: A valid transition can join the journey without changing every original raw identifier. Test
        the intended identity grain.
      type: scenario
      difficulty: 4
      id: 04809b72-a9d4-4233-9156-d604a30f8359
      purpose: practice
      isTransfer: true
    - question: Two anonymous journeys a1 and a2 validly identify user10. What independent evidence should a fixture
        check?
      options:
      - Emitted request count without acceptance checks.
      - Matching email values without accepted links.
      - Same browser version across both journeys.
      - Accepted links plus attribution on both journeys.
      correct: 3
      explanation: Request emission is weaker than accepted identity results. Check each transition and the resulting
        event attribution.
      type: scenario
      difficulty: 4
      id: posthog-data-model-identify-call-how-identify-works-exam-1
      purpose: exam
      isTransfer: true
    - question: identify is sent after login, but an ingestion warning rejects the ID. Which claim is supportable?
      options:
      - Attempted request; linking needs correction/verification.
      - HTTP success proves linking despite the warning.
      - Event-prefix equality proves linking.
      - Refusal proves all earlier events unrecoverable.
      correct: 0
      explanation: Transport acceptance and identity mutation acceptance differ. Use the warning and actual IDs
        to fix and test the supported operation.
      type: scenario
      difficulty: 4
      id: posthog-data-model-identify-call-how-identify-works-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: anonymous-vs-identified
  - id: identify-best-practices
    instruction: '**Identity hygiene** keeps capture state aligned with the active account. On logout or a change
      between unrelated users on a shared device, use the SDK reset flow before identifying the next user. Validate
      the new ID.


      The web SDK can suppress repeated identical identify calls on the same page, but this is not a guarantee
      of zero overhead across page reloads. Use an intentional authentication lifecycle.


      Application boundary: Application logout alone does not establish the analytics reset. Trace the client
      identity at capture time.'
    workedExample: User A logs out on a shared tablet. The app resets analytics state. User B then logs in and
      is identified with B's stable ID, keeping B's journey separate from A's.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/identify
      title: 'The Identify Call: identify best practices'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: Application logout alone does not establish the analytics reset. Trace the client identity at capture
        time.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: User A logs out on a shared tablet. The app resets analytics state. User B then logs in and is identified
        with B's stable ID, keeping B's journey separate from A's.
    problems:
    - question: Which identity lifecycle step helps separate two unrelated users who use the same browser in sequence?
      options:
      - Use current plan as the actor ID.
      - Logout reset.
      - Keep one shared actor for the device lifetime.
      - Retain the first user across later logins.
      correct: 1
      explanation: Reset clears the previous identity context. The next authenticated user can then establish
        their own identity.
      id: 21b4bfb5-1714-4eac-a095-0de6c7a23b75
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: An app repeats the same identify call three times on one page, then reloads and calls it again.
        Which claim is safe?
      options:
      - All repeated calls are universally free.
      - No future reload can send identify.
      - Same-page suppression; reload may send.
      - Each duplicate always creates a person.
      correct: 2
      explanation: Deduplication has a scope. Do not generalize same-page suppression into an unlimited guarantee.
      id: d3d5f92b-ddca-4895-9c2f-672f362cd9dc
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: On a shared browser, userA logs out without reset. The next userB capture occurs before its login
        callback identifies B. Which event is at risk?
      options:
      - App logout alone guarantees analytics reset.
      - Session expiry immediately guarantees a new actor.
      - OnlyB's display name can be affected.
      - Intervening captures may retain A.
      correct: 3
      explanation: Application logout alone does not establish the analytics reset. Trace the client identity
        at capture time.
      type: scenario
      difficulty: 4
      id: 405bb08a-899e-440a-a1a9-a95f1a9b5ada
      purpose: practice
      isTransfer: true
    - question: An SPA calls identify on every render. The team proposes this as universally cost-free. What should
        be measured?
      options:
      - Actual requests and lifecycle-specific deduplication.
      - Profile count alone proves request suppression.
      - SDK name alone proves zero reload cost.
      - Repeated identify always creates a new person.
      correct: 0
      explanation: Avoid universal SDK guarantees. Same-page suppression and reload behavior can differ; measure
        the concrete integration.
      type: scenario
      difficulty: 4
      id: posthog-data-model-identify-call-identify-best-practices-exam-1
      purpose: exam
      isTransfer: true
    - question: A regression test covers login but not logout or account switching. Which additional trace best
        detects cross-user contamination?
      options:
      - Same-user repeated login only.
      - Logout/reset, anonymous interval, then B.
      - Profile rename within one actor only.
      - New-tab activity without a logout boundary.
      correct: 1
      explanation: Exercise the identity boundary and intervening capture. Repeated same-user success does not
        expose stale identity.
      type: scenario
      difficulty: 4
      id: posthog-data-model-identify-call-identify-best-practices-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: anonymous-vs-identified
