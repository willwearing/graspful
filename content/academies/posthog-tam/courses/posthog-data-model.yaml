      options:
      - CompanyC as the occurrence context.
      - All three company keys packed into a single company string.
      - The user's first-ever company regardless of action.
      - The display name of whichever company updated last.
      correct: 0
      explanation: Membership does not establish occurrence attribution. Use the active business context for that
