- id: hogql-basics
  name: 'HogQL: SQL in PostHog'
  difficulty: 5
  estimatedMinutes: 60
  tags:
  - posthog
  - querying
  section: querying
  prerequisites:
  - ph-event-properties
  - ph-persons
  - data-models:associative-entities
  encompassing:
  - concept: ph-events
    weight: 0.35
  - concept: ph-event-properties
    weight: 0.45
  - concept: ph-persons
    weight: 0.3
  knowledgePoints:
  - id: sql-expressions-and-insights
    instruction: '**HogQL** is PostHog''s SQL dialect for querying analytics data. A query must use the intended
      row grain, filters, time range, and aggregation. count() over event rows counts events, while a distinct-actor
      calculation answers a different question.


      Check field types and joins. A one-to-many join can multiply event rows and inflate aggregates unless the
      query accounts for the new grain.


      Application boundary: Repeated matches multiply contributions. Equal legitimate amounts show why DISTINCT
      amount loses revenue. Repair the identity grain, not the numeric value.'
    workedExample: A user performs three purchase events. Counting event rows returns three purchases; a distinct-user
      measure returns one purchasing user. Name the metric according to its actual unit.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data-warehouse/sql
      title: 'HogQL: SQL in PostHog: sql expressions and insights'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: Repeated matches multiply contributions. Equal legitimate amounts show why DISTINCT amount loses revenue.
        Repair the identity grain, not the numeric value.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: A user performs three purchase events. Counting event rows returns three purchases; a distinct-user
        measure returns one purchasing user. Name the metric according to its actual unit.
    problems:
    - question: What does counting rows in an event table normally measure before any row-multiplying join?
      options:
      - Session count regardless of session IDs.
      - Selected event-row count.
      - Unique people regardless of repeat events.
      - Company count regardless of group context.
      correct: 1
      explanation: Aggregation follows row grain. Unique people, groups, and sessions require the relevant identity
        and counting logic.
      id: 1c146f3e-208a-4d37-b701-34b1a1e9c6f6
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: Three users each produce two matching events in a period. No joins duplicate rows. What does an
        event-row count return? Enter the number only.
      options: []
      correct: '6'
      explanation: 'The unit is events: three users times two events gives six rows. A distinct-user count would
        answer a different question.'
      type: fill_blank
      id: 39864a32-f538-4a9b-8688-191bfb12cb13
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: orders has rows (o1,$20), (o2,$20). usage has two matching rows per order. SUM(orders.amount)
        after joining is $80. Which repair preserves $40 revenue?
      options:
      - SUM(DISTINCT amount).
      - Divide every joined total by two.
      - Join to unique order keys before summing.
      - Sum direct detail-expanded order rows.
      correct: 2
      explanation: Repeated matches multiply contributions. Equal legitimate amounts show why DISTINCT amount
        loses revenue. Repair the identity grain, not the numeric value.
      type: scenario
      difficulty: 4
      id: 92ac1035-fd90-4028-9395-29ba588db8cd
      purpose: practice
      isTransfer: true
    - question: Selected events have actor IDs A, A, B and resolved person IDs P,P,Q. What does SELECT count() FROM
        events return for this fixture?
      options:
      - '2'
      - '1'
      - '6'
      - '3'
      correct: 3
      explanation: Count counts selected rows. Distinct actor/person counts are different aggregations even when
        one fixture happens to agree.
      type: scenario
      difficulty: 4
      id: posthog-data-model-hogql-basics-sql-expressions-and-insights-exam-1
      purpose: exam
      isTransfer: true
    - question: orders has one row each o1=$10,o2=$30. tags has rows (o1,red), (o1,blue), (o2,red). Which joined
        revenue is wrong and why?
      options:
      - $50:order1 contributes twice.
      - $40, because every order is unique after the join.
      - $30, because tags preserve only the largest order.
      - $20, because each tag divides revenue.
      correct: 0
      explanation: The joined rows are o1/red10,o1/blue10,o2/red30. Verify multiplicity per order before summing.
      type: scenario
      difficulty: 4
      id: posthog-data-model-hogql-basics-sql-expressions-and-insights-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: ph-events
  - id: when-to-use-hogql
    instruction: 'Use **SQL when the question needs explicit logic** such as a specialized join, derived metric,
      or validation that the standard insight builder cannot express well. A standard insight remains useful for
      supported common analyses.


      Make custom queries reviewable: document the unit, time window, filters, and denominator. Compare a small
      known sample before relying on a production result.


      To include accounts with zero usage, start from the full account population and left join usage aggregated
      by account. A left join retains accounts with no matching usage row. Treat a missing usage value as zero
      only when absence really means no recorded activity.


      Application boundary: Eligibility defines the denominator. Pre-aggregation prevents repetition; left join
      retains zero-use B. The other ratios either use event grain or remove inactivity.'
    workedExample: A paying-accounts table contains A, B, and C. Usage totals exist for A and C. Starting from
      paying accounts and left joining usage preserves B; an inner join would omit it. Convert B's missing total
      to zero only after confirming that missing means no captured usage, rather than a failed data load.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data-warehouse/sql
      title: 'HogQL: SQL in PostHog: when to use hogql'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: Eligibility defines the denominator. Pre-aggregation prevents repetition; left join retains zero-use
        B. The other ratios either use event grain or remove inactivity.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: A paying-accounts table contains A, B, and C. Usage totals exist for A and C. Starting from paying
        accounts and left joining usage preserves B; an inner join would omit it. Convert B's missing total to
        zero only after confirming that missing means no captured usage, rather than a failed data load.
    problems:
    - question: Which requirement is a strong reason to use a custom SQL query?
      options:
      - A belief SQL alone proves correctness.
      - A required unsupported custom calculation.
      - A desire to avoid documenting population.
      - A desire to replace a simple adequate chart with extra maintenance.
      correct: 1
      explanation: Choose SQL for needed expressive control. Correctness still depends on data meaning, joins,
        and validation.
      id: abfe1018-064f-4155-a618-e8e469b5b424
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: A conversion query divides purchasers by all event rows. The intended metric is purchasing users
        divided by eligible users. What needs correction?
      options:
      - Use all pageviews regardless of eligibility.
      - Count event names as users.
      - Correct eligible-user population and identity.
      - Keep event denominator and relabel.
      correct: 2
      explanation: Define the populations and unit before calculating the ratio. Event counts and user counts
        are not interchangeable.
      id: 4e0ad3aa-cf12-4d5b-93bd-8323319320b3
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: Paying_accounts contains A, B, C once each; usage contains A, A, C. The KPI is active paying accounts
        including inactive accounts. Which plan produces a validation table and 2/3?
      options:
      - INNER JOIN raw usage; count joined population.
      - Usage-event rows divided by account rows.
      - Distinct active keys divided by themselves.
      - Eligible accounts LEFT JOIN account-grain usage.
      correct: 3
      explanation: Eligibility defines the denominator. Pre-aggregation prevents repetition; left join retains
        zero-use B. The other ratios either use event grain or remove inactivity.
      type: scenario
      difficulty: 4
      id: c60f3847-129f-4317-90f5-b0273db733f2
      purpose: practice
      isTransfer: true
    - question: Eligible_users has U1,U2,U3,U4. Purchase events are U1,U1,U2. Which purchase-user rate fits?
      options:
      - 2/4 distinct eligible purchasing users.
      - 3/4 from event rows.
      - 2/2 from purchasers alone.
      - 3/3 from purchase deliveries.
      correct: 0
      explanation: Count eligible actors once in both populations. Repeated purchases are not additional people,
        and purchasers alone are not the denominator.
      type: scenario
      difficulty: 4
      id: posthog-data-model-hogql-basics-when-to-use-hogql-exam-1
      purpose: exam
      isTransfer: true
    - question: A standard trend already expresses the required event count and breakdown correctly. A custom
        query duplicates it. Which maintenance decision fits?
      options:
      - Use SQL because custom syntax guarantees accuracy.
      - Use the adequate standard insight.
      - Use SQL to avoid recording definitions.
      - Keep both totals and average them when they disagree.
      correct: 1
      explanation: Choose the least complex surface that meets the measurement contract. Custom SQL still needs
        fixtures and an owner.
      type: scenario
      difficulty: 4
      id: posthog-data-model-hogql-basics-when-to-use-hogql-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: ph-events
  sourceRef: https://posthog.com/docs/data-warehouse/sql; relevant named topic/contract in this concept; verified
    2026-10-07.
- id: hogql-event-selection
  name: Select events with bounded time
  section: sql-query-foundations
  difficulty: 4
  estimatedMinutes: 15
  tags:
  - applied
  - scenario
  - evidence
  sourceRef: https://posthog.com/docs/data-warehouse/sql; Select events with bounded time; verified 2026-10-07.
  prerequisites:
  - hogql-basics
  encompassing:
  - concept: hogql-basics
    weight: 0.5
  - concept: ph-event-properties
    weight: 0.3
  knowledgePoints:
  - id: select-filter-and-time
    instruction: A SQL query selects fields from a named table, filters rows in WHERE, and aggregates only the
      remaining rows. In PostHog the events table exposes event, timestamp, distinct_id, person_id, and properties.
      Use an explicit bounded time interval. A half-open window includes its start and excludes its end, so adjacent
      windows do not double-count the boundary. A saved SQL insight needs the supported filters placeholder if
      dashboard filters should apply. The examples use UTC and declared fixture tables; production table names
      and property types must be verified in the SQL editor.
    workedExample: For purchases during 1 October UTC, use event = purchase AND timestamp >= start AND timestamp
      < next_day. An event exactly at 2 October midnight belongs to the next day. First list the matching rows,
      then count them.
    problems:
    - question: Which WHERE clause selects only purchase events?
      options:
      - WHERE distinct_id = 'purchase'
      - WHERE person_id = 'purchase'
      - WHERE event = 'purchase'
      - WHERE properties.amount = 'purchase'
      correct: 2
      explanation: event is the occurrence name; actor IDs and amount are different fields.
      type: scenario
      difficulty: 2
      id: hogql-basics-select-filter-and-time-1
      purpose: practice
      isTransfer: false
    - question: Rows occur at Oct 1 00:00, Oct 1 12:00, Oct 2 00:00. How many lie in [Oct 1, Oct 2) UTC?
      options:
      - '1'
      - '3'
      - '0'
      - '2'
      correct: 3
      explanation: Include the start, exclude the end. Exactly two rows qualify.
      type: scenario
      difficulty: 3
      id: hogql-basics-select-filter-and-time-2
      purpose: practice
      isTransfer: false
    - question: Choose the clause that selects Oct 1 purchases without including Oct 2 midnight.
      options:
      - WHERE event = 'purchase' AND timestamp >= '2026-10-01 00:00:00' AND timestamp < '2026-10-02 00:00:00'
      - WHERE event = 'purchase' AND timestamp > '2026-10-01 00:00:00' AND timestamp <= '2026-10-02 00:00:00'
      - WHERE event = 'purchase' AND timestamp >= '2026-10-01 00:00:00' AND timestamp <= '2026-10-02 00:00:00'
      - WHERE event = 'purchase' AND timestamp > '2026-10-01 00:00:00' AND timestamp < '2026-10-02 00:00:00'
      correct: 0
      explanation: Include the Oct 1 start and exclude Oct 2 midnight. The other clauses either exclude
        the required start, include the next day, or do both.
      type: scenario
      difficulty: 4
      id: hogql-basics-select-filter-and-time-3
      purpose: practice
      isTransfer: true
    - question: A saved SQL insight has fixed timestamps and no filters placeholder. Changing dashboard dates
        does not change its scope. Which query contract should be evaluated?
      options:
      - Change dashboard dates but retain fixed SQL bounds.
      - Add/test the supported {filters} predicate.
      - Edit visualization title to match dates.
      - Remove all time conditions instead of defining filter scope.
      correct: 1
      explanation: The documented placeholder connects applicable UI filters to the SQL query. Test actual saved-insight
        behavior.
      type: scenario
      difficulty: 4
      id: hogql-basics-select-filter-and-time-4
      purpose: exam
      isTransfer: true
    - question: Two daily queries use timestamp BETWEEN their inclusive start/end boundaries. A midnight event
        counts twice. Which repair fits adjacent-window reporting?
      options:
      - Use >start and <=end but claim start inclusion.
      - Use inclusive BETWEEN in both daily queries.
      - Use >=start and <end for adjacent days.
      - Divide daily totals by two without checking boundaries.
      correct: 2
      explanation: Half-open intervals partition adjacent periods without shared boundary rows.
      type: scenario
      difficulty: 4
      id: hogql-basics-select-filter-and-time-5
      purpose: exam
      isTransfer: true
    keyPrerequisite: hogql-basics
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data-warehouse/sql
      title: 'Select events with bounded time: source contract'
      description: Verified 2026-10-07. Check the stated SDK/version and schema assumptions.
    workedExampleContent:
    - type: callout
      title: Worked trace
      body: For purchases during 1 October UTC, use event = purchase AND timestamp >= start AND timestamp < next_day.
        An event exactly at 2 October midnight belongs to the next day. First list the matching rows, then count
        them.
- id: hogql-property-units
  name: Validate SQL property types and units
  section: sql-query-foundations
  difficulty: 4
  estimatedMinutes: 15
  tags:
  - applied
  - scenario
  - evidence
  sourceRef: https://posthog.com/docs/data-warehouse/sql; Validate SQL property types and units; verified 2026-10-07.
  prerequisites:
  - hogql-event-selection
  encompassing:
  - concept: hogql-event-selection
    weight: 0.5
  - concept: ph-event-properties
    weight: 0.6
  knowledgePoints:
  - id: property-types-and-units
    instruction: Event properties are accessed with dot notation, such as properties.amount_cents. Use bracket
      notation for a property key with special characters. Inspect the actual property type and source schema
      before numeric calculations. These fixtures declare valid numeric cents; dividing by 100 converts to dollars
      once. Malformed or missing values need an explicit handling rule and coverage check. Do not silently replace
      invalid financial values with zero.
    workedExample: A valid purchase has amount_cents=1250 and currency=USD. toFloat(properties.amount_cents)/100
      gives 12.50 dollars. Before summing, filter to the required currency or apply a documented per-row conversion.
      A string such as "$12.50" requires source normalization rather than blind casting.
    problems:
    - question: Which expression reads a custom amount_cents event property?
      options:
      - person.properties.amount_cents
      - event.amount_cents
      - distinct_id.amount_cents
      - properties.amount_cents
      correct: 3
      explanation: Event properties and stored person properties are different sources.
      type: scenario
      difficulty: 2
      id: hogql-basics-property-types-and-units-1
      purpose: practice
      isTransfer: false
    - question: amount_cents values are 1250 and 500, both valid USD. What is their dollar sum?
      options:
      - '17.50'
      - '1750'
      - '1.75'
      - '1250.50'
      correct: 0
      explanation: Convert cents once; 12.50 + 5.00 = 17.50.
      type: scenario
      difficulty: 3
      id: hogql-basics-property-types-and-units-2
      purpose: practice
      isTransfer: false
    - question: Choose the sum for valid numeric USD cents on purchase rows.
      options:
      - SELECT sum(toFloat(properties.amount_cents)) FROM events WHERE event='purchase' AND properties.currency='USD'
        AND {filters}
      - SELECT sum(toFloat(properties.amount_cents))/100 FROM events WHERE event='purchase' AND properties.currency='USD'
        AND {filters}
      - SELECT sum(toFloat(properties.amount_cents))/100 FROM events WHERE event='purchase' AND properties.currency='EUR'
        AND {filters}
      - SELECT sum(toFloat(person.properties.amount_cents))/100 FROM events WHERE event='purchase' AND properties.currency='USD'
        AND {filters}
      correct: 1
      explanation: The answer preserves event source, event type, currency, and conversion. Validate types/coverage
        before running this expression on unknown data.
      type: scenario
      difficulty: 4
      id: hogql-basics-property-types-and-units-3
      purpose: practice
      isTransfer: true
    - question: The backend sends numeric cents; web sends a formatted dollar string. Which acceptance fixture
        prevents a valid-looking wrong total?
      options:
      - Equal row counts without value fixtures.
      - One valid backend cast without web input.
      - Unit/type fixtures for both sources and invalids.
      - Largest source total as canonical revenue.
      correct: 2
      explanation: A compatible type alone does not establish unit or representation. Test both positive and malformed
        examples.
      type: scenario
      difficulty: 4
      id: hogql-basics-property-types-and-units-4
      purpose: exam
      isTransfer: true
    - question: A property key is $feature/checkout. Which documented access form avoids treating slash as expression
        syntax?
      options:
      - properties.$feature / checkout
      - person.properties['$feature/checkout']
      - properties['$feature.checkout']
      - properties['$feature/checkout']
      correct: 3
      explanation: Bracket notation identifies the full property key.
      type: scenario
      difficulty: 4
      id: hogql-basics-property-types-and-units-5
      purpose: exam
      isTransfer: true
    keyPrerequisite: hogql-event-selection
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data-warehouse/sql
      title: 'Validate SQL property types and units: source contract'
      description: Verified 2026-10-07. Check the stated SDK/version and schema assumptions.
    workedExampleContent:
    - type: callout
      title: Worked trace
      body: A valid purchase has amount_cents=1250 and currency=USD. toFloat(properties.amount_cents)/100 gives 12.50
        dollars. Before summing, filter to the required currency or apply a documented per-row conversion. A string
        such as "$12.50" requires source normalization rather than blind casting.
- id: hogql-actor-grain
  name: Count events and resolved actors
  section: sql-query-foundations
  difficulty: 4
  estimatedMinutes: 15
  tags:
  - applied
  - scenario
  - evidence
  sourceRef: https://posthog.com/docs/data-warehouse/sql; Count events and resolved actors; verified 2026-10-07.
  prerequisites:
  - hogql-event-selection
  - ph-distinct-id
  encompassing:
  - concept: hogql-event-selection
    weight: 0.5
  - concept: ph-distinct-id
    weight: 0.6
  knowledgePoints:
  - id: actor-grain-and-aggregation
    instruction: count() counts selected rows. count(DISTINCT distinct_id) counts supplied raw identifiers. A
      resolved-person metric should use the documented person_id path and a fixture with accepted identity links.
      A resolved actor is still a declared analytics unit, not proof of a unique human in every integration. Check
      missing/invalid IDs and population rules. GROUP BY emits one row per grouping key; it does not make every
      joined input unique.
    workedExample: Three events have raw IDs a1, a1, user9 and all resolve to person P. Event count is 3; raw-ID
      count is 2; resolved-person count is 1. SELECT person_id, count() FROM events GROUP BY person_id returns
      P with 3. Verify the accepted link independently.
    problems:
    - question: For raw IDs A, A, B, what does count(DISTINCT distinct_id) return?
      options:
      - '2'
      - '1'
      - '3'
      - '6'
      correct: 0
      explanation: Distinct eliminates repeat values at the specified identifier grain.
      type: scenario
      difficulty: 2
      id: hogql-basics-actor-grain-and-aggregation-1
      purpose: practice
      isTransfer: false
    - question: Three events resolve to person P. Which expression counts the resolved-person unit in this fixture?
      options:
      - count()
      - count(DISTINCT person_id)
      - count(DISTINCT event)
      - sum(properties.amount)
      correct: 1
      explanation: Select the field that represents the intended actor grain and verify its resolution semantics.
      type: scenario
      difficulty: 3
      id: hogql-basics-actor-grain-and-aggregation-2
      purpose: practice
      isTransfer: false
    - question: IDs a1, user9 resolve to P; b2 resolves to Q. Each appears once. Which pair fits count() and count(DISTINCT
        person_id)?
      options:
      - 3 and 3.
      - 2 and 3.
      - 3 and 2.
      - 1 and 2.
      correct: 2
      explanation: The query counts 3 rows but 2 resolved identities. Raw IDs and resolved persons answer different
        questions.
      type: scenario
      difficulty: 4
      id: hogql-basics-actor-grain-and-aggregation-3
      purpose: practice
      isTransfer: true
    - question: Query SELECT person_id,count() FROM events GROUP BY person_id sees P,P,Q. What output fits?
      options:
      - P:1, Q:1.
      - One aggregate row:3.
      - Three source rows, each count 1.
      - P:2, Q:1.
      correct: 3
      explanation: Grouping creates one result per person key and aggregates its matching rows.
      type: scenario
      difficulty: 4
      id: hogql-basics-actor-grain-and-aggregation-4
      purpose: exam
      isTransfer: true
    - question: A KPI needs eligible purchasers. Purchase rows include ineligible people. Which query design preserves
        the population?
      options:
      - Purchasers intersected with eligible resolved users.
      - All purchasing users regardless of eligibility.
      - Purchase events divided by eligible-user rows.
      - Purchasers divided by purchasers only.
      correct: 0
      explanation: Eligibility is an independent contract. An event filter alone may not define the business population.
      type: scenario
      difficulty: 4
      id: hogql-basics-actor-grain-and-aggregation-5
      purpose: exam
      isTransfer: true
    keyPrerequisite: hogql-event-selection
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data-warehouse/sql
      title: 'Count events and resolved actors: source contract'
      description: Verified 2026-10-07. Check the stated SDK/version and schema assumptions.
    workedExampleContent:
    - type: callout
      title: Worked trace
      body: Three events have raw IDs a1, a1, user9 and all resolve to person P. Event count is 3; raw-ID count is
        2; resolved-person count is 1. SELECT person_id, count() FROM events GROUP BY person_id returns P with
        3. Verify the accepted link independently.
- id: hogql-join-grain
  name: Repair joins at the declared grain
  section: sql-query-validation
  difficulty: 4
  estimatedMinutes: 15
  tags:
  - applied
  - scenario
  - evidence
  sourceRef: https://posthog.com/docs/data-warehouse/sql; Repair joins at the declared grain; verified 2026-10-07.
  prerequisites:
  - hogql-property-units
  - hogql-actor-grain
  encompassing:
  - concept: hogql-property-units
    weight: 0.5
  - concept: hogql-actor-grain
    weight: 0.7
  - concept: data-models:associative-entities
    weight: 0.5
  knowledgePoints:
  - id: join-grain-and-repair
    instruction: Before a join, write the grain of each input and the expected match count per key. Joining one
      order to several usage rows repeats the order contribution. Aggregate the many side to the required join
      key, or use a validated semi-join/existence test when only membership is needed. DISTINCT on amount does
      not deduplicate order identity. The fixtures use unique order IDs and ordinary relational joins; verify
      source-table names and key types in PostHog.
    workedExample: orders has rows (o1,20), (o2,20); usage has rows (o1,x), (o1,y), (o2,z). Direct join gives amounts 20,20,20,
      so sum=60. First SELECT order_id FROM usage GROUP BY order_id; joining this two-row key set to orders gives 40.
      DISTINCT amount would give 20 and lose a legitimate order.
    problems:
    - question: One order with three matching detail rows contributes how many order copies after a direct join?
      options:
      - '1'
      - '3'
      - '2'
      - '0'
      correct: 1
      explanation: A matching row pair contributes one joined row, so the one-side value repeats.
      type: scenario
      difficulty: 2
      id: hogql-basics-join-grain-and-repair-1
      purpose: practice
      isTransfer: false
    - question: Two different orders each cost 20. What does SUM(DISTINCT amount) return?
      options:
      - '40'
      - '60'
      - '20'
      - '0'
      correct: 2
      explanation: Numeric distinctness is not order identity. Equal legitimate amounts collapse.
      type: scenario
      difficulty: 3
      id: hogql-basics-join-grain-and-repair-2
      purpose: practice
      isTransfer: false
    - question: orders has A:20, B:20. detail has A:x, A:y, B:z. Which query sums each matched order once?
      options:
      - SELECT sum(DISTINCT o.amount) FROM orders o JOIN (SELECT order_id FROM detail GROUP BY order_id) d ON
        o.id=d.order_id
      - SELECT sum(o.amount)/2 FROM orders o JOIN (SELECT order_id FROM detail GROUP BY order_id) d ON o.id=d.order_id
      - SELECT sum(o.amount) FROM orders o JOIN (SELECT order_id FROM detail) d ON o.id=d.order_id
      - SELECT sum(o.amount) FROM orders o JOIN (SELECT order_id FROM detail GROUP BY order_id) d ON o.id=d.order_id
      correct: 3
      explanation: The key subquery supplies at most one matching row per order. Numeric DISTINCT returns 20 instead
        of 40 in this equal-price fixture, while the direct join returns 60. The key subquery returns 40.
      type: scenario
      difficulty: 4
      id: hogql-basics-join-grain-and-repair-3
      purpose: practice
      isTransfer: true
    - question: After pre-aggregating usage, revenue still doubles. Billing_accounts contains duplicate account
        keys. Which check comes next?
      options:
      - Uniqueness/grain of billing input too.
      - DISTINCT amount instead of order identity.
      - Divide every total by two without a rule.
      - One-side aggregation assumed to constrain both inputs.
      correct: 0
      explanation: Both sides must satisfy the declared cardinality. A repair on one input does not constrain
        the other.
      type: scenario
      difficulty: 4
      id: hogql-basics-join-grain-and-repair-4
      purpose: exam
      isTransfer: true
    - question: A report only needs orders that have at least one successful shipment. It does not need shipment
        rows. What query design should be considered?
      options:
      - Direct join to all shipment occurrences.
      - Existence/key-set match at order grain.
      - SUM(DISTINCT amount) after shipment join.
      - Fixed divisor by average shipments per order.
      correct: 1
      explanation: Membership and detail expansion are different requirements. Choose a design that does not multiply
        the order grain.
      type: scenario
      difficulty: 4
      id: hogql-basics-join-grain-and-repair-5
      purpose: exam
      isTransfer: true
    keyPrerequisite: hogql-property-units
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data-warehouse/sql
      title: 'Repair joins at the declared grain: source contract'
      description: Verified 2026-10-07. Check the stated SDK/version and schema assumptions.
    workedExampleContent:
    - type: callout
      title: Worked trace
      body: orders has rows (o1,20), (o2,20); usage has rows (o1,x), (o1,y), (o2,z). Direct join gives amounts 20,20,20, so sum=60.
        First SELECT order_id FROM usage GROUP BY order_id; joining this two-row key set to orders gives 40. DISTINCT
        amount would give 20 and lose a legitimate order.
- id: hogql-zero-usage
  name: Preserve zero-use eligible accounts
  section: sql-query-validation
  difficulty: 4
  estimatedMinutes: 15
  tags:
  - applied
  - scenario
  - evidence
  sourceRef: https://posthog.com/docs/data-warehouse/sql; Preserve zero-use eligible accounts; verified 2026-10-07.
  prerequisites:
  - hogql-join-grain
  encompassing:
  - concept: hogql-join-grain
    weight: 0.7
  - concept: hogql-actor-grain
    weight: 0.5
  knowledgePoints:
  - id: zero-usage-denominators
    instruction: For adoption, start from the authoritative eligible population. Aggregate usage to one row per
      eligible key, then LEFT JOIN so zero-use members remain. Keep right-side activity restrictions inside the
      usage subquery or join condition; a WHERE filter requiring a right-side match can remove the zero-use rows.
      Check eligibility-table uniqueness before joining. These fixtures use ordinary SQL null behavior; verify
      the actual warehouse schema and HogQL null handling.
    workedExample: Paying_accounts has A, B, C once each. Usage has A, A, C. Aggregated usage gives A:2, C:1. LEFT
      JOIN from accounts returns A:2, B:0, C:1 after a tested missing-value mapping. Active-paying-account rate
      is 2/3.
    problems:
    - question: What population defines the denominator of active paying-account rate?
      options:
      - Only accounts with usage.
      - All usage-event rows.
      - All declared paying accounts in scope.
      - All distinct event names.
      correct: 2
      explanation: The business eligibility contract defines the denominator.
      type: scenario
      difficulty: 2
      id: hogql-basics-zero-usage-denominators-1
      purpose: practice
      isTransfer: false
    - question: Three paying accounts exist; two have usage. What fraction is active?
      options:
      - 2/2
      - 3/3
      - 3/2
      - 2/3
      correct: 3
      explanation: Retain the inactive eligible account in the denominator.
      type: scenario
      difficulty: 3
      id: hogql-basics-zero-usage-denominators-2
      purpose: practice
      isTransfer: false
    - question: Which join plan preserves zero-use paying accounts?
      options:
      - Eligible accounts LEFT JOIN account-grain usage.
      - Eligible accounts INNER JOIN account-grain usage.
      - Usage LEFT JOIN eligible accounts, with no zero-use rows.
      - Eligible accounts INNER JOIN raw usage, count joined rows.
      correct: 0
      explanation: The eligible table must be the preserved side, and usage must not multiply its grain.
      type: scenario
      difficulty: 4
      id: hogql-basics-zero-usage-denominators-3
      purpose: practice
      isTransfer: true
    - question: A left join preserves B with no usage. WHERE usage.event='opened' then removes B. Where should
        the activity filter move?
      options:
      - WHERE requires a right-side match.
      - Filter usage inside subquery/match condition.
      - WHERE keeps only usage.account_id IS NOT NULL.
      - Change LEFT to INNER but keep the denominator claim.
      correct: 1
      explanation: A right-side WHERE predicate can convert the effective result to matched-only. Filter the measured
        usage before preserving eligibility.
      type: scenario
      difficulty: 4
      id: hogql-basics-zero-usage-denominators-4
      purpose: exam
      isTransfer: true
    - question: Eligible account rows are A, A, B; usage has A. The business has two eligible accounts. What must
        be fixed before rate calculation?
      options:
      - Count eligibility rows A, A, B as three accounts.
      - Use active usage keys alone as denominator.
      - Unique eligible accounts A, B before preserving both.
      - Give duplicate A an invented account identity.
      correct: 2
      explanation: The denominator table also needs the intended grain. Deduplication must follow the authoritative
        eligibility identity.
      type: scenario
      difficulty: 4
      id: hogql-basics-zero-usage-denominators-5
      purpose: exam
      isTransfer: true
    keyPrerequisite: hogql-join-grain
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data-warehouse/sql
      title: 'Preserve zero-use eligible accounts: source contract'
      description: Verified 2026-10-07. Check the stated SDK/version and schema assumptions.
    workedExampleContent:
    - type: callout
      title: Worked trace
      body: Paying_accounts has A, B, C once each. Usage has A, A, C. Aggregated usage gives A:2, C:1. LEFT JOIN from
        accounts returns A:2, B:0, C:1 after a tested missing-value mapping. Active-paying-account rate is 2/3.
- id: hogql-query-validation
  name: Validate and explain a metric query
  section: sql-query-validation
  difficulty: 5
  estimatedMinutes: 15
  tags:
  - applied
  - scenario
  - evidence
  sourceRef: https://posthog.com/docs/data-warehouse/sql; Validate and explain a metric query; verified 2026-10-07.
  prerequisites:
  - hogql-zero-usage
  encompassing:
  - concept: hogql-zero-usage
    weight: 0.6
  - concept: hogql-join-grain
    weight: 0.6
  - concept: hogql-actor-grain
    weight: 0.4
  - concept: hogql-event-selection
    weight: 0.4
  knowledgePoints:
  - id: validate-and-explain-query
    instruction: 'Validate a query in layers: confirm scope and source types; list a small expected row set; compare
      intermediate grain; test the aggregate against a hand-computed fixture; then check missing values, duplicate
      keys, boundary times, and zero-use populations. PostHog-specific syntax and identity resolution need validation
      in the SQL editor or an appropriate integration test. A portable SQL fixture tests relational reasoning,
      not every HogQL engine behavior. When responding to a customer, state the metric definition, checked evidence,
      limitation, and next validation step.'
    workedExample: For accounts A, B, C and usage A, A, C, the per-account rows should be A:2, B:0, C:1. If the query
      returns only A,C, inspect preservation/filtering before quoting adoption. If it returns four rows, inspect
      duplicate keys before summing.
    problems:
    - question: Which fixture best detects SUM(DISTINCT amount) losing legitimate orders?
      options:
      - One order with one amount.
      - No orders.
      - Two distinct orders with different amounts.
      - Two distinct orders with equal amounts.
      correct: 3
      explanation: Use a case that distinguishes numeric equality from occurrence identity.
      type: scenario
      difficulty: 2
      id: hogql-basics-validate-and-explain-query-1
      purpose: practice
      isTransfer: false
    - question: Which fixture detects an eligibility INNER JOIN excluding inactivity?
      options:
      - An eligible account with no qualifying usage.
      - Only active accounts.
      - Only events outside the project.
      - Only one purchase with a non-zero amount.
      correct: 0
      explanation: The missing-match case tests the preserved population directly.
      type: scenario
      difficulty: 3
      id: hogql-basics-validate-and-explain-query-2
      purpose: practice
      isTransfer: false
    - question: A query returns a plausible 2/3 rate, but no per-account rows were checked. Which next check establishes
        its meaning?
      options:
      - Plausible ratio alone.
      - Per-account rows plus independent eligibility.
      - Aggregate event volume alone.
      - Current actor names alone.
      correct: 1
      explanation: Several wrong queries can produce plausible numbers. Intermediate rows and independent definitions
        establish the measurement.
      type: scenario
      difficulty: 4
      id: hogql-basics-validate-and-explain-query-3
      purpose: practice
      isTransfer: true
    - question: A SQLite fixture passes for join cardinality. The production query uses person_id and JSON properties.
        What remains to validate?
      options:
      - Relational counts only because SQLite passed.
      - Parsing only because syntax proves semantics.
      - HogQL syntax, types, identity, project scope.
      - Scope only because all engines coerce types equally.
      correct: 2
      explanation: Portable execution checks relational results. Engine-specific contracts require their own validation.
      type: scenario
      difficulty: 4
      id: hogql-basics-validate-and-explain-query-4
      purpose: exam
      isTransfer: true
    - question: A customer asks if the query proves adoption rose. Eligibility changed between weeks. Which explanation
        is required?
      options:
      - Event-volume increase as adoption proof.
      - New eligibility treated as unchanged population.
      - Numerator growth without repeated-actor checks.
      - Comparable eligibility and denominator change.
      correct: 3
      explanation: Changes in eligibility can change the rate without changed behavior. State what is measured
        and compare consistent populations.
      type: scenario
      difficulty: 4
      id: hogql-basics-validate-and-explain-query-5
      purpose: exam
      isTransfer: true
    keyPrerequisite: hogql-zero-usage
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data-warehouse/sql
      title: 'Validate and explain a metric query: source contract'
      description: Verified 2026-10-07. Check the stated SDK/version and schema assumptions.
    workedExampleContent:
    - type: callout
      title: Worked trace
      body: For accounts A, B, C and usage A, A, C, the per-account rows should be A:2, B:0, C:1. If the query returns
        only A,C, inspect preservation/filtering before quoting adoption. If it returns four rows, inspect duplicate
        keys before summing.
- id: identity-trace-capstone
  name: Diagnose an identity lifecycle trace
  section: identity-investigation
  difficulty: 5
  estimatedMinutes: 15
  tags:
  - applied
  - scenario
  - evidence
  sourceRef: https://posthog.com/docs/product-analytics/identify; Diagnose an identity lifecycle trace; verified
    2026-10-07.
  prerequisites:
  - identification-pitfalls
  - ph-sessions
  encompassing:
  - concept: identification-pitfalls
    weight: 0.9
  - concept: identify-call
    weight: 0.7
  - concept: ph-distinct-id
    weight: 0.7
  - concept: ph-sessions
    weight: 0.3
  knowledgePoints:
  - id: identity-trace-capstone
    instruction: Investigate identity from a time-ordered trace. For each source, record the trusted application
      actor, transmitted distinct ID, SDK mode, identify/reset operation, response or warning, and resulting attribution.
      A merge hypothesis needs accepted linking evidence, not only equal properties. Stop corrupt writes before
      repair. On shared devices, inspect the anonymous interval after logout and before the next accepted login.
      A customer response should state the confirmed affected IDs/time range, the root writer, a bounded regression,
      and any historical repair limit.
    workedExample: At 09:00 browser a1 starts signup. At 09:01 backend sends signup_completed for tenant2:user9.
      At 09:02 browser accepted identify links a1 to tenant2:user9. At 10:00 logout resets; the next event is a
      fresh anonymous ID. At 10:10 another user authenticates with tenant2:user10. Test resolved attribution of
      the signup and separation of the next user; session equality is a separate question.
    problems:
    - question: Which evidence links anonymous a1 to tenant2:user9?
      options:
      - An accepted identify transition with those exact IDs.
      - Matching plan properties alone.
      - Nearby timestamps alone.
      - Equal display names alone.
      correct: 0
      explanation: A supported accepted transition establishes linkage under the application identity contract.
      type: scenario
      difficulty: 2
      id: identification-pitfalls-identity-trace-capstone-1
      purpose: practice
      isTransfer: false
    - question: Logout succeeds but reset is absent. What should a shared-device fixture inspect?
      options:
      - The person ID after the next accepted login.
      - The actor ID on the next pre-login capture.
      - The session ID before and after the next login.
      - The profile properties after the next identify.
      correct: 1
      explanation: The intervening event can reveal stale analytics identity before the next login changes state.
      type: scenario
      difficulty: 3
      id: identification-pitfalls-identity-trace-capstone-2
      purpose: practice
      isTransfer: false
    - question: 'Trace: userA is current; app logout occurs without reset; pricing_view is captured as A; userB
        then authenticates. Which bounded repair test targets the root defect?'
      options:
      - Merge A and B because they share a device.
      - Change event name but retain A actor.
      - Reset on logout; verify anonymous interval then B.
      - Wait for session expiry instead of reset.
      correct: 2
      explanation: Fix the lifecycle boundary and test the intervening actor. Sharing a device does not make the
        users one person.
      type: scenario
      difficulty: 4
      id: identification-pitfalls-identity-trace-capstone-3
      purpose: practice
      isTransfer: true
    - question: Frontend uses tenant1:user7; worker uses user7 for tenants 1 and 2. Both workers return HTTP 200. What
        test packet should drive correction?
      options:
      - Two HTTP statuses without actor inspection.
      - One tenant with repeated captures only.
      - Equal emails without namespace checks.
      - Canonical per-tenant/source capture fixture.
      correct: 3
      explanation: Transport success does not prove correct actor namespace. Test legitimate same-user links and
        separation of different tenants.
      type: scenario
      difficulty: 4
      id: identification-pitfalls-identity-trace-capstone-4
      purpose: exam
      isTransfer: true
    - question: A worker sends shared ID unknown; warnings and merged histories appear. Which customer recovery
        statement fits available evidence?
      options:
      - Stop writer; scope evidence; test; assess repair.
      - Split before stopping the writer.
      - Replay using newly guessed actor IDs.
      - Promise full restoration from profile names.
      correct: 0
      explanation: A durable remediation starts with the source defect. Historical attribution must be supported
        by authoritative evidence.
      type: scenario
      difficulty: 4
      id: identification-pitfalls-identity-trace-capstone-5
      purpose: exam
      isTransfer: true
    keyPrerequisite: identification-pitfalls
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/identify
      title: 'Diagnose an identity lifecycle trace: source contract'
      description: Verified 2026-10-07. Check the stated SDK/version and schema assumptions.
    workedExampleContent:
    - type: callout
      title: Worked trace
      body: At 09:00 browser a1 starts signup. At 09:01 backend sends signup_completed for tenant2:user9. At 09:02
        browser accepted identify links a1 to tenant2:user9. At 10:00 logout resets; the next event is a fresh
        anonymous ID. At 10:10 another user authenticates with tenant2:user10. Test resolved attribution of the
        signup and separation of the next user; session equality is a separate question.
