- id: identification-pitfalls
  name: Common Identification Pitfalls
  difficulty: 6
  estimatedMinutes: 18
  tags:
  - posthog
  - identification
  section: identification
  prerequisites:
  - person-merging
  - person-modes
  encompassing: []
  knowledgePoints:
  - id: duplicate-profiles-across-devices
    instruction: '**Cross-device identity** requires a shared canonical ID and valid links from each device''s
      anonymous state. Before a device identifies, its anonymous activity can remain separate. A stored email
      property alone is not a device link.


      Test the transition on each device. Distinguish a temporary anonymous journey from a genuinely conflicting
      known-user ID. A resolved person can have separate sessions on separate devices; matching session IDs are
      not required for a person link.


      Application boundary: Person, identifier, and session are distinct grains. Validate each requested metric
      with the appropriate key.'
    workedExample: A laptop identifies user_24 after login. A phone stays anonymous until its own login, then
      identifies the same user_24. Each device needs its own valid transition.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/identify
      title: 'Common Identification Pitfalls: duplicate profiles across devices'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: Person, identifier, and session are distinct grains. Validate each requested metric with the appropriate
        key.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: A laptop identifies user_24 after login. A phone stays anonymous until its own login, then identifies
        the same user_24. Each device needs its own valid transition.
    problems:
    - question: Why can one real person initially have separate anonymous journeys on two devices?
      options:
      - Shared IP proves one person.
      - Equal email properties automatically link devices.
      - Separate initial device identities.
      - Nearby event times prove one person.
      correct: 2
      explanation: Anonymous device state does not by itself prove a shared person. A valid identity transition
        supplies that connection.
      id: 7a68da19-1407-40c0-bf01-005e26ccb2ce
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: Two devices validly identify the same canonical user. They retain different browser session IDs.
        Does the session difference establish an identity-link failure?
      options:
      - No, so all devices are one session.
      - Yes, the second must overwrite the first session ID.
      - Yes, identity needs one session across devices.
      - No; separate sessions can share a person.
      correct: 3
      explanation: Person identity and session identity have different scopes. Verify the person link independently
        of each device's session.
      id: ca9636ff-7b22-47fe-9157-5d87dd73f791
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: Phone a1 and laptop a2 identify the same canonical user. Person counts drop from two raw IDs to
        one resolved actor, while sessions remain two. Which interpretation fits?
      options:
      - Valid person resolution with separate sessions.
      - Different sessions prove a failed identity link.
      - A shared actor forces one cross-device session.
      - Accepted links rewrite every raw event ID.
      correct: 0
      explanation: Person, identifier, and session are distinct grains. Validate each requested metric with the
        appropriate key.
      type: scenario
      difficulty: 4
      id: d015765b-1f71-4a40-adaf-ec729bbca150
      purpose: practice
      isTransfer: true
    - question: Two devices never authenticate or link. They share an IP and a campaign. Can their journeys be
        reliably combined as one person?
      options:
      - Shared IP alone proves one actor.
      - No authoritative linking evidence.
      - Equal campaign alone proves one actor.
      - Nearby event timestamps alone prove one actor.
      correct: 1
      explanation: Shared environment and attribution properties are not trustworthy user identity. State the
        anonymous cross-device limit.
      type: scenario
      difficulty: 4
      id: posthog-data-model-identification-pitfalls-duplicate-profiles-across-devices-exam-1
      purpose: exam
      isTransfer: true
    - question: One device identifies account-scoped user9; another identifies global user9. The app intended
        the same actor. What should the audit compare?
      options:
      - Runtime difference alone proves separate users.
      - Session duration alone establishes namespace.
      - Namespace, representation, and link/migration policy.
      - Transport status alone establishes canonical IDs.
      correct: 2
      explanation: The same visible number can have different identity scope. Reconcile the application contract
        before linking records.
      type: scenario
      difficulty: 4
      id: posthog-data-model-identification-pitfalls-duplicate-profiles-across-devices-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: person-merging
  - id: canonical-ids-across-systems
    instruction: 'A **canonical ID contract** specifies the exact value each system uses for a known actor. Include
      namespace, type conversion, and ownership. Values such as 42, user_42, and an email address are different
      strings unless deliberately linked.


      Use trusted authentication or application records as the source. Instrumentation tests should compare the
      actual IDs emitted by every participating system.


      Application boundary: A single-tenant success test misses namespace collisions. Test both legitimate actors
      and cross-source consistency.'
    workedExample: The identity contract says tenant_5:user_42. Frontend login, API capture, and background jobs
      all derive that same value from trusted tenant and user records.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/identify
      title: 'Common Identification Pitfalls: canonical ids across systems'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: A single-tenant success test misses namespace collisions. Test both legitimate actors and cross-source
        consistency.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: The identity contract says tenant_5:user_42. Frontend login, API capture, and background jobs all
        derive that same value from trusted tenant and user records.
    problems:
    - question: What should a cross-system canonical ID contract specify?
      options:
      - Only current display name.
      - Fresh random value per occurrence.
      - Unlinked service-local IDs without scope.
      - Stable representation and namespace.
      correct: 3
      explanation: An exact contract prevents collisions and string mismatches. Display names and presentation
        do not define identity.
      id: 845098ec-4afe-4b9e-a544-54bed684c366
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: The frontend emits tenant_5:user_42, but a worker emits user_42 and tenants can share user numbers.
        What needs correction?
      options:
      - Tenant-aware canonical actor ID.
      - Use queue name as actor.
      - Remove tenant scope despite collisions.
      - Force one session ID across all sources.
      correct: 0
      explanation: The missing namespace changes identity and can cause collisions. Align the worker with the
        established source-of-truth contract.
      id: 28e132cb-c97b-4910-92a7-e58ae69addbb
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: tenant5:user42 and tenant6:user42 are different people. A worker sends user42 for both. Which
        acceptance fixture detects the defect?
      options:
      - One-tenant repeated capture only.
      - Per-tenant/source identity test.
      - Amount reconciliation without actor checks.
      - HTTP success without namespace validation.
      correct: 1
      explanation: A single-tenant success test misses namespace collisions. Test both legitimate actors and cross-source
        consistency.
      type: scenario
      difficulty: 4
      id: ce6bffc0-3d23-4eae-862c-27f1a324c514
      purpose: practice
      isTransfer: true
    - question: A CRM contact ID can merge, but application user UUID is stable. Which ID contract suits product
        user analytics?
      options:
      - Latest mutable CRM ID without mapping.
      - Email text without uniqueness scope.
      - Stable app actor with explicit CRM mapping.
      - Separate unlinked IDs for each connector.
      correct: 2
      explanation: Choose the authoritative actor and document mutable external mappings. External record lifecycle
        need not equal user identity lifecycle.
      type: scenario
      difficulty: 4
      id: posthog-data-model-identification-pitfalls-canonical-ids-across-systems-exam-1
      purpose: exam
      isTransfer: true
    - question: A key is built as tenant+user without a delimiter. Pairs (1,23) and (12,3) both become123. What
        contract change is required?
      options:
      - Concatenate components without unambiguous boundaries.
      - Use a display label to infer the tuple.
      - Normalize only one writer and ignore existing collisions.
      - Unambiguous canonical pair serialization.
      correct: 3
      explanation: Namespacing works only if encoding preserves the pair identity. Test edge cases across every
        writer.
      type: scenario
      difficulty: 4
      id: posthog-data-model-identification-pitfalls-canonical-ids-across-systems-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: person-merging
  - id: cross-device-gaps
    instruction: '**Journey-gap diagnosis** checks each event''s project, distinct ID, time, and identity transition.
      Backend activity can arrive before frontend identification when it already uses the correct canonical ID.
      The useful requirement is a valid eventual link, rather than a universal frontend-first order.


      Person identity and session identity remain separate. A connected person history does not imply one session
      across devices.


      Application boundary: Known-user capture need not wait, but the anonymous browser journey still needs a
      valid link. Person and session evidence remain separate.'
    workedExample: A backend signup event arrives as user_90. The browser later identifies its anonymous ID to
      user_90. Investigate the validity of that link instead of treating arrival order alone as a failure.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/identify
      title: 'Common Identification Pitfalls: cross device gaps'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: Known-user capture need not wait, but the anonymous browser journey still needs a valid link. Person
        and session evidence remain separate.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: A backend signup event arrives as user_90. The browser later identifies its anonymous ID to user_90.
        Investigate the validity of that link instead of treating arrival order alone as a failure.
    problems:
    - question: Does backend capture always have to wait for frontend identify when the backend already knows
        the canonical user ID?
      options:
      - Known backend ID; browser link still needed.
      - No, arbitrary backend IDs link automatically.
      - Yes, backend must always wait for browser ID.
      - Yes, earlier backend events are permanently unusable.
      correct: 0
      explanation: Canonical identity and valid linking matter. Arrival order alone does not determine whether
        the history can connect.
      id: 2a2cee1e-2387-4fd7-86f7-64e998bef93d
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: A server records signup_completed as user_90 before the browser validly identifies to user_90.
        Which outcome is supported?
      options:
      - Both automatically share a browser session.
      - Accepted linking can resolve them together.
      - Server-first timing makes permanent separate actors.
      - Rewrite server ID to the anonymous browser ID.
      correct: 1
      explanation: A valid link to the same canonical identity can connect person history. Session membership
        is a separate question.
      id: 6a258812-5f56-41bd-ba3f-3f2d797d69e7
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: Backend signup(user90) arrives before browser identify(a9,user90). The link is accepted. Which
        fixture should verify the intended funnel?
      options:
      - Server-first timing forces separate people.
      - Matching plan values automatically join actors.
      - Resolved actor; session unproved.
      - Accepted person link guarantees session equality.
      correct: 2
      explanation: Known-user capture need not wait, but the anonymous browser journey still needs a valid link.
        Person and session evidence remain separate.
      type: scenario
      difficulty: 4
      id: f2e7aed7-6004-4789-9cbd-64314603d686
      purpose: practice
      isTransfer: true
    - question: A browser was closed before it could identify after successful server signup. Server uses user90;
        browser events use a9. No link exists. What remains uncertain?
      options:
      - Known backend ID proves browser linkage.
      - Shared plan proves the missing transition.
      - Nearby timestamps prove anonymous ownership.
      - The anonymous-to-known actor association.
      correct: 3
      explanation: Canonical server identity does not infer the missing anonymous transition. Preserve evidence
        and establish a legitimate supported link if possible.
      type: scenario
      difficulty: 4
      id: posthog-data-model-identification-pitfalls-cross-device-gaps-exam-1
      purpose: exam
      isTransfer: true
    - question: A user logs in on phone; laptop stays anonymous. Reports miss laptop pre-login behavior in the
        person journey. Which claim fits?
      options:
      - A legitimate laptop linking transition.
      - One-device login links all same-IP devices.
      - Equal event names connect every device.
      - Current plan reconstructs unidentified history.
      correct: 0
      explanation: Known identity on one device does not prove another anonymous device's actor. State and test
        the boundary.
      type: scenario
      difficulty: 4
      id: posthog-data-model-identification-pitfalls-cross-device-gaps-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: person-merging
  sourceRef: https://posthog.com/docs/product-analytics/identify; relevant named topic/contract in this concept;
    verified 2026-10-07.
- id: group-types
  name: 'Group Types: Modeling Organizations'
  difficulty: 4
  estimatedMinutes: 15
  tags:
  - posthog
  - groups
  section: group-analytics
  prerequisites:
  - ph-persons
  - ph-event-properties
  - data-models:relationships
  encompassing: []
  knowledgePoints:
  - id: what-are-groups
    instruction: '**Groups** let analysis aggregate events by an entity such as a company or project. A group
      type names the category; a group key identifies one instance. A cohort selects people who meet conditions,
      which serves a different analytical purpose.


      Decide what one counted unit should represent before building a metric.


      Application boundary: Group type count, group instance count, person count, and event count are different
      units. Use the declared company key.'
    workedExample: For weekly active companies, the unit is company. Several users' qualifying events can contribute
      to one active company when each event carries the appropriate company group context.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/group-analytics
      title: 'Group Types: Modeling Organizations: what are groups'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: Group type count, group instance count, person count, and event count are different units. Use the
        declared company key.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: For weekly active companies, the unit is company. Several users' qualifying events can contribute
        to one active company when each event carries the appropriate company group context.
    problems:
    - question: In group analytics, what is the difference between a group type and a group key?
      options:
      - Key is the count of events.
      - Category type; instance key.
      - Both mean the project token.
      - Type is a person and key must be email.
      correct: 1
      explanation: Category and instance identity are separate. Keep type names consistent and use stable keys
        for instances.
      id: e7eaa155-16db-4daa-af6c-1476dde7ee9b
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: Three people from company A and two from company B perform the qualifying action. All events carry
        correct company group context. How many active companies does this represent? Enter the number only.
      options: []
      correct: '2'
      explanation: Count the chosen entity. Five active people across two companies represent two active companies.
      type: fill_blank
      id: 0f4cd341-6271-418d-a235-1580197a6dfe
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: Events have company keys A,A, A, B,B from five people. The KPI is active companies. Which grain
        and result fit?
      options:
      - Five people counted as companies.
      - Five event rows counted as companies.
      - Two validated company keys.
      - One type counted as one active company.
      correct: 2
      explanation: Group type count, group instance count, person count, and event count are different units.
        Use the declared company key.
      type: scenario
      difficulty: 4
      id: dded9149-6c84-43cb-b2c7-90111db87f35
      purpose: practice
      isTransfer: true
    - question: A project has company and project categories. Company17 and company18 are both active. How many
        company group instances and total group types are described?
      options:
      - Two company instances and three types.
      - One company instance and two types.
      - Three company instances and one type.
      - Two company instances; two types.
      correct: 3
      explanation: Keys identify instances within a category. Do not count each company key as a new group type.
      type: scenario
      difficulty: 4
      id: posthog-data-model-group-types-what-are-groups-exam-1
      purpose: exam
      isTransfer: true
    - question: The account-adoption report counts distinct people. One account has ten people; another has one.
        What changes the measured unit?
      options:
      - Distinct attributed company keys.
      - Count distinct emails and call them companies.
      - Divide users by ten for every account.
      - Count the company display-name property without validating keys.
      correct: 0
      explanation: The group key encodes account identity. Different account sizes make a fixed user divisor unreliable.
      type: scenario
      difficulty: 4
      id: posthog-data-model-group-types-what-are-groups-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: ph-persons
  - id: modeling-with-groups
    instruction: '**Group modeling** selects business entities worth aggregating. Use stable keys, and keep properties
      at their correct owner: company plan on the company, user preference on the person, and action context on
      the event.


      An event can connect a person and group through captured context. This is evidence of activity, not a complete
      authoritative membership directory.


      Application boundary: Place facts at the unit they describe. A user preference should not become every company
      member''s preference.'
    workedExample: A contractor works in two organizations. Events identify the active organization for each action;
      the application's membership database remains the authority for access rights.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/group-analytics
      title: 'Group Types: Modeling Organizations: modeling with groups'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: Place facts at the unit they describe. A user preference should not become every company member's
        preference.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: A contractor works in two organizations. Events identify the active organization for each action;
        the application's membership database remains the authority for access rights.
    problems:
    - question: Which property most naturally belongs to a company group?
      options:
      - Session start time.
      - Company subscription tier.
      - Click coordinate.
      - User interface language.
      correct: 1
      explanation: Put facts on the entity they describe. Company subscription state can apply to many users in
        that company.
      id: ebe28c66-9596-4ad4-b1ba-8dcf38c5ae94
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: A consultant performs one action for company A and another for company B. How should company context
        be modeled?
      options:
      - One combined AB company.
      - Every event assigned to the first company.
      - Active company per occurrence.
      - User email used as both company keys.
      correct: 2
      explanation: The event context determines which company the action concerns. A person can act in different
        groups over time.
      id: 07e8a43d-6eb6-42d5-a552-45cf3a456214
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: A consultant switches from accountA to accountB. Their UI language stays French; accountB tier
        is enterprise. Which property belongs to companyB?
      options:
      - Consultant's interface language.
      - Capture's click coordinate.
      - Browser session's start time.
      - CompanyB enterprise tier.
      correct: 3
      explanation: Place facts at the unit they describe. A user preference should not become every company member's
        preference.
      type: scenario
      difficulty: 4
      id: 741b2581-c4ac-4e36-ab62-5a4157ca23f7
      purpose: practice
      isTransfer: true
    - question: One user belongs to three companies. A workflow event concerns only companyC. What should the
