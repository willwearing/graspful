concepts:
- id: ph-events
  name: 'PostHog Events: The Atomic Unit'
  difficulty: 3
  estimatedMinutes: 18
  tags:
  - posthog
  - data-model
  section: posthog-data-model
  prerequisites:
  - data-pipelines:what-is-a-pipeline
  encompassing:
  - concept: data-models:entities
    weight: 0.35
  knowledgePoints:
  - id: what-is-a-posthog-event
    instruction: 'A **PostHog event** records an occurrence with an event name, a distinct ID, properties, and a
      timestamp. The stored record and the capture request have different contracts. For direct capture, supply
      the project token, event name, and distinct ID. The capture API can assign a timestamp when you omit one.


      Use an explicit occurrence timestamp for delayed historical events. A project token routes capture to a project;
      it is different from a personal API key used for administrative access.'
    workedExample: A server reports invoice_paid for user_42 with amount_cents = 2500. If it sends the event hours
      later, it supplies the actual payment time so time-based analysis reflects the occurrence.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/api/capture
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which statement correctly distinguishes a stored event from a direct capture request?
      options:
      - A stored event has no event name when capture omits a timestamp.
      - A project token is the event timestamp.
      - A capture request must always supply a timestamp or it is invalid.
      - The stored event has a timestamp, while the request can omit it and use the API default.
      correct: 3
      explanation: Check the request contract separately from the stored model. The API can supply a timestamp,
        but delayed events usually need their real occurrence time.
      id: 9a61d61e-5ab2-4e50-9474-4e31bbd42bdd
      type: multiple_choice
      difficulty: 2
    - question: A direct capture payload includes event = invoice_paid and properties.distinct_id = user_42, but
        no project token. Which required routing information is missing?
      options:
      - The project token for the destination project.
      - A group name for every event.
      - A person's email address.
      - A session recording URL.
      correct: 0
      explanation: The project token identifies the capture destination. Email, recordings, and group membership
        are not universal requirements for an event.
      id: 41a171ca-893c-49a1-9d8f-7d14424fd73c
      type: scenario
      difficulty: 3
    - question: An offline integration uploads yesterday's purchases today. The purchase timestamps are available,
        but the payload omits them. Reports place the purchases at upload time. What should be corrected?
      options:
      - Send each purchase's validated occurrence timestamp and verify the historical time window.
      - Use upload time for all records and shift the entire chart back one day.
      - Set every event's time to midnight yesterday, ignoring individual occurrence times.
      - Change the report's timezone to compensate for a full day of delayed delivery.
      correct: 0
      explanation: The API default cannot infer an earlier occurrence time. Supply the known event time and check
        the resulting time-based analysis.
      id: 568c617d-9cbf-4ec2-ad06-16c32363f8f2
      type: scenario
      difficulty: 4
  - id: immutable-facts-and-default-events
    instruction: 'Treat **event facts** as records of what happened. A later state change should normally produce
      a new event or a separate current-state update. Do not assume an old event will silently change with the application
      record.


      Reserved names such as $pageview have defined SDK meanings. A capture plan should define custom business events
      and avoid double-counting the same occurrence through automatic and manual capture.'
    workedExample: An order is submitted and later canceled. order_submitted and order_canceled preserve the sequence.
      A current order-status field can separately show canceled.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/libraries/js/config
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which event name commonly represents a page view captured by the web SDK?
      options:
      - $set
      - $groupidentify
      - $pageview
      - $identify
      correct: 2
      explanation: Reserved event names have specific meanings. Page views, identity transitions, and property updates
        should not be substituted for each other.
      id: 5deab952-8c8e-4647-bb93-01a131680581
      type: multiple_choice
      difficulty: 2
    - question: An order was submitted at 09:00 and canceled at 10:00. You need to analyze both actions. Which event
        design preserves that history?
      options:
      - Capture only the current status at midnight and infer the two action times.
      - Replace the submitted event's name with canceled everywhere.
      - Change the user's distinct ID when the order is canceled.
      - Keep order_submitted and capture a separate order_canceled occurrence.
      correct: 3
      explanation: Separate events preserve each occurrence and its time. Current state alone cannot reconstruct
        the action sequence.
      id: 5a3763a9-452d-47cf-80f7-b4328c1d1cd8
      type: scenario
      difficulty: 3
    - question: Pageview counts double after a release. The web SDK has automatic pageview capture enabled, and
        the application now manually captures the same navigation. What should you validate and fix?
      options:
      - Trace one navigation, choose one intended capture path, and verify one pageview per occurrence.
      - Change every visitor's distinct ID on navigation.
      - Deduplicate all events sharing the same page URL, including legitimate repeat visits.
      - Rename manual pageviews while continuing to sum both paths as visits.
      correct: 0
      explanation: The evidence points to two capture paths for one occurrence. Fix the instrumentation and test
        a real navigation instead of deleting valid repeated visits.
      id: 5a65d373-a75c-42cc-b6b3-e441f9d9b805
      type: scenario
      difficulty: 4
  - id: custom-vs-autocapture
    instruction: '**Autocapture** records supported user interactions when enabled. A **custom event** names a business
      action that your code explicitly reports. DOM activity can show a button click, but the application must establish
      whether a business operation succeeded.


      Choose a stable semantic event for important outcomes. Verify SDK configuration and supported surfaces before
      relying on automatic collection.'
    workedExample: A checkout click can fail validation. Capture purchase_completed only after confirmed success,
      with an order ID that permits reconciliation against the source system.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/autocapture
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which event is the clearest semantic measure of a completed purchase?
      options:
      - Any page view on a marketing page.
      - A custom purchase_completed event emitted after confirmed success.
      - Any focus event on a payment input.
      - Any click on a button whose label contains Buy.
      correct: 1
      explanation: Completion requires business confirmation. UI interactions alone can occur before a failed or
        abandoned purchase.
      id: 5cc4694f-ca8d-4b49-89bb-41536c371a44
      type: multiple_choice
      difficulty: 2
    - question: An autocaptured submit click appears, but the API rejected the form. Which conclusion is supported?
      options:
      - The rejection proves no click occurred.
      - The form was successfully saved because a click exists.
      - The click occurred; successful submission still needs separate evidence.
      - Autocapture automatically retries the business operation until success.
      correct: 2
      explanation: Use the interaction event for interaction evidence. Check the application result or a success
        event before counting completion.
      id: 997aff43-bef9-4a8a-ad16-8fba10d07237
      type: scenario
      difficulty: 3
    - question: A team uses a CSS selector for its core activation metric. A redesign changes the DOM, while the
        business milestone remains the same. What makes future measurement more stable?
      options:
      - Keep guessing new selectors after every release without validation.
      - Instrument the confirmed milestone as a documented custom event and compare it during migration.
      - Count every click as activation to avoid selector maintenance.
      - Move the CSS selector into the user's distinct ID.
      correct: 1
      explanation: A semantic event follows the business contract. Validate the migration so a change in instrumentation
        is not mistaken for a change in activation.
      id: 61b606d7-5cb1-4a12-be0c-264a17ca1d2c
      type: scenario
      difficulty: 4
- id: ph-event-properties
  name: 'Event Properties: Metadata on Events'
  difficulty: 3
  estimatedMinutes: 12
  tags:
  - posthog
  - data-model
  section: posthog-data-model
  prerequisites:
  - ph-events
  encompassing: []
  knowledgePoints:
  - id: default-vs-custom-properties
    instruction: '**Event properties** add context to an occurrence. SDKs can add default properties, while application
      code adds custom ones. Available defaults depend on the SDK and configuration. For web events, $current_url
      describes the full URL and $pathname describes its path.


      Define custom names, types, and units. A property with an inconsistent type is harder to filter and aggregate
      reliably. Property names are exact keys, so plan and Plan are different properties. Keep spelling and case
      consistent with the tracking contract.'
    workedExample: For https://app.example.com/pricing?plan=team, the path is /pricing. Use the full URL when the
      host or query string matters, and check that collection is appropriate for the data involved.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data/events
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: For a web event, which property should you inspect when you need the full URL including host and
        query string?
      options:
      - $current_url
      - The page's title property
      - $host
      - $pathname
      correct: 0
      explanation: The full URL and path serve different needs. A path alone does not contain the host or query
        string.
      id: 7667be7a-70df-4446-bf77-977e6af19aa7
      type: multiple_choice
      difficulty: 2
    - question: You want one report row for /pricing across several hosts and query strings. Which available web
        property most directly represents that path?
      options:
      - $host
      - The page's title property
      - $current_url without normalization
      - $pathname
      correct: 3
      explanation: Use the property whose scope matches the question. Full URLs would split the path by host and
        query parameters unless normalized.
      id: e7be8f7a-c579-4685-ac4e-be6b57fe2e07
      type: scenario
      difficulty: 3
    - question: A custom amount property is numeric in the backend and formatted as "$20" in the frontend. Aggregation
        results differ by source. What should the tracking contract define?
      options:
      - A display string as the canonical numeric measure.
      - A different event name for every amount value.
      - A separate arbitrary meaning for each SDK.
      - One numeric representation with a named currency and unit, plus validation across both sources.
      correct: 3
      explanation: Align types and units at capture. Display formatting should not change the meaning or queryability
        of the underlying measure.
      id: c2e2f384-f03f-4c7a-a84f-5cfa97fa3a5a
      type: scenario
      difficulty: 4
  - id: event-vs-person-properties
    instruction: '**Event properties** describe the occurrence. **Person properties** describe a person profile
      and can change. Store an explicit event-time snapshot when analysis must use the value at that moment. Person-property
      query behavior can depend on how properties are stored and selected, so inspect the actual query field.


      Account-level facts may belong to a group. Decide the owner and time meaning before choosing where to set
      a property.'
    workedExample: A purchase event includes plan_at_purchase = free. The person's current plan later becomes paid.
      A report of purchase-time plan uses the explicit event property.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/person-properties
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which field unambiguously represents the plan used when a particular purchase occurred?
      options:
      - An event property explicitly captured as plan_at_purchase.
      - The person's latest display name.
      - A mutable current-plan field with no historical contract.
      - The report's creation date.
      correct: 0
      explanation: An explicit event-time snapshot gives the required time meaning. Inspect the field used rather
        than assuming all person-property queries mean current or historical state.
      id: 64dc7e9b-f753-4b63-bd58-5e9b28c0410d
      type: multiple_choice
      difficulty: 2
    - question: A person bought on the free plan, then upgraded. The event stores plan_at_purchase = free and the
        current profile says paid. Which value should a purchase-time segmentation use?
      options:
      - The latest value found on any later purchase by that person.
      - The current profile value, paid, for every historical purchase.
      - The event's plan_at_purchase value, free.
      - The plan most common across all users during the report period.
      correct: 2
      explanation: The analysis asks about the occurrence, so use the recorded event-time value. The two fields
        answer different time questions.
      id: 5306cf66-5714-4259-90bf-e150cdb37889
      type: scenario
      difficulty: 3
    - question: A dashboard changed historical segments after a profile update. The team assumed its selected field
        was an event-time snapshot. What should you inspect first?
      options:
      - Whether replaying the current profile value onto all old events makes the chart stable.
      - The query's exact property source and time semantics, then use an explicit captured snapshot if required.
      - Only the report's date range, assuming every property source has the same time meaning.
      - Only the display label of the selected property.
      correct: 1
      explanation: Trace which property the query actually reads. A label alone cannot establish whether the value
        is current, joined, or captured on the event.
      id: 73900918-abb3-4f8c-bb63-405131072a7e
      type: scenario
      difficulty: 4
- id: ph-persons
  name: Persons & Person Profiles
  difficulty: 4
  estimatedMinutes: 18
  tags:
  - posthog
  - data-model
  section: posthog-data-model
  prerequisites:
  - ph-events
  - data-models:keys-and-identity
  - data-models:relationships
  encompassing:
  - concept: data-models:keys-and-identity
    weight: 0.7
  - concept: data-models:relationships
    weight: 0.45
  knowledgePoints:
  - id: what-is-a-person
    instruction: 'A **person profile** connects identifiers and stores person properties. An event can be captured
      without creating a stored profile. In the web SDK''s identified_only mode, a fresh anonymous capture with
      inline $set does not itself create a profile. An explicit profile-triggering action, such as identify or setPersonProperties,
      changes that behavior.


      A person represents an identity in analytics, which must be designed carefully for shared devices and multiple
      systems.'
    workedExample: A fresh anonymous browser emits a pageview under identified_only. The event can appear even though
      there is no corresponding stored person profile yet.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data/anonymous-vs-identified-events
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which observation is possible in PostHog?
      options:
      - Every accepted event must already have a full email-based profile.
      - A person profile is the same object as a session.
      - An event exists for a distinct ID without a stored person profile.
      - A person profile can have no relationship to any identifier.
      correct: 2
      explanation: Event capture and stored profile creation are separate. Do not infer a complete profile merely
        from an accepted event.
      id: 3cf85e83-efd9-43dd-98be-2bcffb8c6fe7
      type: multiple_choice
      difficulty: 2
    - question: 'A fresh browser uses identified_only and captures a pageview with inline $set: {plan: "free"}.
        No profile-triggering helper has run. What should you expect from that capture alone?'
      options:
      - It merges every free-plan visitor into one person.
      - It necessarily creates a profile because $set appears in the payload.
      - The event can be captured without creating a person profile.
      - It necessarily identifies the person by their plan name.
      correct: 2
      explanation: Inline property data alone does not trigger profile creation in this stated mode. Check the SDK
        action and processing mode.
      id: 33aae426-5797-46d0-8ce0-ab831a29ec90
      type: scenario
      difficulty: 3
    - question: A TAM sees anonymous events but no person entries and concludes ingestion is broken. The payloads
        arrive correctly and use identified_only before any profile-triggering action. What is the best diagnosis?
      options:
      - The evidence fits intentional anonymous capture; confirm the required use case before changing profile creation.
      - Treat the absence of profiles as proof that all event data is lost.
      - Replay every event with a fabricated email address.
      - Use one shared identified ID to make the people list populate.
      correct: 0
      explanation: The configured behavior explains the observation. Match profile creation to the customer's identity
        needs rather than inventing identities.
      id: 82a5d9f0-9b90-4d92-9026-e17100dcab6a
      type: scenario
      difficulty: 4
  - id: what-person-profiles-enable
    instruction: '**Stored profiles** support person-property analysis and stored profile-based targeting. Anonymous
      feature flag evaluation can use a distinct ID and explicitly supplied properties without a stored profile.
      The evaluation inputs and unit of assignment still need a stable design.


      For a flag or experiment question, distinguish assignment, supplied targeting inputs, persisted profile properties,
      and recorded exposure. A generic claim that every flag requires a profile is inaccurate.'
    workedExample: An anonymous visitor receives a percentage rollout using a persistent distinct ID. A server-side
      rule that needs a saved subscription status must obtain that value through a supported profile or explicit-property
      path.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/feature-flags/best-practices
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which requirement specifically depends on having stored person-property data available?
      options:
      - Recording an event timestamp.
      - Capturing any event name.
      - Evaluating every possible percentage flag for an anonymous distinct ID.
      - Filtering people by a property saved on their person profiles.
      correct: 3
      explanation: Stored property analysis needs stored data. Anonymous capture and some flag evaluations can operate
        without a persisted profile.
      id: b601c8d0-bc09-46a3-bdbd-8b494c93820f
      type: multiple_choice
      difficulty: 2
    - question: An anonymous percentage flag uses a persistent distinct ID and no person-property rule. Must the
        application create a stored person profile solely to evaluate that rule?
      options:
      - No, and therefore the distinct ID can change on every evaluation without consequences.
      - Yes, every percentage flag requires a saved email address.
      - Yes, every anonymous visitor must share one profile.
      - No, this evaluation can use the distinct ID without a stored profile.
      correct: 3
      explanation: Anonymous flag evaluation is supported. A stable assignment still requires consistent inputs,
        especially the distinct ID.
      id: 8df30caa-1504-4e56-85b9-ec0f0a0e7bb8
      type: scenario
      difficulty: 3
    - question: A flag rule uses subscription_tier. Anonymous evaluations return the default, and the application
        has neither stored the tier nor supplied it to evaluation. What should the investigation establish?
      options:
      - Whether changing the event timestamp creates the missing tier.
      - Whether all anonymous flags are unsupported.
      - Where the rule obtains subscription_tier, whether that input is present, and which identity is evaluated.
      - Whether creating any blank profile guarantees the tier is correct.
      correct: 2
      explanation: Targeting needs the actual rule input. Verify its source and identity rather than assuming that
        a blank profile or generic identify call supplies every property.
      id: 6292872c-d505-4289-9c2d-e8516ee5b9ee
      type: scenario
      difficulty: 4
  - id: viewing-person-profiles
    instruction: '**Profile inspection** combines identifiers, properties, and event history. Search using the known
      identifier, confirm the project, and inspect which distinct IDs belong to the person. Display names and emails
      can be missing or repeated.


      Treat the UI as a view of collected evidence. An empty filtered history can result from the chosen time range,
      project, identity, or query, so check those before drawing a conclusion.'
    workedExample: Support provides user_73. Search that ID in the expected project, verify the profile's identifiers,
      and set the event time range to the reported incident.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/identify
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which value is the strongest starting point for finding a reported user when the application provides
        its canonical PostHog distinct ID?
      options:
      - That exact distinct ID in the expected project.
      - The newest profile in any project.
      - A matching subscription plan alone.
      - Any profile with the same first name.
      correct: 0
      explanation: Use the known identity and project. Human-readable properties can be shared or absent.
      id: 48bd214a-916f-4580-af89-6464f5b253fe
      type: multiple_choice
      difficulty: 2
    - question: A user reports an incident last month, but their profile event view is filtered to the last 24 hours.
        What should you adjust before concluding the event is missing?
      options:
      - The time range to include the reported occurrence.
      - The user's ID to an arbitrary new value.
      - The event name to match the profile title.
      - The project token in all production captures.
      correct: 0
      explanation: The current filter excludes the incident. Validate the query scope before changing instrumentation.
      id: 11f35ffa-b242-40fc-a847-2b908bd2037d
      type: scenario
      difficulty: 3
    - question: Two profiles share the same email property, but the application expects one canonical user. What
        evidence should you gather before proposing an identity repair?
      options:
      - Their distinct IDs, identify transitions, source systems, and whether they represent the same real user.
      - Only which profile was created most recently.
      - Only each profile's current plan.
      - Only the email text, because matching properties automatically prove safe merging.
      correct: 0
      explanation: Matching descriptive properties do not establish a valid identity link. Trace how each profile
        was formed before attempting a repair.
      id: 9d6bdf6d-0455-4e7f-a0aa-e4151aee7a1b
      type: scenario
      difficulty: 4
- id: ph-person-properties
  name: 'Person Properties: $set and $set_once'
  difficulty: 4
  estimatedMinutes: 18
  tags:
  - posthog
  - data-model
  section: posthog-data-model
  prerequisites:
  - ph-persons
  encompassing: []
  knowledgePoints:
  - id: setting-person-properties
    instruction: '**$set** updates person properties; **$set_once** fills values that have not already been set.
      Use current-state properties for current facts and first-value properties for facts whose first accepted value
      should remain.


      For supported SDKs, identify can include property updates. The web helper setPersonProperties can explicitly
      trigger profile creation. Inline $set on a fresh anonymous capture in identified_only has different creation
      behavior, as taught in the person-profile lesson.'
    workedExample: After a known user upgrades, update current_plan with $set. Keep initial_referrer under $set_once
      so a later visit does not overwrite the first accepted value.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/person-properties
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which update operation changes an existing current_plan person property?
      options:
      - Changing only an event's name
      - $set
      - $set_once when current_plan already exists
      - Changing only the chart label
      correct: 1
      explanation: Use $set for a value that should track current state. $set_once intentionally preserves an existing
        value.
      id: 26be62d2-e5d4-4a4b-9b5b-bcfd8ed683f0
      type: multiple_choice
      difficulty: 2
    - question: A known profile has current_plan = free and initial_referrer = search. A later update sets current_plan
        to paid and tries to set_once initial_referrer to email. What should remain?
      options:
      - current_plan = free and initial_referrer = email.
      - Both properties disappear.
      - Both values change to email.
      - current_plan = paid and initial_referrer = search.
      correct: 3
      explanation: The ordinary set updates current state. The set-once operation leaves the already present first
        value intact.
      id: 756578f0-072e-4325-b4d0-aa927b8536cc
      type: scenario
      difficulty: 3
    - question: An integration uses set_once for current_plan. Upgrades are captured, but profiles keep showing
        free. What should be corrected?
      options:
      - Rename free to paid in all historical events.
      - Change every user's distinct ID after an upgrade.
      - Use a current-state update for current_plan and keep any separate initial-plan field under set_once.
      - Retry the same set_once indefinitely.
      correct: 2
      explanation: The write operation conflicts with the intended current-state meaning. Separate current and initial
        facts so each has the appropriate update rule.
      id: e9f50fe9-ab19-4ac8-8432-5ddb25cb0e3a
      type: scenario
      difficulty: 4
  - id: choosing-person-property-updates
    instruction: '**Property update order** follows processing, so out-of-order arrivals can make current state
      stale. A set-once value is the first accepted value, which may differ from the event with the earliest occurrence
      timestamp.


      For authoritative current state, define which system owns the property and how delayed writes are handled.
      Backfills need special care because historical events can carry old profile values.'
    workedExample: A delayed free-plan event arrives after a paid-plan update and carries $set for current_plan.
      Inspect whether it overwrote the current value, then remove stale state writes from the backfill or reconcile
      from the authoritative source.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/person-properties
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: What does set_once establish when events arrive out of occurrence-time order?
      options:
      - Always the value from the earliest historical timestamp.
      - The first accepted value, which need not come from the earliest event timestamp.
      - A value that changes on every later event.
      - Always the lexicographically smallest value.
      correct: 1
      explanation: Processing order and occurrence time differ. Do not use set_once as an automatic historical minimum
        calculation.
      id: e456cc82-6a26-4db8-bebb-00ddaeed3494
      type: multiple_choice
      difficulty: 2
    - question: A newer paid-plan update is processed, then an old backfill writes current_plan = free with $set.
        Which result must you guard against?
      options:
      - The backfill automatically consulting current billing state before applying $set.
      - The occurrence timestamp automatically blocking every stale profile update.
      - The old profile value being ignored solely because the distinct ID already exists.
      - The late old write replacing the intended current state.
      correct: 3
      explanation: Late processing can apply an old value as a new write. Plan backfills so they do not silently
        regress current properties.
      id: fd28de79-2f45-4b97-9537-0dfa06354791
      type: scenario
      difficulty: 3
    - question: Billing and frontend code both write subscription_status, and delayed browser events sometimes restore
        canceled accounts to active. Which design addresses the conflict?
      options:
      - Let whichever client retries most often define the truth.
      - Use set_once so the first status can never change.
      - Assign a new distinct ID for each subscription status.
      - Make billing the authoritative writer and define reconciliation and stale-event handling.
      correct: 3
      explanation: The property needs clear ownership and ordering rules. A permanent first value would also fail
        for a status that legitimately changes.
      id: 363f44b9-7513-4edf-8102-decce15f67f0
      type: scenario
      difficulty: 4
- id: ph-distinct-id
  name: 'distinct_id: Linking Events to Persons'
  difficulty: 5
  estimatedMinutes: 18
  tags:
  - posthog
  - data-model
  section: posthog-data-model
  prerequisites:
  - ph-persons
  - data-models:keys-and-identity
  encompassing:
  - concept: data-models:keys-and-identity
    weight: 0.8
  knowledgePoints:
  - id: what-is-distinct-id
    instruction: 'A **distinct ID** is the identifier attached to events for identity resolution. It is scoped to
      the project and must distinguish the intended users. A generated anonymous browser ID and a stable application
      user ID can later be connected through a valid identify transition.


      Avoid shared placeholders and mutable values. Validate the value before sending it, including empty or missing
      IDs.'
    workedExample: Use user_105 from the application's user database for that known user. A value like logged_in_user
      would incorrectly collapse unrelated users into one identifier.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/identify
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: What is the main purpose of an event's distinct ID?
      options:
      - Identify the project receiving the event.
      - Define the session inactivity timeout.
      - Name the type of business action that occurred.
      - Identify the actor for PostHog identity resolution.
      correct: 3
      explanation: The distinct ID carries actor identity. Other context belongs in appropriate properties.
      id: 54dabab3-0726-4c8c-91e3-f21ddecad178
      type: multiple_choice
      difficulty: 2
    - question: All signed-in customers are captured with distinct_id = logged_in_user. What measurement problem
        does this create?
      options:
      - The value automatically expands into each customer's database ID.
      - Only page URLs are affected.
      - Every customer automatically receives a unique identity.
      - Unrelated customers share an analytics identity.
      correct: 3
      explanation: A shared placeholder cannot distinguish people. Send the stable, unique ID for the actual actor.
      id: 2f0a3ee7-3b0f-4f02-a8e4-1673c98eab50
      type: scenario
      difficulty: 3
    - question: A system has user ID 81 in two tenants. IDs are only tenant-unique, but events share one PostHog
        project. Which canonical identity scheme avoids collisions?
      options:
      - A new random ID on every event.
      - The bare number 81 for both users.
      - A stable tenant-and-user identifier or an existing globally unique user ID.
      - The users' first names.
      correct: 2
      explanation: Respect the source ID namespace. A stable globally unique representation preserves continuity
        while separating different users.
      id: f460d25d-ad6a-4ffa-b4c1-8e5710d75d0d
      type: scenario
      difficulty: 4
  - id: frontend-vs-backend-distinct-id
    instruction: 'The **web SDK** normally maintains an anonymous browser ID. Backend capture for a known user should
      use the same canonical ID that the frontend uses after identification. Exact method signatures and optional-ID
      behavior vary by SDK version.


      When tracing anonymous server-side activity, propagate a suitable browser ID explicitly under the application''s
      data policy. A backend request does not inherently know which browser identity produced it.'
    workedExample: After login, the frontend identifies user_31. A payment job captures payment_completed using
      user_31 from trusted application data. Both use the same canonical identity.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/identify
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: For an authenticated user, which value should backend capture normally share with the identified
        frontend?
      options:
      - A fresh random ID for each backend event.
      - The same canonical application user ID.
      - The project token as the user ID.
      - The backend machine's hostname for all users.
      correct: 1
      explanation: Consistent canonical identity links the known user's events across sources. A server or project
        identifier describes a different entity.
      id: ad190289-fe59-4bfd-b919-9adc75eb1e6d
      type: multiple_choice
      difficulty: 2
    - question: Frontend identify uses user_31, while backend payment events use email alex@example.com. No link
        connects these IDs. What mismatch should be corrected?
      options:
      - The backend timestamp has seconds.
      - The systems use different identifiers for the same intended user.
      - The frontend runs in a browser.
      - The event names are different, which always prevents identity resolution.
      correct: 1
      explanation: Different event names are normal. Align identity values or establish a valid deliberate link
        rather than assuming the email property connects them.
      id: 783006d2-0a88-49e8-a362-c77b6898294d
      type: scenario
      difficulty: 3
    - question: An unauthenticated API action needs to join the same browser journey. The backend has no browser
        ID and no authenticated user. What must the design establish?
      options:
      - An invented email address for every request.
      - An explicit, validated identity propagation path or a deliberate separate anonymous identity model.
      - A guarantee that the server SDK automatically reads the browser's local storage.
      - One common distinct ID for all anonymous API callers.
      correct: 1
      explanation: The backend needs evidence of identity. Design how an allowed identifier crosses the boundary
        instead of assuming the browser state is available.
      id: 3ae6b395-b5b5-49e2-bc6c-194434628cfa
      type: scenario
      difficulty: 4
  - id: multiple-distinct-ids
    instruction: 'One **person** can have multiple linked distinct IDs. Valid identity transitions can connect an
      anonymous device ID to the known application ID. Counting raw distinct IDs therefore need not equal counting
      resolved people.


      A shared email property alone does not establish that link. Inspect the identity records and transition events
      when counts differ.'
    workedExample: A person uses two devices. Each starts with its own anonymous ID, and both later identify to
      user_52. A resolved-person count can treat the linked history as one person even though several raw IDs exist.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/identify
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Can one resolved PostHog person have several distinct IDs?
      options:
      - Yes, because any matching first name automatically merges people.
      - Yes, but only if every event has the same name.
      - No, every person can have only one identifier for all time.
      - Yes, when valid identity links connect those identifiers.
      correct: 3
      explanation: A person can have multiple identifiers. The link comes from identity resolution, not arbitrary
        descriptive similarity.
      id: 23adc204-dc86-4e9a-a84d-fe2fcf1d48b6
      type: multiple_choice
      difficulty: 2
    - question: Two browser IDs are validly linked to user_52. A query counts three raw distinct IDs. What should
        you check before reporting three people?
      options:
      - Whether the metric should count resolved people instead of raw identifiers.
      - Whether dividing every identifier count by three works for all users.
      - Whether all three IDs should be treated as separate people despite the valid links.
      - Whether event names should be made identical to combine people.
      correct: 0
      explanation: Identifier count and person count have different units. Use the metric that matches the business
        question.
      id: 1db4d719-fba9-4a60-95ed-c649d5713d55
      type: scenario
      difficulty: 3
    - question: A unique-user report changes after known identity links are added. Event volume stays constant.
        Which explanation should you test?
      options:
      - The chart must be counting project tokens as users.
      - The links must have deleted every anonymous event.
      - Several raw identities now resolve to the same people, changing the counting unit without removing events.
      - The unchanged event count proves unique-person counts cannot change.
      correct: 2
      explanation: Resolution can change which identifiers belong to one person. Compare raw IDs and resolved-person
        logic before concluding that ingestion lost data.
      id: af1a31ff-9482-4c89-9229-999e9f598d5f
      type: scenario
      difficulty: 4
- id: ph-sessions
  name: 'Sessions: Grouping Events by Visit'
  difficulty: 3
  estimatedMinutes: 12
  tags:
  - posthog
  - data-model
  section: posthog-data-model
  prerequisites:
  - ph-events
  - ph-distinct-id
  encompassing: []
  knowledgePoints:
  - id: how-sessions-work
    instruction: 'A **session** groups activity from an interaction period. Web SDK defaults include a 30-minute
      inactivity timeout and a 24-hour maximum; configuration can change the inactivity threshold. A reset starts
      a new session. Sessions can be shared across tabs in the same browser.


      Backend events do not automatically inherit a browser session. If the analysis needs that link, propagate
      the appropriate $session_id through a supported path.'
    workedExample: With the default inactivity timeout, a browser event after a 40-minute idle gap starts a new
      session. A later backend event needs explicit session context if it should join that browser session.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data/sessions
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Under the default web session behavior, what does a 40-minute inactivity gap imply for the next
        activity?
      options:
      - It must remain in the same session until the user closes the account.
      - It starts a new session because the default idle threshold is 30 minutes.
      - It merges all browser tabs from every device.
      - It changes the project token.
      correct: 1
      explanation: Use the configured inactivity threshold. The default is 30 minutes, but a project can configure
        a different value.
      id: 7c2de23f-89e9-4416-bd86-f7e705bbbfe0
      type: multiple_choice
      difficulty: 2
    - question: A backend SDK captures an event with the correct user ID, but no $session_id and no session-propagation
        middleware. Is it guaranteed to join the active browser session?
      options:
      - Yes. The event name determines its browser session.
      - Yes. Every known-user event always gets the active browser session.
      - No. Backend events can never receive session context.
      - No. Matching the person ID alone does not supply the browser session ID.
      correct: 3
      explanation: Person identity and session identity are distinct. Supported explicit propagation can link backend
        activity to the desired session.
      id: 7f2e21ea-110c-4f03-ad6c-97659358b44e
      type: scenario
      difficulty: 3
    - question: A customer expects every browser tab to create a new session, but two tabs share a session ID. They
        use the normal web SDK configuration in one browser. What should you explain and verify?
      options:
      - Count tabs by reusing the project token as a session ID.
      - Tabs can share the browser session; verify timing and configuration against the intended session metric.
      - Change the user ID on every tab focus.
      - Each tab must have a unique session, so all data is corrupt.
      correct: 1
      explanation: The observed behavior can be expected. Define whether the business metric concerns browser sessions,
        tabs, or users before changing instrumentation.
      id: 65ecb869-9dae-4527-a026-9e5fc8113ee5
      type: scenario
      difficulty: 4
  - id: session-properties
    instruction: '**Session properties** summarize a session, such as duration and entry URL. A session metric needs
      an explicit definition. For PostHog web analytics, the default bounce definition uses one pageview, no autocapture
      interactions, and duration below the configured threshold, normally 10 seconds.


      A one-page session can still be engaged. Always check the applicable metric settings and collected signals.'
    workedExample: A visitor reads one page for 45 seconds. A rule that marks every one-page session as a bounce
      would disagree with the default duration-based bounce definition.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/web-analytics/dashboard
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Why is a one-page session alone insufficient to apply PostHog's default bounce definition?
      options:
      - A bounce is defined only by a person's plan.
      - Every one-page session is always a bounce under every configuration.
      - Duration and autocapture interactions also matter.
      - Only the number of browser tabs determines a bounce.
      correct: 2
      explanation: Use all conditions in the defined metric. Pageview count alone omits engagement signals.
      id: 678ce63e-469e-449e-87cf-6072a7ef81b4
      type: multiple_choice
      difficulty: 2
    - question: Using the default 10-second bounce threshold, a session has one pageview, no autocapture interactions,
        and a duration of 6 seconds. How is it classified?
      options:
      - A new person profile.
      - A bounce.
      - An engaged session solely because a pageview exists.
      - Two sessions.
      correct: 1
      explanation: 'All stated bounce conditions hold: one pageview, no autocapture interactions, and duration below
        the threshold.'
      id: 0edbff83-482a-472b-b965-c1db2124713b
      type: scenario
      difficulty: 3
    - question: Bounce rate rises after autocapture is disabled, while session duration and navigation patterns
        are stable. What should be investigated before claiming engagement fell?
      options:
      - Whether the changed interaction signals altered how the bounce definition is evaluated.
      - Compare only the count of identified people, ignoring bounce inputs.
      - Assume stable navigation proves that an interaction-dependent metric cannot change.
      - Lower the bounce threshold until the old percentage returns, without validating behavior.
      correct: 0
      explanation: An instrumentation change can affect a metric that depends on those signals. Compare the definition
        and signal coverage before interpreting a behavior change.
      id: 001ae60f-afee-49ee-9e21-474c8c4b465f
      type: scenario
      difficulty: 4
- id: ph-actions
  name: 'Actions: Grouping Events for Analysis'
  difficulty: 3
  estimatedMinutes: 14
  tags:
  - posthog
  - data-model
  section: posthog-data-model
  prerequisites:
  - ph-events
  - ph-event-properties
  encompassing: []
  knowledgePoints:
  - id: what-are-actions
    instruction: 'A **PostHog action** groups matching events under a reusable definition. Its conditions can select
      events and properties, including autocaptured interactions. The underlying events remain available.


      An action is a query definition over captured evidence. It cannot create a missing business fact. Editing
      its conditions can change which historical events match, so record metric-definition changes.'
    workedExample: An action named Contact interest matches clicks on two contact buttons. It can measure those
      interactions, while a confirmed form submission needs a success signal.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data/actions
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: What does a PostHog action define?
      options:
      - A reusable set of conditions that match captured events.
      - A permanent rewrite of every original event payload.
      - A new identity for every user.
      - A command that guarantees a business operation succeeds.
      correct: 0
      explanation: An action groups evidence by conditions. It does not replace event identity or create a missing
        outcome.
      id: e2b91b92-8f78-4181-88e9-256821129498
      type: multiple_choice
      difficulty: 2
    - question: An action matches event = contact_clicked and location = header. An event has contact_clicked with
        location = footer. Does it match those conditions?
      options:
      - Only if the person has an email address.
      - No, the location condition does not match.
      - Yes, because all contact events automatically belong to every action.
      - Yes, because the event name matches part of the rule.
      correct: 1
      explanation: Evaluate the whole rule. A matching event name does not override a failed property condition.
      id: 48d51e0e-dd0e-4462-9b27-df6a7093693c
      type: scenario
      difficulty: 3
    - question: An action's selector is broadened and last month's count rises even though no events were added.
        What should the report owner assess?
      options:
      - Whether the action necessarily created new historical events.
      - Whether the original events all changed their timestamps.
      - The changed matching definition and its effect on historical comparability.
      - Whether user identities must be reset.
      correct: 2
      explanation: A query definition can select more existing events. Document the definition change and compare
        the old and new rules against the same evidence.
      id: dd1b34ed-b5cb-4d4b-809e-997742b7edac
      type: scenario
      difficulty: 4
  - id: actions-vs-custom-events
    instruction: 'Choose an **action** when a reusable rule over existing events captures the intended meaning.
      Choose new instrumentation when the required fact was never recorded. For a metric migration, run the definitions
      side by side and reconcile differences before replacing a report.


      An action built from clicks can be useful, but its name should reflect the evidence it actually matches.'
    workedExample: Existing events record two successful export names from old and new clients. An action can combine
      those known success signals into one report definition.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data/actions
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which requirement can an action satisfy without new application instrumentation?
      options:
      - Determine a server-side result that was never recorded.
      - Recover missing transaction amounts from no source.
      - Combine two already captured success-event names into one reusable metric.
      - Create valid user identity links from display names.
      correct: 2
      explanation: An action can reuse available evidence. Missing facts require instrumentation or another trustworthy
        data source.
      id: a93aa06b-af79-47d5-9f3e-d8a4ec686652
      type: multiple_choice
      difficulty: 2
    - question: Old clients emit export_done and new clients emit export_completed. Both mean the same verified
        success. What is a suitable temporary reporting approach?
      options:
      - Change the distinct ID for every old client.
      - Ignore the old clients before measuring their traffic.
      - Define one action matching either success event and validate the combined count.
      - Count all export button clicks as successful exports.
      correct: 2
      explanation: A union of equivalent captured signals supports the migration. Check overlap so one occurrence
        is not counted twice.
      id: 57802c5f-3d87-4a83-9029-aff57135d1a1
      type: scenario
      difficulty: 3
    - question: A team wants to replace a paid_order event with an action matching checkout clicks. The click can
        lead to failed payment, and no success result is captured. What should the review require?
      options:
      - Approve the replacement because both names mention checkout.
      - Use the person's current plan as proof that this payment succeeded.
      - Treat every click as paid revenue.
      - Keep or add confirmed payment instrumentation and validate any replacement against actual orders.
      correct: 3
      explanation: The proposed evidence does not establish payment. Protect the metric's meaning and reconcile
        it against the authoritative outcome.
      id: a387d6f8-cbf4-4f87-94f9-6d85760b31fd
      type: scenario
      difficulty: 4
- id: anonymous-vs-identified
  name: Anonymous vs Identified Events
  difficulty: 4
  estimatedMinutes: 16
  tags:
  - posthog
  - identification
  section: identification
  prerequisites:
  - ph-person-properties
  encompassing: []
  knowledgePoints:
  - id: two-modes-of-events
    instruction: '**Anonymous and identified event processing** have different capabilities and costs. Anonymous
      events can support event-based analysis without a stored person profile. Person processing supports identity
      resolution and stored person properties.


      A human can still be unknown by name while an SDK action triggers person processing. Inspect configuration
      and event flags instead of assuming that every event before login is anonymous.


      Anonymous analysis can still use a stable browser distinct ID. A new ID on every event prevents repeat-browser
      counts, while one shared ID for all browsers collapses visitors.'
    workedExample: A public-page event can be analyzed by event URL without creating a person profile. A helper
      that explicitly sets person properties can change how subsequent events are processed.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data/anonymous-vs-identified-events
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which statement correctly distinguishes human login state from PostHog person processing?
      options:
      - A stored profile always proves that the application authenticated the visitor.
      - A visitor can be unknown by name while an SDK operation enables person processing.
      - An event name containing login is sufficient proof of a trusted identity.
      - All events before authentication must skip person processing.
      correct: 1
      explanation: Authentication and analytics processing are different signals. Inspect the SDK operations and
        configuration instead of inferring one from the other.
      id: 2b74e627-e9ba-479f-93fc-e9e52fb67126
      type: multiple_choice
      difficulty: 2
    - question: A visitor has not logged in, but application code has called a profile-triggering person-property
        helper. Is login status alone enough to classify all later events as anonymous processing?
      options:
      - Yes. A helper can never affect profile creation.
      - No. Inspect the SDK mode and profile-triggering actions.
      - Yes. All pre-login events always bypass person processing.
      - No. Every pre-login event must use an email address.
      correct: 1
      explanation: Human recognition and processing mode are different dimensions. Check what the SDK actually sends
        and what operations have run.
      id: d2d8d895-290f-4ead-9563-c00b9bdf7711
      type: scenario
      difficulty: 3
    - question: A site avoids stored person profiles but needs to count repeat visits from the same anonymous browser.
        Its custom capture code generates a new distinct ID for every event. What should change?
      options:
      - Use one shared anonymous ID for every browser.
      - Retain a stable anonymous browser identifier for the intended measurement period, while keeping the chosen
        no-profile policy.
      - Create a fake authenticated account for each event.
      - Keep changing the ID because anonymous events cannot support repeat-visitor analysis.
      correct: 1
      explanation: Anonymous describes the identity or processing state, not a requirement to discard continuity.
        Stable per-browser IDs support the stated metric; shared or per-event IDs distort it.
      id: 8f8b2dd5-5258-49ce-9e1d-07850033bd8d
      type: scenario
      difficulty: 4
  - id: choosing-when-to-identify
    instruction: '**Identify when a trusted stable user identity becomes available**, such as after successful login
      or account creation. Delay is appropriate when the application still lacks a valid ID. Avoid identifying with
      empty values, form guesses, or shared placeholders.


      For an existing authenticated session on a page load, identify once the trusted user record is available.
      Decide separately what anonymous analysis and flag evaluation need.'
    workedExample: A login request succeeds and returns user_64. The application then identifies user_64. A failed
      login supplies no trusted identity and should not identify the typed email as a verified account.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/identify
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which event provides a sound trigger for identifying a user?
      options:
      - A visitor typing an unverified email into a form.
      - Successful authentication that supplies the stable application user ID.
      - A button becoming visible.
      - A failed request with no user record.
      correct: 1
      explanation: Identify from a trusted identity transition. User input alone can be incomplete, invalid, or
        belong to someone else.
      id: bc90673c-ddb8-4a8c-828d-8d0184568ff1
      type: multiple_choice
      difficulty: 2
    - question: A login form contains pat@example.com, but authentication fails. What should the client do with
        respect to identification?
      options:
      - Reuse the last successful user's ID even after logout.
      - Retain the existing anonymous state until a valid user identity is established.
      - Identify all failed logins as user_unknown.
      - Identify every failed attempt as the typed email.
      correct: 1
      explanation: A failed login does not prove identity. Avoid creating links from unverified form data or stale
        account state.
      id: 8a5f91c4-f7ab-4079-86be-e0b6348d3a3d
      type: scenario
      difficulty: 3
    - question: The app identifies with user.id during startup, before the asynchronous user request completes.
        Some calls have a missing ID. What change addresses the timing fault?
      options:
      - Use the project ID as a fallback user ID.
      - Send the call more often while the request is pending.
      - Convert every missing value to the literal string undefined.
      - Run identification only after a validated user record is available, and handle unauthenticated startup explicitly.
      correct: 3
      explanation: Gate the transition on a real identity value. A shared placeholder would create a different and
        more serious identity error.
      id: 5e60b2fb-3202-4ca6-9347-b5c659315c0d
      type: scenario
      difficulty: 4
- id: identify-call
  name: The Identify Call
  difficulty: 5
  estimatedMinutes: 18
  tags:
  - posthog
  - identification
  section: identification
  prerequisites:
  - anonymous-vs-identified
  encompassing:
  - concept: anonymous-vs-identified
    weight: 0.6
  knowledgePoints:
  - id: how-identify-works
    instruction: 'A valid web **identify transition** links the current anonymous browser ID to a known user ID.
      Later events use the identified state. Identity safeguards restrict invalid merges, so identify is not a general
      command for combining any two established people.


      Inspect the anonymous ID, known ID, and emitted transition when a journey fails to connect.'
    workedExample: A browser captures signup_started under anonymous ID a7, then identifies user_70 after signup.
      The valid transition supplies the evidence connecting a7 with user_70.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/identify
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: What link does the normal web identify transition establish?
      options:
      - Every session in the project to one user.
      - Any two existing identified people without restriction.
      - The current anonymous browser identity to a known user identity.
      - Every user with the same plan to one profile.
      correct: 2
      explanation: The normal transition has a specific identity context. Safeguards prevent arbitrary merges of
        established people.
      id: a20f1cc8-8ac6-4036-983d-7f3a34610d57
      type: multiple_choice
      difficulty: 2
    - question: A browser captures signup_started as a7, then validly identifies user_70 and captures signup_finished.
        Which evidence connects the two stages?
      options:
      - The fact that both events have an email-shaped property.
      - The identify transition relating a7 to user_70.
      - Their shared event-name prefix.
      - Their shared page URL and close timestamps alone.
      correct: 1
      explanation: The identity transition provides the link. Similar event metadata alone is not reliable identity
        evidence.
      id: e8eb7162-b15b-437d-a064-5372457ae0c6
      type: scenario
      difficulty: 3
    - question: An integration discards the anonymous browser state immediately before identify. The previous anonymous
        events no longer connect as expected. What should be traced?
      options:
      - Whether the two histories should be joined solely by timestamp proximity.
      - Whether the known user's display name matches the anonymous event name.
      - Whether the intended anonymous ID was still available when the identify transition was emitted.
      - Whether forcing every browser to use one anonymous ID would connect the funnel.
      correct: 2
      explanation: The transition must carry the correct identity context. Trace the before-and-after IDs and avoid
        clearing the evidence before linking.
      id: 04809b72-a9d4-4233-9156-d604a30f8359
      type: scenario
      difficulty: 4
  - id: identify-best-practices
    instruction: '**Identity hygiene** keeps capture state aligned with the active account. On logout or a change
      between unrelated users on a shared device, use the SDK reset flow before identifying the next user. Validate
      the new ID.


      The web SDK can suppress repeated identical identify calls on the same page, but this is not a guarantee of
      zero overhead across page reloads. Use an intentional authentication lifecycle.'
    workedExample: User A logs out on a shared tablet. The app resets analytics state. User B then logs in and is
      identified with B's stable ID, keeping B's journey separate from A's.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/identify
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which identity lifecycle step helps separate two unrelated users who use the same browser in sequence?
      options:
      - Use the current plan as the distinct ID.
      - Use one shared ID for the device's entire lifetime.
      - Reset analytics identity on logout before the next user is identified.
      - Keep the first user's identity for the next login.
      correct: 2
      explanation: Reset clears the previous identity context. The next authenticated user can then establish their
        own identity.
      id: 21b4bfb5-1714-4eac-a095-0de6c7a23b75
      type: multiple_choice
      difficulty: 2
    - question: An app repeats the same identify call three times on one page, then reloads and calls it again.
        Which claim is safe?
      options:
      - The SDK guarantees repeated calls have no cost in every environment.
      - No identify request can occur again for that user on any future page.
      - Every duplicate always creates a new person.
      - Same-page duplicates may be suppressed, while reloads can still cause another request.
      correct: 3
      explanation: Deduplication has a scope. Do not generalize same-page suppression into an unlimited guarantee.
      id: d3d5f92b-ddca-4895-9c2f-672f362cd9dc
      type: scenario
      difficulty: 3
    - question: A support agent impersonates several customer accounts in one browser. Events leak between identities
        during switches. What should the application design enforce?
      options:
      - Only a more readable database ID while retaining stale client state.
      - One shared support ID for all customer behavior without labeling that design.
      - An identify call for each click using whichever ID is cached first.
      - Explicit account-switch boundaries, reset where appropriate, and validation of the active analytics identity
        before capture.
      correct: 3
      explanation: Canonical IDs alone cannot repair stale lifecycle state. Verify the switch sequence and identity
        at capture, and decide how impersonated actions should be represented.
      id: 405bb08a-899e-440a-a1a9-a95f1a9b5ada
      type: scenario
      difficulty: 4
- id: person-merging
  name: 'Person Merging: Linking Identities'
  difficulty: 6
  estimatedMinutes: 15
  tags:
  - posthog
  - identification
  section: identification
  prerequisites:
  - identify-call
  - ph-distinct-id
  encompassing:
  - concept: identify-call
    weight: 0.5
  - concept: ph-distinct-id
    weight: 0.45
  knowledgePoints:
  - id: how-merging-works
    instruction: '**Identity merging** combines identifiers when a supported transition establishes that they represent
      one person. Equality of email properties is not sufficient. Already identified people and IDs previously linked
      elsewhere can trigger safeguards.


      Inspect the supported identity operation and its result. A request being sent does not prove that the proposed
      merge was accepted.'
    workedExample: A normal anonymous-to-known transition can connect a device journey. A request to combine two
      established accounts requires careful investigation of identity rules and must not be assumed to succeed.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/identify
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: What evidence is stronger than a matching email property for explaining an accepted identity merge?
      options:
      - The same subscription tier.
      - Equal display names on two profiles.
      - A supported identity transition that validly links the IDs.
      - The same browser version.
      correct: 2
      explanation: Merge logic uses identity operations and safeguards. Descriptive similarities do not establish
        a valid link.
      id: 9274f87c-05cf-4078-a4c5-83d8e1e6bebd
      type: multiple_choice
      difficulty: 2
    - question: An integration tries to combine two already identified people and sees an ingestion warning. What
        should it check?
      options:
      - Whether repeating the same rejected operation more frequently will bypass the restriction.
      - Whether matching display names are enough to override the warning.
      - The merge restriction and the identities involved, rather than assuming the request succeeded.
      - Whether a successful HTTP request proves the identity operation was accepted.
      correct: 2
      explanation: An emitted request can be rejected by identity safeguards. Read the warning and reconstruct the
        transition.
      id: 8bdd4abb-35e0-47eb-a5b0-c6ce260c472f
      type: scenario
      difficulty: 3
    - question: A customer proposes merging all profiles with a shared household email. The database has separate
        accounts for family members. What is the correct review outcome?
      options:
      - Use the household email as the ID for all future events without assessing the effect.
      - Keep those identities separate unless reliable evidence and the intended identity model establish they are
        one person.
      - Delete the oldest account to remove the ambiguity.
      - Merge them because a shared descriptive property always proves one person.
      correct: 1
      explanation: The application models different people. A shared contact address is insufficient evidence to
        combine their analytics identities.
      id: 00d47294-527d-46e5-933a-43937ba37c6f
      type: scenario
      difficulty: 4
  - id: when-merging-goes-wrong
    instruction: '**Merge recovery** starts by stopping the faulty identity writes and identifying the affected
      IDs and period. PostHog''s Split IDs operation can separate future behavior, but recovery of historical events
      is not guaranteed.


      Keep evidence and verify the actual result. Do not promise a complete historical undo without checking the
      supported recovery path for the specific case.'
    workedExample: A shared placeholder caused two users' events to connect. Fix capture first, preserve the incident
      details, and validate future identities after the supported repair.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/identify
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which promise is unsafe when proposing Split IDs as an identity repair?
      options:
      - That affected identifiers should be recorded for investigation.
      - That it will always restore every historical event to the correct person.
      - That future behavior should be verified after repair.
      - That the faulty capture code should be fixed first.
      correct: 1
      explanation: Historical reconstruction is not guaranteed. Describe the supported behavior and verify the result
        for the affected data.
      id: a7b5e9de-9d6d-439b-b57e-d41fcfcfbaca
      type: multiple_choice
      difficulty: 2
    - question: A shared placeholder is still being sent while a team repairs merged profiles. What should be done
        first?
      options:
      - Stop or correct the faulty identity writes so the damage does not continue.
      - Change only the profile display name.
      - Assume a one-time repair overrides all future bad capture.
      - Repeat the split while leaving the faulty writes active.
      correct: 0
      explanation: Repair cannot stay effective while the source keeps recreating the problem. Correct and validate
        the capture path first.
      id: 856fdd31-200c-4bfa-aae8-7d2e6566b364
      type: scenario
      difficulty: 3
    - question: After a split, new test events remain separate, but historical reports still show mixed activity.
        What should the TAM report?
      options:
      - All future events must still be merged because history is mixed.
      - The historical events can be assigned confidently without supporting identity evidence.
      - Future separation is verified; historical recovery remains incomplete and needs case-specific investigation.
      - The split restored all history because one new test passed.
      correct: 2
      explanation: Separate the evidence for future behavior from the evidence for old data. Avoid claiming a complete
        undo from a forward-only test.
      id: 4a3a5c48-b522-4929-893b-e4d43d3b51d0
      type: scenario
      difficulty: 4
- id: person-modes
  name: 'Person Modes: identified_only vs Always'
  difficulty: 5
  estimatedMinutes: 15
  tags:
  - posthog
  - identification
  section: identification
  prerequisites:
  - anonymous-vs-identified
  encompassing: []
  knowledgePoints:
  - id: choosing-a-mode
    instruction: 'The web **person_profiles** setting controls profile creation policy. identified_only limits automatic
      profiles until a qualifying action. always creates profiles for ordinary captures. never prevents person-profile
      processing and excludes features that require it.


      Choose the mode from the required analyses and identity operations. Verify the actual SDK version and configuration
      before assuming a default.'
    workedExample: A site needs event-level page analytics but no saved profiles. It can evaluate a restricted profile
      mode, while checking separately whether planned group or profile-based features need person processing.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data/anonymous-vs-identified-events
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which web person_profiles mode is intended to prevent person-profile processing?
      options:
      - never
      - A project's display name
      - always
      - An event's URL path
      correct: 0
      explanation: The mode controls profile policy. Confirm the consequences for the features the application intends
        to use.
      id: 7ba753cf-5408-4c9d-b834-ed05a7349a65
      type: multiple_choice
      difficulty: 2
    - question: A customer needs known-user profiles after login but wants ordinary fresh anonymous pageviews to
        avoid automatic profile creation. Which web mode fits that policy?
      options:
      - identified_only, with a valid identification flow for known users.
      - never while expecting stored profiles after identify.
      - A different project token on every pageview.
      - always for every anonymous pageview.
      correct: 0
      explanation: identified_only supports this boundary. The application still needs an explicit, valid profile-triggering
        transition.
      id: c467dd49-369a-4ca3-ad9d-e504a81d7ce5
      type: scenario
      difficulty: 3
    - question: A team chooses never, then plans stored person-property analysis and group analytics. What should
        the implementation review resolve?
      options:
      - Store the project token in a person property to bypass the mode.
      - Change only the feature names in the tracking plan.
      - The conflict between the mode and required features, using a tested configuration that supports the intended
        use cases.
      - Assume the features work because event capture works.
      correct: 2
      explanation: Capture success does not establish profile or group capability. Align the mode with the required
        operations and verify the resulting payloads.
      id: 2c153648-0bc1-490e-9ad6-d05e871078e7
      type: scenario
      difficulty: 4
  - id: mode-gotchas
    instruction: '**Profile-triggering helpers** matter when estimating identified_only behavior. In the web SDK,
      helpers such as identify, alias, group, and setPersonProperties can enable person processing. Inline $set
      on a fresh anonymous capture does not itself do so.


      If a flag needs properties without a saved profile, use the supported flag-property input path and test the
      actual payloads. Do not substitute a profile-writing helper without considering its side effects.'
    workedExample: A team wants anonymous flag targeting by a supplied country value. It uses the supported flag-property
      setter instead of creating stored person properties solely for that evaluation.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data/anonymous-vs-identified-events
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which distinction matters in identified_only mode for a fresh anonymous web visitor?
      options:
      - An inline capture $set and the setPersonProperties helper have different profile-creation behavior.
      - Every object containing a property automatically identifies the visitor.
      - A flag name is automatically used as the person ID.
      - Only a successful login can ever trigger person processing.
      correct: 0
      explanation: The helper operation matters. Identified-only does not mean that login is the sole possible profile
        trigger.
      id: d0238a42-ca54-4b3f-8019-fab8270553c5
      type: multiple_choice
      difficulty: 2
    - question: A page only needs an anonymous flag rule with an explicitly supplied country. It must avoid creating
        a stored profile solely for this input. Which approach should it evaluate?
      options:
      - The supported flag-property input API, with a test that confirms no unwanted profile creation.
      - A fabricated email-based identify call.
      - A shared country string as every visitor's distinct ID.
      - setPersonProperties solely because its name contains properties.
      correct: 0
      explanation: Supply the flag input through the intended evaluation path. Profile writes and identity changes
        introduce separate effects.
      id: 6cadcb36-7e40-4e56-acfe-85fea3712abf
      type: scenario
      difficulty: 3
    - question: Anonymous-profile counts increase after a frontend release. The mode remains identified_only, but
        a new helper now sets person properties on every page. What evidence should the investigation compare?
      options:
      - Only whether the event name remained $pageview.
      - Only whether a login form is present, because helpers cannot affect processing.
      - The assumption that identified_only forbids profiles before authentication under all helper calls.
      - Before-and-after helper calls, processing flags, and profile creation for a fresh browser.
      correct: 3
      explanation: The new helper can change processing despite an unchanged mode. Reproduce with fresh state and
        inspect the resulting behavior.
      id: cc475376-2ade-49ee-9bec-1e3740633231
      type: scenario
      difficulty: 4
- id: identification-pitfalls
  name: Common Identification Pitfalls
  difficulty: 6
  estimatedMinutes: 18
  tags:
  - posthog
  - identification
  section: identification
  prerequisites:
  - person-merging
  - person-modes
  encompassing: []
  knowledgePoints:
  - id: duplicate-profiles-across-devices
    instruction: '**Cross-device identity** requires a shared canonical ID and valid links from each device''s anonymous
      state. Before a device identifies, its anonymous activity can remain separate. A stored email property alone
      is not a device link.


      Test the transition on each device. Distinguish a temporary anonymous journey from a genuinely conflicting
      known-user ID. A resolved person can have separate sessions on separate devices; matching session IDs are
      not required for a person link.'
    workedExample: A laptop identifies user_24 after login. A phone stays anonymous until its own login, then identifies
      the same user_24. Each device needs its own valid transition.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/identify
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Why can one real person initially have separate anonymous journeys on two devices?
      options:
      - A shared IP address always resolves both devices to one person.
      - The same email property automatically links device identities.
      - Any events within the same minute are automatically one person.
      - Each device can start with its own anonymous identity before a linking transition.
      correct: 3
      explanation: Anonymous device state does not by itself prove a shared person. A valid identity transition
        supplies that connection.
      id: 7a68da19-1407-40c0-bf01-005e26ccb2ce
      type: multiple_choice
      difficulty: 2
    - question: Two devices validly identify the same canonical user. They retain different browser session IDs.
        Does the session difference establish an identity-link failure?
      options:
      - No. Therefore the devices must be counted as one simultaneous session.
      - Yes. The second device must overwrite the first device's session ID.
      - No. A shared person can have separate sessions on different devices.
      - Yes. Correct identity resolution requires one session ID across all devices.
      correct: 2
      explanation: Person identity and session identity have different scopes. Verify the person link independently
        of each device's session.
      id: ca9636ff-7b22-47fe-9157-5d87dd73f791
      type: scenario
      difficulty: 3
    - question: A phone's anonymous events remain separate while the laptop is already identified. The phone has
        never logged in. What is the best next test?
      options:
      - Conclude the laptop's identify call must have failed.
      - Copy the laptop's session ID into all phones.
      - Merge every anonymous visitor who viewed the same page.
      - Perform a valid login on the phone and trace its anonymous-to-canonical transition.
      correct: 3
      explanation: A transition on one device does not automatically establish another device's unknown identity.
        Test the missing link on the affected device.
      id: d015765b-1f71-4a40-adaf-ec729bbca150
      type: scenario
      difficulty: 4
  - id: canonical-ids-across-systems
    instruction: 'A **canonical ID contract** specifies the exact value each system uses for a known actor. Include
      namespace, type conversion, and ownership. Values such as 42, user_42, and an email address are different
      strings unless deliberately linked.


      Use trusted authentication or application records as the source. Instrumentation tests should compare the
      actual IDs emitted by every participating system.'
    workedExample: The identity contract says tenant_5:user_42. Frontend login, API capture, and background jobs
      all derive that same value from trusted tenant and user records.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/identify
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: What should a cross-system canonical ID contract specify?
      options:
      - Only the person's current display name.
      - The exact stable representation and namespace used for each actor.
      - A fresh random ID for each event to guarantee uniqueness.
      - A different service-specific ID with no namespace or linking rules.
      correct: 1
      explanation: An exact contract prevents collisions and string mismatches. Display names and presentation do
        not define identity.
      id: 845098ec-4afe-4b9e-a544-54bed684c366
      type: multiple_choice
      difficulty: 2
    - question: The frontend emits tenant_5:user_42, but a worker emits user_42 and tenants can share user numbers.
        What needs correction?
      options:
      - The worker should use the job queue name as the actor.
      - The frontend must remove tenant scope even though IDs can collide.
      - Both systems must use the same session ID for every event.
      - The worker must follow the tenant-aware canonical ID contract.
      correct: 3
      explanation: The missing namespace changes identity and can cause collisions. Align the worker with the established
        source-of-truth contract.
      id: 28e132cb-c97b-4910-92a7-e58ae69addbb
      type: scenario
      difficulty: 3
    - question: A migration changes canonical ID format. Historical events use the old format, and two services
        will roll out on different days. What must the rollout plan include?
      options:
      - Only a change to profile display names.
      - A deliberate supported identity-transition strategy, compatibility tests, and monitoring for split identities
        during overlap.
      - An assumption that similar-looking strings merge automatically.
      - A different random prefix for each service release.
      correct: 1
      explanation: An ID-format migration changes identity, not just formatting. Plan and test the transition while
        old and new emitters coexist.
      id: ce6bffc0-3d23-4eae-862c-27f1a324c514
      type: scenario
      difficulty: 4
  - id: cross-device-gaps
    instruction: '**Journey-gap diagnosis** checks each event''s project, distinct ID, time, and identity transition.
      Backend activity can arrive before frontend identification when it already uses the correct canonical ID.
      The useful requirement is a valid eventual link, rather than a universal frontend-first order.


      Person identity and session identity remain separate. A connected person history does not imply one session
      across devices.'
    workedExample: A backend signup event arrives as user_90. The browser later identifies its anonymous ID to user_90.
      Investigate the validity of that link instead of treating arrival order alone as a failure.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/identify
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Does backend capture always have to wait for frontend identify when the backend already knows the
        canonical user ID?
      options:
      - No. It can capture under that ID; the frontend still needs its valid identity link.
      - No. Therefore any arbitrary backend ID will connect automatically.
      - Yes. The backend must use the browser's anonymous ID even when the canonical user ID is known.
      - Yes. Every earlier backend event is permanently unusable.
      correct: 0
      explanation: Canonical identity and valid linking matter. Arrival order alone does not determine whether the
        history can connect.
      id: 2a2cee1e-2387-4fd7-86f7-64e998bef93d
      type: multiple_choice
      difficulty: 2
    - question: A server records signup_completed as user_90 before the browser validly identifies to user_90. Which
        outcome is supported?
      options:
      - The two events must share one browser session automatically.
      - The server event must belong to a different person forever solely because it arrived first.
      - The server must rewrite its ID to the old anonymous browser ID.
      - The known-user events can belong to the same resolved person once the valid link is processed.
      correct: 3
      explanation: A valid link to the same canonical identity can connect person history. Session membership is
        a separate question.
      id: 6a258812-5f56-41bd-ba3f-3f2d797d69e7
      type: scenario
      difficulty: 3
    - question: Browser events and server events use the same canonical ID but are sent to different projects. A
        user journey report in one project lacks the other events. What should you fix or clarify first?
      options:
      - A profile merge within production before locating the events in the other project.
      - The intended project routing and whether both sources should feed the same analysis project.
      - The user's browser session timeout, while ignoring project routing.
      - The event names first, assuming matching IDs join data across independent projects.
      correct: 1
      explanation: Identity is scoped to project data. Check routing before trying to repair an identity link that
        cannot cross the current project boundary.
      id: f2e7aed7-6004-4789-9cbd-64314603d686
      type: scenario
      difficulty: 4
- id: group-types
  name: 'Group Types: Modeling Organizations'
  difficulty: 4
  estimatedMinutes: 15
  tags:
  - posthog
  - groups
  section: group-analytics
  prerequisites:
  - ph-persons
  - ph-event-properties
  - data-models:relationships
  encompassing: []
  knowledgePoints:
  - id: what-are-groups
    instruction: '**Groups** let analysis aggregate events by an entity such as a company or project. A group type
      names the category; a group key identifies one instance. A cohort selects people who meet conditions, which
      serves a different analytical purpose.


      Decide what one counted unit should represent before building a metric.'
    workedExample: For weekly active companies, the unit is company. Several users' qualifying events can contribute
      to one active company when each event carries the appropriate company group context.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/group-analytics
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: In group analytics, what is the difference between a group type and a group key?
      options:
      - The type is a category such as company; the key identifies an individual company.
      - The key is the number of events captured in the group.
      - They are two names for the same project token.
      - The type identifies one user, and the key is always their email.
      correct: 0
      explanation: Category and instance identity are separate. Keep type names consistent and use stable keys for
        instances.
      id: e7eaa155-16db-4daa-af6c-1476dde7ee9b
      type: multiple_choice
      difficulty: 2
    - question: Three people from company A and two from company B perform the qualifying action. All events carry
        correct company group context. How many active companies does this represent? Enter the number only.
      options: []
      correct: '2'
      explanation: Count the chosen entity. Five active people across two companies represent two active companies.
      type: fill_blank
      id: 0f4cd341-6271-418d-a235-1580197a6dfe
      difficulty: 3
    - question: A stakeholder asks whether accounts complete onboarding even when different employees perform the
        steps. Which analytical unit should the design evaluate?
      options:
      - A cohort of people used as if it were one company entity.
      - Individual users only, while assuming employees are interchangeable without group context.
      - Session IDs used as permanent company identifiers.
      - Company groups with correctly attributed events and a company-level funnel.
      correct: 3
      explanation: The business outcome belongs to the account. Group attribution lets several people contribute
        to that account's journey.
      id: dded9149-6c84-43cb-b2c7-90111db87f35
      type: scenario
      difficulty: 4
  - id: modeling-with-groups
    instruction: '**Group modeling** selects business entities worth aggregating. Use stable keys, and keep properties
      at their correct owner: company plan on the company, user preference on the person, and action context on
      the event.


      An event can connect a person and group through captured context. This is evidence of activity, not a complete
      authoritative membership directory.'
    workedExample: A contractor works in two organizations. Events identify the active organization for each action;
      the application's membership database remains the authority for access rights.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/group-analytics
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which property most naturally belongs to a company group?
      options:
      - A browser session's start time.
      - One click's horizontal coordinate.
      - A user's personal interface language.
      - The company's subscription tier.
      correct: 3
      explanation: Put facts on the entity they describe. Company subscription state can apply to many users in
        that company.
      id: ebe28c66-9596-4ad4-b1ba-8dcf38c5ae94
      type: multiple_choice
      difficulty: 2
    - question: A consultant performs one action for company A and another for company B. How should company context
        be modeled?
      options:
      - Create one combined company AB without a business requirement.
      - Assign every event forever to the first company visited.
      - Use the consultant's email as both company keys.
      - Attribute each event to the company active for that action.
      correct: 3
      explanation: The event context determines which company the action concerns. A person can act in different
        groups over time.
      id: 07e8a43d-6eb6-42d5-a552-45cf3a456214
      type: scenario
      difficulty: 3
    - question: A security team wants to use the list of people associated with a PostHog group as the complete
        current access-control list. What limitation should be explained?
      options:
      - Group analytics guarantees a complete inventory of all account members.
      - A user who has never emitted a group event must have no access.
      - The association is based on captured activity and does not replace the authoritative membership and permission
        system.
      - Every group automatically removes users the moment application access is revoked.
      correct: 2
      explanation: Activity evidence can omit inactive members or include historical participants. Authorization
        needs the application's actual membership records.
      id: 741b2581-c4ac-4e36-ab62-5a4157ca23f7
      type: scenario
      difficulty: 4
- id: group-identify
  name: Group Identify & Group Properties
  difficulty: 5
  estimatedMinutes: 15
  tags:
  - posthog
  - groups
  section: group-analytics
  prerequisites:
  - group-types
  - identify-call
  encompassing:
  - concept: group-types
    weight: 0.7
  - concept: identify-call
    weight: 0.45
  knowledgePoints:
  - id: creating-groups-and-properties
    instruction: '**Group identification** creates or updates a group''s properties. The web group helper also associates
      subsequent events with that group. The group-identify event can create the type when it does not exist; a
      separate manual type-registration step is not universally required.


      Use a stable key instead of an editable display name. Set descriptive properties such as name or plan separately.'
    workedExample: The web app calls group for type company, key org_8, and properties name = Acme. Acme can later
      rename without changing org_8.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/group-analytics
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which value is the better key for a company whose display name can change?
      options:
      - Its stable internal company ID.
      - Its current subscription tier shared by many companies.
      - The email of whichever employee first visited.
      - Its current display name if names can repeat.
      correct: 0
      explanation: A group key carries identity. Mutable or repeated labels belong in descriptive properties.
      id: 4fe1bea2-fd99-48a7-ba14-650bbe98cf6d
      type: multiple_choice
      difficulty: 2
    - question: Company org_8 changes its name from Acme to Acme Labs. Which update preserves its group identity?
      options:
      - Create a new key Acme Labs and stop referring to org_8 without a migration.
      - Change every member's user ID to Acme Labs.
      - Update the name property for key org_8.
      - Use the new name as the project token.
      correct: 2
      explanation: Keep the stable key and update the description. Changing identity for a rename can split the
        company's history.
      id: 847314e4-1d15-4152-8c24-d537bc30ee5c
      type: scenario
      difficulty: 3
    - question: A new integration says it must manually register every group type in project settings before a supported
        group-identify call can work. How should this be reviewed?
      options:
      - Skip group identification and assume a display label creates properties.
      - Assign every new company a new group type to avoid setup.
      - 'Check the supported SDK path: a group-identify operation can create the type, so validate that flow and
        its limits.'
      - Accept the universal requirement without testing the SDK behavior.
      correct: 2
      explanation: Use the documented creation path. Types describe categories, so individual companies should usually
        share one company type.
      id: d2ec05af-a861-4ce6-83b0-dcf61fbe884c
      type: scenario
      difficulty: 4
  - id: backend-group-identify-pattern
    instruction: '**Backend group updates** and event attribution are separate operations. A group-identify call
      updates the group. A backend capture should explicitly supply the group context for that event through the
      SDK''s supported argument.


      A long-lived backend client serves many accounts. Do not assume it retains the correct active group from a
      previous request.'
    workedExample: 'A worker updates company org_8''s plan with groupIdentify. When it captures invoice_paid, it
      also passes company: org_8 in that event''s groups argument.'
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/group-analytics
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: What does a backend group-identify call primarily establish?
      options:
      - A merge of all users of the backend client.
      - The browser's current session ID.
      - The specified group's existence or properties.
      - A permanent implicit group for every future server request.
      correct: 2
      explanation: Group property writes and capture context serve different purposes. Supply event attribution
        explicitly in backend capture.
      id: 1ad11c9b-cf74-4567-a0b5-107255bf9008
      type: multiple_choice
      difficulty: 2
    - question: A worker sends groupIdentify for org_8, then captures invoice_paid without group context. What is
        missing for reliable group attribution of that event?
      options:
      - A new group type for the invoice number.
      - The capture call's company group key.
      - A duplicate person ID for every company employee.
      - The company's name inside the event name only.
      correct: 1
      explanation: The property update does not establish an implicit per-request company for later backend captures.
        Pass the intended group on the event.
      id: 94d25eca-d4e3-4cd7-a8ef-581a43918243
      type: scenario
      difficulty: 3
    - question: A shared server client handles simultaneous requests for companies A and B. A helper keeps the last
        company in a global variable. What design prevents cross-account attribution?
      options:
      - Use company A for every event to make results consistent.
      - Derive and pass group context from each request or job's trusted data.
      - Create a new person profile whenever the global value changes.
      - Keep the global variable and hope requests finish in order.
      correct: 1
      explanation: Request-local context avoids concurrency races. The shared client's last value cannot reliably
        identify the current event's company.
      id: 2fcead01-1a9a-4d73-9d27-20d0bf50faba
      type: scenario
      difficulty: 4
- id: linking-events-to-groups
  name: Linking Events to Groups
  difficulty: 5
  estimatedMinutes: 15
  tags:
  - posthog
  - groups
  section: group-analytics
  prerequisites:
  - group-identify
  encompassing:
  - concept: group-identify
    weight: 0.55
  knowledgePoints:
  - id: frontend-vs-backend-patterns
    instruction: '**Frontend group context** can persist for subsequent captures after the web group helper. Backend
      SDKs use explicit group context per event. Keep these patterns distinct when sharing utility code.


      For a frontend workspace switch, update or clear the relevant context before the next action is captured.
      Test that the emitted event contains the intended group key.'
    workedExample: A browser switches from org_A to org_B. The group state changes before project_opened is captured.
      A server job independently supplies org_B from the job payload.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/group-analytics
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which implementation detail requires attention when porting web group-tracking code to a backend
        service?
      options:
      - The web helper's subsequent-event context should not be assumed to exist on backend captures.
      - The backend must use one group type per request.
      - The backend event name automatically creates all group properties.
      - Backend groups always use a person's email as the key.
      correct: 0
      explanation: SDK state behavior differs by environment. Preserve the intended attribution explicitly when
        moving capture code.
      id: 8f5648eb-4c3a-4e56-9179-74c2e3dc2136
      type: multiple_choice
      difficulty: 2
    - question: A browser was associated with org_A. The user switches to org_B, but project_opened is captured
        before group context changes. Which company can receive the event?
      options:
      - Both companies always receive every event.
      - org_B automatically because the UI title changed.
      - org_A, because the stale context was still active at capture.
      - Neither, because web group context never persists.
      correct: 2
      explanation: Capture uses the context present at that moment. Update the context before capturing the action
        for the new workspace.
      id: e73c5ebc-cb6f-4df4-80b4-6b58fd4dc451
      type: scenario
      difficulty: 3
    - question: Frontend events show org_B correctly after a switch, but backend events still show org_A. What should
        you trace?
      options:
      - A new group type for org_B instead of correcting the per-event group key.
      - Only the browser's group call, assuming it changes server state automatically.
      - The backend request or job context and its per-event group argument independently of frontend state.
      - A forced merge of the user's identities before inspecting group attribution.
      correct: 2
      explanation: A browser update does not update a separate server's context. Trace the boundary and the actual
        backend payload.
      id: bf6d64c6-20cf-4180-beb2-ca8e428b38e2
      type: scenario
      difficulty: 4
  - id: group-linking-constraints
    instruction: '**Group attribution is attached to events.** An event can contain keys for several group types,
      such as company and project. Within one type, its group context identifies one key. A person can emit different
      events for different groups of the same type.


      Group context is not retroactively inferred from a later membership change. Validate it at capture.'
    workedExample: 'An event can carry company: org_8 and project: project_2. Another event by the same person can
      carry company: org_9 when that action concerns another organization.'
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/group-analytics
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which group context fits one event that belongs to company org_8 and project project_2?
      options:
      - Two different company keys packed into one comma-separated company value.
      - The company name substituted for the user's ID.
      - One company key and one project key under their respective group types.
      - No event context because a person can have only one permanent group.
      correct: 2
      explanation: Different group types can coexist on one event. Each type's key should identify the intended
        instance.
      id: 78e16a0d-4647-4052-9e4d-99cec1ff7415
      type: multiple_choice
      difficulty: 2
    - question: 'An event carries company: "org_A,org_B" as one string. The author intended it to count independently
        for both company keys. What is the issue?'
      options:
      - That string is a single key, not two separate company associations.
      - The value changes only the person's email.
      - The SDK automatically copies the event into every company in the project.
      - The comma guarantees two valid group links.
      correct: 0
      explanation: A group key is an identifier. Define the analytical requirement explicitly instead of encoding
        multiple same-type groups in a string.
      id: d5a28e20-14f6-4471-a6d1-e30943ad627b
      type: scenario
      difficulty: 3
    - question: A person joins company B today. Their older events explicitly carry company A. The customer expects
        those old events to move to B automatically. What should you explain?
      options:
      - Changing the group's display name moves the old events to B.
      - All historical group context is ignored in analysis.
      - The latest company always replaces every historical group key.
      - Historical event attribution records the company context captured for those actions; a later membership
        change does not automatically reassign it.
      correct: 3
      explanation: Group context describes the occurrence. Distinguish activity history from current membership
        before proposing any data correction.
      id: aa4ee5ee-8eda-4fa8-ad74-d52a70ad17bc
      type: scenario
      difficulty: 4
- id: group-gotchas
  name: Group Analytics Gotchas
  difficulty: 5
  estimatedMinutes: 15
  tags:
  - posthog
  - groups
  section: group-analytics
  prerequisites:
  - linking-events-to-groups
  - person-modes
  encompassing: []
  knowledgePoints:
  - id: important-limitations
    instruction: '**Group troubleshooting** separates group properties, event attribution, processing mode, and
      UI visibility. A group can be absent from a list when it has no descriptive properties. The current documentation
      requires at least one property for a group to appear in People and groups.


      In a profile-restricted setup, check the supported group helper and person-processing behavior. Inspect payloads
      and warnings before assuming the group key alone proves success.'
    workedExample: An event contains a company key, but the group list is empty. Inspect the group-identify operation
      and its properties, then confirm the event's processing path and project.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/group-analytics
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which documented condition can explain why a group with a known key does not appear in the People
        and groups list?
      options:
      - A requirement that every group have at least ten active users.
      - A guarantee that event attribution automatically creates all descriptive group properties.
      - No group property has been set.
      - A requirement that the group key equal its display name.
      correct: 2
      explanation: Check the group's property record and the documented visibility requirement. A list view alone
        is not a full test of event attribution.
      id: cf1d8b06-cabc-4924-a2c0-331715015625
      type: multiple_choice
      difficulty: 2
    - question: A group-identify payload sets company org_8 with name = Acme, but the event being investigated carries
        company org_9. What should be checked first?
      options:
      - Whether the property update and event refer to the same intended group key.
      - Whether changing org_8's display name also changes org_9's key.
      - Whether identical group types imply that all their keys share properties.
      - Whether the event can inherit properties from the most recently updated group regardless of its key.
      correct: 0
      explanation: Compare identifiers across the two operations. Properties written to org_8 do not describe org_9.
      id: 935a2bdd-0532-4813-b2be-56149b5a291b
      type: scenario
      difficulty: 3
    - question: Group reports are empty after a team disables person processing and manually adds $groups to captures.
        What is the best investigation?
      options:
      - Create more group types without checking the existing payloads.
      - Add random group properties until a chart changes.
      - Assume the presence of $groups alone proves group processing succeeded.
      - Verify the supported group flow, processing mode, payloads, and ingestion warnings with a controlled test.
      correct: 3
      explanation: The full processing path must support the intended feature. Inspect configuration and warnings
        before changing the entity model.
      id: 4808769f-3ac6-4ea7-97f4-c0a322819507
      type: scenario
      difficulty: 4
  - id: limits-and-feature-constraints
    instruction: '**Group type limits** apply to categories, rather than the number of individual companies. Current
      documentation permits up to five group types per project. Use one company type with many stable company keys
      instead of a type per customer.


      Group analytics also has product and billing requirements. Check current availability and pricing for a customer
      rather than promising a fixed cost from a training example.'
    workedExample: A SaaS product models company and workspace as two types. Thousands of company keys still use
      one company type.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/group-analytics
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Under the documented five-group-type limit, what consumes one type?
      options:
      - Each event attributed to a company.
      - Each individual company key.
      - Each person associated with a company.
      - A category such as company.
      correct: 3
      explanation: The limit is on entity categories. Many instances can share the same group type.
      id: 64b60793-04cf-42f2-a71f-e9b8d5c9555b
      type: multiple_choice
      difficulty: 2
    - question: A project has company and project group types, with 4,000 company keys. How many group types does
        that design use? Enter the number only.
      options: []
      correct: '2'
      explanation: Count categories, not instances. The number of company keys does not create additional group
        types.
      type: fill_blank
      id: 264303c5-2169-4753-9fd8-3b7c5bab1bc5
      difficulty: 3
    - question: A customer proposes a separate type for each of 200 customer accounts and asks for a cost guarantee.
        What should the TAM recommend?
      options:
      - Use stable keys under an appropriate shared type and verify current feature access and billing for the project.
      - Use one group type per user to reduce the account count.
      - Promise that 200 types are supported under the five-type limit.
      - Guarantee pricing from an old screenshot without checking current terms.
      correct: 0
      explanation: The model confuses categories with instances. Correct that first, then assess current commercial
        and feature requirements.
      id: 615b043a-4cc6-4323-a733-5d1847a9dd1d
      type: scenario
      difficulty: 4
- id: ph-cdp-overview
  name: 'PostHog CDP: Sources, Transformations, Destinations'
  difficulty: 4
  estimatedMinutes: 16
  tags:
  - posthog
  - cdp
  section: posthog-cdp
  prerequisites:
  - data-pipelines:transformation-etl-elt
  encompassing:
  - concept: data-pipelines:transformation-etl-elt
    weight: 0.4
  knowledgePoints:
  - id: three-pieces
    instruction: 'PostHog''s **customer data platform workflow** connects sources, transformations, and destinations.
      Sources bring data in, transformations prepare events, and destinations send data to other systems. Warehouse
      connectors and event destinations solve different timing and data-shape needs.


      Name the required source, output, and latency before choosing a surface.'
    workedExample: A product event enters from an SDK, receives an allowed-field transformation, and is sent to
      a support destination. A nightly warehouse sync is a separate data movement use case.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/cdp
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which part of a data flow sends processed events to another system?
      options:
      - A transformation that only changes fields within the incoming payload.
      - A destination.
      - An insight that only queries already stored events.
      - A source that imports records from that other system.
      correct: 1
      explanation: The destination is the outbound surface. Source access and transformation have different roles.
      id: 211ef168-460a-4d72-8993-6e678986dd9e
      type: multiple_choice
      difficulty: 2
    - question: A flow receives a signup event, removes an unnecessary property, then sends it to a CRM. Which step
        is the transformation?
      options:
      - Removing the unnecessary property.
      - The CRM receiving the result.
      - The user choosing a password.
      - The source emitting signup.
      correct: 0
      explanation: Identify the step that changes the payload. Ingestion and outbound delivery are separate boundaries.
      id: 2f0c54e1-7537-40e8-9a6b-9b6bfd61da3d
      type: scenario
      difficulty: 3
    - question: A CRM needs selected signup events within minutes, but a proposed design only refreshes a warehouse
        table nightly. What should be reassessed?
      options:
      - The outbound event delivery surface and its latency against the CRM requirement.
      - Whether calling a nightly schedule real time is enough to meet the deadline.
      - Whether all warehouse rows should be sent as signup notifications regardless of event meaning.
      - Only the warehouse refresh job's success status, without measuring delivery time.
      correct: 0
      explanation: Choose a flow that serves the required event and timing contract. A nightly table refresh does
        not automatically satisfy a near-real-time event destination need.
      id: ce2f18ff-0b3c-4764-b9cb-ed5336a51156
      type: scenario
      difficulty: 4
  - id: choosing-the-cdp-surface
    instruction: '**Surface selection** follows direction, shape, and timing. Event destinations deliver selected
      events outward. Batch exports move event data in scheduled batches to supported storage or warehouse targets.
      Warehouse sources import external data for analysis.


      Confirm the supported connector, fields, update behavior, and failure handling for the concrete use case.'
    workedExample: A team wants daily event files in its own storage. It evaluates a batch export. A team wants
      external billing tables available for joins in PostHog and evaluates a warehouse source.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/cdp
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which use case fits an external warehouse source into PostHog?
      options:
      - Import billing tables so they can be analyzed alongside product data.
      - Send a signup alert to another application.
      - Rename a PostHog person profile.
      - Export PostHog events into the customer's object storage.
      correct: 0
      explanation: A source brings external data into the analysis environment. Destinations and exports move data
        outward.
      id: a738fc7b-cc49-4d35-9fa4-452c022c8e54
      type: multiple_choice
      difficulty: 2
    - question: A data team wants scheduled batches of PostHog events in its own supported storage destination.
        Which surface should it evaluate first?
      options:
      - A cohort name change.
      - A person identify call.
      - Batch exports.
      - An anonymous feature-flag property override.
      correct: 2
      explanation: Batch exports match scheduled outbound data movement. Confirm the destination and delivery contract
        before setup.
      id: 26df5030-ea2e-457b-897d-75d9d5cde92e
      type: scenario
      difficulty: 3
    - question: An integration request says "sync Salesforce" but omits direction and purpose. What information
        is necessary before selecting a connector?
      options:
      - Only the source system's name, assuming one connector covers all directions.
      - Whether data must enter PostHog or leave it, which records are involved, and the required freshness.
      - Only whether the team calls the work ETL, without a data contract.
      - Only the API token type, without the records or latency requirements.
      correct: 1
      explanation: The same product name can appear on either side of a flow. Resolve the data contract before choosing
        the surface.
      id: db80a5a8-877a-4077-b768-eac38e788318
      type: scenario
      difficulty: 4
- id: ph-destinations-exports
  name: Destinations & Batch Exports
  difficulty: 4
  estimatedMinutes: 15
  tags:
  - posthog
  - cdp
  section: posthog-cdp
  prerequisites:
  - ph-cdp-overview
  encompassing:
  - concept: ph-cdp-overview
    weight: 0.55
  knowledgePoints:
  - id: realtime-vs-batch
    instruction: '**Delivery latency** describes how quickly data becomes usable downstream. Event-driven delivery
      can serve timely operational reactions. Batch export supports bounded data windows and bulk processing. Neither
      label alone guarantees end-to-end freshness or exactly-once effects.


      Account for queueing, retries, destination processing, and late events. Define the measurable deadline at
      the consumer.'
    workedExample: A support notification must appear within two minutes of a signup. Measure the time from event
      occurrence through destination acceptance and final visibility, including retry cases.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/cdp/batch-exports
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which measurement establishes end-to-end delivery freshness?
      options:
      - Time from the relevant occurrence to usable data at the consumer.
      - Only the dashboard query duration.
      - Only the connector's configured schedule label.
      - Only the time to enqueue an outbound request.
      correct: 0
      explanation: The consumer deadline includes every stage. Queue acceptance or a schedule name alone is incomplete
        evidence.
      id: b8d6fc9c-1c0e-4ec5-ad03-e009dcd4f993
      type: multiple_choice
      difficulty: 2
    - question: Events enter an outbound queue within one second, but the destination processes them ten minutes
        later. A two-minute consumer deadline is required. Does queue speed prove the requirement is met?
      options:
      - Yes. All destinations have zero processing time by definition.
      - No. Usability at minute 10 exceeds the two-minute deadline by eight minutes.
      - No. Therefore the source event timestamp must be removed.
      - Yes. Only enqueue time counts for every freshness contract.
      correct: 1
      explanation: Measure the whole path against the defined deadline. The downstream processing stage currently
        prevents compliance.
      id: 5698e50c-cf7c-46b4-9be6-32f495e3a988
      type: scenario
      difficulty: 3
    - question: An operational alert needs minute-level updates and the analytics archive needs daily files. What
        design best fits the separate requirements?
      options:
      - Send all archive rows as urgent notifications to the support channel.
      - Discard the archive because one consumer needs low latency.
      - Force both through a daily batch and label alerts immediate.
      - Use a suitable timely event path for alerts and a validated batch export for the archive.
      correct: 3
      explanation: Different consumers can justify different serving paths. Define and verify each path's contract
        independently.
      id: 10e5b3f9-cda0-4d87-81ec-8265892019df
      type: scenario
      difficulty: 4
  - id: operating-exports
    instruction: '**Export operations** require more than an enabled configuration. Inspect run status, covered
      time windows, destination records, and errors. A successful retry can repeat delivery, so downstream processing
      should handle duplicates according to the connector''s actual guarantees.


      For a backfill, define the missing interval and compare source and destination evidence. Do not claim a complete
      repair from a green status alone.'
    workedExample: A daily export fails for Tuesday. After credentials are repaired, the team reruns the Tuesday
      interval and reconciles stable event IDs or equivalent completeness checks at the destination.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/cdp/batch-exports
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which evidence most directly shows that an expected export interval reached its destination?
      options:
      - The destination contains the expected records for that interval, supported by run evidence.
      - The destination name exists in a menu.
      - The export toggle is enabled.
      - An unrelated interval succeeded last week.
      correct: 0
      explanation: Configuration is intent. Verify the relevant run and destination data for the interval being
        investigated.
      id: f2490af0-0da1-40a9-ab2b-64a062b00037
      type: multiple_choice
      difficulty: 2
    - question: Monday and Wednesday exports exist, while Tuesday failed with an expired credential. After fixing
        access, what should the recovery target?
      options:
      - Only the failed run's status label, leaving the missing destination interval untouched.
      - Every interval since project creation without assessing duplicate delivery.
      - The missing Tuesday interval, followed by destination validation.
      - Only Thursday's future schedule.
      correct: 2
      explanation: Repair the access cause and the actual coverage gap. Future success does not fill a past missing
        interval automatically.
      id: 7dc192d1-4d03-439a-b2fd-5b9ac149d44d
      type: scenario
      difficulty: 3
    - question: A retry delivers some records twice and the destination appends them into revenue totals. What should
        the integration design establish?
      options:
      - A rule to delete arbitrary rows until the total looks plausible.
      - Stable record identity and a deduplication or idempotent load rule consistent with delivery guarantees.
      - A new random record ID on each retry.
      - A guarantee that retries can never happen.
      correct: 1
      explanation: Repeated delivery must have a defined effect. Use identity-based handling and reconcile results
        rather than guessing which rows to remove.
      id: 41fe76ab-35e4-4925-bb8c-0faed53e2499
      type: scenario
      difficulty: 4
- id: cohorts
  name: 'Cohorts: Static and Dynamic User Groups'
  difficulty: 4
  estimatedMinutes: 15
  tags:
  - posthog
  - querying
  section: querying
  prerequisites:
  - ph-person-properties
  - ph-event-properties
  encompassing:
  - concept: ph-person-properties
    weight: 0.45
  knowledgePoints:
  - id: static-vs-dynamic
    instruction: 'A **static cohort** is a selected set of people. A **dynamic cohort** computes membership from
      rules. Stored cohort membership can take time to refresh, so the visible list need not react instantly to
      a new event.


      Choose a fixed list for a defined invitation group and a rule-based cohort for a changing analytical population.
      Check refresh behavior when diagnosing membership.'
    workedExample: A pilot invitation list uses a static cohort. A report of people active during a rolling period
      uses a dynamic rule whose computed membership changes as the window moves.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data/cohorts
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: What distinguishes a dynamic cohort from a static one?
      options:
      - Static cohorts automatically include every future matching person.
      - Dynamic membership is determined by rules that can be reevaluated.
      - Dynamic cohorts always identify companies instead of people.
      - Static and dynamic cohorts always refresh at the same instant.
      correct: 1
      explanation: The membership mechanism differs. Refresh behavior is a separate operational property to check.
      id: 12330d24-c94e-4327-bf93-f22d66fa81d3
      type: multiple_choice
      difficulty: 2
    - question: A team must invite exactly the 150 people approved for a pilot, even if their later behavior changes.
        Which cohort approach fits?
      options:
      - A company group type used as if it were an invitation list.
      - A static cohort containing the approved list.
      - A rolling activity rule that adds new people automatically.
      - A rule selecting every visitor in the project.
      correct: 1
      explanation: The requirement is a fixed selected population. A dynamic behavior rule could change that population.
      id: 9f083b10-cc09-4fb2-9319-f5d8aae1988e
      type: scenario
      difficulty: 3
    - question: A new event matches a dynamic cohort's rule, but the saved member list has not updated yet. What
        should be checked before changing capture code?
      options:
      - Assume every dynamic cohort refreshes immediately and replay the event repeatedly.
      - Change the cohort name while keeping its rule and calculation state unchanged.
      - Only whether the event is visible in any project, without checking the cohort's scope.
      - The exact rule, time window, identity, and cohort calculation or refresh status.
      correct: 3
      explanation: Membership depends on the rule and its evaluation. Verify those boundaries before assuming event
        capture failed.
      id: 8476bbac-8759-43ab-addf-d1ab8db7e6d0
      type: scenario
      difficulty: 4
  - id: cohorts-for-analysis-vs-rollout
    instruction: '**Analysis cohorts and rollout targeting** have different support rules. Standard dynamic behavioral
      or lifecycle cohorts are not generally supported for flag targeting. Person-property cohort conditions can
      be supported. An early real-time-cohort feature can support some event conditions, so check availability and
      exact restrictions.


      For an immediate rollout condition, use a supported targeting input with a clear update path instead of assuming
      every analysis cohort is eligible.'
    workedExample: A project without the real-time-cohort feature analyzes people who purchased yesterday. Before
      using that segment for a flag, the team checks supported targeting conditions and may maintain an authoritative
      eligibility property.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data/cohorts
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: In a project without the real-time-cohort feature, which assumption about standard behavioral cohorts
        is unsafe?
      options:
      - Person-property inputs can be relevant to flag rules.
      - A saved cohort can have a refresh delay.
      - Every behavioral analysis cohort can directly target a feature flag.
      - Supported targeting conditions should be checked.
      correct: 2
      explanation: Analysis support does not imply rollout support. Check current cohort and flag constraints for
        the project.
      id: 47963eac-bfa4-453e-9bd9-d3a02bd428e6
      type: multiple_choice
      difficulty: 2
    - question: A project has no real-time-cohort feature and wants a flag for people who completed an event. It
        already has a trustworthy eligibility property updated by the application. Which approach should it evaluate?
      options:
      - Changing the event's name to the flag key.
      - A supported flag rule using that eligibility property and a verified update path.
      - A rule that assumes a chart filter automatically becomes flag targeting.
      - Direct use of any standard behavioral cohort without checking support.
      correct: 1
      explanation: Use an input supported by the flag system. Verify that its value and identity reach evaluation
        in time.
      id: 4ff336ee-2aad-46a1-b1d6-2384a9dcf3f6
      type: scenario
      difficulty: 3
    - question: A customer needs immediate event-based eligibility and points to an early real-time-cohort feature.
        What must be verified before promising the rollout?
      options:
      - Project access, supported event conditions, update latency, and end-to-end evaluation behavior.
      - Assume every historical cohort rule is supported by the early feature.
      - Assume access to a beta feature guarantees the required update latency.
      - Only whether the standard analysis cohort has a nonzero member count.
      correct: 0
      explanation: An early feature can have limited scope. Confirm the concrete rule and timing in the customer's
        environment before committing to the design.
      id: 0873bfa2-4f01-464e-9387-ebde167d139b
      type: scenario
      difficulty: 4
- id: hogql-basics
  name: 'HogQL: SQL in PostHog'
  difficulty: 5
  estimatedMinutes: 16
  tags:
  - posthog
  - querying
  section: querying
  prerequisites:
  - ph-events
  - ph-event-properties
  - ph-persons
  encompassing:
  - concept: ph-events
    weight: 0.35
  - concept: ph-event-properties
    weight: 0.45
  - concept: ph-persons
    weight: 0.3
  knowledgePoints:
  - id: sql-expressions-and-insights
    instruction: '**HogQL** is PostHog''s SQL dialect for querying analytics data. A query must use the intended
      row grain, filters, time range, and aggregation. count() over event rows counts events, while a distinct-actor
      calculation answers a different question.


      Check field types and joins. A one-to-many join can multiply event rows and inflate aggregates unless the
      query accounts for the new grain.'
    workedExample: A user performs three purchase events. Counting event rows returns three purchases; a distinct-user
      measure returns one purchasing user. Name the metric according to its actual unit.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/sql
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: What does counting rows in an event table normally measure before any row-multiplying join?
      options:
      - The number of sessions regardless of session IDs.
      - The number of unique people in every case.
      - The number of companies regardless of group context.
      - The number of event rows selected by the filters.
      correct: 3
      explanation: Aggregation follows row grain. Unique people, groups, and sessions require the relevant identity
        and counting logic.
      id: 1c146f3e-208a-4d37-b701-34b1a1e9c6f6
      type: multiple_choice
      difficulty: 2
    - question: Three users each produce two matching events in a period. No joins duplicate rows. What does an
        event-row count return? Enter the number only.
      options: []
      correct: '6'
      explanation: 'The unit is events: three users times two events gives six rows. A distinct-user count would
        answer a different question.'
      type: fill_blank
      id: 39864a32-f538-4a9b-8688-191bfb12cb13
      difficulty: 3
    - question: Revenue doubles after joining each purchase to a table containing two matching contact records per
        account. What should you inspect and correct?
      options:
      - Round the revenue result to fewer decimal places.
      - Divide all joined totals by two as a permanent fix even when contact counts vary.
      - Use DISTINCT on the revenue amount alone, which can collapse legitimate equal-value purchases.
      - Join cardinality and aggregation grain, using an appropriate deduplicated or preaggregated join strategy.
      correct: 3
      explanation: The join multiplies purchase rows. Restore the intended grain before summing money; display formatting
        cannot fix the underlying duplication.
      id: 92ac1035-fd90-4028-9395-29ba588db8cd
      type: scenario
      difficulty: 4
  - id: when-to-use-hogql
    instruction: 'Use **SQL when the question needs explicit logic** such as a specialized join, derived metric,
      or validation that the standard insight builder cannot express well. A standard insight remains useful for
      supported common analyses.


      Make custom queries reviewable: document the unit, time window, filters, and denominator. Compare a small
      known sample before relying on a production result.


      To include accounts with zero usage, start from the full account population and left join usage aggregated
      by account. A left join retains accounts with no matching usage row. Treat a missing usage value as zero only
      when absence really means no recorded activity.'
    workedExample: A paying-accounts table contains A, B, and C. Usage totals exist for A and C. Starting from paying
      accounts and left joining usage preserves B; an inner join would omit it. Convert B's missing total to zero
      only after confirming that missing means no captured usage, rather than a failed data load.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/sql
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which requirement is a strong reason to use a custom SQL query?
      options:
      - A specific join and metric calculation that the standard insight configuration cannot express adequately.
      - A belief that writing SQL automatically guarantees correct metrics.
      - A requirement to avoid documenting the denominator.
      - A preference to make a simple supported chart harder to maintain.
      correct: 0
      explanation: Choose SQL for needed expressive control. Correctness still depends on data meaning, joins, and
        validation.
      id: abfe1018-064f-4155-a618-e8e469b5b424
      type: multiple_choice
      difficulty: 2
    - question: A conversion query divides purchasers by all event rows. The intended metric is purchasing users
        divided by eligible users. What needs correction?
      options:
      - Use all pageviews as the denominator regardless of eligibility.
      - Count distinct event names as the denominator.
      - Keep the event denominator and rename the output user conversion.
      - Both numerator and denominator must use the intended user populations and identity logic.
      correct: 3
      explanation: Define the populations and unit before calculating the ratio. Event counts and user counts are
        not interchangeable.
      id: 4e0ad3aa-cf12-4d5b-93bd-8323319320b3
      type: scenario
      difficulty: 3
    - question: A custom account-usage query runs successfully but excludes accounts with no events. The customer
        needs adoption across all paying accounts, including zero usage. What should validation address?
      options:
      - Replace missing usage with an arbitrary positive count.
      - Start from the paying-account population and use join and null-handling logic that preserves zero-usage
        accounts.
      - Remove inactive accounts from the requirement.
      - Treat successful execution as proof of complete coverage.
      correct: 1
      explanation: A valid query can still select the wrong population. Test known zero-usage accounts and preserve
        them in the denominator.
      id: c60f3847-129f-4317-90f5-b0273db733f2
      type: scenario
      difficulty: 4
