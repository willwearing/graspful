- id: ph-persons
  name: Persons & Person Profiles
  difficulty: 4
  estimatedMinutes: 18
  tags:
  - posthog
  - data-model
  section: posthog-data-model
  prerequisites:
  - ph-events
  - data-models:keys-and-identity
  - data-models:relationships
  encompassing:
  - concept: data-models:keys-and-identity
    weight: 0.7
  - concept: data-models:relationships
    weight: 0.45
  knowledgePoints:
  - id: what-is-a-person
    instruction: 'A **person profile** connects identifiers and stores person properties. An event can be captured
      without creating a stored profile. In the web SDK''s identified_only mode, a fresh anonymous capture with
      inline $set does not itself create a profile. An explicit profile-triggering action, such as identify or
      setPersonProperties, changes that behavior.


      A person represents an identity in analytics, which must be designed carefully for shared devices and multiple
      systems.


      Application boundary: Stored events and stored profiles are separate observations. Trace mode and operations
      before changing the data policy.'
    workedExample: A fresh anonymous browser emits a pageview under identified_only. The event can appear even
      though there is no corresponding stored person profile yet.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data/persons
      title: 'Persons & Person Profiles: what is a person'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: Stored events and stored profiles are separate observations. Trace mode and operations before changing
        the data policy.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: A fresh anonymous browser emits a pageview under identified_only. The event can appear even though
        there is no corresponding stored person profile yet.
    problems:
    - question: Which observation is possible in PostHog?
      options:
      - Every event needs an email profile.
      - Person and session are the same record.
      - Event without a stored profile.
      - A person is the event's project token.
      correct: 2
      explanation: Event capture and stored profile creation are separate. Do not infer a complete profile merely
        from an accepted event.
      id: 3cf85e83-efd9-43dd-98be-2bcffb8c6fe7
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: 'A fresh browser uses identified_only and captures a pageview with inline $set: {plan: "free"}.
        No profile-triggering helper has run. What should you expect from that capture alone?'
      options:
      - The plan value merges all visitors.
      - Inline $set alone necessarily creates a profile.
      - The plan string becomes the actor ID.
      - Capture without creating a profile.
      correct: 3
      explanation: Inline property data alone does not trigger profile creation in this stated mode. Check the
        SDK action and processing mode.
      id: 33aae426-5797-46d0-8ce0-ab831a29ec90
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: A fresh identified_only browser sends pageview with no profile-triggering helper. The event exists
        but People has no profile. What should the TAM conclude?
      options:
      - Expected anonymous capture.
      - Missing People entry proves failed ingestion.
      - Enable always before checking feature requirements.
      - Create a guessed identity to populate People.
      correct: 0
      explanation: Stored events and stored profiles are separate observations. Trace mode and operations before
        changing the data policy.
      type: scenario
      difficulty: 4
      id: 82a5d9f0-9b90-4d92-9026-e17100dcab6a
      purpose: practice
      isTransfer: true
    - question: A customer counts event distinct IDs and reports all of them as stored People profiles. Which
        check is missing?
      options:
      - Raw-ID count directly equals saved profiles.
      - Stored profile existence and identity resolution.
      - Event count directly equals saved profiles.
      - Login UI state directly equals saved profiles.
      correct: 1
      explanation: An identifier is not proof of a saved profile, and several identifiers may resolve to one person.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-persons-what-is-a-person-exam-1
      purpose: exam
      isTransfer: true
    - question: An anonymous event has a stable distinct ID and a numeric cart amount. Which claim follows without
        more evidence?
      options:
      - A cart amount proves stored person state.
      - A stable ID proves authenticated identity.
      - The event is queryable without proving profile state.
      - An event name proves group membership.
      correct: 2
      explanation: Event-level data can exist independently of a stored profile. Additional identity and profile
        facts require their own evidence.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-persons-what-is-a-person-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: ph-events
  - id: what-person-profiles-enable
    instruction: '**Stored profiles** support person-property analysis and stored profile-based targeting. Anonymous
      feature flag evaluation can use a distinct ID and explicitly supplied properties without a stored profile.
      The evaluation inputs and unit of assignment still need a stable design.


      For a flag or experiment question, distinguish assignment, supplied targeting inputs, persisted profile
      properties, and recorded exposure. A generic claim that every flag requires a profile is inaccurate.


      Application boundary: Percentage changes do not supply missing targeting inputs. Trace the rule, identity,
      and supported property-input path.'
    workedExample: An anonymous visitor receives a percentage rollout using a persistent distinct ID. A server-side
      rule that needs a saved subscription status must obtain that value through a supported profile or explicit-property
      path.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data/persons
      title: 'Persons & Person Profiles: what person profiles enable'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: Percentage changes do not supply missing targeting inputs. Trace the rule, identity, and supported
        property-input path.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: An anonymous visitor receives a percentage rollout using a persistent distinct ID. A server-side rule
        that needs a saved subscription status must obtain that value through a supported profile or explicit-property
        path.
    problems:
    - question: Which requirement specifically depends on having stored person-property data available?
      options:
      - Saving an occurrence timestamp.
      - Recording an event name.
      - Percentage rollout using only a distinct ID.
      - Filtering saved profile properties.
      correct: 3
      explanation: Stored property analysis needs stored data. Anonymous capture and some flag evaluations can
        operate without a persisted profile.
      id: b601c8d0-bc09-46a3-bdbd-8b494c93820f
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: An anonymous percentage flag uses a persistent distinct ID and no person-property rule. Must the
        application create a stored person profile solely to evaluate that rule?
      options:
      - Persistent ID can support this rule.
      - No, so IDs may safely change every evaluation.
      - Yes, because every flag needs a saved email.
      - Yes, using one shared visitor profile.
      correct: 0
      explanation: Anonymous flag evaluation is supported. A stable assignment still requires consistent inputs,
        especially the distinct ID.
      id: 8df30caa-1504-4e56-85b9-ec0f0a0e7bb8
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: A flag needs subscription_tier. The anonymous request neither supplies tier nor has it stored.
        What must be established before changing rollout percentage?
      options:
      - Change rollout percentage without tracing tier.
      - Rule-input source and evaluated identity.
      - Create a blank profile and assume tier exists.
      - Treat all anonymous flag rules as unsupported.
      correct: 1
      explanation: Percentage changes do not supply missing targeting inputs. Trace the rule, identity, and supported
        property-input path.
      type: scenario
      difficulty: 4
      id: 6292872c-d505-4289-9c2d-e8516ee5b9ee
      purpose: practice
      isTransfer: true
    - question: A flag uses only a persistent distinct ID and a percentage rule. No saved profile exists. What
        should a TAM test before requiring profiles?
      options:
      - Email persistence despite an ID-only rule.
      - Stored tier despite no property condition.
      - Stable-ID allocation under the actual rule.
      - One shared profile for every anonymous visitor.
      correct: 2
      explanation: Some rollout rules need identity rather than saved person properties. Verify the actual rule
        and ID stability.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-persons-what-person-profiles-enable-exam-1
      purpose: exam
      isTransfer: true
    - question: A People filter needs saved country, but the app only supplies country to flag evaluation. Which
        distinction explains the empty filter result?
      options:
      - All flag inputs always persist to People.
      - A profile automatically acquires every rule property.
      - Country evaluation input changes actor identity.
      - Evaluation input need not be persisted.
      correct: 3
      explanation: Transient targeting input and stored profile state have different contracts. Choose the persistence
        policy deliberately.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-persons-what-person-profiles-enable-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: ph-events
  - id: viewing-person-profiles
    instruction: '**Profile inspection** combines identifiers, properties, and event history. Search using the
      known identifier, confirm the project, and inspect which distinct IDs belong to the person. Display names
      and emails can be missing or repeated.


      Treat the UI as a view of collected evidence. An empty filtered history can result from the chosen time
      range, project, identity, or query, so check those before drawing a conclusion.


      Application boundary: Shared properties do not prove interchangeable identities. Tenant boundaries and accepted
      transition evidence are critical.'
    workedExample: Support provides user_73. Search that ID in the expected project, verify the profile's identifiers,
      and set the event time range to the reported incident.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data/persons
      title: 'Persons & Person Profiles: viewing person profiles'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: Shared properties do not prove interchangeable identities. Tenant boundaries and accepted transition
        evidence are critical.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: Support provides user_73. Search that ID in the expected project, verify the profile's identifiers,
        and set the event time range to the reported incident.
    problems:
    - question: Which value is the strongest starting point for finding a reported user when the application provides
        its canonical PostHog distinct ID?
      options:
      - Exact ID and expected project.
      - Newest profile in any project.
      - Matching plan alone.
      - Matching first name alone.
      correct: 0
      explanation: Use the known identity and project. Human-readable properties can be shared or absent.
      id: 48bd214a-916f-4580-af89-6464f5b253fe
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: A user reports an incident last month, but their profile event view is filtered to the last 24
        hours. What should you adjust before concluding the event is missing?
      options:
      - Create a new actor ID for the incident.
      - Include the occurrence window.
      - Change the event name to the profile title.
      - Change production project tokens first.
      correct: 1
      explanation: The current filter excludes the incident. Validate the query scope before changing instrumentation.
      id: 11f35ffa-b242-40fc-a847-2b908bd2037d
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: Two profiles share an email; one belongs to tenantA:user7, the other tenantB:user7. What must
        precede any merge proposal?
      options:
      - Merge solely on equal email text.
      - Use latest profile creation as canonical proof.
      - Tenant/real-actor contract and accepted links.
      - Choose the larger history without tenant checks.
      correct: 2
      explanation: Shared properties do not prove interchangeable identities. Tenant boundaries and accepted transition
        evidence are critical.
      type: scenario
      difficulty: 4
      id: 9d6bdf6d-0455-4e7f-a0aa-e4151aee7a1b
      purpose: practice
      isTransfer: true
    - question: Support has canonical ID user81, region EU, and an incident timestamp. A search in a US test project
        finds nothing. Which check comes first?
      options:
      - Identity repair before scope verification.
      - US test search as proof of EU production loss.
      - Unbounded replay before a correct bounded search.
      - Correct project/region and bounded time window.
      correct: 3
      explanation: Establish scope before interpreting absence. A wrong project search cannot diagnose ingestion
        or identity.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-persons-viewing-person-profiles-exam-1
      purpose: exam
      isTransfer: true
    - question: A profile event view shows five recent rows; the report counts eight matching rows over a month.
        Which evidence resolves the difference?
      options:
      - Compare both views' exact scopes.
      - Profile view always covers the whole project.
      - Report count proves duplication without scope checks.
      - Equal plan values prove merged identity.
      correct: 0
      explanation: The views may have different scopes. Match those dimensions before proposing a data repair.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-persons-viewing-person-profiles-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: ph-events
  sourceRef: https://posthog.com/docs/data/persons; relevant named topic/contract in this concept; verified 2026-10-07.
- id: ph-person-properties
  name: 'Person Properties: $set and $set_once'
  difficulty: 4
  estimatedMinutes: 18
  tags:
  - posthog
  - data-model
  section: posthog-data-model
  prerequisites:
  - ph-persons
  encompassing: []
  knowledgePoints:
  - id: setting-person-properties
    instruction: '**$set** updates person properties; **$set_once** fills values that have not already been set.
      Use current-state properties for current facts and first-value properties for facts whose first accepted
      value should remain.


      For supported SDKs, identify can include property updates. The web helper setPersonProperties can explicitly
      trigger profile creation. Inline $set on a fresh anonymous capture in identified_only has different creation
      behavior, as taught in the person-profile lesson.


      Application boundary: A supported unset operation removes a profile key. It is different from replacing
      its value, set-once, or an evaluation-only flag override. Verify the SDK version and processing path, then
      read persisted state.'
    workedExample: After a known user upgrades, update current_plan with $set. Keep initial_referrer under $set_once
      so a later visit does not overwrite the first accepted value.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/person-properties
      title: 'Person Properties: $set and $set_once: setting person properties'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: A supported unset operation removes a profile key. It is different from replacing its value, set-once,
        or an evaluation-only flag override. Verify the SDK version and processing path, then read persisted state.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: After a known user upgrades, update current_plan with $set. Keep initial_referrer under $set_once
        so a later visit does not overwrite the first accepted value.
    problems:
    - question: Which update operation changes an existing current_plan person property?
      options:
      - A normal event attribute update without profile operations.
      - $set
      - $set_once for an already present value
      - A flag-evaluation override without persistence.
      correct: 1
      explanation: Use $set for a value that should track current state. $set_once intentionally preserves an
        existing value.
      id: 26be62d2-e5d4-4a4b-9b5b-bcfd8ed683f0
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: A known profile has current_plan = free and initial_referrer = search. A later update sets current_plan
        to paid and tries to set_once initial_referrer to email. What should remain?
      options:
      - plan=free, referrer=email.
      - plan=paid, referrer=email.
      - plan=paid; referrer=search.
      - plan=free, referrer=search.
      correct: 2
      explanation: The ordinary set updates current state. The set-once operation leaves the already present first
        value intact.
      id: 756578f0-072e-4325-b4d0-aa927b8536cc
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: Profile current_plan=free and first_campaign=search. The app sends $set plan=paid and $set_once
        first_campaign=email. Which audit result fits?
      options:
      - plan=paid,first_campaign=email.
      - plan=free,first_campaign=search.
      - plan=free,first_campaign=email.
      - plan=paid,first_campaign=search.
      correct: 3
      explanation: Normal set replaces existing values; set-once preserves an existing key. Verify the supported
        profile-processing path also ran.
      type: scenario
      difficulty: 4
      id: e9f50fe9-ab19-4ac8-8432-5ddb25cb0e3a
      purpose: practice
      isTransfer: true
    - question: 'A profile has no first_referrer. Two accepted writes run in order: set_once search, then set_once
        email. What remains?'
      options:
      - search
      - email
      - Both values as a list.
      - No value until identify is repeated.
      correct: 0
      explanation: Set-once fills an absent property, then preserves it. The accepted processing order determines
        this example.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-person-properties-setting-person-properties-exam-1
      purpose: exam
      isTransfer: true
    - question: A known profile must clear an obsolete crm_segment. Which operation should be tested under the
        SDK contract?
      options:
      - A new event name without a profile write.
      - Supported profile-property unset.
      - A flag override that changes only evaluation input.
      - A $set_once write while the old property exists.
      correct: 1
      explanation: Deletion, replacement, set-once, and transient evaluation inputs are different operations.
        Use the supported unset path and verify persisted state.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-person-properties-setting-person-properties-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: ph-persons
  - id: choosing-person-property-updates
    instruction: '**Property update order** follows processing, so out-of-order arrivals can make current state
      stale. A set-once value is the first accepted value, which may differ from the event with the earliest occurrence
      timestamp.


      For authoritative current state, define which system owns the property and how delayed writes are handled.
      Backfills need special care because historical events can carry old profile values.


      Application boundary: Separate historical occurrence attributes from current-state ownership. Set-once cannot
      implement a changing plan, and old timestamps do not universally guard writes.'
    workedExample: A delayed free-plan event arrives after a paid-plan update and carries $set for current_plan.
      Inspect whether it overwrote the current value, then remove stale state writes from the backfill or reconcile
      from the authoritative source.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/person-properties
      title: 'Person Properties: $set and $set_once: choosing person property updates'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: Separate historical occurrence attributes from current-state ownership. Set-once cannot implement
        a changing plan, and old timestamps do not universally guard writes.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: A delayed free-plan event arrives after a paid-plan update and carries $set for current_plan. Inspect
        whether it overwrote the current value, then remove stale state writes from the backfill or reconcile
        from the authoritative source.
    problems:
    - question: What does set_once establish when events arrive out of occurrence-time order?
      options:
      - The earliest occurrence timestamp automatically.
      - The latest value from every later event.
      - First accepted value.
      - The smallest value after sorting.
      correct: 2
      explanation: Processing order and occurrence time differ. Do not use set_once as an automatic historical
        minimum calculation.
      id: e456cc82-6a26-4db8-bebb-00ddaeed3494
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: A newer paid-plan update is processed, then an old backfill writes current_plan = free with $set.
        Which result must you guard against?
      options:
      - A backfill always consults billing first.
      - Timestamp alone blocks all stale $set writes.
      - Known IDs ignore every later property update.
      - Late stale overwrite.
      correct: 3
      explanation: Late processing can apply an old value as a new write. Plan backfills so they do not silently
        regress current properties.
      id: fd28de79-2f45-4b97-9537-0dfa06354791
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: Paid is current after a June upgrade. A May event is backfilled in July with $set plan=free. What
        prevention fits a current-plan contract?
      options:
      - Separate historical and current writes.
      - Old timestamp automatically blocks stale writes.
      - Use set_once for a changing current plan.
      - Rewrite current plan from each historical event.
      correct: 0
      explanation: Separate historical occurrence attributes from current-state ownership. Set-once cannot implement
        a changing plan, and old timestamps do not universally guard writes.
      type: scenario
      difficulty: 4
      id: 363f44b9-7513-4edf-8102-decce15f67f0
      purpose: practice
      isTransfer: true
    - question: An August backfill arrives before a June historical event. Both use set_once first_campaign. Which
        value is guaranteed by that operation alone?
      options:
      - Earliest occurrence campaign always wins.
      - First accepted value while the key is absent.
      - Latest occurrence campaign always wins.
      - Every later set_once replaces the value.
      correct: 1
      explanation: Processing order and source history differ. Computing a historical first touch requires an
        authoritative time-aware rule.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-person-properties-choosing-person-property-updates-exam-1
      purpose: exam
      isTransfer: true
    - question: Billing and CRM both overwrite subscription_tier with different delay. Which contract avoids a
        last-writer accident?
      options:
      - Let arrival order decide business authority.
      - Use set_once for a mutable tier.
      - Authoritative owner and stale-write policy.
      - Select whichever source emits more events.
      correct: 2
      explanation: A current-state property needs ownership and update semantics. Arrival order alone is not a
        business precedence rule.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-person-properties-choosing-person-property-updates-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: ph-persons
  sourceRef: https://posthog.com/docs/product-analytics/person-properties; relevant named topic/contract in this
    concept; verified 2026-10-07.
- id: ph-distinct-id
  name: 'distinct_id: Linking Events to Persons'
  difficulty: 5
  estimatedMinutes: 18
  tags:
  - posthog
  - data-model
  section: posthog-data-model
  prerequisites:
  - ph-persons
  - data-models:keys-and-identity
  encompassing:
  - concept: data-models:keys-and-identity
    weight: 0.8
  knowledgePoints:
  - id: what-is-distinct-id
    instruction: 'A **distinct ID** is the identifier attached to events for identity resolution. It is scoped
      to the project and must distinguish the intended users. A generated anonymous browser ID and a stable application
      user ID can later be connected through a valid identify transition.


      Avoid shared placeholders and mutable values. Validate the value before sending it, including empty or missing
      IDs.


      Application boundary: Actor identity determines attribution. An ordinary customer property does not automatically
      replace a shared distinct ID.'
    workedExample: Use user_105 from the application's user database for that known user. A value like logged_in_user
      would incorrectly collapse unrelated users into one identifier.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/identify
      title: 'distinct_id: Linking Events to Persons: what is distinct id'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: Actor identity determines attribution. An ordinary customer property does not automatically replace
        a shared distinct ID.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: Use user_105 from the application's user database for that known user. A value like logged_in_user
        would incorrectly collapse unrelated users into one identifier.
    problems:
    - question: What is the main purpose of an event's distinct ID?
      options:
      - Route to the project.
      - Set the session idle threshold.
      - Name the business occurrence.
      - Actor identity.
      correct: 3
      explanation: The distinct ID carries actor identity. Other context belongs in appropriate properties.
      id: 54dabab3-0726-4c8c-91e3-f21ddecad178
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: All signed-in customers are captured with distinct_id = logged_in_user. What measurement problem
        does this create?
      options:
      - Shared analytics identity.
      - The shared label expands into canonical IDs.
      - Only URLs are affected.
      - Every event gets a unique actor automatically.
      correct: 0
      explanation: A shared placeholder cannot distinguish people. Send the stable, unique ID for the actual actor.
      id: 2f0a3ee7-3b0f-4f02-a8e4-1673c98eab50
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: A worker uses distinct_id=worker01 for all customer payments. Each payload also has customer_id.
        Which repair aligns actor measurement?
      options:
      - Keep worker actor and relabel it customer.
      - Customer actor; worker metadata.
      - Use order ID as the customer actor identity.
      - Rotate worker actor daily to spread counts.
      correct: 1
      explanation: Actor identity determines attribution. An ordinary customer property does not automatically
        replace a shared distinct ID.
      type: scenario
      difficulty: 4
      id: f460d25d-ad6a-4ffa-b4c1-8e5710d75d0d
      purpose: practice
      isTransfer: true
    - question: Two tenants independently number users as 42. Events use raw 42. What is required before counting
        these as one person?
      options:
      - Equal local user numbers alone.
      - Equal plan values alone.
      - Authoritative tenant-aware identity contract.
      - Equal names and nearby timestamps alone.
      correct: 2
      explanation: A namespace collision can combine unrelated actors. Identity must follow the application boundary.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-distinct-id-what-is-distinct-id-exam-1
      purpose: exam
      isTransfer: true
    - question: One user generates two events with new random distinct IDs each time. No links exist. What does
        raw distinct-ID count measure?
      options:
      - One human is proved by the two random IDs.
      - Two real humans are proved by the two random IDs.
      - Two sessions are proved by the two random IDs.
      - Two supplied IDs; real-person count unproved.
      correct: 3
      explanation: Identifier count reflects the supplied representation. It cannot establish real-user count
        without stable identity and resolution evidence.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-distinct-id-what-is-distinct-id-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: ph-persons
  - id: frontend-vs-backend-distinct-id
    instruction: 'The **web SDK** normally maintains an anonymous browser ID. Backend capture for a known user
      should use the same canonical ID that the frontend uses after identification. Exact method signatures and
      optional-ID behavior vary by SDK version.


      When tracing anonymous server-side activity, propagate a suitable browser ID explicitly under the application''s
      data policy. A backend request does not inherently know which browser identity produced it.


      Application boundary: The backend must preserve the namespace, not just a locally equal number. Document
      exact serialization across systems.'
    workedExample: After login, the frontend identifies user_31. A payment job captures payment_completed using
      user_31 from trusted application data. Both use the same canonical identity.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/identify
      title: 'distinct_id: Linking Events to Persons: frontend vs backend distinct id'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: The backend must preserve the namespace, not just a locally equal number. Document exact serialization
        across systems.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: After login, the frontend identifies user_31. A payment job captures payment_completed using user_31
        from trusted application data. Both use the same canonical identity.
    problems:
    - question: For an authenticated user, which value should backend capture normally share with the identified
        frontend?
      options:
      - Canonical application user ID.
      - Random ID per event.
      - Project token as user identity.
      - Shared machine hostname.
      correct: 0
      explanation: Consistent canonical identity links the known user's events across sources. A server or project
        identifier describes a different entity.
      id: ad190289-fe59-4bfd-b919-9adc75eb1e6d
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: Frontend identify uses user_31, while backend payment events use email alex@example.com. No link
        connects these IDs. What mismatch should be corrected?
      options:
      - Timestamp precision only.
      - Different unlinked actor IDs.
      - Browser versus server runtime alone.
      - Different event names alone.
      correct: 1
      explanation: Different event names are normal. Align identity values or establish a valid deliberate link
        rather than assuming the email property connects them.
      id: 783006d2-0a88-49e8-a362-c77b6898294d
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: Frontend identifies tenant4:user12. Backend invoices use user12; tenant5 also has user12. Which
        integration correction is needed?
      options:
      - Remove tenant scope without collision checks.
      - Use email matching as an automatic link.
      - Consistent tenant-scoped canonical ID.
      - Use invoice ID as the user identity.
      correct: 2
      explanation: The backend must preserve the namespace, not just a locally equal number. Document exact serialization
        across systems.
      type: scenario
      difficulty: 4
      id: 3ae6b395-b5b5-49e2-bc6c-194434628cfa
      purpose: practice
      isTransfer: true
    - question: Frontend uses numeric user ID serialized as "007"; backend uses "7". The business says these refer
        to one user. What should be tested?
      options:
      - Display-equal values link automatically.
      - HTTP success establishes one identity.
      - Normalization of new IDs alone repairs all history.
      - Canonical serialization plus existing-ID migration.
      correct: 3
      explanation: Semantically equal source values can be different analytics identifiers. Future normalization
        and existing-history repair are separate tasks.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-distinct-id-frontend-vs-backend-distinct-id-exam-1
      purpose: exam
      isTransfer: true
    - question: A webhook lacks browser context but knows canonical user99. Which capture choice preserves actor
        attribution without inventing a session?
      options:
      - Known user99; only trustworthy session context.
      - Guess the latest browser session.
      - Capture every user under one webhook actor.
      - Wait for browser context despite a known actor.
      correct: 0
      explanation: Known actor identity can be supplied independently of browser session context. Do not fabricate
        a browser journey.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-distinct-id-frontend-vs-backend-distinct-id-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: ph-persons
  - id: multiple-distinct-ids
    instruction: 'One **person** can have multiple linked distinct IDs. Valid identity transitions can connect
      an anonymous device ID to the known application ID. Counting raw distinct IDs therefore need not equal counting
      resolved people.


      A shared email property alone does not establish that link. Inspect the identity records and transition
      events when counts differ.


      Application boundary: Raw event identifiers persist while accepted identity links can resolve them together.
      Declare the count grain.'
    workedExample: A person uses two devices. Each starts with its own anonymous ID, and both later identify to
      user_52. A resolved-person count can treat the linked history as one person even though several raw IDs
      exist.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/identify
      title: 'distinct_id: Linking Events to Persons: multiple distinct ids'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: Raw event identifiers persist while accepted identity links can resolve them together. Declare the
        count grain.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: A person uses two devices. Each starts with its own anonymous ID, and both later identify to user_52.
        A resolved-person count can treat the linked history as one person even though several raw IDs exist.
    problems:
    - question: Can one resolved PostHog person have several distinct IDs?
      options:
      - Yes, matching names automatically prove linking.
      - Yes, through accepted identity links.
      - Yes, equal event names automatically prove linking.
      - No, one person can have only one ID.
      correct: 1
      explanation: A person can have multiple identifiers. The link comes from identity resolution, not arbitrary
        descriptive similarity.
      id: 23adc204-dc86-4e9a-a84d-fe2fcf1d48b6
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: Two browser IDs are validly linked to user_52. A query counts three raw distinct IDs. What should
        you check before reporting three people?
      options:
      - A fixed divisor of three for every user.
      - Assume each linked ID is a separate person.
      - Resolved-person versus raw-ID grain.
      - Rename all events to merge actors.
      correct: 2
      explanation: Identifier count and person count have different units. Use the metric that matches the business
        question.
      id: 1db4d719-fba9-4a60-95ed-c649d5713d55
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: Anonymous a1 and a2 validly link to user9. Each ID has one event. Which count pair fits this fixture?
      options:
      - Three raw IDs; three resolved people.
      - One raw ID; three resolved people.
      - One raw ID; one event.
      - Three raw IDs; one resolved person.
      correct: 3
      explanation: Raw event identifiers persist while accepted identity links can resolve them together. Declare
        the count grain.
      type: scenario
      difficulty: 4
      id: af1a31ff-9482-4c89-9229-999e9f598d5f
      purpose: practice
      isTransfer: true
    - question: A query uses distinct_id. A profile shows several IDs linked to one person. What evidence should
        precede changing the KPI?
      options:
      - Intended actor grain and resolved-query path.
      - A fixed divisor for linked IDs.
      - Display-name matching instead of resolved identity.
      - Newest raw ID only, discarding linked history.
      correct: 0
      explanation: A raw-ID KPI and person KPI answer different questions. Use documented identity semantics and
        a small linked-ID fixture.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-distinct-id-multiple-distinct-ids-exam-1
      purpose: exam
      isTransfer: true
    - question: A backend and two browsers share user50 after valid links. Session IDs remain different. Which
        conclusion is supported?
      options:
      - One person requires one shared session.
      - One person can retain separate sessions/raw IDs.
      - All raw IDs must disappear from storage.
      - Same person proves device concurrency.
      correct: 1
      explanation: Actor resolution does not erase the distinction between devices, sessions, or raw capture identity.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-distinct-id-multiple-distinct-ids-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: ph-persons
  sourceRef: https://posthog.com/docs/product-analytics/identify; relevant named topic/contract in this concept;
    verified 2026-10-07.
- id: ph-sessions
  name: 'Sessions: Grouping Events by Visit'
  difficulty: 3
  estimatedMinutes: 12
  tags:
  - posthog
  - data-model
  section: posthog-data-model
  prerequisites:
  - ph-events
  - ph-distinct-id
  encompassing: []
  knowledgePoints:
  - id: how-sessions-work
    instruction: 'A **session** groups activity from an interaction period. Web SDK defaults include a 30-minute
      inactivity timeout and a 24-hour maximum; configuration can change the inactivity threshold. A reset starts
      a new session. Sessions can be shared across tabs in the same browser.


      Backend events do not automatically inherit a browser session. If the analysis needs that link, propagate
      the appropriate $session_id through a supported path.


      Application boundary: Timestamp proximity and actor identity do not prove browser-session membership. Propagate
      trustworthy session context where required.'
    workedExample: With the default inactivity timeout, a browser event after a 40-minute idle gap starts a new
      session. A later backend event needs explicit session context if it should join that browser session.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data/sessions
      title: 'Sessions: Grouping Events by Visit: how sessions work'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: Timestamp proximity and actor identity do not prove browser-session membership. Propagate trustworthy
        session context where required.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: With the default inactivity timeout, a browser event after a 40-minute idle gap starts a new session.
        A later backend event needs explicit session context if it should join that browser session.
    problems:
    - question: Under the default web session behavior, what does a 40-minute inactivity gap imply for the next
        activity?
      options:
      - Always the same session until account closure.
      - A merge across all devices.
      - New session after idle expiry.
      - A new project token.
      correct: 2
      explanation: Use the configured inactivity threshold. The default is 30 minutes, but a project can configure
        a different value.
      id: 7c2de23f-89e9-4416-bd86-f7e705bbbfe0
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: A backend SDK captures an event with the correct user ID, but no $session_id and no session-propagation
        middleware. Is it guaranteed to join the active browser session?
      options:
      - Yes, the event name supplies browser context.
      - Yes, known person ID alone supplies browser context.
      - No, backend session context is impossible.
      - No; person ID is not session context.
      correct: 3
      explanation: Person identity and session identity are distinct. Supported explicit propagation can link
        backend activity to the desired session.
      id: 7f2e21ea-110c-4f03-ad6c-97659358b44e
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: A browser session s1 contains a click at 09:00. A webhook at 09:01 has user9 but no session ID.
        What can be claimed?
      options:
      - Same actor possible; session membership unproved.
      - Same session inferred from nearby timestamps.
      - Known actor guarantees active-session inheritance.
      - Webhook creates a browser session automatically.
      correct: 0
      explanation: Timestamp proximity and actor identity do not prove browser-session membership. Propagate trustworthy
        session context where required.
      type: scenario
      difficulty: 4
      id: 65ecb869-9dae-4527-a026-9e5fc8113ee5
      purpose: practice
      isTransfer: true
    - question: Web activity occurs at 10:00 and 10:20, then11:00, under default inactivity behavior. Which session
        boundary is expected?
      options:
      - All three remain one session because actor matches.
      - 10:00/10:20 together;11:00 starts another.
      - Each event starts a session despite short gaps.
      - Every browser device shares one identified session.
      correct: 1
      explanation: The40-minute idle gap exceeds the default 30-minute threshold. Separate actor and session identity.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-sessions-how-sessions-work-exam-1
      purpose: exam
      isTransfer: true
    - question: Two tabs in the same browser share session context, but each has its own window ID. Which metric
        distinction matters?
      options:
      - Count windows as sessions unconditionally.
      - Count sessions as people unconditionally.
      - Count windows and sessions with their own keys.
      - Use window ID as canonical user identity.
      correct: 2
      explanation: A window/tab identity is not the session identity. Count the key matching the requested unit.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-sessions-how-sessions-work-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: ph-events
  - id: session-properties
    instruction: '**Session properties** summarize a session, such as duration and entry URL. A session metric
      needs an explicit definition. For PostHog web analytics, the default bounce definition uses one pageview,
      no autocapture interactions, and duration below the configured threshold, normally 10 seconds.


      A one-page session can still be engaged. Always check the applicable metric settings and collected signals.


      Application boundary: The interaction disqualifies B under the supplied criteria. One pageview alone does
      not decide bounce.'
    workedExample: A visitor reads one page for 45 seconds. A rule that marks every one-page session as a bounce
      would disagree with the default duration-based bounce definition.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data/sessions
      title: 'Sessions: Grouping Events by Visit: session properties'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: The interaction disqualifies B under the supplied criteria. One pageview alone does not decide bounce.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: A visitor reads one page for 45 seconds. A rule that marks every one-page session as a bounce would
        disagree with the default duration-based bounce definition.
    problems:
    - question: Why is a one-page session alone insufficient to apply PostHog's default bounce definition?
      options:
      - Person plan alone defines bounce.
      - Every one-page session is a bounce.
      - Browser tab count alone defines bounce.
      - Duration and interaction matter.
      correct: 3
      explanation: Use all conditions in the defined metric. Pageview count alone omits engagement signals.
      id: 678ce63e-469e-449e-87cf-6072a7ef81b4
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: Using the default 10-second bounce threshold, a session has one pageview, no autocapture interactions,
        and a duration of 6 seconds. How is it classified?
      options:
      - Bounce.
      - A new person.
      - Engaged solely because it has one pageview.
      - Two sessions.
      correct: 0
      explanation: 'All stated bounce conditions hold: one pageview, no autocapture interactions, and duration
        below the threshold.'
      id: 0edbff83-482a-472b-b965-c1db2124713b
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: Session A has one pageview, no autocapture,6 seconds. B has one pageview, an autocapture interaction,6
        seconds. Under default criteria, which is a bounce?
      options:
      - B only.
      - A only.
      - Both A and B.
      - Neither A nor B.
      correct: 1
      explanation: The interaction disqualifies B under the supplied criteria. One pageview alone does not decide
        bounce.
      type: scenario
      difficulty: 4
      id: 001ae60f-afee-49ee-9e21-474c8c4b465f
      purpose: practice
      isTransfer: true
    - question: A one-page session lasts 25 seconds with no autocapture. Default bounce threshold is 10 seconds.
        Which classification fits?
      options:
      - Bounce from one pageview alone.
      - A new session after ten seconds.
      - Not a bounce under the stated duration rule.
      - Unknown actor from no autocapture alone.
      correct: 2
      explanation: Bounce threshold and session inactivity threshold are different. Duration can disqualify a
        one-page session.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-sessions-session-properties-exam-1
      purpose: exam
      isTransfer: true
    - question: Pageleave and autocapture collection were disabled. A customer compares bounce rates to a fully
        instrumented project. What caveat is required?
      options:
      - Pageviews alone ensure identical bounce measurement.
      - Session ID reconstructs every missing interaction.
      - Missing inputs always imply zero engagement.
      - Duration/interaction coverage differs.
      correct: 3
      explanation: Check the inputs of the definition. Equal pageview counts do not guarantee equally observed
        session behavior.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-sessions-session-properties-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: ph-events
  sourceRef: https://posthog.com/docs/data/sessions; relevant named topic/contract in this concept; verified 2026-10-07.
- id: ph-actions
  name: 'Actions: Grouping Events for Analysis'
  difficulty: 3
  estimatedMinutes: 14
  tags:
  - posthog
  - data-model
  section: posthog-data-model
  prerequisites:
  - ph-events
  - ph-event-properties
  encompassing: []
  knowledgePoints:
  - id: what-are-actions
    instruction: 'A **PostHog action** groups matching events under a reusable definition. Its conditions can
      select events and properties, including autocaptured interactions. The underlying events remain available.


      An action is a query definition over captured evidence. It cannot create a missing business fact. Editing
      its conditions can change which historical events match, so record metric-definition changes.


      Application boundary: A partial match is insufficient when a property condition is required. Test each rule
      against positive and negative fixtures.'
    workedExample: An action named Contact interest matches clicks on two contact buttons. It can measure those
      interactions, while a confirmed form submission needs a success signal.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data/actions
      title: 'Actions: Grouping Events for Analysis: what are actions'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: A partial match is insufficient when a property condition is required. Test each rule against positive
        and negative fixtures.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: An action named Contact interest matches clicks on two contact buttons. It can measure those interactions,
        while a confirmed form submission needs a success signal.
    problems:
    - question: What does a PostHog action define?
      options:
      - Reusable event-matching rules.
      - A rewrite of every original payload.
      - An actor identity for each event.
      - A command that executes the business operation.
      correct: 0
      explanation: An action groups evidence by conditions. It does not replace event identity or create a missing
        outcome.
      id: e2b91b92-8f78-4181-88e9-256821129498
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: An action matches event = contact_clicked and location = header. An event has contact_clicked
        with location = footer. Does it match those conditions?
      options:
      - Only when profile email exists.
      - No; header condition fails.
      - Yes, all contact events belong to the action.
      - Yes, name alone satisfies every rule.
      correct: 1
      explanation: Evaluate the whole rule. A matching event name does not override a failed property condition.
      id: 48d51e0e-dd0e-4462-9b27-df6a7093693c
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: An action matches export_success OR report_downloaded where status=complete. One report_downloaded
        has status=failed. Which row belongs?
      options:
      - Name-only matching despite failed status.
      - Same-person matching regardless of event criteria.
      - Rows satisfying a complete matching alternative.
      - Same-session matching regardless of event criteria.
      correct: 2
      explanation: A partial match is insufficient when a property condition is required. Test each rule against
        positive and negative fixtures.
      type: scenario
      difficulty: 4
      id: dd1b34ed-b5cb-4d4b-809e-997742b7edac
      purpose: practice
      isTransfer: true
    - question: An action definition is edited from all clicks to confirmed successes. Historical action charts
        change. What should be documented?
      options:
      - Source events were rewritten by action editing.
      - Action editing performed identity merges.
      - A new rule applies only to future source rows.
      - Changed matching semantics over stored rows.
      correct: 3
      explanation: Actions define a reusable query meaning over captured rows. Changing that meaning can change
        historical results without editing source facts.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-actions-what-are-actions-exam-1
      purpose: exam
      isTransfer: true
    - question: The needed action is payment_success, but storage contains only pay_button_clicked. Which conclusion
        is defensible?
      options:
      - Authoritative success instrumentation.
      - Rename clicks to success without outcome evidence.
      - Profile presence proves successful payment.
      - Any click after login proves payment success.
      correct: 0
      explanation: Matching existing data cannot create a business outcome that was never recorded.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-actions-what-are-actions-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: ph-events
  - id: actions-vs-custom-events
    instruction: 'Choose an **action** when a reusable rule over existing events captures the intended meaning.
      Choose new instrumentation when the required fact was never recorded. For a metric migration, run the definitions
      side by side and reconcile differences before replacing a report.


      An action built from clicks can be useful, but its name should reflect the evidence it actually matches.


      Application boundary: An OR action unifies names but does not automatically establish one row per occurrence.
      Validate authoritative occurrence IDs and overlap.'
    workedExample: Existing events record two successful export names from old and new clients. An action can
      combine those known success signals into one report definition.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data/actions
      title: 'Actions: Grouping Events for Analysis: actions vs custom events'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: An OR action unifies names but does not automatically establish one row per occurrence. Validate authoritative
        occurrence IDs and overlap.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: Existing events record two successful export names from old and new clients. An action can combine
        those known success signals into one report definition.
    problems:
    - question: Which requirement can an action satisfy without new application instrumentation?
      options:
      - Infer an unrecorded server result.
      - Combine recorded equivalent successes.
      - Recover amounts from no source.
      - Create identity links from display names.
      correct: 1
      explanation: An action can reuse available evidence. Missing facts require instrumentation or another trustworthy
        data source.
      id: a93aa06b-af79-47d5-9f3e-d8a4ec686652
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: Old clients emit export_done and new clients emit export_completed. Both mean the same verified
        success. What is a suitable temporary reporting approach?
      options:
      - Change actor ID for old clients.
      - Exclude old clients without traffic reconciliation.
      - Validated action matching both names.
      - Count every export click as success.
      correct: 2
      explanation: A union of equivalent captured signals supports the migration. Check overlap so one occurrence
        is not counted twice.
      id: 57802c5f-3d87-4a83-9029-aff57135d1a1
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: Old clients send export_done, new ones export_completed. During migration one client sends both
        for the same export. What must a combined action check?
      options:
      - Name equivalence alone proves no overlap.
      - Sum both names and ignore shared occurrence IDs.
      - Divide the combined action count by two.
      - Equivalence and overlap duplicate counting.
      correct: 3
      explanation: An OR action unifies names but does not automatically establish one row per occurrence. Validate
        authoritative occurrence IDs and overlap.
      type: scenario
      difficulty: 4
      id: a387d6f8-cbf4-4f87-94f9-6d85760b31fd
      purpose: practice
      isTransfer: true
    - question: Autocapture records a submit click; server validation can reject it. Which requirement needs a
        new semantic event?
      options:
      - Confirmed valid submission.
      - Observed click intent.
      - Observed page URL at click.
      - Observed clicked-button label.
      correct: 0
      explanation: Outcome cannot be inferred reliably from intent. The click already answers interaction questions.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-actions-actions-vs-custom-events-exam-1
      purpose: exam
      isTransfer: true
    - question: Three stored events are equivalent onboarding milestones in different clients. A reusable chart
        definition is needed without code changes. What can an action provide?
      options:
      - Recover missing milestones without stored evidence.
      - A validated union of captured conditions.
      - Rewrite each original name in storage.
      - Assume automatic deduplication of client overlap.
      correct: 1
      explanation: An action can group observed equivalent evidence. Instrumentation and duplicate policy remain
        separate obligations.
      type: scenario
      difficulty: 4
      id: posthog-data-model-ph-actions-actions-vs-custom-events-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: ph-events
