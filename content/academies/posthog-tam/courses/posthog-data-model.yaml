- id: group-identify
  name: Group Identify & Group Properties
  difficulty: 5
  estimatedMinutes: 15
  tags:
  - posthog
  - groups
  section: group-analytics
  prerequisites:
  - group-types
  - identify-call
  encompassing:
  - concept: group-types
    weight: 0.7
  - concept: identify-call
    weight: 0.45
  knowledgePoints:
  - id: creating-groups-and-properties
    instruction: '**Group identification** creates or updates a group''s properties. The web group helper also
      associates subsequent events with that group. The group-identify event can create the type when it does
      not exist; a separate manual type-registration step is not universally required.


      Use a stable key instead of an editable display name. Set descriptive properties such as name or plan separately.


      Application boundary: Setting a supported descriptive group property is required for the documented People
      and groups list visibility. Event attribution alone does not prove descriptive list visibility. Property
      updates and captures must use the same stable group key.'
    workedExample: The web app calls group for type company, key org_8, and properties name = Acme. Acme can later
      rename without changing org_8.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/group-analytics
      title: 'Group Identify & Group Properties: creating groups and properties'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: Setting a supported descriptive group property is required for the documented People and groups list
        visibility. Event attribution alone does not prove descriptive list visibility. Property updates and captures
        must use the same stable group key.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: The web app calls group for type company, key org_8, and properties name = Acme. Acme can later rename
        without changing org_8.
    problems:
    - question: Which value is the better key for a company whose display name can change?
      options:
      - Subscription tier shared by companies.
      - First employee's email.
      - Stable internal company ID.
      - Mutable non-unique display name.
      correct: 2
      explanation: A group key carries identity. Mutable or repeated labels belong in descriptive properties.
      id: 4fe1bea2-fd99-48a7-ba14-650bbe98cf6d
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: Company org_8 changes its name from Acme to Acme Labs. Which update preserves its group identity?
      options:
      - Create a new name-based key without migration.
      - Change all member user IDs.
      - Use company name as project token.
      - Update org8 name; retain key.
      correct: 3
      explanation: Keep the stable key and update the description. Changing identity for a rename can split the
        company's history.
      id: 847314e4-1d15-4152-8c24-d537bc30ee5c
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: The application uses org8 for captures but Acme for groupIdentify. After rename, the list has
        two group keys. What should the contract unify?
      options:
      - One stable key across updates/captures.
      - Rename the display label only.
      - Create a key from each mutable company name.
      - Use the latest property update for every group.
      correct: 0
      explanation: Identity and display name are different. Property updates must target the same key as attributed
        events.
      type: scenario
      difficulty: 4
      id: d2ec05af-a861-4ce6-83b0-dcf61fbe884c
      purpose: practice
      isTransfer: true
    - question: Company17 has attributed events but no descriptive properties. The team expects it in People and
        groups. Which supported action should be tested?
      options:
      - Rename people to the group key.
      - Set a supported property on company17.
      - Change session ID to the group key.
      - Use the group key as the project token.
      correct: 1
      explanation: The documented group-list visibility needs a set property. A type/key on events and descriptive
        group state are different observations.
      type: scenario
      difficulty: 4
      id: posthog-data-model-group-identify-creating-groups-and-properties-exam-1
      purpose: exam
      isTransfer: true
    - question: A billing sync changes org8 tier from free to paid. Product events must keep org8 attribution.
        Which validation fits?
      options:
      - New group key for each plan value.
      - New actor IDs for every employee on upgrade.
      - org8 property update and org8 captures.
      - New group type for each tier.
      correct: 2
      explanation: Mutable state must not create new group identity. Verify both property state and event context.
      type: scenario
      difficulty: 4
      id: posthog-data-model-group-identify-creating-groups-and-properties-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: group-types
  - id: backend-group-identify-pattern
    instruction: '**Backend group updates** and event attribution are separate operations. A group-identify call
      updates the group. A backend capture should explicitly supply the group context for that event through the
      SDK''s supported argument.


      A long-lived backend client serves many accounts. Do not assume it retains the correct active group from
      a previous request.


      Application boundary: A backend must pass the required capture context. Group state update is not a request-wide
      default for all later actors.'
    workedExample: 'A worker updates company org_8''s plan with groupIdentify. When it captures invoice_paid,
      it also passes company: org_8 in that event''s groups argument.'
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/group-analytics
      title: 'Group Identify & Group Properties: backend group identify pattern'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: A backend must pass the required capture context. Group state update is not a request-wide default
        for all later actors.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: 'A worker updates company org_8''s plan with groupIdentify. When it captures invoice_paid, it also
        passes company: org_8 in that event''s groups argument.'
    problems:
    - question: What does a backend group-identify call primarily establish?
      options:
      - Merge backend users.
      - Set browser session ID.
      - Set implicit group context for every server request.
      - Specified group properties/state.
      correct: 3
      explanation: Group property writes and capture context serve different purposes. Supply event attribution
        explicitly in backend capture.
      id: 1ad11c9b-cf74-4567-a0b5-107255bf9008
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: A worker sends groupIdentify for org_8, then captures invoice_paid without group context. What
        is missing for reliable group attribution of that event?
      options:
      - Company key in this capture.
      - An invoice-specific group type.
      - A person ID per company employee.
      - The company name in the event name only.
      correct: 0
      explanation: The property update does not establish an implicit per-request company for later backend captures.
        Pass the intended group on the event.
      id: 94d25eca-d4e3-4cd7-a8ef-581a43918243
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: A worker updates org8 name via groupIdentify, then captures invoice_paid for org8 without groups.
        Why can the event lack company attribution?
      options:
      - Last group update implicitly scopes all worker captures.
      - Independent capture lacks group context.
      - Stored group name overrides absent context.
      - Matching user email infers the invoice company.
      correct: 1
      explanation: A backend must pass the required capture context. Group state update is not a request-wide
        default for all later actors.
      type: scenario
      difficulty: 4
      id: 2fcead01-1a9a-4d73-9d27-20d0bf50faba
      purpose: practice
      isTransfer: true
    - question: One worker serves orgA then orgB. Which payload review catches accidental cross-account attribution?
      options:
      - Last group update only.
      - Worker hostname alone.
      - Each capture key versus invoice account.
      - User's current-company property alone.
      correct: 2
      explanation: Backend request-local business context must reach each capture. Last update and worker identity
        are not evidence of event ownership.
      type: scenario
      difficulty: 4
      id: posthog-data-model-group-identify-backend-group-identify-pattern-exam-1
      purpose: exam
      isTransfer: true
    - question: Group properties for org9 update successfully, but captures specify org8. What should be fixed?
      options:
      - Rename org9 without correctingorg8 captures.
      - Create another group type without fixing keys.
      - Reassign profiles but leave event context unchanged.
      - Authoritative mapping across both payload paths.
      correct: 3
      explanation: A correct property update for a different key cannot supply the intended group context. Trace
        the identifiers.
      type: scenario
      difficulty: 4
      id: posthog-data-model-group-identify-backend-group-identify-pattern-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: group-types
