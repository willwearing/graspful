  - concept: identify-call
    weight: 0.5
  - concept: ph-distinct-id
    weight: 0.45
  knowledgePoints:
  - id: how-merging-works
    instruction: '**Identity merging** combines identifiers when a supported transition establishes that they
      represent one person. Equality of email properties is not sufficient. Already identified people and IDs
      previously linked elsewhere can trigger safeguards.


      Inspect the supported identity operation and its result. A request being sent does not prove that the proposed
      merge was accepted.


      Application boundary: Safeguards prevent unsafe conflation. Evidence and repair contract matter before an
      irreversible operation.'
    workedExample: A normal anonymous-to-known transition can connect a device journey. A request to combine two
      established accounts requires careful investigation of identity rules and must not be assumed to succeed.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/identify
      title: 'Person Merging: Linking Identities: how merging works'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: Safeguards prevent unsafe conflation. Evidence and repair contract matter before an irreversible operation.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: A normal anonymous-to-known transition can connect a device journey. A request to combine two established
        accounts requires careful investigation of identity rules and must not be assumed to succeed.
    problems:
    - question: What evidence is stronger than a matching email property for explaining an accepted identity merge?
      options:
      - Same subscription tier.
      - Equal display names.
      - Accepted supported identity link.
      - Equal browser version.
      correct: 2
      explanation: Merge logic uses identity operations and safeguards. Descriptive similarities do not establish
        a valid link.
      id: 9274f87c-05cf-4078-a4c5-83d8e1e6bebd
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: An integration tries to combine two already identified people and sees an ingestion warning. What
        should it check?
      options:
      - Retry the rejected request more frequently.
      - Assume equal names override restrictions.
      - Treat HTTP acceptance as merge proof.
      - Restrictions and actual identities.
      correct: 3
      explanation: An emitted request can be rejected by identity safeguards. Read the warning and reconstruct
        the transition.
      id: 8bdd4abb-35e0-47eb-a5b0-c6ce260c472f
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: Profiles pA and pB are both established identified users. A normal alias attempt produces a merge
        warning. What is the safest next decision?
      options:
      - Identity evidence and restrictions.
      - Repeat the refused operation more often.
      - Use dangerous merge based solely on email.
      - Replace both actors with one shared placeholder.
      correct: 0
      explanation: Safeguards prevent unsafe conflation. Evidence and repair contract matter before an irreversible
        operation.
      type: scenario
      difficulty: 4
      id: 00d47294-527d-46e5-933a-43937ba37c6f
      purpose: practice
      isTransfer: true
    - question: Two profiles have equal email values but different tenant-bound canonical IDs. Which fact establishes
        a supported merge?
      options:
      - Equal email values alone.
      - Accepted legitimate transition under the identity contract.
      - Shared current plan alone.
      - Equal creation dates alone.
      correct: 1
      explanation: Properties are not authoritative identity links. Tenant scope may intentionally represent distinct
        actors.
