      difficulty: 4
      id: posthog-data-model-person-merging-how-merging-works-exam-1
      purpose: exam
      isTransfer: true
    - question: Support sees an emitted identity request and a rejected-operation warning. Which evidence would
        change a claim of successful merging?
      options:
      - HTTP acceptance alone.
      - Emitted identity call alone.
      - Confirmed linkage and expected attribution.
      - Matching profile names alone.
      correct: 2
      explanation: Verify the mutation result separately from transport. A warning can coexist with a successful
        capture response.
      type: scenario
      difficulty: 4
      id: posthog-data-model-person-merging-how-merging-works-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: identify-call
  - id: when-merging-goes-wrong
    instruction: '**Merge recovery** starts by stopping the faulty identity writes and identifying the affected
      IDs and period. PostHog''s Split IDs operation can separate future behavior, but recovery of historical
      events is not guaranteed.


      Keep evidence and verify the actual result. Do not promise a complete historical undo without checking the
      supported recovery path for the specific case.


      Application boundary: Repair results depend on available identity evidence and supported behavior. Do not
      promise restoration that cannot be validated.'
    workedExample: A shared placeholder caused two users' events to connect. Fix capture first, preserve the incident
      details, and validate future identities after the supported repair.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/identify
      title: 'Person Merging: Linking Identities: when merging goes wrong'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: Repair results depend on available identity evidence and supported behavior. Do not promise restoration
        that cannot be validated.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: A shared placeholder caused two users' events to connect. Fix capture first, preserve the incident
        details, and validate future identities after the supported repair.
    problems:
    - question: Which promise is unsafe when proposing Split IDs as an identity repair?
      options:
      - Record affected identifiers.
      - Verify future attribution after repair.
      - Fix the faulty writer first.
      - Guaranteed complete historical restoration.
      correct: 3
      explanation: Historical reconstruction is not guaranteed. Describe the supported behavior and verify the
        result for the affected data.
      id: a7b5e9de-9d6d-439b-b57e-d41fcfcfbaca
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: A shared placeholder is still being sent while a team repairs merged profiles. What should be
        done first?
      options:
      - Fix the faulty writer first.
      - Edit only profile names.
      - Assume one repair blocks future bad writes.
      - Repeat splits while faulty writes continue.
      correct: 0
      explanation: Repair cannot stay effective while the source keeps recreating the problem. Correct and validate
        the capture path first.
      id: 856fdd31-200c-4bfa-aae8-7d2e6566b364
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: Several users were captured with shared ID customer. The writer is fixed. A requested Split IDs
        repair has incomplete historical evidence. Which customer statement is defensible?
      options:
      - Guarantee complete restoration after every split.
      - Tested future separation; historical limits explicit.
      - Infer historical actors from current plan.
      - Replay with guessed actors to manufacture separation.
      correct: 1
      explanation: Repair results depend on available identity evidence and supported behavior. Do not promise
        restoration that cannot be validated.
      type: scenario
      difficulty: 4
      id: 4a3a5c48-b522-4929-893b-e4d43d3b51d0
      purpose: practice
      isTransfer: true
    - question: A merge incident continues after a split because one worker still emits user_unknown. Which remediation
        boundary was missed?
      options:
      - Profile rename only.
      - Repeated split while one writer remains corrupt.
      - Correct every faulty capture source.
      - New unrelated IDs for all legitimate actors.
      correct: 2
      explanation: A repair cannot outlast ongoing corruption. Inventory source systems and validate the exact
        identity payloads.
      type: scenario
      difficulty: 4
      id: posthog-data-model-person-merging-when-merging-goes-wrong-exam-1
      purpose: exam
      isTransfer: true
    - question: An engineer suggests $merge_dangerously to resolve equal-email profiles. What must the TAM establish
        before escalation?
      options:
      - Email equality and a refused alias are sufficient.
      - Smaller history size is sufficient same-actor proof.
      - Use dangerous merge before scoping affected identities.
      - Same-actor evidence and documented risk/escalation.
      correct: 3
      explanation: The dangerous operation removes safeguards and is not a general workaround for ambiguity. Use
        a documented escalation and verify scope.
      type: scenario
      difficulty: 4
      id: posthog-data-model-person-merging-when-merging-goes-wrong-exam-2
      purpose: exam
      isTransfer: true
