course:
  id: data-pipelines
  name: Data Pipelines
  description: 'Generic pipeline concepts: ingestion patterns, storage layers, transformation, orchestration, serving,
    and operational tradeoffs.'
  estimatedHours: 2
  version: '2026.2'
  sourceDocument: PostHog official documentation and supplied architecture models; content reviewed 2026-09-21
sections:
- id: pipeline-basics
  name: Pipeline Basics
  description: What data pipelines are, where data comes from, and where it's stored.
- id: pipeline-architecture
  name: Pipeline Architecture
  description: Transformation patterns, orchestration, and the tradeoffs that shape pipeline design.
concepts:
- id: what-is-a-pipeline
  name: What Is a Data Pipeline?
  difficulty: 2
  estimatedMinutes: 14
  tags:
  - foundational
  - pipelines
  section: pipeline-basics
  prerequisites: []
  encompassing: []
  knowledgePoints:
  - id: pipeline-definition-and-flow
    instruction: 'A **data pipeline** moves data through connected processing steps. Those steps can ingest, store,
      transform, and serve data. Their order depends on the design. In ELT, data is loaded before transformation;
      ETL transforms before loading into the target.


      Name each boundary and the expected output. This makes a flow testable instead of treating the whole system
      as one black box.'
    workedExample: A nightly reporting flow copies orders into raw storage, converts currencies, and publishes a
      sales table. The raw copy lets the team rerun the conversion without reading the source again.
    instructionContent:
    - type: callout
      title: Practice method
      body: State the requirement, trace the supplied evidence, and check whether your answer meets every stated
        constraint.
    workedExampleContent: []
    problems:
    - question: Which description identifies a data pipeline?
      options:
      - Connected steps that move and process data from a source toward a use.
      - A dashboard that only displays an already prepared metric.
      - A rule requiring every system to transform before any storage.
      - A static collection of source records with no defined movement or processing.
      correct: 0
      explanation: A pipeline is the connected flow. ETL and ELT are possible designs rather than universal step
        orders.
      id: 3d3e3cba-abc0-4925-a820-399d4eb31f95
      type: multiple_choice
      difficulty: 2
    - question: An ELT pipeline copies source records into its target before transforming them there. Put its three
        main stages in order.
      options:
      - Transform in the target
      - Extract from the source
      - Load into the target
      correct:
      - Extract from the source
      - Load into the target
      - Transform in the target
      explanation: 'Follow the observed steps: the raw records are loaded before transformation. That is ELT.'
      type: ordering
      id: e5533990-da1c-4139-a929-6f82e8131a83
      difficulty: 3
    - question: A customer asks where to add a currency conversion so reports use one reporting currency while source
        values remain recoverable. Which design meets both requirements?
      options:
      - Use the first currency found as the unit for every row.
      - Convert values after the report has already summed mixed currencies.
      - Overwrite the only source values and discard the conversion rate.
      - Preserve source values and add a documented conversion step before serving the report.
      correct: 3
      explanation: Preserve the original evidence and transform at a defined boundary. Mixed-currency sums and undocumented
        overwrites cannot satisfy both requirements.
      id: fdd1f0ea-9987-4583-806a-54d90ecd2715
      type: scenario
      difficulty: 4
  - id: pipeline-failure-points
    instruction: '**Boundary checks** compare what entered and left each stage. Inspect counts, required fields,
      identifiers, timestamps, and error records. Data can arrive but still be wrong, incomplete, duplicated, or
      late.


      Investigate the earliest boundary where evidence diverges from expectations. An accepted request proves less
      than a correctly queryable output.'
    workedExample: The source has 1,000 records, the raw store has 1,000, and the transformed table has 870. Check
      transform rejections and filters before changing the source connector.
    instructionContent:
    - type: callout
      title: Practice method
      body: State the requirement, trace the supplied evidence, and check whether your answer meets every stated
        constraint.
    workedExampleContent: []
    problems:
    - question: A pipeline reports that all requests were accepted. What still needs validation?
      options:
      - Only whether the capture endpoint returned a success status.
      - Whether the expected records and values reached the final output correctly.
      - Only whether the destination connection can be opened.
      - Nothing, because acceptance proves every downstream stage succeeded.
      correct: 1
      explanation: Acceptance is one boundary signal. Validate completeness, values, and downstream visibility separately.
      id: e3022e6d-da88-4ce9-b425-464931471f9b
      type: multiple_choice
      difficulty: 2
    - question: Source count is 2,000, landing count is 2,000, and transformed count is 1,650. The serving layer
        shows those same 1,650 rows. Where does the first measured loss occur?
      options:
      - At every stage equally.
      - Between transformed output and serving.
      - Between landing and transformed output.
      - Before the source produced records.
      correct: 2
      explanation: Compare adjacent boundaries. The first change is in transformation, so start with its filters,
        errors, and input handling.
      id: 4bd5b494-d406-40ac-8779-bf6e7500f1ce
      type: scenario
      difficulty: 3
    - question: Counts match end to end, but revenue doubled after a retry. Which evidence should you inspect next?
      options:
      - Record identities, retry behavior, and whether repeated records contribute twice to revenue.
      - Only the report's date range, without checking repeated record identities.
      - Only total row counts, because equal counts rule out duplicated effects.
      - Only the connector success status, because a retry cannot change totals.
      correct: 0
      explanation: Equal counts do not prove correct values or deduplication. Trace stable record identities and
        the effect of retries on aggregation.
      id: 54caff01-0cf4-4020-90dd-8be2c6313096
      type: scenario
      difficulty: 4
- id: sources-and-ingestion
  name: Sources & Ingestion Patterns
  difficulty: 3
  estimatedMinutes: 15
  tags:
  - foundational
  - pipelines
  section: pipeline-basics
  prerequisites:
  - what-is-a-pipeline
  encompassing: []
  knowledgePoints:
  - id: where-data-comes-from
    instruction: '**Source contracts** define the shape, ownership, and meaning of incoming data. Application events
      describe actions, operational databases store changing records, and third-party APIs expose another system''s
      data. Each needs an access and change strategy.


      Check identifiers, timestamps, pagination, deletion signals, and schema changes. A successful connection alone
      does not establish a complete extract.'
    workedExample: An API returns at most 100 invoices per page. The importer follows every next-page token and
      records a stable invoice ID so repeated fetches can be reconciled.
    instructionContent:
    - type: callout
      title: Practice method
      body: State the requirement, trace the supplied evidence, and check whether your answer meets every stated
        constraint.
    workedExampleContent: []
    problems:
    - question: Which source contract detail determines whether an API extract must make more requests after its
        first response?
      options:
      - Its schema's numeric field units.
      - Its pagination rules.
      - Its authentication token's expiry time.
      - Its policy for deleting source records.
      correct: 1
      explanation: Pagination determines how to retrieve the complete result. A successful first response may contain
        only one page.
      id: bedbc2c5-8757-4150-96fa-d70e2d1e2139
      type: multiple_choice
      difficulty: 2
    - question: A billing API says there are 240 invoices and returns pages of 100, 100, and 40. The importer stops
        after the first page. What is missing? Enter the number only.
      options: []
      correct: '140'
      explanation: The first page contains 100 of 240 records. Follow all pages and reconcile the extracted count.
      type: fill_blank
      id: b0bc1936-23ec-4c90-8f2a-790afc0b662a
      difficulty: 3
    - question: An API removes deleted customers from ordinary list responses. A nightly incremental importer only
        requests recently updated rows. What must the team clarify to keep the destination accurate?
      options:
      - Whether changing the primary-key column name will expose deleted rows.
      - Whether the target can retain removed customers as active forever.
      - How deletions are signaled or detected, and how the importer applies them.
      - Whether a larger page size can substitute for deletion tracking.
      correct: 2
      explanation: Updates and deletions are separate contract concerns. Without deletion evidence or reconciliation,
        stale destination rows can survive indefinitely.
      id: 31ec533e-6f50-4cf0-879b-1b56c5b33416
      type: scenario
      difficulty: 4
  - id: ingestion-approaches
    instruction: '**Ingestion** brings source data into the pipeline. Batch ingestion handles bounded sets on a
      schedule. Streaming processes a continuing flow. Change data capture, or CDC, tracks database changes; it
      can use logs, triggers, or other methods.


      Log-based CDC reads supported change logs. Compare freshness needs, source load, available change history,
      and recovery behavior when choosing an approach.'
    workedExample: A dashboard with a 24-hour freshness target can use a nightly batch. A fraud alert with a seconds-level
      target needs a lower-latency path and monitoring that matches that target.
    instructionContent:
    - type: link
      url: https://aws.amazon.com/what-is/change-data-capture/
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: What specifically distinguishes log-based CDC from other CDC approaches?
      options:
      - It requires a full-table export for every change.
      - It stores only final report images.
      - It means every possible CDC implementation uses logs.
      - It reads database change logs to observe changes.
      correct: 3
      explanation: The qualifier log-based names the mechanism. CDC also includes other ways to detect changes.
      id: ed5bc6b9-a5da-4d09-9caf-88c85c530bbd
      type: multiple_choice
      difficulty: 2
    - question: A daily finance report is due at 08:00 and may use data through midnight. A reliable 02:00 batch
        finishes in 30 minutes. Does the stated freshness need require streaming?
      options:
      - No. Therefore failures and completeness never need monitoring.
      - Yes. Batch data cannot contain timestamps.
      - Yes. Every report requires second-level updates.
      - No. The batch meets the stated schedule if it completes and is validated.
      correct: 3
      explanation: Select the approach from the actual freshness requirement. This batch fits, while still requiring
        operational checks.
      id: 6849db42-db7d-4f0d-9c3b-dadcbaa37639
      type: scenario
      difficulty: 3
    - question: A log-based CDC consumer was offline longer than the source retains change logs. Its last position
        is no longer available. What is the sound recovery plan?
      options:
      - Skip to the latest position and claim that no changes were lost.
      - Replay an arbitrary earlier timestamp without checking source availability.
      - Use a supported resnapshot or reconciliation procedure, then resume changes from a consistent position.
      - Continue serving the old data as current indefinitely.
      correct: 2
      explanation: A missing log interval breaks continuity. Recover a consistent baseline and verify it before
        claiming completeness.
      id: b0c06325-c0de-491e-94a5-e8351acf7488
      type: scenario
      difficulty: 4
- id: storage-layers
  name: 'Storage Layers: Where Data Lives'
  difficulty: 3
  estimatedMinutes: 16
  tags:
  - foundational
  - pipelines
  section: pipeline-basics
  prerequisites:
  - sources-and-ingestion
  encompassing: []
  knowledgePoints:
  - id: raw-lake-warehouse
    instruction: '**Raw storage** retains data close to its received form. A **data lake** commonly stores varied
      files for flexible later use. A **warehouse** provides queryable data for analysis and can contain both raw
      and curated tables. These roles can overlap.


      A curated dataset applies agreed types, definitions, and quality rules. Storage technology alone does not
      prove that curation happened.'
    workedExample: A warehouse has raw_orders and daily_revenue tables. The first preserves source rows; the second
      applies the finance team's revenue definition. Both are warehouse tables with different roles.
    instructionContent:
    - type: callout
      title: Practice method
      body: State the requirement, trace the supplied evidence, and check whether your answer meets every stated
        constraint.
    workedExampleContent: []
    problems:
    - question: What makes a dataset curated for a business metric?
      options:
      - A table name ending in final or certified.
      - The fact that the data is stored in a warehouse.
      - A successful copy job with no documented metric rules.
      - Agreed definitions and transformations with suitable quality checks.
      correct: 3
      explanation: Curation is a process with explicit rules. A storage label or filename does not establish trustworthy
        meaning.
      id: c1e19fee-f292-4201-a8fa-f3a60cda4002
      type: multiple_choice
      difficulty: 2
    - question: A warehouse contains untouched source JSON in one table and validated daily sales in another. How
        should these tables be classified?
      options:
      - Raw and curated layers within the same warehouse.
      - Neither can be used in a pipeline.
      - Both must be raw because they share a database.
      - Both must be curated because warehouses cannot hold raw data.
      correct: 0
      explanation: Classify the role from the data and processing, not from the product category of the storage
        system.
      id: b368d62f-c3a5-4c2f-b871-2c4198d4b87e
      type: scenario
      difficulty: 3
    - question: Two reports use different revenue definitions from the same warehouse. The team proposes moving
        all data to a lake to make the numbers agree. What should be addressed first?
      options:
      - Select whichever report shows the higher revenue without reconciling it.
      - Align the metric definitions and transformations, then validate both report paths.
      - Rename both tables daily_revenue while keeping their different calculations.
      - Move the same conflicting calculations to a new storage format.
      correct: 1
      explanation: The disagreement concerns meaning. Resolve the calculation rules before making an infrastructure
        change that may leave the conflict intact.
      id: 56a2ddc8-5053-4405-8758-6db596df7dd7
      type: scenario
      difficulty: 4
  - id: choosing-storage-layers
    instruction: '**Storage-layer selection** balances recovery, query speed, cost, and access. Retaining raw inputs
      can support replay when logic changes. Curated outputs make routine queries easier and more consistent.


      Retention and access need explicit rules. Keeping every payload forever is a separate decision from choosing
      ETL, ELT, a lake, or a warehouse.'
    workedExample: A team retains restricted raw records for 30 days and keeps validated daily totals for two years.
      It can repair recent transformations while meeting its chosen retention policy.
    instructionContent:
    - type: callout
      title: Practice method
      body: State the requirement, trace the supplied evidence, and check whether your answer meets every stated
        constraint.
    workedExampleContent: []
    problems:
    - question: Which need most directly supports retaining replayable raw inputs?
      options:
      - Making all source data public.
      - Guaranteeing that raw data is already a certified business metric.
      - Recomputing outputs after a transformation bug is fixed.
      - Avoiding any retention decisions.
      correct: 2
      explanation: Raw inputs preserve evidence for replay. They still need access controls, retention rules, and
        interpretation.
      id: 631d5b76-7935-4c5c-bcaa-7d0b396fcf2f
      type: multiple_choice
      difficulty: 2
    - question: A calculation bug affected the last week. The pipeline retains raw inputs for 30 days and records
        transform versions. What recovery option does this enable?
      options:
      - Recover the correct values merely by renaming the output table.
      - Reprocess the affected inputs with the corrected transform and compare results.
      - Recover years of discarded inputs without another source.
      - Assume the existing totals are correct because raw data exists.
      correct: 1
      explanation: The retained inputs cover the affected week. Use them with the corrected logic and verify the
        replacement output.
      id: 603320fd-0831-48ac-a029-1a18a44f2eb8
      type: scenario
      difficulty: 3
    - question: A team needs daily aggregate reports for two years but only 14 days of detailed replay. Raw payloads
        include sensitive fields. Which design best fits those stated needs?
      options:
      - Keep every raw field forever because replay is sometimes useful.
      - Give every report viewer access to all detailed payloads.
      - Delete all raw data immediately and promise 14-day replay.
      - Apply restricted access and 14-day raw retention, with longer retention for the required aggregates.
      correct: 3
      explanation: Match retention and access to the separate use cases. Aggregated reporting does not require unlimited
        detailed retention.
      id: 50544765-b050-4add-95ef-256952b14bbd
      type: scenario
      difficulty: 4
- id: transformation-etl-elt
  name: 'Transformation: ETL vs ELT'
  difficulty: 4
  estimatedMinutes: 15
  tags:
  - foundational
  - pipelines
  section: pipeline-architecture
  prerequisites:
  - storage-layers
  encompassing: []
  knowledgePoints:
  - id: what-transformation-does
    instruction: '**Transformation** changes data into a form or meaning required downstream. Examples include type
      conversion, normalization, enrichment, deduplication, and aggregation. Each rule should define how invalid
      and missing inputs are handled.


      Preserve enough evidence to explain output values. Quietly coercing a bad input to zero can corrupt an aggregate
      while making the job appear successful.'
    workedExample: A transform converts amount_cents = 1250 to amount_dollars = 12.50. If amount_cents contains
      "unknown", the row is rejected or quarantined under an explicit rule rather than counted as a zero-value sale.
    instructionContent:
    - type: callout
      title: Practice method
      body: State the requirement, trace the supplied evidence, and check whether your answer meets every stated
        constraint.
    workedExampleContent: []
    problems:
    - question: Which operation changes data meaning or structure as a transformation step?
      options:
      - Granting an analyst access to a report.
      - Retrying a failed network connection.
      - Converting a documented cents field to dollars.
      - Copying identical bytes without changing their representation.
      correct: 2
      explanation: The unit conversion changes the represented value using a defined rule. Transfer, retries, and
        access are different concerns.
      id: c07d8165-5940-46af-8f34-847b33b71518
      type: multiple_choice
      difficulty: 2
    - question: A source stores 2,450 cents. The target requires dollars with two decimal places. What value should
        a correct conversion produce? Enter the number only.
      options: []
      correct:
        answer: '24.50'
        alternatives:
        - '24.5'
      explanation: Divide cents by 100. Check the unit contract before performing or validating an aggregation.
      type: fill_blank
      id: a7757a8a-5d47-42d4-9e74-7abc4ab48ab8
      difficulty: 3
    - question: A transform converts malformed amounts to zero, and its success count stays high while reported
        revenue falls. Which change best makes this failure visible?
      options:
      - Keep the zeros and suppress the revenue alert.
      - Treat the job success count as proof of correct revenue.
      - Multiply every result by an arbitrary adjustment factor.
      - Separate invalid rows with reasons, alert on their rate, and fix the source or mapping before replay.
      correct: 3
      explanation: Silent coercion hides rejected meaning. Track invalid inputs explicitly and repair the relevant
        rule using evidence.
      id: 344cb015-f1f8-4cc3-b22a-ef15f56cf736
      type: scenario
      difficulty: 4
  - id: etl-vs-elt
    instruction: '**ETL** transforms data before loading it into the target. **ELT** loads data into the target
      before transforming it there. The relevant target must be named when describing a flow.


      The acronym does not decide whether raw inputs are retained elsewhere. Choose the transformation boundary
      from sensitivity, compute, target constraints, and replay requirements.'
    workedExample: A pipeline removes unnecessary personal fields before loading the analytics warehouse. It can
      still retain an approved, restricted source archive under a separate policy. ETL does not imply that every
      raw copy is discarded.
    instructionContent:
    - type: link
      url: https://aws.amazon.com/what-is/etl/
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: What determines whether a flow is ETL or ELT relative to a named target?
      options:
      - Whether transformation occurs before or after loading into that target.
      - Whether the team uses a dashboard.
      - Whether every raw copy is deleted.
      - Whether the data originates from an API.
      correct: 0
      explanation: The order relative to the target is the defining distinction. Retention and source type are separate
        choices.
      id: 60178634-df60-4a26-90a7-9d673caa3793
      type: multiple_choice
      difficulty: 2
    - question: A warehouse must receive only cleaned data. Put these ETL stages in order. A separate source archive
        does not change the warehouse step order.
      options:
      - Load cleaned data into the warehouse
      - Extract source records
      - Transform the extracted records
      correct:
      - Extract source records
      - Transform the extracted records
      - Load cleaned data into the warehouse
      explanation: The warehouse receives transformed data, so this path is ETL. The archive does not change that
        step order.
      type: ordering
      id: fcf52f7f-d54f-415d-9348-4bc9986e2273
      difficulty: 3
    - question: A warehouse must never receive payment card fields, and the extraction payload includes them. Which
        design meets that boundary requirement?
      options:
      - Remove those fields in a controlled step before loading into the warehouse, and verify the output schema.
      - Rename the fields after analysts have access.
      - Load everything first and promise to hide the fields in dashboards.
      - Treat the ELT label as permission to ignore the target restriction.
      correct: 0
      explanation: The requirement applies at entry to the warehouse. Enforce and validate the transformation before
        that boundary.
      id: a9bb08fa-77a0-473f-8390-99b3fec8b07e
      type: scenario
      difficulty: 4
- id: orchestration-and-serving
  name: Orchestration & Serving Data
  difficulty: 3
  estimatedMinutes: 10
  tags:
  - foundational
  - pipelines
  section: pipeline-architecture
  prerequisites:
  - transformation-etl-elt
  encompassing: []
  knowledgePoints:
  - id: workflow-orchestration
    instruction: '**Orchestration** schedules work and enforces dependencies. A directed acyclic graph, or DAG,
      has directed edges and no dependency cycle. A task can run after its required predecessors succeed; independent
      branches can run in parallel.


      Retries, timeouts, and failure states belong in the workflow. A schedule alone does not guarantee that required
      input is ready.'
    workedExample: Extract feeds both Validate and Archive. Publish depends on Validate. Archive can run alongside
      Validate after Extract succeeds; Publish must wait for Validate.
    instructionContent:
    - type: callout
      title: Practice method
      body: State the requirement, trace the supplied evidence, and check whether your answer meets every stated
        constraint.
    workedExampleContent: []
    problems:
    - question: What makes a dependency graph acyclic?
      options:
      - Following directed dependency edges cannot lead back to the starting task.
      - Every task has exactly one predecessor.
      - Every task has the same execution time.
      - Every task runs at the same time.
      correct: 0
      explanation: A cycle would make tasks depend on a chain that returns to themselves. DAGs can still have branches
        and multiple predecessors.
      id: d6f4a1fc-ef12-4128-b6ed-41b4fd35fe25
      type: multiple_choice
      difficulty: 2
    - question: Extract must finish before Validate and Archive. Publish requires Validate. Extract has succeeded
        and the other tasks have not started. Which tasks are now eligible?
      options:
      - Validate and Archive.
      - Publish only.
      - Extract and Publish.
      - All tasks regardless of dependencies.
      correct: 0
      explanation: Both immediate dependents are ready. Publish still lacks its required Validate result.
      id: eec11405-a85e-41a6-bc71-194dc0990adb
      type: scenario
      difficulty: 3
    - question: A report is scheduled for 03:00, but its upstream import sometimes finishes at 03:20. The report
        occasionally uses yesterday's data. What should orchestration enforce?
      options:
      - Start the report earlier to avoid the slow import.
      - Retry the report continuously without checking which input it uses.
      - Run publication after a successful import and freshness check, with a defined late-data response.
      - Keep the fixed time and label all outputs current.
      correct: 2
      explanation: Use dependency and freshness evidence. A clock time alone cannot prove that the needed data is
        ready.
      id: 5713b0d0-5431-40a0-8e2f-1f0369eadcf0
      type: scenario
      difficulty: 4
  - id: serving-data
    instruction: '**Serving** exposes data in the form consumers need, such as a dashboard table, an API response,
      or a destination export. Define the contract: fields, meaning, freshness, access, and availability.


      A served dataset can be technically reachable yet unsuitable because it is stale or at the wrong level of
      detail. Validate the consumer''s actual use case.'
    workedExample: An executive report needs one row per account per day. A raw click stream has a different grain,
      so a serving table computes the agreed daily account measures.
    instructionContent:
    - type: callout
      title: Practice method
      body: State the requirement, trace the supplied evidence, and check whether your answer meets every stated
        constraint.
    workedExampleContent: []
    problems:
    - question: Which concern belongs in a serving contract?
      options:
      - A requirement to send every raw field to every consumer.
      - The output's meaning, grain, and freshness expected by its consumer.
      - Only the source connector's internal batch size.
      - Only the table's physical file format, without its business meaning.
      correct: 1
      explanation: A useful serving contract describes what the consumer receives and when it is valid for use.
      id: 47215b42-b350-427d-8533-5d34b3f6bc95
      type: multiple_choice
      difficulty: 2
    - question: A dashboard expects one row per account per day, but an export emits one row per click. What mismatch
        must be resolved?
      options:
      - The grain of the served data.
      - The choice of account display name.
      - The source event retention window alone.
      - The destination's network retry interval.
      correct: 0
      explanation: Grain means what one row represents. Aggregate or redesign the consumer deliberately so counts
        are interpreted correctly.
      id: 74174276-bb6b-41a5-97f3-6c97264ba710
      type: scenario
      difficulty: 3
    - question: An API responds in 100 milliseconds but returns data last refreshed three days ago. The contract
        requires a one-hour maximum age. What does this evidence establish?
      options:
      - The source data must be incorrect because the API is reachable.
      - Response latency passes, but freshness fails and needs its own check and recovery.
      - The contract passes because the API is fast.
      - The only useful fix is a faster web server.
      correct: 1
      explanation: Availability, response latency, and data freshness are separate dimensions. Measure and repair
        the dimension that failed.
      id: 1721622a-5745-41c6-ad89-91236597e648
      type: scenario
      difficulty: 4
- id: pipeline-tradeoffs
  name: 'Pipeline Tradeoffs: Latency, Cost, Complexity'
  difficulty: 4
  estimatedMinutes: 15
  tags:
  - foundational
  - pipelines
  section: pipeline-architecture
  prerequisites:
  - orchestration-and-serving
  encompassing: []
  knowledgePoints:
  - id: three-tensions
    instruction: 'Pipeline design balances **freshness, cost, and operational complexity**. A shorter refresh interval
      can increase compute, source load, and monitoring needs. More recovery guarantees can require extra state
      and storage.


      Use measurable requirements and expected volume. Choose the least complex design that meets the actual need,
      then measure its behavior under load and failure.'
    workedExample: A daily staffing report needs yesterday's totals by 07:00. A tested nightly batch can satisfy
      this need with less operational work than a continuously running stream.
    instructionContent:
    - type: callout
      title: Practice method
      body: State the requirement, trace the supplied evidence, and check whether your answer meets every stated
        constraint.
    workedExampleContent: []
    problems:
    - question: Which information should anchor a choice between a nightly batch and a continuous stream?
      options:
      - Which design has the shortest polling interval, regardless of need.
      - Required data age, expected volume, recovery needs, and operating cost.
      - Which option retains the most data, regardless of cost or purpose.
      - Which option has the lowest bill, even if it misses the required deadline.
      correct: 1
      explanation: Compare the designs against measurable needs and constraints. A technology label alone does not
        establish suitability.
      id: 8050c316-f285-4a2a-b6ad-b82c25f46aa3
      type: multiple_choice
      difficulty: 2
    - question: A fraud decision must use events within five seconds. A nightly batch costs less but makes data
        available the next morning. Which tradeoff matters most here?
      options:
      - Both have equal freshness because both eventually process events.
      - The batch misses the required freshness target despite its lower cost.
      - The lower cost proves the batch meets every requirement.
      - The report format decides whether five seconds is achievable.
      correct: 1
      explanation: A mandatory latency target constrains the design. Compare cost only among designs that can meet
        the required behavior.
      id: fc717f23-b185-48b3-badf-31ef03f97d9a
      type: scenario
      difficulty: 3
    - question: A team proposes subsecond updates for a monthly board report. The source has strict request limits,
        and no consumer needs intraday updates. Which recommendation fits the evidence?
      options:
      - Drop validation to compensate for the extra request volume.
      - Stop monitoring because the report is infrequent.
      - Use a scheduled, validated extract aligned with the report deadline and leave room for retries.
      - Adopt subsecond polling regardless of source limits.
      correct: 2
      explanation: The consumer gains no stated benefit from subsecond freshness. A scheduled design can meet the
        deadline with lower load and enough recovery time.
      id: 970b6681-ab2e-422b-95c4-b219aac38df2
      type: scenario
      difficulty: 4
  - id: operational-safety
    instruction: '**Idempotency** means repeating an operation has the same intended effect as doing it once. Stable
      source IDs and explicit update rules can make retries safe. A checkpoint records progress, but its relationship
      to committed output matters.


      Define how to handle partial failure, late records, and replay. Test those paths instead of relying only on
      a successful first run.'
    workedExample: An import upserts by source invoice ID. If the connection fails after some rows commit, retrying
      the batch updates those same records rather than adding duplicate invoices.
    instructionContent:
    - type: callout
      title: Practice method
      body: State the requirement, trace the supplied evidence, and check whether your answer meets every stated
        constraint.
    workedExampleContent: []
    problems:
    - question: What does an idempotent import allow you to do safely?
      options:
      - Guarantee that the source never changes.
      - Skip all validation forever.
      - Discard record identities after every batch.
      - Repeat the same import without creating an extra intended record for each retry.
      correct: 3
      explanation: Idempotency controls the effect of repetition. It does not remove the need for validation or
        change handling.
      id: 5c13e942-ce1c-4664-a9e5-6900876b6c04
      type: multiple_choice
      difficulty: 2
    - question: A batch of 100 invoices commits 60 rows and then fails. It retries all 100 using an upsert keyed
        by stable invoice ID. With unchanged input, how many invoice records should exist after success? Enter the
        number only.
      options: []
      correct: '100'
      explanation: The retry updates the first 60 and inserts the remaining 40. Stable-key upserts prevent duplicate
        business records.
      type: fill_blank
      id: b1558d5d-7e5a-44ce-b6d9-672320a83610
      difficulty: 3
    - question: A job advances its checkpoint before writing output. It crashes after the checkpoint but before
        the write. What failure must the design prevent?
      options:
      - Skipping unwritten records on restart by coordinating durable output and checkpoint progress.
      - Treating the advanced checkpoint as proof that output exists.
      - Reordering dashboard columns after restart.
      - Giving every retry a new source record ID.
      correct: 0
      explanation: The checkpoint claims work is complete before it is durable. Coordinate commits or use a recovery
        protocol that can safely replay the uncertain interval.
      id: 0b91e70b-ebd4-48d7-835b-e9e3eb67d7ff
      type: scenario
      difficulty: 4
