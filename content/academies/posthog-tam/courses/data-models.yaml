course:
  id: data-models
  name: Data Models
  description: 'Generic data modeling concepts: entities, attributes, keys, relationships, cardinality, join tables,
    and the design process.'
  estimatedHours: 2
  version: '2026.2'
  sourceDocument: PostHog official documentation and supplied architecture models; content reviewed 2026-09-21
sections:
- id: data-modeling-basics
  name: Data Modeling Basics
  description: 'Entities, attributes, and keys: the building blocks of any data model.'
  sectionExam:
    enabled: true
    blueprint:
    - conceptId: entities
      minQuestions: 2
    - conceptId: attributes
      minQuestions: 2
    - conceptId: keys-and-identity
      minQuestions: 2
    instructions: Work without step-by-step cues. Show that you can distinguish entities, attributes, and keys,
      then apply those ideas to realistic PostHog-flavored examples.
    passingScore: 0.75
    questionCount: 6
    timeLimitMinutes: 12
- id: data-modeling-design
  name: Data Modeling Design
  description: Relationships, cardinality, join tables, and the design process.
concepts:
- id: entities
  name: 'Entities: Things That Exist'
  difficulty: 2
  estimatedMinutes: 10
  tags:
  - foundational
  - data-modeling
  section: data-modeling-basics
  prerequisites: []
  encompassing: []
  knowledgePoints:
  - id: what-is-an-entity
    instruction: '**An entity** is a kind of thing whose individual instances the system must track. A customer
      and an order can each have an identity and several facts. A name or a price is usually an attribute of such
      a thing.


      Start with nouns, then check the requirements. An action can also become an entity when you must track each
      occurrence, such as an appointment or a payment.'
    workedExample: A clinic records each appointment, its time, patient, and outcome. Appointment is an entity because
      two appointments can involve the same patient and still need separate records.
    instructionContent:
    - type: callout
      title: Practice method
      body: State the requirement, trace the supplied evidence, and check whether your answer meets every stated
        constraint.
    workedExampleContent: []
    problems:
    - question: Which requirement most strongly supports treating something as an entity?
      options:
      - The word appears as a noun in a sentence.
      - The value can be stored as text.
      - The value appears on a report.
      - The system must distinguish individual instances and store facts about each.
      correct: 3
      explanation: Look for a need to identify and track separate instances. A noun alone does not establish that
        need.
      id: c2731731-5fd5-4374-b333-fa0fb819ede1
      type: multiple_choice
      difficulty: 2
    - question: A delivery app tracks each delivery attempt, including its time and outcome. One parcel can have
        several attempts. What should the model include?
      options:
      - Only an outcome label on the customer.
      - A DeliveryAttempt entity with one instance per attempt.
      - One latest-attempt field on Parcel, with earlier attempts overwritten.
      - One shared attempt record for all parcels.
      correct: 1
      explanation: Each attempt has its own identity and facts. Overwriting one field would lose the required history.
      id: 533eb212-1ff3-4907-b1ae-05ea43da8480
      type: scenario
      difficulty: 3
    - question: A team rejects Payment as an entity because paying is an action. The system must refund individual
        payments and retain their dates and amounts. What is the best review feedback?
      options:
      - Keep only the latest paid amount on Customer.
      - Create one Payment record per customer regardless of the number of payments.
      - Model individual payments because the requirements give each occurrence a separate identity.
      - Use the verb rule and remove Payment from the model.
      correct: 2
      explanation: The tracking requirement decides the model. A grammar shortcut must not remove separately refundable
        payment records.
      id: d528e8c6-0101-4a73-9656-f7d45d5d44d9
      type: scenario
      difficulty: 4
  - id: identifying-entities
    instruction: '**Entity discovery** starts with the system boundary. List the things that the application must
      manage, then test whether each needs its own records. Similar names can describe the same thing, while similar-looking
      objects can have different lifecycles.


      Ask stakeholders about ambiguous cases before you add or combine entities. A model should support the stated
      use cases without inventing extra ones.'
    workedExample: A library tracks a book title and each physical copy. Two copies share a title but have different
      barcodes and loan histories, so BookTitle and BookCopy serve different needs.
    instructionContent:
    - type: callout
      title: Practice method
      body: State the requirement, trace the supplied evidence, and check whether your answer meets every stated
        constraint.
    workedExampleContent: []
    problems:
    - question: Requirements use both Account and Customer, but their meaning is unclear. Which question helps decide
        whether they should be separate entity types?
      options:
      - Can their instances exist independently, and do they have different identity or lifecycle rules?
      - Do the two words appear on different screens, regardless of their meaning?
      - Can their fields fit in one table, regardless of the business rules?
      - Does one label appear more often in the requirements, regardless of its meaning?
      correct: 0
      explanation: Clarify independent identity and lifecycle. Different labels can describe one entity, and similar
        fields can describe separate entities.
      id: 50094d2a-038d-4ce6-a0a0-bc8af5c18b9a
      type: multiple_choice
      difficulty: 2
    - question: A hiring system manages applicants and interviews. It only displays the employer name, and it manages
        no employer records. Which initial entity set fits the stated scope?
      options:
      - Applicant only, with one interview date overwritten each time.
      - Interview only, with applicant details repeated in every interview.
      - Applicant, Interview, and a mandatory employer-management subsystem.
      - Applicant and Interview.
      correct: 3
      explanation: Applicant and Interview have separate records in scope. A displayed label alone does not require
        an employer-management entity.
      id: 8352c582-4ee4-49ee-ab93-c2b2b2a2d2f2
      type: scenario
      difficulty: 3
    - question: A school uses Student and Customer for the same people in different screens. The requirements do
        not say whether one person can hold both roles. What should happen before you create two unrelated entity
        types?
      options:
      - Clarify shared identity and role rules with the stakeholders.
      - Create unrelated records because the screen labels differ.
      - Combine them and discard the role distinction immediately.
      - Use the displayed name to match records after launch.
      correct: 0
      explanation: Clarify identity and lifecycle first. Both unconditional separation and unconditional merging
        can encode the wrong business rules.
      id: a2eecd3e-9537-4b5d-bb4f-9bbbef848b04
      type: scenario
      difficulty: 4
- id: attributes
  name: 'Attributes: Properties of Entities'
  difficulty: 2
  estimatedMinutes: 14
  tags:
  - foundational
  - data-modeling
  section: data-modeling-basics
  prerequisites:
  - entities
  encompassing: []
  knowledgePoints:
  - id: what-are-attributes
    instruction: '**Attributes** describe an entity instance. Choose their shape from how the application reads,
      validates, and searches the data. A single address string can support display. Separate city and postal-code
      fields support reliable filters and validation.


      Store units and meanings with numeric fields in the schema design. A number without a defined unit can support
      conflicting interpretations.'
    workedExample: A parcel has weight_grams = 750. The field name defines the unit. An address used for postal-code
      filtering has a separate postal_code attribute.
    instructionContent:
    - type: callout
      title: Practice method
      body: State the requirement, trace the supplied evidence, and check whether your answer meets every stated
        constraint.
    workedExampleContent: []
    problems:
    - question: Which item is an attribute of a particular parcel?
      options:
      - The rule that customers may send parcels.
      - Its weight in grams.
      - The delivery company entity type.
      - The collection of all parcels.
      correct: 1
      explanation: An attribute records a fact about one instance. Weight needs a defined unit to be interpreted
        correctly.
      id: ecf8bfce-02d6-4d39-b02e-c943cd51eba3
      type: multiple_choice
      difficulty: 2
    - question: A contact system must filter addresses by city and validate postal codes. Which design directly
        supports both needs?
      options:
      - A numeric address ID with no address details stored anywhere.
      - A single unstructured address string used for every operation.
      - A free-text notes field containing the address.
      - Separate city and postal_code attributes, with other address fields as needed.
      correct: 3
      explanation: Use structured components for required filters and validation. A display-only string makes these
        operations unreliable.
      id: 3366def7-78ff-4e2c-a426-bdfada6fac57
      type: scenario
      difficulty: 3
    - question: Two services write 500 and 0.5 to a field named weight for the same parcel. One uses grams and the
        other kilograms. Which change addresses the cause?
      options:
      - Rename the field size and keep both input conventions.
      - Store whichever value arrives last without documenting its unit.
      - Define one storage unit, validate inputs, and convert at the integration boundary.
      - Average the two values before displaying them.
      correct: 2
      explanation: The mismatch is semantic. Define a shared unit and conversion rule before comparing or combining
        values.
      id: 535ba43a-4d2c-45a9-92ae-5ed3e49d0e69
      type: scenario
      difficulty: 4
  - id: attribute-boundaries
    instruction: '**Attribute ownership** follows the fact being described. A customer owns their current contact
      address. An invoice can own a snapshot of the billing address used when it was issued.


      A stored snapshot preserves a past fact. A reference to current data follows later changes. Choose deliberately
      from the requirement, and label historical snapshots clearly.'
    workedExample: A customer changes address in June. A May invoice retains its billing_address_at_issue, while
      the customer record receives the new current address.
    instructionContent:
    - type: callout
      title: Practice method
      body: State the requirement, trace the supplied evidence, and check whether your answer meets every stated
        constraint.
    workedExampleContent: []
    problems:
    - question: Which question best determines where an attribute belongs?
      options:
      - Which placement duplicates the fewest values regardless of historical requirements?
      - Which entity currently has the fewest attributes?
      - Which entity instance and point in time does this fact describe?
      - Which screen first displayed this fact?
      correct: 2
      explanation: Ownership depends on meaning and time. Table size and implementation order do not establish the
        correct owner.
      id: 8066348a-9ddf-4f93-b40f-16107f3503c2
      type: multiple_choice
      difficulty: 2
    - question: A customer can place many orders. Each order has a different shipping address, and the exact address
        used must remain available. Where should that address be stored?
      options:
      - As a shipping-address snapshot for each order.
      - As one shared address overwritten by the latest order.
      - Only as a product attribute.
      - Only as the customer's current address.
      correct: 0
      explanation: The address describes that order at shipping time. A current customer address cannot preserve
        several historical destinations.
      id: 0a13b9ad-1272-4256-90cc-666510a0e6f0
      type: scenario
      difficulty: 3
    - question: Old invoices now show a customer's new address because the invoice screen always reads the current
        customer record. The requirement is to reproduce the issued invoice. What is the sound fix?
      options:
      - Use an invoice-time address snapshot and recover historical values only from reliable records.
      - Copy the current address into every old invoice and label it historical.
      - Prevent all future customer address changes.
      - Remove invoice addresses from all documents.
      correct: 0
      explanation: A snapshot meets the requirement for future invoices. Existing historical values require evidence;
        current data cannot reconstruct them reliably.
      id: ae83e56c-5c6e-41f5-8cd5-ea14e0c8cf03
      type: scenario
      difficulty: 4
- id: keys-and-identity
  name: 'Keys: Uniquely Identifying Things'
  difficulty: 3
  estimatedMinutes: 18
  tags:
  - foundational
  - data-modeling
  section: data-modeling-basics
  prerequisites:
  - entities
  - attributes
  encompassing: []
  knowledgePoints:
  - id: primary-keys
    instruction: 'A **primary key** uniquely identifies each row and cannot be null. It can contain one column or
      a combination of columns. Human-readable names often repeat and usually need a separate identifier.


      The key identifies the row; other constraints express business rules. Check uniqueness in the full intended
      scope, including records from different tenants or source systems.'
    workedExample: Two customers can both be named Sam Lee. customer_id values 41 and 42 keep their records distinct
      without changing either name.
    instructionContent:
    - type: link
      url: https://www.postgresql.org/docs/current/ddl-constraints.html
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: What does a primary key guarantee for rows in its table?
      options:
      - Every value stays unchanged forever.
      - Every column is unique.
      - A unique, non-null key value or key combination.
      - Rows are returned in insertion order.
      correct: 2
      explanation: A primary key enforces uniqueness and non-null values. Stable key choice is a design decision,
        and query order needs its own rule.
      id: bed70432-6728-4cbd-af05-58d236da8161
      type: multiple_choice
      difficulty: 2
    - question: Two tenants both use local customer number 17. The shared table must store both. Which proposed
        primary key preserves that distinction?
      options:
      - The customer's display name alone.
      - The combination of tenant_id and local_customer_number.
      - The customer's current subscription plan.
      - local_customer_number alone.
      correct: 1
      explanation: The number is unique only inside a tenant. Include the tenant in the key scope or use a globally
        unique surrogate key.
      id: 7864e82d-d6e1-4f15-b166-10df35888e7c
      type: scenario
      difficulty: 3
    - question: A migration plans to use email as a primary key, but the source contains shared email addresses
        and missing emails. Which conclusion follows from the evidence?
      options:
      - Replace every missing email with the same placeholder and use it as the key.
      - Delete all rows that share an email without a business decision.
      - Choose another valid key and define separate email rules.
      - Proceed because most emails are unique.
      correct: 2
      explanation: The proposed column violates the required uniqueness and non-null rules. Preserve valid records
        and choose an identity design that fits the data.
      id: 303e593a-7bed-4ef7-9ee5-65d6f1ae1256
      type: scenario
      difficulty: 4
  - id: foreign-keys-need-stable-targets
    instruction: 'A **foreign key** requires a referenced value to exist in an eligible unique or primary key. The
      update rule controls what happens when the referenced key changes. With ON UPDATE CASCADE, the database can
      update dependent references. Other rules can reject the change.


      Stable identifiers reduce the need for coordinated updates. Use a mutable name or email as descriptive data
      when it has no need to be the identifier.'
    workedExample: Orders reference customer_id 41. Changing that customer's email leaves the relationship intact.
      If email were the referenced key, the update would need the configured foreign-key action.
    instructionContent:
    - type: link
      url: https://www.postgresql.org/docs/current/ddl-constraints.html
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Why does a stable customer ID help orders retain their customer relationship?
      options:
      - A change to descriptive customer data leaves the referenced ID intact.
      - It causes deleted customers to remain available automatically.
      - It makes every customer attribute immutable.
      - It removes the need for a foreign-key constraint.
      correct: 0
      explanation: Stable IDs separate record identity from mutable descriptions. Referential rules are still needed
        for updates and deletes.
      id: fc1fb61b-f524-4034-b033-22908982c66d
      type: multiple_choice
      difficulty: 2
    - question: Order.customer_email references a unique Customer.email with ON UPDATE CASCADE. A valid email changes.
        What does that configured rule do?
      options:
      - Always rejects the email change.
      - Updates the matching foreign-key values in Order.
      - Deletes the related orders.
      - Always leaves dangling order references.
      correct: 1
      explanation: CASCADE propagates this key update. Do not assume all mutable-key changes break references; inspect
        the configured action.
      id: 2112c6fd-2c59-404c-9d66-ff5d5c46d8dd
      type: scenario
      difficulty: 3
    - question: A proposed integration uses a customer's editable display name as a referenced key. Names can repeat,
        and several services send references asynchronously. Which design reduces both ambiguity and update coordination?
      options:
      - Require each service to guess the latest spelling of the name.
      - Add the current date to the name whenever a conflict occurs.
      - Use a stable unique customer ID in every service and keep the name as a separate attribute.
      - Use the name and disable validation when duplicates appear.
      correct: 2
      explanation: A shared stable identifier avoids duplicate-name ambiguity and coordinated reference rewrites.
        The display name can then change independently.
      id: 86cde7a7-03b8-4469-a50e-18bc6833c9eb
      type: scenario
      difficulty: 4
  - id: choosing-key-types
    instruction: 'A **natural key** comes from the domain. A **surrogate key** is assigned for record identity,
      such as a generated number or UUID. A surrogate key does not enforce business uniqueness by itself. Add a
      unique constraint for any separate rule, such as one account per tenant and external account number.


      Choose keys from their real scope, stability, and constraints rather than their appearance.'
    workedExample: An import assigns each row a UUID. It also enforces uniqueness on source_system plus external_id
      so the same source record cannot be inserted twice under different UUIDs.
    instructionContent:
    - type: link
      url: https://www.postgresql.org/docs/current/ddl-constraints.html
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: After adding a generated UUID primary key, what enforces the rule that an external account number
        is unique within each tenant?
      options:
      - A separate unique constraint on tenant_id and external_account_number.
      - A convention that import jobs should avoid duplicates, with no validation.
      - A non-unique display-name column.
      - The UUID primary key automatically enforces that rule.
      correct: 0
      explanation: A surrogate key identifies rows. Business uniqueness needs its own constraint or equivalent enforcement.
      id: 13002928-15f2-450e-aee6-b9c7aee2b107
      type: multiple_choice
      difficulty: 2
    - question: A product table uses generated product_id values. The business also requires each active SKU to
        be unique. Two imports create different product IDs with the same SKU. Which missing rule explains the duplicate?
      options:
      - A generated primary key automatically validates every business field, so no rule is missing.
      - The product_id values must be identical whenever any descriptive field matches.
      - A separate uniqueness rule for the SKU in the required business scope.
      - The SKU must be removed because surrogate and natural identifiers cannot coexist.
      correct: 2
      explanation: A surrogate primary key prevents duplicate row identities. The SKU business rule needs its own
        constraint or equivalent validation.
      id: a73a34cf-5201-4187-90a8-2d8f13e25e97
      type: scenario
      difficulty: 3
    - question: A team favors a product code as the primary key because it is readable. Codes are reassigned after
        product retirement, while orders must reference the original product indefinitely. What is the better design?
      options:
      - Reuse the old product row whenever the code is reassigned.
      - Use the current product name as the permanent key.
      - Update historical orders to point to the new product with the same code.
      - Use a permanent product ID and model the code with its business validity rules.
      correct: 3
      explanation: Historical references need permanent identity. A reused business code cannot alone distinguish
        the old and new product.
      id: 9d41f71b-7217-4aca-befc-9229031bfd7f
      type: scenario
      difficulty: 4
- id: relationships
  name: 'Relationships: How Entities Connect'
  difficulty: 3
  estimatedMinutes: 12
  tags:
  - foundational
  - data-modeling
  section: data-modeling-design
  prerequisites:
  - entities
  - keys-and-identity
  encompassing: []
  knowledgePoints:
  - id: what-are-relationships
    instruction: 'A **relationship** connects entity instances according to a business rule, such as an order placed
      by a customer. In a relational database, a foreign-key column can store the reference, and a foreign-key constraint
      can enforce its validity.


      The conceptual relationship can exist even if no database constraint enforces it. In that case, application
      logic or data checks must detect invalid references.'
    workedExample: Order.customer_id records which customer placed an order. A foreign-key constraint rejects a
      value that points to a nonexistent customer, subject to the declared null rules.
    instructionContent:
    - type: link
      url: https://www.postgresql.org/docs/current/ddl-constraints.html
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: What does the relationship "Customer places Order" describe?
      options:
      - A connection between a particular customer and their orders.
      - A single attribute value shared by all customers.
      - A requirement that Customer and Order use identical columns.
      - The physical order of rows on disk.
      correct: 0
      explanation: A relationship connects instances. Storage layout and shared column structure are separate design
        choices.
      id: 86424806-95f3-4b5e-abf2-eedc36a13f1a
      type: multiple_choice
      difficulty: 2
    - question: Order.customer_id contains customer IDs, but the database has no foreign-key constraint. Which statement
        is accurate?
      options:
      - The reference models a relationship, but the database does not enforce that customers exist.
      - Each order must now belong to every customer.
      - Every customer ID is guaranteed valid.
      - The data cannot represent a relationship at all.
      correct: 0
      explanation: Distinguish the reference from enforcement. Without the constraint, invalid references can enter
        unless another control prevents them.
      id: 5da1d5b0-0f92-474d-8a79-55a1508f6b91
      type: scenario
      difficulty: 3
    - question: An audit finds orders referring to deleted customers in a schema without foreign-key enforcement.
        Which response addresses both existing damage and future integrity?
      options:
      - Copy the deleted customer ID into a text field and treat it as verified.
      - Rename customer_id to make the intended relationship clearer.
      - Add a join to hide unmatched orders from every report.
      - Investigate and repair the invalid references, then add suitable enforcement or controlled deletion rules.
      correct: 3
      explanation: Hiding rows conceals the issue. Repair using evidence and enforce the intended relationship so
        the fault does not recur.
      id: e0afb99d-ad30-4cf6-aa3f-176ab948f02e
      type: scenario
      difficulty: 4
  - id: optional-vs-mandatory
    instruction: '**Optionality** specifies whether an instance can exist without a related instance. For a foreign-key
      column, NOT NULL requires a value and the foreign-key constraint requires that value to reference a valid
      row.


      Consider lifecycle stages. A draft may allow a missing assignee, while a submitted record may require one.
      That conditional business rule needs suitable validation.'
    workedExample: A draft support ticket may have assignee_id = null. Submission checks that an assignee is present.
      A foreign key checks that a supplied assignee exists.
    instructionContent:
    - type: link
      url: https://www.postgresql.org/docs/current/ddl-constraints.html
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which combination requires every stored order to reference an existing customer through customer_id?
      options:
      - A NOT NULL customer_id with no reference validation.
      - A nullable customer_id with a foreign-key constraint.
      - A unique order number and an unconstrained customer_id.
      - A NOT NULL customer_id and a foreign-key constraint.
      correct: 3
      explanation: NOT NULL enforces presence. The foreign key enforces a valid reference. Both are needed for the
        stated rule.
      id: 6f40d49e-e617-4799-8882-dba2f379035a
      type: multiple_choice
      difficulty: 2
    - question: A ticket can remain unassigned in a queue. Once an agent is assigned, that agent must exist. Which
        column design fits this basic rule?
      options:
      - An unconstrained assignee name.
      - A unique assignee_id that allows each agent only one ticket.
      - A mandatory assignee_id with a fake agent ID for unassigned tickets.
      - A nullable assignee_id with a foreign-key constraint.
      correct: 3
      explanation: Null represents the permitted absence. The foreign key validates supplied assignees without inventing
        fake records.
      id: a7e17ca1-ae35-42a8-9270-d0d25ca18dde
      type: scenario
      difficulty: 3
    - question: Draft orders may have no address, but submitted orders must have one. Making address_id NOT NULL
        prevents valid drafts. What should the design add?
      options:
      - A unique constraint on address_id so drafts cannot share addresses.
      - Validation that requires a valid address when the order enters the submitted state.
      - A fabricated address for every draft.
      - A rule allowing submitted orders to omit addresses permanently.
      correct: 1
      explanation: The requirement depends on lifecycle state. Enforce the state transition while retaining valid
        drafts.
      id: b16277f1-1a04-4ef6-9afa-1e052576f121
      type: scenario
      difficulty: 4
- id: cardinality
  name: 'Cardinality: How Many of Each?'
  difficulty: 4
  estimatedMinutes: 18
  tags:
  - foundational
  - data-modeling
  section: data-modeling-design
  prerequisites:
  - relationships
  encompassing: []
  knowledgePoints:
  - id: cardinality-types
    instruction: '**Cardinality** gives the maximum number of related instances in each direction. One-to-many from
      Author to Book means one author can have many books, while each book has at most one author under that model.
      Co-authorship changes that rule.


      Optionality gives the minimum, often zero or one. State both direction and domain rules before choosing a
      cardinality.'
    workedExample: In a single-author catalog, Author to Book is one-to-many. A catalog that permits co-authors
      needs many-to-many, because both directions can have several instances.
    instructionContent:
    - type: callout
      title: Practice method
      body: State the requirement, trace the supplied evidence, and check whether your answer meets every stated
        constraint.
    workedExampleContent: []
    problems:
    - question: In a model where each book has exactly one author and an author can write many books, what is the
        cardinality from Author to Book?
      options:
      - One-to-many.
      - Many-to-many.
      - Many-to-one.
      - One-to-one.
      correct: 0
      explanation: Read the direction explicitly. The first author can relate to many books; each book has only
        one author under the stated rule.
      id: 74c27407-645a-40b4-b2a8-a886e7966061
      type: multiple_choice
      difficulty: 2
    - question: Each employee may have zero or one assigned locker. Each locker may have zero or one employee. How
        should the relationship be described?
      options:
      - One employee to many lockers.
      - An optional one-to-one relationship on both sides.
      - Many employees to many lockers.
      - A mandatory one-to-one relationship on both sides.
      correct: 1
      explanation: The maximum is one in each direction, while the minimum is zero. Optionality and maximum cardinality
        express different parts of the rule.
      id: a59347a7-f618-431d-b4c4-c59033e293e3
      type: scenario
      difficulty: 3
    - question: A design assumes each patient has one doctor. Interviews show patients can see several doctors and
        doctors can treat several patients. What must change?
      options:
      - Keep the model because a patient has only one doctor during a single appointment.
      - Use a many-to-many relationship based on the confirmed care rules.
      - Make Doctor.name unique and keep the original relationship.
      - Keep one-to-many and overwrite the patient's doctor after each visit.
      correct: 1
      explanation: The relationship concerns all relevant care connections, not just one appointment. Both directions
        can have multiple instances.
      id: 0b008c93-403a-457d-bcf8-ed6abe6498d1
      type: scenario
      difficulty: 4
  - id: implementing-cardinality
    instruction: 'For a **one-to-many relationship**, put the reference on the many side. Several orders can reference
      one customer. A unique constraint on that reference would restrict it to at most one order per customer.


      Model direct relationships from business rules. A path through other entities does not automatically require
      another stored relationship.'
    workedExample: Playlist references its owner User. PlaylistSong links playlists to songs. A user can reach songs
      through playlists; a separate UserSong record is needed only if the application tracks a distinct user-song
      fact, such as a favorite.
    instructionContent:
    - type: link
      url: https://www.postgresql.org/docs/current/ddl-constraints.html
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Where does the foreign key usually sit for Customer to Order, when a customer can have many orders
        and each order has one customer?
      options:
      - On both tables with unrelated values.
      - Only in the customer's display name.
      - On Customer, with space for only one order ID.
      - On Order, referencing Customer.
      correct: 3
      explanation: The many side holds the reference. Each order then selects its customer while a customer can
        be referenced repeatedly.
      id: 5b878f57-1b0f-4750-9ba5-5cadba7732b6
      type: multiple_choice
      difficulty: 2
    - question: Customer to Order should be one-to-many, but Order.customer_id has a unique constraint. A second
        order for the same customer fails. What causes the failure?
      options:
      - The foreign key alone prohibits repeated customer references.
      - Order needs the customer name instead of its ID.
      - The uniqueness rule restricts each customer to at most one order.
      - The customer primary key should allow duplicate customer rows.
      correct: 2
      explanation: A foreign key allows repeated valid references. The extra unique constraint imposes the unintended
        one-to-one maximum.
      id: ed689fae-a3f3-4e98-95a1-4cd4aabbafbe
      type: scenario
      difficulty: 3
    - question: Users own playlists, and playlists contain songs. The only requirement is to find songs through
        a user's playlists. Should a separate UserSong table be added now?
      options:
      - Store the entire song catalog on each user.
      - Add it because every transitive connection must be stored twice.
      - Use the existing relationship path; add UserSong when a separate user-song fact is required.
      - Replace Playlist with UserSong and discard playlist membership.
      correct: 2
      explanation: An extra relationship needs its own meaning. Duplicating a derived path creates synchronization
        work without meeting a new requirement.
      id: 6af220e4-4dc9-4f69-a572-a102be45316a
      type: scenario
      difficulty: 4
- id: associative-entities
  name: 'Associative Entities: Join Tables'
  difficulty: 4
  estimatedMinutes: 14
  tags:
  - foundational
  - data-modeling
  section: data-modeling-design
  prerequisites:
  - cardinality
  encompassing: []
  knowledgePoints:
  - id: resolving-many-to-many
    instruction: 'A **join table** stores links in a many-to-many relationship. Each row references the two linked
      entities. A unique constraint on the pair can prohibit duplicate membership.


      If the same pair can relate repeatedly, define the occurrence as part of its identity. Repeated enrollments
      might include a course offering or term.'
    workedExample: StudentCourse(student_id, course_id) has one row per enrollment when a student can take each
      course once. If retakes are allowed, enrollment_id or an offering-aware key distinguishes occurrences.
    instructionContent:
    - type: link
      url: https://www.postgresql.org/docs/current/ddl-constraints.html
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: What is the purpose of a join table between Student and Course?
      options:
      - Force every student to take exactly one course.
      - Store only the total number of students.
      - Store individual links between students and courses.
      - Remove the identities of both linked entities.
      correct: 2
      explanation: Each row represents a relationship instance and references both endpoints.
      id: 4589f2bd-a176-4986-90bb-e98be4e9bca0
      type: multiple_choice
      difficulty: 2
    - question: A student can enroll in each course only once. Which constraint prevents duplicate rows in StudentCourse?
      options:
      - A unique constraint on course_id alone.
      - A unique constraint on student_id and course_id together.
      - A unique constraint on student_id alone.
      - A unique constraint on an unrelated timestamp alone.
      correct: 1
      explanation: The pair defines membership. Uniqueness on either endpoint alone would incorrectly limit the
        many-to-many relationship.
      id: 5ddff7ab-2d4d-45ac-82df-38ecf7a4c84c
      type: scenario
      difficulty: 3
    - question: The school now allows a student to retake the same course in a later term and retain both grades.
        What should the relationship model represent?
      options:
      - Duplicate identical rows with no way to distinguish terms.
      - One row for the student-course pair with the old grade overwritten.
      - One grade on the Course record shared by all students.
      - Separate enrollment occurrences, with term or offering identity and an appropriate uniqueness rule.
      correct: 3
      explanation: A retake is a separate occurrence. Its identity must preserve both attempts and their facts.
      id: f8284188-e6e4-4e56-a674-d1c7a0adb652
      type: scenario
      difficulty: 4
  - id: relationship-level-attributes
    instruction: 'A **relationship attribute** describes a link or occurrence. Quantity belongs to an order line
      because it depends on both the order and the product. A student''s grade belongs to their enrollment rather
      than to the student or course alone.


      Specify time when a relationship fact can change. A current membership role and a historical role assignment
      have different storage needs.'
    workedExample: OrderLine stores product_id, quantity, and unit_price_at_purchase. The product owns its current
      catalog price; the order line preserves the agreed historical price.
    instructionContent:
    - type: callout
      title: Practice method
      body: State the requirement, trace the supplied evidence, and check whether your answer meets every stated
        constraint.
    workedExampleContent: []
    problems:
    - question: Which fact belongs to an OrderLine linking an order and a product?
      options:
      - The quantity of that product in that order.
      - The order's unique ID definition.
      - The product's global SKU.
      - The customer's date of birth.
      correct: 0
      explanation: Quantity describes this specific line. It can differ for the same product in another order.
      id: e0dc111d-5cf2-40b2-ab80-75bfa36722e0
      type: multiple_choice
      difficulty: 2
    - question: Alex is an administrator in workspace A and a viewer in workspace B. Where should the workspace
        role be recorded?
      options:
      - As one global role on Alex.
      - On each Alex-workspace membership.
      - As one role shared by all users of each workspace.
      - On the product's pricing plan.
      correct: 1
      explanation: The role depends on both person and workspace. A single global value cannot represent both memberships.
      id: 86526d40-c80b-4128-bacb-9203f234ab59
      type: scenario
      difficulty: 3
    - question: An audit must show who held a workspace role on any past date. The current Membership.role field
        is overwritten on each change. Which model meets the new requirement?
      options:
      - Keep overwriting the field and infer history from its current value.
      - Copy the current role onto every user event regardless of event time.
      - Create a new workspace each time someone changes role.
      - Record role assignments with effective time ranges and rules that prevent conflicting overlaps.
      correct: 3
      explanation: Historical questions require historical evidence. Effective intervals preserve when each relationship
        fact applied.
      id: 4e36a890-cf2d-4230-8c50-0b07b2cafa90
      type: scenario
      difficulty: 4
- id: data-modeling-process
  name: The Data Modeling Design Process
  difficulty: 3
  estimatedMinutes: 15
  tags:
  - foundational
  - data-modeling
  section: data-modeling-design
  prerequisites:
  - associative-entities
  encompassing: []
  knowledgePoints:
  - id: five-step-workflow
    instruction: 'Use this **modeling workflow** as a guide:


      1. Define the use cases and candidate entities.

      2. Describe attributes and identity.

      3. Define relationships.

      4. State cardinality, optionality, and constraints.

      5. Validate with sample data and real use cases.


      Iterate when evidence changes a rule. A diagram, paper example, or small SQL prototype can help. Choose a
      tool that exposes mistakes cheaply.'
    workedExample: A sample shows a customer with two addresses. If the model permits only one and the use case
      needs both, revise the relationship before the design is treated as finished.
    instructionContent:
    - type: callout
      title: Practice method
      body: State the requirement, trace the supplied evidence, and check whether your answer meets every stated
        constraint.
    workedExampleContent: []
    problems:
    - question: What is the purpose of the validation step in the modeling workflow?
      options:
      - Confirm that the table names match the first requirements draft.
      - Treat successful table creation as proof that all business cases work.
      - Test the model against real cases and revise rules that fail.
      - Ensure the diagram uses a separate entity for every noun.
      correct: 2
      explanation: Validation tests whether the design represents required cases. It can send you back to earlier
        decisions.
      id: 0b4ed024-5cea-4437-b34a-9a98ed53ec7a
      type: multiple_choice
      difficulty: 2
    - question: A model lists Student and Course but has no enrollment relationship or cardinality rules. Which
        work is still needed before realistic validation?
      options:
      - Define how students connect to courses and the allowed counts and absences.
      - Choose a database engine and assume its defaults establish the enrollment rules.
      - Assume each student has exactly one course without checking.
      - Add a mandatory course_id to Student without checking whether students take multiple courses.
      correct: 0
      explanation: Entity lists alone do not describe valid connections. State the relationship rules before testing
        sample enrollments.
      id: 35227b16-b446-46b2-a8de-820a0e502a2f
      type: scenario
      difficulty: 3
    - question: A team disagrees about whether a many-to-many design supports retakes. They can test sample enrollments
        in a small SQL prototype today. How should they use it?
      options:
      - Avoid prototypes because modeling must use diagrams exclusively.
      - Run representative and edge cases, then revise the model from the results.
      - Treat successful table creation as proof that every business case works.
      - Skip requirements review once the SQL executes.
      correct: 1
      explanation: A prototype is a valid modeling tool. Test the business cases and constraints, not just whether
        tables can be created.
      id: 3ede9a26-748e-4dd4-a66d-0c61c79ed487
      type: scenario
      difficulty: 4
  - id: applying-the-workflow
    instruction: '**Model validation** uses examples that can disprove the design. Include empty cases, repeated
      relationships, changes over time, and records from different tenants. Trace one required query or operation
      through the proposed model.


      When a case fails, identify the missing entity, relationship, or constraint. Change that part and rerun the
      affected cases.'
    workedExample: A subscription model passes a single-account example but fails when one user joins two accounts.
      That case exposes an assumed one-to-one relationship that needs revision.
    instructionContent:
    - type: callout
      title: Practice method
      body: State the requirement, trace the supplied evidence, and check whether your answer meets every stated
        constraint.
    workedExampleContent: []
    problems:
    - question: Which test case is most useful for checking a claimed many-to-many enrollment model?
      options:
      - Several students share a course, and one student takes several courses.
      - Several students each take a different single course, with no shared courses.
      - One student takes one course, with no other cases.
      - An empty StudentCourse table with valid column names.
      correct: 0
      explanation: Exercise both directions of multiplicity. A one-to-one example can pass under an incorrect, more
        restrictive model.
      id: cd6e9873-435f-4a0a-802b-754e8cad5e66
      type: multiple_choice
      difficulty: 2
    - question: A team has identified entities, attributes, keys, relationships, and cardinality rules. What is
        the next step in the stated five-step workflow?
      options:
      - Restart entity discovery without testing the completed model.
      - Validate with sample data and required operations.
      - Optimize table indexes before testing whether the model represents the required cases.
      - Deploy immediately because the diagram has all its labels.
      correct: 1
      explanation: The structural decisions are ready to be tested. Representative operations reveal gaps before
        deployment.
      id: d12a7ed8-6080-4255-85ed-529e918d1bef
      type: scenario
      difficulty: 3
    - question: A model passes signup tests but cannot represent a user leaving one account and later rejoining
        with a different role while retaining history. What is the best next action?
      options:
      - Create a new user identity for every role change.
      - Overwrite the old membership and declare the history out of scope despite the requirement.
      - Remove the historical query from the test suite.
      - Add or revise time-aware membership occurrences, then retest joining, leaving, and historical role queries.
      correct: 3
      explanation: The failing use case points to relationship history. Repair that specific model gap and verify
        both current and historical behavior.
      id: 10d06114-c1b7-41e0-aea3-6d30f8f01a5c
      type: scenario
      difficulty: 4
