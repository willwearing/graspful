- id: ph-person-processing
  name: 'Person Processing: Resolving Events to Profiles'
  difficulty: 5
  estimatedMinutes: 17
  tags:
  - posthog
  - ingestion
  section: posthog-ingestion
  prerequisites:
  - ph-ingestion-pipeline
  - posthog-data-model:ph-persons
  - posthog-data-model:ph-distinct-id
  - posthog-data-model:person-modes
  encompassing:
  - concept: posthog-data-model:ph-persons
    weight: 0.55
  - concept: posthog-data-model:ph-distinct-id
    weight: 0.65
  knowledgePoints:
  - id: how-person-processing-works
    instruction: '**Person processing** handles identity and profile-related work during ingestion when enabled.
      It can resolve distinct IDs, apply supported profile updates, and enforce identity safeguards. Event acceptance
      does not prove every attempted identity operation succeeded.


      Use ingestion warnings and before-and-after identity evidence. Invalid or conflicting identity operations
      require correction at their source. If an ordinary event explicitly skips person processing, its event properties
      can still be present while a requested profile write is not applied.


      Application boundary: The public API also documents per-distinct-ID high sustained volume protection. Acceptance
      can continue with reduced strict ordering and profile updates during the spike. Inspect ingestion warnings
      and check whether a shared actor ID is a modeling defect before proposing more retries.'
    workedExample: A capture request is accepted, but a proposed identity merge violates a safeguard. Inspect
      the warning and identifiers before telling the customer that the merge completed.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data/anonymous-vs-identified-events
      title: 'Person Processing: Resolving Events to Profiles: how person processing works'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: The public API also documents per-distinct-ID high sustained volume protection. Acceptance can continue
        with reduced strict ordering and profile updates during the spike. Inspect ingestion warnings and check
        whether a shared actor ID is a modeling defect before proposing more retries.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: A capture request is accepted, but a proposed identity merge violates a safeguard. Inspect the warning
        and identifiers before telling the customer that the merge completed.
    problems:
    - question: Which task belongs to person processing?
      options:
      - Event-name-only shard routing.
      - Identity resolution and supported profile updates.
      - Unconditional acceptance of every merge.
      - Trusted authentication from any event label.
      correct: 1
      explanation: Person processing operates on identity and profile data with safeguards. It cannot turn invalid
        identity evidence into a trustworthy link.
      id: a852e4c1-dd2c-4892-b74d-4d348321ec53
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: An identify request uses a disallowed placeholder ID and produces an ingestion warning. What should
        the implementation do?
      options:
      - Retry the invalid value indefinitely.
      - Treat warning as an accepted merge.
      - Fix the placeholder emitter and use validated stable IDs.
      - Use another shared placeholder for all users.
      correct: 2
      explanation: Fix invalid identity at the producer. Warnings are evidence that an attempted operation did
        not meet its contract.
      id: e68d48ea-12ef-4e1d-8737-97882fdda4ea
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: Event e1 exists; inline amount is correct. Its intended profile write is absent, and processing=false
        is transmitted. Which boundary is supported by the evidence?
      options:
      - A proven transport failure.
      - A proven missing event row.
      - A dashboard timezone error explaining every property write.
      - Skipped processing versus expected mutation.
      correct: 3
      explanation: Event storage and person processing have separate results. Inspect the reserved flag, SDK mode,
        and supported update path.
      type: scenario
      difficulty: 4
      id: c2657315-ae66-42fc-8460-9014403bac29
      purpose: practice
      isTransfer: true
    - question: A capture logs an invalid-distinct-ID identity warning. Retrying creates ordinary events but no
        intended link. What should the test assert after correction?
      options:
      - Valid canonical ID plus accepted attribution.
      - HTTP 200without accepted-link checks.
      - Emitted identify count without warnings.
      - Email equality without identity acceptance.
      correct: 0
      explanation: Verify the mutation outcome, not just transport. Correct the root writer before assessing repair.
      type: scenario
      difficulty: 4
      id: posthog-ingestion-pipeline-ph-person-processing-how-person-processing-works-exam-1
      purpose: exam
      isTransfer: true
    - question: One hot shared actor emits sustained high volume. PostHog warns about reduced ordering/person
        updates. What should diagnosis examine?
      options:
      - Retry every event to force ordered writes.
      - Shared actor, rate, warning and update effects.
      - Ignore warnings because capture remains200.
      - Spread shared placeholder IDs without canonical identity review.
      correct: 1
      explanation: The documented protection can preserve acceptance while altering processing guarantees. Avoid
        solving an identity/cardinality defect solely by retrying.
      type: scenario
      difficulty: 4
      id: posthog-ingestion-pipeline-ph-person-processing-how-person-processing-works-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: ph-ingestion-pipeline
  - id: cost-control-and-skip-rules
    instruction: '**Person-processing controls** can reduce profile work when the use case does not need it. The
      server-side event property $process_person_profile = false requests that person processing be skipped. Identity
      operations that require person processing are incompatible with that choice.


      Validate processing behavior end to end. In the web SDK, use its documented profile mode and helpers; inline
      $set alone does not create a profile for a fresh anonymous identified_only capture.


      Application boundary: Before estimating savings, separate three observations: whether profile processing
      runs, whether the actor already links to a stored person, and how events are classified for billing. A known
      linked distinct ID with processing=false remains identified and cannot update its profile. Fresh unlinked
      IDs have different behavior. Group/identity operations and required feature coverage must also be tested.'
    workedExample: A high-volume event only needs event-level analysis. The team tests the skip setting against
      that use case, confirms the absence of profile-dependent operations, and checks resulting data and warnings.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data/anonymous-vs-identified-events
      title: 'Person Processing: Resolving Events to Profiles: cost control and skip rules'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: 'Before estimating savings, separate three observations: whether profile processing runs, whether
        the actor already links to a stored person, and how events are classified for billing. A known linked
        distinct ID with processing=false remains identified and cannot update its profile. Fresh unlinked IDs
        have different behavior. Group/identity operations and required feature coverage must also be tested.'
    workedExampleContent:
    - type: callout
      title: Skip work versus identity linkage
      body: '| Capture with processing=false | Existing link | Profile write | Classification |

        |---|---|---|---|

        | Known user42 | Yes | Skipped | Identified |

        | Fresh unlinked anon17 | No | No profile creation | Can be anonymous |


        These rows assume ordinary event capture with no conflicting group or identity operation.'
    problems:
    - question: What does $process_person_profile = false request on a server-side capture?
      options:
      - Remove all ordinary event properties.
      - Create a profile on every retry.
      - Request skipped profile processing for this event.
      - Merge every actor in the project.
      correct: 2
      explanation: The flag controls person processing. Verify its compatibility with the operations and analyses
        the event needs.
      id: 94dea87e-59f0-4ceb-9de2-40f26c76171d
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: A payload sets $process_person_profile = false while attempting an identity operation that requires
        person processing. What should the integration review identify?
      options:
      - More arbitrary properties will force any merge.
      - Warnings universally prove success.
      - Skip-processing permits every identity mutation.
      - A conflicting skip-processing and required identity operation contract.
      correct: 3
      explanation: Skipping required processing and requesting an identity operation are incompatible. Choose
        the intended behavior and follow its supported path.
      id: a7dbda82-b3dd-4838-966b-ee4b4b1a07bb
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: Processing=false is sent for A, already linked to a person, and B, fresh/unlinked with no profile.
        Which savings assumption is defensible?
      options:
      - A identified, no update; B anonymous, no creation.
      - A anonymous, no update; B anonymous, no creation.
      - A identified, update applied; B identified, profile created.
      - A anonymous, update applied; B identified, profile created.
      correct: 0
      explanation: Known identity linkage can preserve identified classification. Audit actual IDs and downstream
        requirements before estimating savings.
      type: scenario
      difficulty: 4
      id: 883d86dd-41b9-47aa-8e2e-3ce35fc0c01e
      purpose: practice
      isTransfer: true
    - question: A proposed global skip preserves event count but removes person-tier coverage needed by a report.
        Which rollout acceptance check is missing?
      options:
      - Only total event counts.
      - Cost/classification plus required feature coverage.
      - Only capture success statuses.
      - Only application login state.
      correct: 1
      explanation: A cost change must satisfy its measurement contract. Scope processing changes where possible
        and compare actual classification rather than UI login state.
      type: scenario
      difficulty: 4
      id: posthog-ingestion-pipeline-ph-person-processing-cost-control-and-skip-rules-exam-1
      purpose: exam
      isTransfer: true
    - question: The app calls events anonymous because IDs begin anon_. Some IDs were previously linked to profiles.
        What evidence decides the estimate?
      options:
      - anon_ prefix alone.
      - Missing login click alone.
      - Actual linkage and classification contract.
      - Identifier length alone.
      correct: 2
      explanation: Naming conventions are not classification evidence. Separate fresh unlinked identities from
        known linked actors and verify the documented rule.
      type: scenario
      difficulty: 4
      id: posthog-ingestion-pipeline-ph-person-processing-cost-control-and-skip-rules-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: ph-ingestion-pipeline
  sourceRef: https://posthog.com/docs/data/anonymous-vs-identified-events; relevant named topic/contract in this
    concept; verified 2026-10-07.
- id: tracking-payload-capstone
  name: Review a tracking payload contract
  section: ingestion-investigations
  difficulty: 5
  estimatedMinutes: 15
  tags:
  - applied
  - scenario
  - evidence
  sourceRef: https://posthog.com/docs/api/capture; Review a tracking payload contract; verified 2026-10-07.
  prerequisites:
  - ph-event-capture
  - posthog-data-model:identification-pitfalls
  encompassing:
  - concept: ph-event-capture
    weight: 0.8
  - concept: posthog-data-model:ph-event-properties
    weight: 0.7
  - concept: posthog-data-model:identification-pitfalls
    weight: 0.5
  knowledgePoints:
  - id: tracking-payload-capstone
    instruction: 'Review a tracking payload against four contracts: destination, occurrence, actor, and typed
      business properties. Capture uses the destination project token rather than a personal query key. Keep top-level
      and property distinct IDs consistent; the top-level value takes precedence when both are sent. Preserve
      validated occurrence time for delayed events. For a purchase, define the authoritative success boundary,
      stable order reference, currency, and numeric unit. Browser session/group context must be propagated explicitly
      where the runtime does not supply it. Verify a bounded test without exposing credentials or unnecessary
      personal data.'
    workedExample: A backend payment confirmation belongs to user42/order17, occurred at 09:00 UTC, and is sent
      at 10:00 UTC. The contract uses amount_cents=2000,currency=USD. The payload sends the production project
      token, canonical user42, order17, validated 09:00 timestamp, and the declared numeric properties. Test one
      authoritative occurrence and supported retry behavior.
    problems:
    - question: Which field routes direct capture to its destination project?
      options:
      - The personal API key for authenticated data queries.
      - The workspace or organization ID for membership.
      - The regional hostname for capture infrastructure.
      - The project token in the capture api_key field.
      correct: 3
      explanation: Use the documented destination token; private-query credentials and actor identities are different.
      type: scenario
      difficulty: 2
      id: ph-event-capture-tracking-payload-capstone-1
      purpose: practice
      isTransfer: false
    - question: A contract uses numeric cents. Which representation matches a 20 USD purchase?
      options:
      - amount_cents=2000,currency=USD.
      - amount_cents="$20",currency=USD.
      - amount_cents=20,currency=USD without a unit change.
      - amount_cents=2000 with no currency contract.
      correct: 0
      explanation: Name the unit and currency explicitly and validate both sources. Formatting belongs in presentation.
      type: scenario
      difficulty: 3
      id: ph-event-capture-tracking-payload-capstone-2
      purpose: practice
      isTransfer: false
    - question: Payload has top-level distinct_id=worker, properties.distinct_id=user42, send-time timestamp,
        and "$20" as amount_cents. Which patch set meets the stated contract?
      options:
      - user42; send time;2000 USD cents.
      - user42; occurrence time;2000 USD cents.
      - worker; occurrence time;20 USD cents.
      - user42; occurrence time;"$20" cents.
      correct: 1
      explanation: Several independent defects are visible. Validate destination, actor, occurrence, and units
        rather than repairing one field and assuming the whole contract passes.
      type: scenario
      difficulty: 4
      id: ph-event-capture-tracking-payload-capstone-3
      purpose: practice
      isTransfer: true
    - question: A webhook retries order17 after timeout; UI already emits purchase_completed. Which acceptance
        fixture detects inflated revenue?
      options:
      - Different orders with no repeated delivery.
      - One confirmation without the UI path.
      - One order with UI intent, confirmation, retry.
      - Repeated UI clicks without webhook retries.
      correct: 2
      explanation: Test overlap and delivery retries against the same occurrence. Preserve useful intent evidence
        without double-counting business success.
      type: scenario
      difficulty: 4
      id: ph-event-capture-tracking-payload-capstone-4
      purpose: exam
      isTransfer: true
    - question: A valid server capture knows user42 but has no browser session evidence. Which payload review
        is defensible?
      options:
      - Known actor; guess latest observed session.
      - Shared webhook actor; same session for everyone.
      - Wait for browser ID despite known canonical actor.
      - Known actor; session only from trusted context.
      correct: 3
      explanation: Actor identity and session membership are separate. A backend can know the actor without knowing
        the browser session.
      type: scenario
      difficulty: 4
      id: ph-event-capture-tracking-payload-capstone-5
      purpose: exam
      isTransfer: true
    keyPrerequisite: ph-event-capture
    instructionContent:
    - type: link
      url: https://posthog.com/docs/api/capture
      title: 'Review a tracking payload contract: source contract'
      description: Verified 2026-10-07. Check the stated SDK/version and schema assumptions.
    workedExampleContent:
    - type: callout
      title: Worked trace
      body: A backend payment confirmation belongs to user42/order17, occurred at 09:00 UTC, and is sent at 10:00 UTC.
        The contract uses amount_cents=2000,currency=USD. The payload sends the production project token, canonical
        user42, order17, validated 09:00 timestamp, and the declared numeric properties. Test one authoritative
        occurrence and supported retry behavior.
- id: quota-recovery-capstone
  name: Plan bounded ingestion recovery
  section: ingestion-investigations
  difficulty: 5
  estimatedMinutes: 15
  tags:
  - applied
  - scenario
  - evidence
  sourceRef: https://posthog.com/docs/api; Plan bounded ingestion recovery; verified 2026-10-07.
  prerequisites:
  - ph-person-processing
  - ph-clickhouse-storage
  encompassing:
  - concept: ph-ingestion-pipeline
    weight: 0.8
  - concept: ph-person-processing
    weight: 0.6
  - concept: ph-clickhouse-storage
    weight: 0.5
  - concept: data-pipelines:pipeline-tradeoffs
    weight: 0.5
  knowledgePoints:
  - id: quota-and-bounded-remediation
    instruction: Diagnose missing events with a bounded evidence ladder. Confirm the source emitted a request,
      inspect the actual status and response body, verify project token and regional host, and search exact IDs
      in a bounded UTC occurrence window. HTTP 200 alone does not prove ingestion. The documented quota_limited
      response names resources over quota. Resolve the applicable quota/billing condition before proposing replay.
      Record source retention and stable event identity, determine which interval is actually missing, and verify
      supported duplicate/replay handling. Use customer-accessible evidence first; escalate internal queue/storage
      questions with a redacted packet. Close only after destination/event verification and required profile/group
      coverage pass.
    workedExample: Three requests for e1,e2,e3 use the correct production host/token. Each receives 200 with quota_limited
      naming events. Correct bounded searches find none. Check the event quota and affected interval; after the
      restriction is resolved, send one bounded canary and verify it. Then assess recoverable source payloads
      and replay only the missing scope under the supported delivery contract. Do not use new event IDs to hide
      possible duplicates.
    problems:
    - question: Which evidence makes HTTP 200 insufficient to claim successful event ingestion?
      options:
      - The response body names events in quota_limited.
      - The response body confirms the submitted batch size.
      - The payload includes the validated occurrence time.
      - The request uses the correct regional capture host.
      correct: 0
      explanation: The response body provides a documented resource restriction. Acceptance status alone is incomplete.
      type: scenario
      difficulty: 2
      id: ph-ingestion-pipeline-quota-and-bounded-remediation-1
      purpose: practice
      isTransfer: false
    - question: Storage finds e2 but a saved chart omits it. Which next check fits the ladder?
      options:
      - Replay every project event.
      - Compare the chart's exact project/time/filter/aggregation scope to e2.
      - Assume the SDK never sent e2.
      - Reset e2's actor identity first.
      correct: 1
      explanation: Confirmed event availability moves the investigation to the query/view boundary.
      type: scenario
      difficulty: 3
      id: ph-ingestion-pipeline-quota-and-bounded-remediation-2
      purpose: practice
      isTransfer: false
    - question: e1-e3 have 200 plus event quota_limited, no bounded arrival, and retained source payloads. Which
        recovery sequence is defensible?
      options:
      - Replay first; inspect quota after new failures.
      - Change query time; ignore response quota signal.
      - Resolve quota; canary; bounded replay/reconciliation.
      - Retry identify; assume profiles control quota.
      correct: 2
      explanation: Address the observed blocker before delivery recovery. Bound scope, retain stable evidence,
        and validate actual outcomes.
      type: scenario
      difficulty: 4
      id: ph-ingestion-pipeline-quota-and-bounded-remediation-3
      purpose: practice
      isTransfer: true
    - question: A replayable source covers 10:00-10:30; events from 10:10 to 10:20 already exist. What must a recovery
        plan establish?
      options:
      - Treat the whole retained window as missing.
      - Give every source occurrence a new event ID.
      - Replay all retained data and divide totals.
      - Missing identities/window and duplicate contract.
      correct: 3
      explanation: Avoid changing business identity or adding repeated effects. Reconcile known records and use
        the documented replay contract.
      type: scenario
      difficulty: 4
      id: ph-ingestion-pipeline-quota-and-bounded-remediation-4
      purpose: exam
      isTransfer: true
    - question: Capture and raw-event checks pass after a fix, but required company attribution is absent. What
        should the closure test include?
      options:
      - Verify company keys and required group context, then test company-level output.
      - Verify canonical person IDs and person properties, then test person-level output.
      - Verify event IDs and declared currency units, then reconcile aggregate revenue.
      - Verify occurrence windows and project filters, then reconcile daily event totals.
      correct: 0
      explanation: Delivery is one acceptance dimension. Close the incident against the full tracking and downstream
        feature contract.
      type: scenario
      difficulty: 4
      id: ph-ingestion-pipeline-quota-and-bounded-remediation-5
      purpose: exam
      isTransfer: true
    keyPrerequisite: ph-person-processing
    instructionContent:
    - type: link
      url: https://posthog.com/docs/api
      title: 'Plan bounded ingestion recovery: source contract'
      description: Verified 2026-10-07. Check the stated SDK/version and schema assumptions.
    workedExampleContent:
    - type: callout
      title: Worked trace
      body: Three requests for e1,e2,e3 use the correct production host/token. Each receives 200 with quota_limited
        naming events. Correct bounded searches find none. Check the event quota and affected interval; after
        the restriction is resolved, send one bounded canary and verify it. Then assess recoverable source payloads
        and replay only the missing scope under the supported delivery contract. Do not use new event IDs to hide
        possible duplicates.
