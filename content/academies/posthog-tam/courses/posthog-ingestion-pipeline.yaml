    - type: callout
      title: Boundary to verify
      body: This hash and placement example is a supplied teaching model only. Current deployment routing is not
        inferred from this rule. For real support work, verify linked-identity history with supported project
        queries and escalate internal shard-scope questions using actual deployment evidence.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: Under the supplied routing rule, anonymous ID a1 lands on shard A and known ID user_9 lands on shard
        B. A valid identity link can connect their person history even though the raw events are stored separately.
    problems:
    - question: Under the supplied project-ID-plus-raw-distinct-ID routing model, what determines an event's shard?
      options:
      - The configured routing inputs in this supplied model.
      - The first reader's preference.
      - Current profile ID after any later merge.
      - Event name alone regardless of the model.
