concepts:
- id: ph-event-capture
  name: 'Event Capture: SDKs, API, and Autocapture'
  difficulty: 3
  estimatedMinutes: 15
  tags:
  - posthog
  - ingestion
  section: posthog-ingestion
  prerequisites:
  - posthog-data-model:ph-events
  - posthog-data-model:ph-event-properties
  encompassing: []
  knowledgePoints:
  - id: how-events-enter-posthog
    instruction: '**Capture surfaces** include supported SDKs and the capture API. SDK behavior depends on its
      platform, version, and configuration. A web SDK can collect browser context and enabled automatic events;
      a backend SDK relies on information supplied by the application.


      Check the project token, ingestion region or host, payload, and SDK transport behavior. An HTTP acceptance
      response does not by itself prove that an event is queryable.


      Application boundary: The missing transport evidence points to process-lifetime delivery. Verify the actual
      SDK contract; a query or identity change cannot guarantee flush.'
    workedExample: A backend payment event supplies a trusted user ID and amount. A web pageview can include browser
      context from the web SDK. Both must route to the intended project and ingestion host.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/api/capture
      title: 'Event Capture: SDKs, API, and Autocapture: how events enter posthog'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: The missing transport evidence points to process-lifetime delivery. Verify the actual SDK contract;
        a query or identity change cannot guarantee flush.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: A backend payment event supplies a trusted user ID and amount. A web pageview can include browser
        context from the web SDK. Both must route to the intended project and ingestion host.
    problems:
    - question: A backend SDK is correctly initialized with its project token and host. The caller supplies a
        known canonical user ID and event name. No browser request-context middleware is installed. Which value
        still needs explicit application propagation for browser-session attribution?
      options:
      - The browser session ID absent from server request context.
      - The configured project token.
      - The initialized SDK library version.
      - The supplied semantic event name.
      correct: 0
      explanation: The backend cannot infer browser state automatically. Supply trusted identity and session context
        when the use case needs it.
      id: 75ea7c89-6594-4c2a-b733-4009b17a5012
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: The backend capture payload is valid but uses the token of a test project. The team searches the
        production project and sees no event. What should be corrected?
      options:
      - Change production chart dates while sending to test.
      - Align capture destination and verification project.
      - Change amount units while sending to test.
      - Change profile email while sending to test.
      correct: 1
      explanation: The token routes capture. Confirm the intended project and host before investigating unrelated
        properties.
      id: de92eb48-948e-46eb-8a8a-f03bc469431b
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: A serverless invocation queues capture, returns immediately, and never awaits the SDK's documented
        flush/shutdown. No outbound request is logged. What test should come first?
      options:
      - Increase the chart time range before checking request emission.
      - Replay all historical payments with new UUIDs.
      - Await/test the SDK delivery boundary.
      - Call identify repeatedly to force every event buffer to drain.
      correct: 2
      explanation: The missing transport evidence points to process-lifetime delivery. Verify the actual SDK contract;
        a query or identity change cannot guarantee flush.
      type: scenario
      difficulty: 4
      id: 47c31da7-3357-4f9f-b456-263aa7ef0a54
      purpose: practice
      isTransfer: true
    - question: A backend SDK is initialized with a valid token/host and canonical actor ID. It lacks browser
        session middleware. Which input requires explicit trusted propagation to join that browser session?
      options:
      - Project token already supplied.
      - SDK library name from initialization.
      - Event name already supplied by caller.
      - $session_id.
      correct: 3
      explanation: Initialization supplies routing; actor identity does not supply browser session context. Do
        not guess a session from nearby times.
      type: scenario
      difficulty: 4
      id: posthog-ingestion-pipeline-ph-event-capture-how-events-enter-posthog-exam-1
      purpose: exam
      isTransfer: true
    - question: Capture gets 401 invalid_api_key. The integration uses the correct region but a personal API key
        instead of its project token. Which correction should be verified?
      options:
      - Capture project token; bounded verification.
      - Increase consumer capacity before fixing401.
      - Change actor ID while retaining wrong credential.
      - Change occurrence time while retaining wrong credential.
      correct: 0
      explanation: Public capture routing uses a project token; private-query credentials are a different contract.
        Inspect response body and endpoint before downstream diagnosis.
      type: scenario
      difficulty: 4
      id: posthog-ingestion-pipeline-ph-event-capture-how-events-enter-posthog-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: posthog-data-model:ph-events
  - id: choosing-a-capture-surface
    instruction: '**Capture placement** should match the source of truth for the action. A confirmed payment belongs
      at the trusted success boundary, often a server or payment callback. A browser interaction belongs where
      that interaction is observable.


      PostHog also imports external data through warehouse sources. Event capture is a push flow, while a source
      connector can fetch external data. Choose from the actual data movement requirement.


      Application boundary: Choose one business-success owner and distinguish retries from occurrences. Fixed
      divisors break when failures or retries vary.'
    workedExample: A checkout page click measures intent. A verified payment callback measures payment completion.
      A warehouse source can import existing billing records for analysis without pretending that each row is
      a fresh browser interaction.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/api/capture
      title: 'Event Capture: SDKs, API, and Autocapture: choosing a capture surface'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: Choose one business-success owner and distinguish retries from occurrences. Fixed divisors break when
        failures or retries vary.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: A checkout page click measures intent. A verified payment callback measures payment completion. A
        warehouse source can import existing billing records for analysis without pretending that each row is
        a fresh browser interaction.
    problems:
    - question: An application has no supported SDK for its runtime, but it can send authenticated HTTPS requests
        with the required capture fields. Which surface can it evaluate?
      options:
      - A query endpoint that reads existing data.
      - Capture API with explicit required fields and delivery handling.
      - A warehouse connector that only syncs existing tables.
      - A dashboard action that only matches existing events.
      correct: 1
      explanation: The capture API provides a direct ingestion surface. The integration must implement its request
        contract and reliable delivery behavior.
      id: 82129289-26d9-4f2d-953f-89e8ac72e2a1
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: A team wants existing CRM tables imported into PostHog on a schedule. Does this requirement mean
        the CRM must push each row through the event capture API?
      options:
      - Yes, every row needs a browser session.
      - No, so permissions and deletions never matter.
      - No, evaluate the warehouse source's sync contract.
      - Yes, every source uses browser push.
      correct: 2
      explanation: Capture and external-source import are different surfaces. Select and validate the supported
        connector for the required data.
      id: fdbeba0e-ed65-4c06-90aa-d56fb7b9cabd
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: UI checkout and payment webhook both report order_paid. Webhook can retry. Which tracking contract
        yields one authoritative purchase measure?
      options:
      - Both success paths with a fixed divide-by-two rule.
      - Only button clicks with payment status inferred.
      - A new actor ID for each webhook retry.
      - Authoritative webhook completion; separate UI intent.
      correct: 3
      explanation: Choose one business-success owner and distinguish retries from occurrences. Fixed divisors
        break when failures or retries vary.
      type: scenario
      difficulty: 4
      id: c363da6d-520a-419d-a1d8-9aa9c98c0d16
      purpose: practice
      isTransfer: true
    - question: CRM has current account rows and deletion semantics; the request is periodic table analysis alongside
        usage. What comparison is appropriate?
      options:
      - Warehouse/table-sync lifecycle contract.
      - Browser push of every current row without deletion semantics.
      - Outbound event export instead of inbound row sync.
      - Current-state events without stable source keys.
      correct: 0
      explanation: The source shape is a table contract. An event push design is optional and must not discard
        row lifecycle semantics.
      type: scenario
      difficulty: 4
      id: posthog-ingestion-pipeline-ph-event-capture-choosing-a-capture-surface-exam-1
      purpose: exam
      isTransfer: true
    - question: The runtime has no supported SDK. A capture API integration can send HTTPS. What operational work
        is now explicitly owned by the integration?
      options:
      - SDK-like buffering assumed without implementation.
      - Explicit payload, routing, retry and delivery ownership.
      - HTTP call count alone as delivery proof.
      - Unbounded retries with new event identity.
      correct: 1
      explanation: Direct HTTP does not supply SDK lifecycle behavior for free. Implement and test the actual
        transport and payload contract.
      type: scenario
      difficulty: 4
      id: posthog-ingestion-pipeline-ph-event-capture-choosing-a-capture-surface-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: posthog-data-model:ph-events
  sourceRef: https://posthog.com/docs/api/capture; relevant named topic/contract in this concept; verified 2026-10-07.
- id: ph-ingestion-pipeline
  name: 'The Ingestion Pipeline: Kafka to ClickHouse'
  difficulty: 5
  estimatedMinutes: 18
  tags:
  - posthog
  - ingestion
  section: posthog-ingestion
  prerequisites:
  - ph-event-capture
  - data-pipelines:storage-layers
  encompassing: []
  knowledgePoints:
  - id: why-not-straight-to-db
    instruction: 'A **buffered ingestion path** separates accepting events from processing and writing them to
      analytical storage. A durable queue can absorb bursts and support retries within its retention limits. Consumers
      process queued records; lag measures how far they are behind.


      Durability is conditional on configured retention and failure handling. Acceptance, consumption, and query
      visibility are different milestones.


      Application boundary: Compare rates as well as queue size. Service capacity below arrival means the backlog
      keeps growing after the original burst.'
    workedExample: A short traffic spike raises queue lag while storage remains healthy. Consumers catch up after
      the spike, provided capacity and retention are sufficient.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/api
      title: 'The Ingestion Pipeline: Kafka to ClickHouse: why not straight to db'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: Compare rates as well as queue size. Service capacity below arrival means the backlog keeps growing
        after the original burst.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: A short traffic spike raises queue lag while storage remains healthy. Consumers catch up after the
        spike, provided capacity and retention are sufficient.
    problems:
    - question: What is one reason to put a durable queue between event acceptance and analytical storage?
      options:
      - Unlimited retention despite every outage.
      - Immediate query visibility after every acceptance.
      - Durable buffering and independently paced consumers.
      - No payload validation required.
      correct: 2
      explanation: A queue decouples stages and can help recovery. It does not remove capacity, retention, or
        validation limits.
      id: ec70d198-72c2-44ab-88b1-03fc5ec305c0
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: Events are accepted into the queue, but the storage consumer is paused. What should happen to
        unprocessed work while retention remains sufficient?
      options:
      - Occurrence times automatically become restart times.
      - All queued events are already queryable.
      - Earlier accepted HTTP statuses become rejected retroactively.
      - Pending work remains and lag grows within retention.
      correct: 3
      explanation: Acceptance and processing are distinct. A paused consumer accumulates backlog that must later
        be processed.
      id: 8db4c5e2-09d2-4914-bd8f-43c9bc684917
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: Incoming rate returns to 100/s after a burst. Consumer stays80/s, oldest age rises, and retention
        is finite. Which conclusion fits?
      options:
      - At 80/s processing against 100/s arrival, backlog grows.
      - The burst is fully recovered because arrival rate is lower now.
      - A larger dashboard time range adds consumer capacity.
      - Capture200 proves every queued record is queryable.
      correct: 0
      explanation: Compare rates as well as queue size. Service capacity below arrival means the backlog keeps
        growing after the original burst.
      type: scenario
      difficulty: 4
      id: 4d82af89-fff7-4155-86c2-9cbc632e080d
      purpose: practice
      isTransfer: true
    - question: Arrival is 100/s; consumer processes 150/s; pending count falls 500/s elsewhere in an aggregated
        graph. What must be checked before promising recovery time?
      options:
      - Rate arithmetic without checking aggregated metric scope.
      - Comparable metric scope and pending age.
      - Queue size alone without oldest age.
      - Consumer rate alone without arrival/retention evidence.
      correct: 1
      explanation: Conflicting rate arithmetic indicates mismatched scopes or units. A recovery estimate requires
        comparable measurements and retention context.
      type: scenario
      difficulty: 4
      id: posthog-ingestion-pipeline-ph-ingestion-pipeline-why-not-straight-to-db-exam-1
      purpose: exam
      isTransfer: true
    - question: A customer has capture acceptance but no events yet. Internal engineering confirms consumer backlog.
        What should the TAM communicate?
      options:
      - Guaranteed loss from an empty dashboard.
      - Guaranteed visibility from acceptance alone.
      - Verified lag/interval with bounded recovery checks.
      - Immediate unbounded replay despite confirmed queued work.
      correct: 2
      explanation: Use confirmed evidence and distinguish delay from permanent loss. Avoid duplicate replay until
        the fate of original work is established.
      type: scenario
      difficulty: 4
      id: posthog-ingestion-pipeline-ph-ingestion-pipeline-why-not-straight-to-db-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: ph-event-capture
  - id: the-full-flow
    instruction: 'Use this **scoped ingestion model** for the exercises: capture endpoint → durable queue → validation
      and enrichment consumer → analytical storage → query. It is a teaching model, not a promise of permanent
      internal service or table names.


      An offset is a position in the queue. Consumer progress and lag show whether records have passed that boundary.
      Trace one event ID through adjacent stages before changing unrelated settings.


      Application boundary: Operational evidence ladder: emitted request, actual response body, correct project/region,
      bounded raw-event lookup, then the saved query output. Capture HTTP 200 does not prove ingestion. The quota_limited
      body names limited resources. Source/response/query evidence is customer-accessible; queue offsets and local
      storage details require the applicable internal access and deployment evidence.'
    workedExample: Event e17 is accepted at queue position 510. The consumer has only reached 480. Its absence
      from storage is consistent with the observed backlog; query filters cannot make an unprocessed record appear.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/api
      title: 'The Ingestion Pipeline: Kafka to ClickHouse: the full flow'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: 'Operational evidence ladder: emitted request, actual response body, correct project/region, bounded
        raw-event lookup, then the saved query output. Capture HTTP 200 does not prove ingestion. The quota_limited
        body names limited resources. Source/response/query evidence is customer-accessible; queue offsets and
        local storage details require the applicable internal access and deployment evidence.'
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: Event e17 is accepted at queue position 510. The consumer has only reached 480. Its absence from storage
        is consistent with the observed backlog; query filters cannot make an unprocessed record appear.
    problems:
    - question: Put the stages of this lesson's supplied ingestion model in data-flow order.
      options:
      - Analytical storage
      - Capture endpoint
      - Query
      - Validation and enrichment consumer
      - Durable queue
      correct:
      - Capture endpoint
      - Durable queue
      - Validation and enrichment consumer
      - Analytical storage
      - Query
      explanation: The supplied model separates acceptance, buffering, processing, storage, and reads. Use this
        order to locate the first boundary where event evidence stops.
      type: ordering
      id: 6672db5d-1ef1-4834-863b-2ffe80561a6b
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: In this flow, event e17 is at queue offset 510 and the consumer has reached 480. Storage has no
        e17 yet. What is the first boundary to inspect?
      options:
      - Source-to-capture transport.
      - Storage-to-query presentation.
      - Dashboard aggregation after confirmed storage.
      - Queue-to-consumer backlog.
      correct: 3
      explanation: The consumer has not reached the event. Investigate lag and progress before diagnosing query
        filtering.
      id: abe25435-a31b-4320-9a30-95bf883c23de
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: A bounded event e17 is returned by a raw event query. A saved dashboard omits it. Which next comparison
        is most useful?
      options:
      - Stored-event versus saved-query scope.
      - Source flush behavior as the sole diagnosis.
      - Global replay before inspecting the dashboard.
      - Identity split before inspecting the query.
      correct: 0
      explanation: Storage evidence narrows the next boundary. A saved view can exclude a correctly stored event
        without ingestion loss.
      type: scenario
      difficulty: 4
      id: 33c8775b-b616-47d9-a478-ea997d9a7a5f
      purpose: practice
      isTransfer: true
    - question: Capture receives 200, but its body reports quota_limited for events. A correct bounded project
        query finds no test row. What should be checked before replay?
      options:
      - Source flushing despite confirmed outbound requests.
      - Event quota/billing restriction.
      - Session idle expiry as event-ingestion control.
      - Person merging as proof of event quota recovery.
      correct: 1
      explanation: The response body is stronger evidence than status alone. Resolve the applicable restriction
        and plan bounded verification/recovery.
      type: scenario
      difficulty: 4
      id: posthog-ingestion-pipeline-ph-ingestion-pipeline-the-full-flow-exam-1
      purpose: exam
      isTransfer: true
    - question: An event is missing in a correct bounded query. Request logs prove emission and valid routing,
        but no processing/storage evidence is available. What escalation packet is useful?
      options:
      - An empty chart without its filters.
      - Capture status without payload/IDscope.
      - Redacted payload, IDs/times, response and query scope.
      - Unbounded replay request without affected evidence.
      correct: 2
      explanation: A boundary-specific packet allows engineering to trace the event. State confirmed observations
        and avoid claiming a storage stage failed without evidence.
      type: scenario
      difficulty: 4
      id: posthog-ingestion-pipeline-ph-ingestion-pipeline-the-full-flow-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: ph-event-capture
  sourceRef: https://posthog.com/docs/api; relevant named topic/contract in this concept; verified 2026-10-07.
- id: ph-clickhouse-storage
  name: 'ClickHouse Storage: Tables and Sharding'
  difficulty: 6
  estimatedMinutes: 18
  tags:
  - posthog
  - ingestion
  section: posthog-ingestion
  prerequisites:
  - ph-ingestion-pipeline
  - posthog-data-model:ph-distinct-id
  encompassing: []
  knowledgePoints:
  - id: table-roles
    instruction: 'A **distributed analytical store** can separate routing from local storage. In this lesson''s
      model, a distributed query surface reads across shards, and each shard stores a subset of event rows locally.
      A replica holds a copy for availability.


      These are roles in a supplied model. Production names and implementations can change, so verify live architecture
      before diagnosing a specific deployment.


      Application boundary: A local shard count is not automatically a total. Replicas can duplicate physical
      copies rather than add distinct business records.'
    workedExample: The model has two shards. Shard A holds events e1 and e3; shard B holds e2 and e4. A distributed
      read can query both. A local read on A sees only its own subset.
    instructionContent:
    - type: link
      url: https://posthog.com/handbook/engineering/clickhouse/replication
      title: 'ClickHouse Storage: Tables and Sharding: table roles'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
        are stated explicitly.'
    - type: callout
      title: Boundary to verify
      body: A local shard count is not automatically a total. Replicas can duplicate physical copies rather than
        add distinct business records.
    workedExampleContent:
    - type: callout
      title: Trace the example
      body: The model has two shards. Shard A holds events e1 and e3; shard B holds e2 and e4. A distributed read
        can query both. A local read on A sees only its own subset.
    problems:
    - question: In the supplied model, what is the role of a distributed query surface?
      options:
      - Hold an extra unique copy outside local tables.
      - Choose canonical actor from profile name.
      - Turn every replica into a new unique event.
      - Combine/read the relevant shard scope.
      correct: 3
      explanation: Distributed reads cover multiple storage subsets. Local reads and replicas have different roles.
      id: 5e9adfd8-36fe-47d5-ad5c-40a0f572e741
      type: multiple_choice
      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: Shard A holds e1 and e3, and shard B holds e2 and e4. A query reads only the local table on A.
        Which event set can it return from those rows?
      options:
      - e1 and e3.
      - e2 and e4 only.
      - No events because shards differ.
      - All four despite a local-only read.
      correct: 0
      explanation: A local read covers its local subset. Use the intended distributed surface when the query requires
        all shards.
      id: 40c52e8c-376e-47fa-8fae-e2a4780de5b0
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: An internal local-table count is 50; a distributed count is 100 for the same filters. Which check
        precedes a loss claim?
      options:
      - Replay50 arbitrary records immediately.
      - Shard/replica/query scope.
      - Add each replica count as new business events.
      - Declare the local query authoritative globally.
      correct: 1
      explanation: A local shard count is not automatically a total. Replicas can duplicate physical copies rather
        than add distinct business records.
      type: scenario
      difficulty: 4
      id: 5ea48978-6199-45b8-9570-315e3d7eed9b
      purpose: practice
      isTransfer: true
    - question: Two replicas each hold the same 20 event UUIDs. An engineer sums their counts as40 purchases.
        What fixture disproves the metric?
      options:
      - Count physical replicas as separate purchases.
      - Add replica counts without identity reconciliation.
      - Distinct identities across replica copies.
      - Treat replication factor as business occurrence count.
      correct: 2
      explanation: Physical storage copies and unique business occurrences have different grain. Verify identity
        sets rather than add replica totals.
      type: scenario
      difficulty: 4
      id: posthog-ingestion-pipeline-ph-clickhouse-storage-table-roles-exam-1
      purpose: exam
      isTransfer: true
    - question: A TAM only has the supported cloud SQL editor. A customer asks which local ClickHouse shard contains
        an event. What is a sound investigation boundary?
      options:
      - Infer current shard from an obsolete teaching hash.
      - Treat one local shard as complete project scope.
      - Request internal access without checking permissions/support.
      - Supported query plus deployment-specific escalation.
      correct: 3
      explanation: Customer query surfaces and internal deployment telemetry have different access and semantics.
        Do not infer current routing from an abstract model.
      type: scenario
      difficulty: 4
      id: posthog-ingestion-pipeline-ph-clickhouse-storage-table-roles-exam-2
      purpose: exam
      isTransfer: true
    keyPrerequisite: ph-ingestion-pipeline
  - id: reads-writes-and-sharding
    instruction: '**Shard routing** chooses where data is written according to a specified key. For these exercises
      only, the system routes by a hash of project ID and raw distinct ID. Do not infer a production routing rule
      from this teaching model.


      One resolved person can have several raw distinct IDs. Those IDs need not route to the same shard. A complete
      person-history query must account for identity links and the relevant storage scope.


      Application boundary: This hash and placement example is a supplied teaching model only. Current deployment
      routing is not inferred from this rule. For real support work, verify linked-identity history with supported
      project queries and escalate internal shard-scope questions using actual deployment evidence.'
    workedExample: Under the supplied routing rule, anonymous ID a1 lands on shard A and known ID user_9 lands
      on shard B. A valid identity link can connect their person history even though the raw events are stored
      separately.
    instructionContent:
    - type: link
      url: https://posthog.com/handbook/engineering/clickhouse/replication
      title: 'ClickHouse Storage: Tables and Sharding: reads writes and sharding'
      description: 'Verification date: 2026-10-07. Read the named claim and scope in this lesson; fixture assumptions
