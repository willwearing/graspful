      difficulty: 2
      purpose: practice
      isTransfer: false
    - question: The model routes a1 to shard A and user_9 to shard B. They later resolve to one person. Where
        can that person's raw events remain?
      options:
      - Necessarily only shardB.
      - Across both original shards.
      - Only browser storage.
      - Necessarily only shardA.
      correct: 1
      explanation: Resolved identity does not by itself prove physical colocation. Read the relevant shards and
        apply the appropriate identity logic.
      id: b56cbbca-5856-406c-8975-9b9679c81f1c
      type: scenario
      difficulty: 3
      purpose: practice
      isTransfer: false
    - question: An internal incident fixture records a1 events on shardA and user9 events on shardB, then confirms
