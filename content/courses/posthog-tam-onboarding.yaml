    passingScore: 0.75
    questionCount: 4
    timeLimitMinutes: 8
concepts:
- id: entities
  name: 'Entities: Things That Exist'
  difficulty: 2
  estimatedMinutes: 10
  tags:
  - foundational
  - data-modeling
  section: data-modeling-basics
  prerequisites: []
  encompassing: []
  knowledgePoints:
  - id: what-is-an-entity
    instruction: '**An entity** is a kind of thing whose individual instances the system must track. A customer
      and an order can each have an identity and several facts. A name or a price is usually an attribute of such
      a thing.


      Start with nouns, then check the requirements. An action can also become an entity when you must track each
      occurrence, such as an appointment or a payment.'
    workedExample: A clinic records each appointment, its time, patient, and outcome. Appointment is an entity because
      two appointments can involve the same patient and still need separate records.
    instructionContent:
    - type: callout
      title: Practice method
      body: State the requirement, trace the supplied evidence, and check whether your answer meets every stated
        constraint.
    workedExampleContent: []
    problems:
    - question: Which requirement most strongly supports treating something as an entity?
      options:
      - The value appears on a report.
      - The word appears as a noun in a sentence.
      - The value can be stored as text.
      - The system must distinguish individual instances and store facts about each.
      correct: 3
      explanation: Look for a need to identify and track separate instances. A noun alone does not establish that
        need.
      id: 3662f849-3bf9-4d05-81a9-c16591df003b
      type: multiple_choice
      difficulty: 2
    - question: A delivery app tracks each delivery attempt, including its time and outcome. One parcel can have
        several attempts. What should the model include?
      options:
      - Only an outcome label on the customer.
      - One latest-attempt field on Parcel, with earlier attempts overwritten.
      - A DeliveryAttempt entity with one instance per attempt.
      - One shared attempt record for all parcels.
      correct: 2
      explanation: Each attempt has its own identity and facts. Overwriting one field would lose the required history.
      id: 70659bff-d51b-456c-8b90-db868e946935
      type: scenario
      difficulty: 3
    - question: A team rejects Payment as an entity because paying is an action. The system must refund individual
        payments and retain their dates and amounts. What is the best review feedback?
      options:
      - Use the verb rule and remove Payment from the model.
      - Create one Payment record per customer regardless of the number of payments.
      - Keep only the latest paid amount on Customer.
      - Model individual payments because the requirements give each occurrence a separate identity.
      correct: 3
      explanation: The tracking requirement decides the model. A grammar shortcut must not remove separately refundable
        payment records.
      id: b912537a-dfd3-45fd-b404-ceea69246829
      type: scenario
      difficulty: 4
  - id: identifying-entities
    instruction: '**Entity discovery** starts with the system boundary. List the things that the application must
      manage, then test whether each needs its own records. Similar names can describe the same thing, while similar-looking
      objects can have different lifecycles.


      Ask stakeholders about ambiguous cases before you add or combine entities. A model should support the stated
      use cases without inventing extra ones.'
    workedExample: A library tracks a book title and each physical copy. Two copies share a title but have different
      barcodes and loan histories, so BookTitle and BookCopy serve different needs.
    instructionContent:
    - type: callout
      title: Practice method
      body: State the requirement, trace the supplied evidence, and check whether your answer meets every stated
        constraint.
    workedExampleContent: []
    problems:
    - question: Requirements use both Account and Customer, but their meaning is unclear. Which question helps decide
        whether they should be separate entity types?
      options:
      - Do the two words appear on different screens, regardless of their meaning?
      - Can their fields fit in one table, regardless of the business rules?
      - Can their instances exist independently, and do they have different identity or lifecycle rules?
      - Does one label appear more often in the requirements, regardless of its meaning?
      correct: 2
      explanation: Clarify independent identity and lifecycle. Different labels can describe one entity, and similar
        fields can describe separate entities.
      id: e7753f0c-ed9f-42f8-a07a-547baf4e6dc5
      type: multiple_choice
      difficulty: 2
    - question: A hiring system manages applicants and interviews. It only displays the employer name, and it manages
        no employer records. Which initial entity set fits the stated scope?
      options:
      - Applicant, Interview, and a mandatory employer-management subsystem.
      - Applicant and Interview.
      - Interview only, with applicant details repeated in every interview.
      - Applicant only, with one interview date overwritten each time.
      correct: 1
      explanation: Applicant and Interview have separate records in scope. A displayed label alone does not require
        an employer-management entity.
      id: 6e5ac7fe-674b-426f-884e-e14a6a9ed159
      type: scenario
      difficulty: 3
    - question: A school uses Student and Customer for the same people in different screens. The requirements do
        not say whether one person can hold both roles. What should happen before you create two unrelated entity
        types?
      options:
      - Create unrelated records because the screen labels differ.
      - Use the displayed name to match records after launch.
      - Combine them and discard the role distinction immediately.
      - Clarify shared identity and role rules with the stakeholders.
      correct: 3
      explanation: Clarify identity and lifecycle first. Both unconditional separation and unconditional merging
        can encode the wrong business rules.
      id: 0e4f2039-f77d-4beb-b295-9c82b966a550
      type: scenario
      difficulty: 4
- id: attributes
  name: 'Attributes: Properties of Entities'
  difficulty: 2
  estimatedMinutes: 14
  tags:
  - foundational
  - data-modeling
  section: data-modeling-basics
  prerequisites:
  - entities
  encompassing: []
  knowledgePoints:
  - id: what-are-attributes
    instruction: '**Attributes** describe an entity instance. Choose their shape from how the application reads,
      validates, and searches the data. A single address string can support display. Separate city and postal-code
      fields support reliable filters and validation.


      Store units and meanings with numeric fields in the schema design. A number without a defined unit can support
      conflicting interpretations.'
    workedExample: A parcel has weight_grams = 750. The field name defines the unit. An address used for postal-code
      filtering has a separate postal_code attribute.
    instructionContent:
    - type: callout
      title: Practice method
      body: State the requirement, trace the supplied evidence, and check whether your answer meets every stated
        constraint.
    workedExampleContent: []
    problems:
    - question: Which item is an attribute of a particular parcel?
      options:
      - The delivery company entity type.
      - Its weight in grams.
      - The collection of all parcels.
      - The rule that customers may send parcels.
      correct: 1
      explanation: An attribute records a fact about one instance. Weight needs a defined unit to be interpreted
        correctly.
      id: 97db87f1-e5bf-48d4-9700-0174d385ac7f
      type: multiple_choice
      difficulty: 2
    - question: A contact system must filter addresses by city and validate postal codes. Which design directly
        supports both needs?
      options:
      - Separate city and postal_code attributes, with other address fields as needed.
      - A free-text notes field containing the address.
      - A numeric address ID with no address details stored anywhere.
      - A single unstructured address string used for every operation.
      correct: 0
      explanation: Use structured components for required filters and validation. A display-only string makes these
        operations unreliable.
      id: 4c53b2cb-5a2b-4247-bb28-b264152630d5
      type: scenario
      difficulty: 3
    - question: Two services write 500 and 0.5 to a field named weight for the same parcel. One uses grams and the
        other kilograms. Which change addresses the cause?
      options:
      - Define one storage unit, validate inputs, and convert at the integration boundary.
      - Average the two values before displaying them.
      - Store whichever value arrives last without documenting its unit.
      - Rename the field size and keep both input conventions.
      correct: 0
      explanation: The mismatch is semantic. Define a shared unit and conversion rule before comparing or combining
        values.
      id: 3345f795-777f-4eb6-a1a5-4e1bd158db21
      type: scenario
      difficulty: 4
  - id: attribute-boundaries
    instruction: '**Attribute ownership** follows the fact being described. A customer owns their current contact
      address. An invoice can own a snapshot of the billing address used when it was issued.


      A stored snapshot preserves a past fact. A reference to current data follows later changes. Choose deliberately
      from the requirement, and label historical snapshots clearly.'
    workedExample: A customer changes address in June. A May invoice retains its billing_address_at_issue, while
      the customer record receives the new current address.
    instructionContent:
    - type: callout
      title: Practice method
      body: State the requirement, trace the supplied evidence, and check whether your answer meets every stated
        constraint.
    workedExampleContent: []
    problems:
    - question: Which question best determines where an attribute belongs?
      options:
      - Which entity currently has the fewest attributes?
      - Which entity instance and point in time does this fact describe?
      - Which screen first displayed this fact?
      - Which placement duplicates the fewest values regardless of historical requirements?
      correct: 1
      explanation: Ownership depends on meaning and time. Table size and implementation order do not establish the
        correct owner.
      id: e738005a-a527-4a0b-a47d-518f2a8df609
      type: multiple_choice
      difficulty: 2
    - question: A customer can place many orders. Each order has a different shipping address, and the exact address
        used must remain available. Where should that address be stored?
      options:
      - As a shipping-address snapshot for each order.
      - Only as a product attribute.
      - Only as the customer's current address.
      - As one shared address overwritten by the latest order.
      correct: 0
      explanation: The address describes that order at shipping time. A current customer address cannot preserve
        several historical destinations.
      id: 7c7448aa-b4f2-45df-b420-80108be8ff57
      type: scenario
      difficulty: 3
    - question: Old invoices now show a customer's new address because the invoice screen always reads the current
        customer record. The requirement is to reproduce the issued invoice. What is the sound fix?
      options:
      - Copy the current address into every old invoice and label it historical.
      - Prevent all future customer address changes.
      - Remove invoice addresses from all documents.
      - Use an invoice-time address snapshot and recover historical values only from reliable records.
      correct: 3
      explanation: A snapshot meets the requirement for future invoices. Existing historical values require evidence;
        current data cannot reconstruct them reliably.
      id: c52e0835-6c15-41d3-83eb-ac8539b33d54
      type: scenario
      difficulty: 4
- id: keys-and-identity
  name: 'Keys: Uniquely Identifying Things'
  difficulty: 3
  estimatedMinutes: 18
  tags:
  - foundational
  - data-modeling
  section: data-modeling-basics
  prerequisites:
  - entities
  - attributes
  encompassing: []
  knowledgePoints:
  - id: primary-keys
    instruction: 'A **primary key** uniquely identifies each row and cannot be null. It can contain one column or
      a combination of columns. Human-readable names often repeat and usually need a separate identifier.


      The key identifies the row; other constraints express business rules. Check uniqueness in the full intended
      scope, including records from different tenants or source systems.'
    workedExample: Two customers can both be named Sam Lee. customer_id values 41 and 42 keep their records distinct
      without changing either name.
    instructionContent:
    - type: link
      url: https://www.postgresql.org/docs/current/ddl-constraints.html
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: What does a primary key guarantee for rows in its table?
      options:
      - Rows are returned in insertion order.
      - Every value stays unchanged forever.
      - A unique, non-null key value or key combination.
      - Every column is unique.
      correct: 2
      explanation: A primary key enforces uniqueness and non-null values. Stable key choice is a design decision,
        and query order needs its own rule.
      id: d6ff62a6-5cf6-476f-aec9-b181818459b8
      type: multiple_choice
      difficulty: 2
    - question: Two tenants both use local customer number 17. The shared table must store both. Which proposed
        primary key preserves that distinction?
      options:
      - The customer's current subscription plan.
      - The combination of tenant_id and local_customer_number.
      - local_customer_number alone.
      - The customer's display name alone.
      correct: 1
      explanation: The number is unique only inside a tenant. Include the tenant in the key scope or use a globally
        unique surrogate key.
      id: 63ee4b9a-f094-4294-814d-35d5ba3b5d17
      type: scenario
      difficulty: 3
    - question: A migration plans to use email as a primary key, but the source contains shared email addresses
        and missing emails. Which conclusion follows from the evidence?
      options:
      - Delete all rows that share an email without a business decision.
      - Replace every missing email with the same placeholder and use it as the key.
      - Proceed because most emails are unique.
      - Choose another valid key and define separate email rules.
      correct: 3
      explanation: The proposed column violates the required uniqueness and non-null rules. Preserve valid records
        and choose an identity design that fits the data.
      id: 36b4fbad-d3ff-4a51-bc25-2f7eeeab0fb8
      type: scenario
      difficulty: 4
  - id: foreign-keys-need-stable-targets
    instruction: 'A **foreign key** requires a referenced value to exist in an eligible unique or primary key. The
      update rule controls what happens when the referenced key changes. With ON UPDATE CASCADE, the database can
      update dependent references. Other rules can reject the change.


      Stable identifiers reduce the need for coordinated updates. Use a mutable name or email as descriptive data
      when it has no need to be the identifier.'
    workedExample: Orders reference customer_id 41. Changing that customer's email leaves the relationship intact.
      If email were the referenced key, the update would need the configured foreign-key action.
    instructionContent:
    - type: link
      url: https://www.postgresql.org/docs/current/ddl-constraints.html
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Why does a stable customer ID help orders retain their customer relationship?
      options:
      - A change to descriptive customer data leaves the referenced ID intact.
      - It causes deleted customers to remain available automatically.
      - It makes every customer attribute immutable.
      - It removes the need for a foreign-key constraint.
      correct: 0
      explanation: Stable IDs separate record identity from mutable descriptions. Referential rules are still needed
        for updates and deletes.
      id: 6af84e4b-ca7c-4947-9c09-6a8c3d749a15
      type: multiple_choice
      difficulty: 2
    - question: Order.customer_email references a unique Customer.email with ON UPDATE CASCADE. A valid email changes.
        What does that configured rule do?
      options:
      - Deletes the related orders.
      - Always rejects the email change.
      - Updates the matching foreign-key values in Order.
      - Always leaves dangling order references.
      correct: 2
      explanation: CASCADE propagates this key update. Do not assume all mutable-key changes break references; inspect
        the configured action.
      id: 165c79e0-4f85-4c17-9c9b-fe7dc5f44fa6
      type: scenario
      difficulty: 3
    - question: A proposed integration uses a customer's editable display name as a referenced key. Names can repeat,
        and several services send references asynchronously. Which design reduces both ambiguity and update coordination?
      options:
      - Use the name and disable validation when duplicates appear.
      - Require each service to guess the latest spelling of the name.
      - Use a stable unique customer ID in every service and keep the name as a separate attribute.
      - Add the current date to the name whenever a conflict occurs.
      correct: 2
      explanation: A shared stable identifier avoids duplicate-name ambiguity and coordinated reference rewrites.
        The display name can then change independently.
      id: 10d6d08b-61be-4828-b322-4415a63c8d11
      type: scenario
      difficulty: 4
  - id: choosing-key-types
    instruction: 'A **natural key** comes from the domain. A **surrogate key** is assigned for record identity,
      such as a generated number or UUID. A surrogate key does not enforce business uniqueness by itself. Add a
      unique constraint for any separate rule, such as one account per tenant and external account number.


      Choose keys from their real scope, stability, and constraints rather than their appearance.'
    workedExample: An import assigns each row a UUID. It also enforces uniqueness on source_system plus external_id
      so the same source record cannot be inserted twice under different UUIDs.
    instructionContent:
    - type: link
      url: https://www.postgresql.org/docs/current/ddl-constraints.html
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: After adding a generated UUID primary key, what enforces the rule that an external account number
        is unique within each tenant?
      options:
      - The UUID primary key automatically enforces that rule.
      - A non-unique display-name column.
      - A convention that import jobs should avoid duplicates, with no validation.
      - A separate unique constraint on tenant_id and external_account_number.
      correct: 3
      explanation: A surrogate key identifies rows. Business uniqueness needs its own constraint or equivalent enforcement.
      id: e3c1ce87-77b5-45a7-a1fb-9facc092bf5e
      type: multiple_choice
      difficulty: 2
    - question: A product table uses generated product_id values. The business also requires each active SKU to
        be unique. Two imports create different product IDs with the same SKU. Which missing rule explains the duplicate?
      options:
      - The SKU must be removed because surrogate and natural identifiers cannot coexist.
      - A separate uniqueness rule for the SKU in the required business scope.
      - A generated primary key automatically validates every business field, so no rule is missing.
      - The product_id values must be identical whenever any descriptive field matches.
      correct: 1
      explanation: A surrogate primary key prevents duplicate row identities. The SKU business rule needs its own
        constraint or equivalent validation.
      id: 0c3faceb-fdfa-4d31-b1c9-97ec58d5e36d
      type: scenario
      difficulty: 3
    - question: A team favors a product code as the primary key because it is readable. Codes are reassigned after
        product retirement, while orders must reference the original product indefinitely. What is the better design?
      options:
      - Use the current product name as the permanent key.
      - Reuse the old product row whenever the code is reassigned.
      - Use a permanent product ID and model the code with its business validity rules.
      - Update historical orders to point to the new product with the same code.
      correct: 2
      explanation: Historical references need permanent identity. A reused business code cannot alone distinguish
        the old and new product.
      id: 46df7538-67b7-49c8-89de-dfad5462bf1b
      type: scenario
      difficulty: 4
- id: relationships
  name: 'Relationships: How Entities Connect'
  difficulty: 3
  estimatedMinutes: 12
  tags:
  - foundational
  - data-modeling
  section: data-modeling-design
  prerequisites:
  - entities
  - keys-and-identity
  encompassing: []
  knowledgePoints:
  - id: what-are-relationships
    instruction: 'A **relationship** connects entity instances according to a business rule, such as an order placed
      by a customer. In a relational database, a foreign-key column can store the reference, and a foreign-key constraint
      can enforce its validity.


      The conceptual relationship can exist even if no database constraint enforces it. In that case, application
      logic or data checks must detect invalid references.'
    workedExample: Order.customer_id records which customer placed an order. A foreign-key constraint rejects a
      value that points to a nonexistent customer, subject to the declared null rules.
    instructionContent:
    - type: link
      url: https://www.postgresql.org/docs/current/ddl-constraints.html
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: What does the relationship "Customer places Order" describe?
      options:
      - A requirement that Customer and Order use identical columns.
      - A single attribute value shared by all customers.
      - A connection between a particular customer and their orders.
      - The physical order of rows on disk.
      correct: 2
      explanation: A relationship connects instances. Storage layout and shared column structure are separate design
        choices.
      id: 7a0bf420-fc33-48c3-9c70-23bf641832dc
      type: multiple_choice
      difficulty: 2
    - question: Order.customer_id contains customer IDs, but the database has no foreign-key constraint. Which statement
        is accurate?
      options:
      - The reference models a relationship, but the database does not enforce that customers exist.
      - Every customer ID is guaranteed valid.
      - Each order must now belong to every customer.
      - The data cannot represent a relationship at all.
      correct: 0
      explanation: Distinguish the reference from enforcement. Without the constraint, invalid references can enter
        unless another control prevents them.
      id: f796cb4d-1dde-4ed7-9977-9505424f5bea
      type: scenario
      difficulty: 3
    - question: An audit finds orders referring to deleted customers in a schema without foreign-key enforcement.
        Which response addresses both existing damage and future integrity?
      options:
      - Add a join to hide unmatched orders from every report.
      - Investigate and repair the invalid references, then add suitable enforcement or controlled deletion rules.
      - Copy the deleted customer ID into a text field and treat it as verified.
      - Rename customer_id to make the intended relationship clearer.
      correct: 1
      explanation: Hiding rows conceals the issue. Repair using evidence and enforce the intended relationship so
        the fault does not recur.
      id: b9dfaf70-75dd-43b9-807a-6408ed66d450
      type: scenario
      difficulty: 4
  - id: optional-vs-mandatory
    instruction: '**Optionality** specifies whether an instance can exist without a related instance. For a foreign-key
      column, NOT NULL requires a value and the foreign-key constraint requires that value to reference a valid
      row.


      Consider lifecycle stages. A draft may allow a missing assignee, while a submitted record may require one.
      That conditional business rule needs suitable validation.'
    workedExample: A draft support ticket may have assignee_id = null. Submission checks that an assignee is present.
      A foreign key checks that a supplied assignee exists.
    instructionContent:
    - type: link
      url: https://www.postgresql.org/docs/current/ddl-constraints.html
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which combination requires every stored order to reference an existing customer through customer_id?
      options:
      - A unique order number and an unconstrained customer_id.
      - A NOT NULL customer_id and a foreign-key constraint.
      - A nullable customer_id with a foreign-key constraint.
      - A NOT NULL customer_id with no reference validation.
      correct: 1
      explanation: NOT NULL enforces presence. The foreign key enforces a valid reference. Both are needed for the
        stated rule.
      id: 2d4c0653-7dcb-42b4-aafd-50af6f32438a
      type: multiple_choice
      difficulty: 2
    - question: A ticket can remain unassigned in a queue. Once an agent is assigned, that agent must exist. Which
        column design fits this basic rule?
      options:
      - A unique assignee_id that allows each agent only one ticket.
      - An unconstrained assignee name.
      - A nullable assignee_id with a foreign-key constraint.
      - A mandatory assignee_id with a fake agent ID for unassigned tickets.
      correct: 2
      explanation: Null represents the permitted absence. The foreign key validates supplied assignees without inventing
        fake records.
      id: 6be7b8bb-d1e2-4b10-ba6e-e443a3e802a8
      type: scenario
      difficulty: 3
    - question: Draft orders may have no address, but submitted orders must have one. Making address_id NOT NULL
        prevents valid drafts. What should the design add?
      options:
      - Validation that requires a valid address when the order enters the submitted state.
      - A rule allowing submitted orders to omit addresses permanently.
      - A fabricated address for every draft.
      - A unique constraint on address_id so drafts cannot share addresses.
      correct: 0
      explanation: The requirement depends on lifecycle state. Enforce the state transition while retaining valid
        drafts.
      id: 4429ff6e-9b45-4aa7-840f-ee5c91e11b12
      type: scenario
      difficulty: 4
- id: cardinality
  name: 'Cardinality: How Many of Each?'
  difficulty: 4
  estimatedMinutes: 18
  tags:
  - foundational
  - data-modeling
  section: data-modeling-design
  prerequisites:
  - relationships
  encompassing: []
  knowledgePoints:
  - id: cardinality-types
    instruction: '**Cardinality** gives the maximum number of related instances in each direction. One-to-many from
      Author to Book means one author can have many books, while each book has at most one author under that model.
      Co-authorship changes that rule.


      Optionality gives the minimum, often zero or one. State both direction and domain rules before choosing a
      cardinality.'
    workedExample: In a single-author catalog, Author to Book is one-to-many. A catalog that permits co-authors
      needs many-to-many, because both directions can have several instances.
    instructionContent:
    - type: callout
      title: Practice method
      body: State the requirement, trace the supplied evidence, and check whether your answer meets every stated
        constraint.
    workedExampleContent: []
    problems:
    - question: In a model where each book has exactly one author and an author can write many books, what is the
        cardinality from Author to Book?
      options:
      - One-to-many.
      - Many-to-many.
      - One-to-one.
      - Many-to-one.
      correct: 0
      explanation: Read the direction explicitly. The first author can relate to many books; each book has only
        one author under the stated rule.
      id: 71949062-c167-4322-aa2a-540b508f963b
      type: multiple_choice
      difficulty: 2
    - question: Each employee may have zero or one assigned locker. Each locker may have zero or one employee. How
        should the relationship be described?
      options:
      - An optional one-to-one relationship on both sides.
      - A mandatory one-to-one relationship on both sides.
      - One employee to many lockers.
      - Many employees to many lockers.
      correct: 0
      explanation: The maximum is one in each direction, while the minimum is zero. Optionality and maximum cardinality
        express different parts of the rule.
      id: 45e5d5be-e4a8-4484-9c1b-aedbaac1f550
      type: scenario
      difficulty: 3
    - question: A design assumes each patient has one doctor. Interviews show patients can see several doctors and
        doctors can treat several patients. What must change?
      options:
      - Keep one-to-many and overwrite the patient's doctor after each visit.
      - Make Doctor.name unique and keep the original relationship.
      - Use a many-to-many relationship based on the confirmed care rules.
      - Keep the model because a patient has only one doctor during a single appointment.
      correct: 2
      explanation: The relationship concerns all relevant care connections, not just one appointment. Both directions
        can have multiple instances.
      id: 56abde6f-d857-4141-a9f8-64a5b35486c7
      type: scenario
      difficulty: 4
  - id: implementing-cardinality
    instruction: 'For a **one-to-many relationship**, put the reference on the many side. Several orders can reference
      one customer. A unique constraint on that reference would restrict it to at most one order per customer.


      Model direct relationships from business rules. A path through other entities does not automatically require
      another stored relationship.'
    workedExample: Playlist references its owner User. PlaylistSong links playlists to songs. A user can reach songs
      through playlists; a separate UserSong record is needed only if the application tracks a distinct user-song
      fact, such as a favorite.
    instructionContent:
    - type: link
      url: https://www.postgresql.org/docs/current/ddl-constraints.html
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Where does the foreign key usually sit for Customer to Order, when a customer can have many orders
        and each order has one customer?
      options:
      - On Order, referencing Customer.
      - Only in the customer's display name.
      - On both tables with unrelated values.
      - On Customer, with space for only one order ID.
      correct: 0
      explanation: The many side holds the reference. Each order then selects its customer while a customer can
        be referenced repeatedly.
      id: c6a84952-ef14-4fcd-af2e-f67504e8d726
      type: multiple_choice
      difficulty: 2
    - question: Customer to Order should be one-to-many, but Order.customer_id has a unique constraint. A second
        order for the same customer fails. What causes the failure?
      options:
      - The uniqueness rule restricts each customer to at most one order.
      - Order needs the customer name instead of its ID.
      - The foreign key alone prohibits repeated customer references.
      - The customer primary key should allow duplicate customer rows.
      correct: 0
      explanation: A foreign key allows repeated valid references. The extra unique constraint imposes the unintended
        one-to-one maximum.
      id: 21cee5b2-c500-4f7b-ad7d-1d99dc57e3a7
      type: scenario
      difficulty: 3
    - question: Users own playlists, and playlists contain songs. The only requirement is to find songs through
        a user's playlists. Should a separate UserSong table be added now?
      options:
      - Store the entire song catalog on each user.
      - Replace Playlist with UserSong and discard playlist membership.
      - Add it because every transitive connection must be stored twice.
      - Use the existing relationship path; add UserSong when a separate user-song fact is required.
      correct: 3
      explanation: An extra relationship needs its own meaning. Duplicating a derived path creates synchronization
        work without meeting a new requirement.
      id: 1207cb67-baa5-43a8-9008-e9103b501f44
      type: scenario
      difficulty: 4
- id: associative-entities
  name: 'Associative Entities: Join Tables'
  difficulty: 4
  estimatedMinutes: 14
  tags:
  - foundational
  - data-modeling
  section: data-modeling-design
  prerequisites:
  - cardinality
  encompassing: []
  knowledgePoints:
  - id: resolving-many-to-many
    instruction: 'A **join table** stores links in a many-to-many relationship. Each row references the two linked
      entities. A unique constraint on the pair can prohibit duplicate membership.


      If the same pair can relate repeatedly, define the occurrence as part of its identity. Repeated enrollments
      might include a course offering or term.'
    workedExample: StudentCourse(student_id, course_id) has one row per enrollment when a student can take each
      course once. If retakes are allowed, enrollment_id or an offering-aware key distinguishes occurrences.
    instructionContent:
    - type: link
      url: https://www.postgresql.org/docs/current/ddl-constraints.html
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: What is the purpose of a join table between Student and Course?
      options:
      - Store only the total number of students.
      - Force every student to take exactly one course.
      - Store individual links between students and courses.
      - Remove the identities of both linked entities.
      correct: 2
      explanation: Each row represents a relationship instance and references both endpoints.
      id: 1e89f7cf-c351-4ba8-94a2-a57ca4f64a61
      type: multiple_choice
      difficulty: 2
    - question: A student can enroll in each course only once. Which constraint prevents duplicate rows in StudentCourse?
      options:
      - A unique constraint on course_id alone.
      - A unique constraint on student_id and course_id together.
      - A unique constraint on an unrelated timestamp alone.
      - A unique constraint on student_id alone.
      correct: 1
      explanation: The pair defines membership. Uniqueness on either endpoint alone would incorrectly limit the
        many-to-many relationship.
      id: 51bea654-00c8-4d4c-bd72-30c713adef7b
      type: scenario
      difficulty: 3
    - question: The school now allows a student to retake the same course in a later term and retain both grades.
        What should the relationship model represent?
      options:
      - Separate enrollment occurrences, with term or offering identity and an appropriate uniqueness rule.
      - One grade on the Course record shared by all students.
      - Duplicate identical rows with no way to distinguish terms.
      - One row for the student-course pair with the old grade overwritten.
      correct: 0
      explanation: A retake is a separate occurrence. Its identity must preserve both attempts and their facts.
      id: f2af2807-0cca-4eb7-af80-af70119ad5c0
      type: scenario
      difficulty: 4
  - id: relationship-level-attributes
    instruction: 'A **relationship attribute** describes a link or occurrence. Quantity belongs to an order line
      because it depends on both the order and the product. A student''s grade belongs to their enrollment rather
      than to the student or course alone.


      Specify time when a relationship fact can change. A current membership role and a historical role assignment
      have different storage needs.'
    workedExample: OrderLine stores product_id, quantity, and unit_price_at_purchase. The product owns its current
      catalog price; the order line preserves the agreed historical price.
    instructionContent:
    - type: callout
      title: Practice method
      body: State the requirement, trace the supplied evidence, and check whether your answer meets every stated
        constraint.
    workedExampleContent: []
    problems:
    - question: Which fact belongs to an OrderLine linking an order and a product?
      options:
      - The order's unique ID definition.
      - The quantity of that product in that order.
      - The customer's date of birth.
      - The product's global SKU.
      correct: 1
      explanation: Quantity describes this specific line. It can differ for the same product in another order.
      id: d1570bd8-bd9f-4be0-8716-a0eff2294c30
      type: multiple_choice
      difficulty: 2
    - question: Alex is an administrator in workspace A and a viewer in workspace B. Where should the workspace
        role be recorded?
      options:
      - On the product's pricing plan.
      - On each Alex-workspace membership.
      - As one global role on Alex.
      - As one role shared by all users of each workspace.
      correct: 1
      explanation: The role depends on both person and workspace. A single global value cannot represent both memberships.
      id: 8c5c17d2-6b71-4957-b8ae-8def34a42b43
      type: scenario
      difficulty: 3
    - question: An audit must show who held a workspace role on any past date. The current Membership.role field
        is overwritten on each change. Which model meets the new requirement?
      options:
      - Keep overwriting the field and infer history from its current value.
      - Copy the current role onto every user event regardless of event time.
      - Create a new workspace each time someone changes role.
      - Record role assignments with effective time ranges and rules that prevent conflicting overlaps.
      correct: 3
      explanation: Historical questions require historical evidence. Effective intervals preserve when each relationship
        fact applied.
      id: d8a0d41c-4b2c-41e6-9745-6d71379d6650
      type: scenario
      difficulty: 4
- id: data-modeling-process
  name: The Data Modeling Design Process
  difficulty: 3
  estimatedMinutes: 15
  tags:
  - foundational
  - data-modeling
  section: data-modeling-design
  prerequisites:
  - associative-entities
  encompassing: []
  knowledgePoints:
  - id: five-step-workflow
    instruction: 'Use this **modeling workflow** as a guide:


      1. Define the use cases and candidate entities.

      2. Describe attributes and identity.

      3. Define relationships.

      4. State cardinality, optionality, and constraints.

      5. Validate with sample data and real use cases.


      Iterate when evidence changes a rule. A diagram, paper example, or small SQL prototype can help. Choose a
      tool that exposes mistakes cheaply.'
    workedExample: A sample shows a customer with two addresses. If the model permits only one and the use case
      needs both, revise the relationship before the design is treated as finished.
    instructionContent:
    - type: callout
      title: Practice method
      body: State the requirement, trace the supplied evidence, and check whether your answer meets every stated
        constraint.
    workedExampleContent: []
    problems:
    - question: What is the purpose of the validation step in the modeling workflow?
      options:
      - Treat successful table creation as proof that all business cases work.
      - Test the model against real cases and revise rules that fail.
      - Confirm that the table names match the first requirements draft.
      - Ensure the diagram uses a separate entity for every noun.
      correct: 1
      explanation: Validation tests whether the design represents required cases. It can send you back to earlier
        decisions.
      id: 4a08877f-0bfb-4af2-b517-8f6ac8c6ec63
      type: multiple_choice
      difficulty: 2
    - question: A model lists Student and Course but has no enrollment relationship or cardinality rules. Which
        work is still needed before realistic validation?
      options:
      - Add a mandatory course_id to Student without checking whether students take multiple courses.
      - Assume each student has exactly one course without checking.
      - Choose a database engine and assume its defaults establish the enrollment rules.
      - Define how students connect to courses and the allowed counts and absences.
      correct: 3
      explanation: Entity lists alone do not describe valid connections. State the relationship rules before testing
        sample enrollments.
      id: 02b81938-9a13-4bc1-b4d5-7e24785259db
      type: scenario
      difficulty: 3
    - question: A team disagrees about whether a many-to-many design supports retakes. They can test sample enrollments
        in a small SQL prototype today. How should they use it?
      options:
      - Avoid prototypes because modeling must use diagrams exclusively.
      - Run representative and edge cases, then revise the model from the results.
      - Treat successful table creation as proof that every business case works.
      - Skip requirements review once the SQL executes.
      correct: 1
      explanation: A prototype is a valid modeling tool. Test the business cases and constraints, not just whether
        tables can be created.
      id: 3ca393b0-5748-490e-ab70-bd23b202037e
      type: scenario
      difficulty: 4
  - id: applying-the-workflow
    instruction: '**Model validation** uses examples that can disprove the design. Include empty cases, repeated
      relationships, changes over time, and records from different tenants. Trace one required query or operation
      through the proposed model.


      When a case fails, identify the missing entity, relationship, or constraint. Change that part and rerun the
      affected cases.'
    workedExample: A subscription model passes a single-account example but fails when one user joins two accounts.
      That case exposes an assumed one-to-one relationship that needs revision.
    instructionContent:
    - type: callout
      title: Practice method
      body: State the requirement, trace the supplied evidence, and check whether your answer meets every stated
        constraint.
    workedExampleContent: []
    problems:
    - question: Which test case is most useful for checking a claimed many-to-many enrollment model?
      options:
      - Several students each take a different single course, with no shared courses.
      - One student takes one course, with no other cases.
      - Several students share a course, and one student takes several courses.
      - An empty StudentCourse table with valid column names.
      correct: 2
      explanation: Exercise both directions of multiplicity. A one-to-one example can pass under an incorrect, more
        restrictive model.
      id: e34e9edb-892d-49e1-a72e-ca5589655438
      type: multiple_choice
      difficulty: 2
    - question: A team has identified entities, attributes, keys, relationships, and cardinality rules. What is
        the next step in the stated five-step workflow?
      options:
      - Deploy immediately because the diagram has all its labels.
      - Validate with sample data and required operations.
      - Optimize table indexes before testing whether the model represents the required cases.
      - Restart entity discovery without testing the completed model.
      correct: 1
      explanation: The structural decisions are ready to be tested. Representative operations reveal gaps before
        deployment.
      id: 5677bdb3-bb44-479c-9d85-2a54e53b2bd8
      type: scenario
      difficulty: 3
    - question: A model passes signup tests but cannot represent a user leaving one account and later rejoining
        with a different role while retaining history. What is the best next action?
      options:
      - Create a new user identity for every role change.
      - Add or revise time-aware membership occurrences, then retest joining, leaving, and historical role queries.
      - Overwrite the old membership and declare the history out of scope despite the requirement.
      - Remove the historical query from the test suite.
      correct: 1
      explanation: The failing use case points to relationship history. Repair that specific model gap and verify
        both current and historical behavior.
      id: 96798093-53da-4930-b390-21626d552356
      type: scenario
      difficulty: 4
- id: what-is-a-pipeline
  name: What Is a Data Pipeline?
  difficulty: 2
  estimatedMinutes: 14
  tags:
  - foundational
  - pipelines
  section: pipeline-basics
  prerequisites: []
  encompassing: []
  knowledgePoints:
  - id: pipeline-definition-and-flow
    instruction: 'A **data pipeline** moves data through connected processing steps. Those steps can ingest, store,
      transform, and serve data. Their order depends on the design. In ELT, data is loaded before transformation;
      ETL transforms before loading into the target.


      Name each boundary and the expected output. This makes a flow testable instead of treating the whole system
      as one black box.'
    workedExample: A nightly reporting flow copies orders into raw storage, converts currencies, and publishes a
      sales table. The raw copy lets the team rerun the conversion without reading the source again.
    instructionContent:
    - type: callout
      title: Practice method
      body: State the requirement, trace the supplied evidence, and check whether your answer meets every stated
        constraint.
    workedExampleContent: []
    problems:
    - question: Which description identifies a data pipeline?
      options:
      - A static collection of source records with no defined movement or processing.
      - Connected steps that move and process data from a source toward a use.
      - A dashboard that only displays an already prepared metric.
      - A rule requiring every system to transform before any storage.
      correct: 1
      explanation: A pipeline is the connected flow. ETL and ELT are possible designs rather than universal step
        orders.
      id: b8c1e0df-28d1-4aea-b5e0-7207b37498d1
      type: multiple_choice
      difficulty: 2
    - question: An ELT pipeline copies source records into its target before transforming them there. Put its three
        main stages in order.
      options:
      - Transform in the target
      - Extract from the source
      - Load into the target
      correct:
      - Extract from the source
      - Load into the target
      - Transform in the target
      explanation: 'Follow the observed steps: the raw records are loaded before transformation. That is ELT.'
      type: ordering
      id: 4e501716-46fa-413c-8c5b-f2f000792d42
      difficulty: 3
    - question: A customer asks where to add a currency conversion so reports use one reporting currency while source
        values remain recoverable. Which design meets both requirements?
      options:
      - Preserve source values and add a documented conversion step before serving the report.
      - Convert values after the report has already summed mixed currencies.
      - Overwrite the only source values and discard the conversion rate.
      - Use the first currency found as the unit for every row.
      correct: 0
      explanation: Preserve the original evidence and transform at a defined boundary. Mixed-currency sums and undocumented
        overwrites cannot satisfy both requirements.
      id: 50446203-d471-447f-907b-ff153285ef10
      type: scenario
      difficulty: 4
  - id: pipeline-failure-points
    instruction: '**Boundary checks** compare what entered and left each stage. Inspect counts, required fields,
      identifiers, timestamps, and error records. Data can arrive but still be wrong, incomplete, duplicated, or
      late.


      Investigate the earliest boundary where evidence diverges from expectations. An accepted request proves less
      than a correctly queryable output.'
    workedExample: The source has 1,000 records, the raw store has 1,000, and the transformed table has 870. Check
      transform rejections and filters before changing the source connector.
    instructionContent:
    - type: callout
      title: Practice method
      body: State the requirement, trace the supplied evidence, and check whether your answer meets every stated
        constraint.
    workedExampleContent: []
    problems:
    - question: A pipeline reports that all requests were accepted. What still needs validation?
      options:
      - Only whether the destination connection can be opened.
      - Only whether the capture endpoint returned a success status.
      - Whether the expected records and values reached the final output correctly.
      - Nothing, because acceptance proves every downstream stage succeeded.
      correct: 2
      explanation: Acceptance is one boundary signal. Validate completeness, values, and downstream visibility separately.
      id: 6e739bce-c581-4980-a329-a6c493c02ef5
      type: multiple_choice
      difficulty: 2
    - question: Source count is 2,000, landing count is 2,000, and transformed count is 1,650. The serving layer
        shows those same 1,650 rows. Where does the first measured loss occur?
      options:
      - At every stage equally.
      - Between transformed output and serving.
      - Before the source produced records.
      - Between landing and transformed output.
      correct: 3
      explanation: Compare adjacent boundaries. The first change is in transformation, so start with its filters,
        errors, and input handling.
      id: 5566addf-7085-408b-bfd2-fd6db8c8ef4c
      type: scenario
      difficulty: 3
    - question: Counts match end to end, but revenue doubled after a retry. Which evidence should you inspect next?
      options:
      - Only the report's date range, without checking repeated record identities.
      - Record identities, retry behavior, and whether repeated records contribute twice to revenue.
      - Only total row counts, because equal counts rule out duplicated effects.
      - Only the connector success status, because a retry cannot change totals.
      correct: 1
      explanation: Equal counts do not prove correct values or deduplication. Trace stable record identities and
        the effect of retries on aggregation.
      id: 141a7c60-42b1-4e33-bbf4-51225b37d5f5
      type: scenario
      difficulty: 4
- id: sources-and-ingestion
  name: Sources & Ingestion Patterns
  difficulty: 3
  estimatedMinutes: 15
  tags:
  - foundational
  - pipelines
  section: pipeline-basics
  prerequisites:
  - what-is-a-pipeline
  encompassing: []
  knowledgePoints:
  - id: where-data-comes-from
    instruction: '**Source contracts** define the shape, ownership, and meaning of incoming data. Application events
      describe actions, operational databases store changing records, and third-party APIs expose another system''s
      data. Each needs an access and change strategy.


      Check identifiers, timestamps, pagination, deletion signals, and schema changes. A successful connection alone
      does not establish a complete extract.'
    workedExample: An API returns at most 100 invoices per page. The importer follows every next-page token and
      records a stable invoice ID so repeated fetches can be reconciled.
    instructionContent:
    - type: callout
      title: Practice method
      body: State the requirement, trace the supplied evidence, and check whether your answer meets every stated
        constraint.
    workedExampleContent: []
    problems:
    - question: Which source contract detail determines whether an API extract must make more requests after its
        first response?
      options:
      - Its authentication token's expiry time.
      - Its pagination rules.
      - Its policy for deleting source records.
      - Its schema's numeric field units.
      correct: 1
      explanation: Pagination determines how to retrieve the complete result. A successful first response may contain
        only one page.
      id: 9f1884c6-175c-4606-9baf-984b6cafbfeb
      type: multiple_choice
      difficulty: 2
    - question: A billing API says there are 240 invoices and returns pages of 100, 100, and 40. The importer stops
        after the first page. What is missing? Enter the number only.
      options: []
      correct: '140'
      explanation: The first page contains 100 of 240 records. Follow all pages and reconcile the extracted count.
      type: fill_blank
      id: ee2aa4d2-a6a5-4efd-8a2c-9dae9ed889ed
      difficulty: 3
    - question: An API removes deleted customers from ordinary list responses. A nightly incremental importer only
        requests recently updated rows. What must the team clarify to keep the destination accurate?
      options:
      - Whether the target can retain removed customers as active forever.
      - How deletions are signaled or detected, and how the importer applies them.
      - Whether changing the primary-key column name will expose deleted rows.
      - Whether a larger page size can substitute for deletion tracking.
      correct: 1
      explanation: Updates and deletions are separate contract concerns. Without deletion evidence or reconciliation,
        stale destination rows can survive indefinitely.
      id: 4502a462-535f-4305-8f23-1cb8e149bee9
      type: scenario
      difficulty: 4
  - id: ingestion-approaches
    instruction: '**Ingestion** brings source data into the pipeline. Batch ingestion handles bounded sets on a
      schedule. Streaming processes a continuing flow. Change data capture, or CDC, tracks database changes; it
      can use logs, triggers, or other methods.


      Log-based CDC reads supported change logs. Compare freshness needs, source load, available change history,
      and recovery behavior when choosing an approach.'
    workedExample: A dashboard with a 24-hour freshness target can use a nightly batch. A fraud alert with a seconds-level
      target needs a lower-latency path and monitoring that matches that target.
    instructionContent:
    - type: link
      url: https://aws.amazon.com/what-is/change-data-capture/
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: What specifically distinguishes log-based CDC from other CDC approaches?
      options:
      - It stores only final report images.
      - It means every possible CDC implementation uses logs.
      - It reads database change logs to observe changes.
      - It requires a full-table export for every change.
      correct: 2
      explanation: The qualifier log-based names the mechanism. CDC also includes other ways to detect changes.
      id: b229097f-aec3-4b58-bd33-ff0d38193ce5
      type: multiple_choice
      difficulty: 2
    - question: A daily finance report is due at 08:00 and may use data through midnight. A reliable 02:00 batch
        finishes in 30 minutes. Does the stated freshness need require streaming?
      options:
      - No. The batch meets the stated schedule if it completes and is validated.
      - Yes. Batch data cannot contain timestamps.
      - No. Therefore failures and completeness never need monitoring.
      - Yes. Every report requires second-level updates.
      correct: 0
      explanation: Select the approach from the actual freshness requirement. This batch fits, while still requiring
        operational checks.
      id: 62ee7ea9-ffab-45e3-ac06-bc14f660c722
      type: scenario
      difficulty: 3
    - question: A log-based CDC consumer was offline longer than the source retains change logs. Its last position
        is no longer available. What is the sound recovery plan?
      options:
      - Continue serving the old data as current indefinitely.
      - Use a supported resnapshot or reconciliation procedure, then resume changes from a consistent position.
      - Replay an arbitrary earlier timestamp without checking source availability.
      - Skip to the latest position and claim that no changes were lost.
      correct: 1
      explanation: A missing log interval breaks continuity. Recover a consistent baseline and verify it before
        claiming completeness.
      id: 7efba9a9-2b69-4326-9aea-b06b28a07858
      type: scenario
      difficulty: 4
- id: storage-layers
  name: 'Storage Layers: Where Data Lives'
  difficulty: 3
  estimatedMinutes: 16
  tags:
  - foundational
  - pipelines
  section: pipeline-basics
  prerequisites:
  - sources-and-ingestion
  encompassing: []
  knowledgePoints:
  - id: raw-lake-warehouse
    instruction: '**Raw storage** retains data close to its received form. A **data lake** commonly stores varied
      files for flexible later use. A **warehouse** provides queryable data for analysis and can contain both raw
      and curated tables. These roles can overlap.


      A curated dataset applies agreed types, definitions, and quality rules. Storage technology alone does not
      prove that curation happened.'
    workedExample: A warehouse has raw_orders and daily_revenue tables. The first preserves source rows; the second
      applies the finance team's revenue definition. Both are warehouse tables with different roles.
    instructionContent:
    - type: callout
      title: Practice method
      body: State the requirement, trace the supplied evidence, and check whether your answer meets every stated
        constraint.
    workedExampleContent: []
    problems:
    - question: What makes a dataset curated for a business metric?
      options:
      - A table name ending in final or certified.
      - The fact that the data is stored in a warehouse.
      - A successful copy job with no documented metric rules.
      - Agreed definitions and transformations with suitable quality checks.
      correct: 3
      explanation: Curation is a process with explicit rules. A storage label or filename does not establish trustworthy
        meaning.
      id: 3aaa1858-8479-470f-8ce3-32b6a18312ac
      type: multiple_choice
      difficulty: 2
    - question: A warehouse contains untouched source JSON in one table and validated daily sales in another. How
        should these tables be classified?
      options:
      - Neither can be used in a pipeline.
      - Both must be curated because warehouses cannot hold raw data.
      - Both must be raw because they share a database.
      - Raw and curated layers within the same warehouse.
      correct: 3
      explanation: Classify the role from the data and processing, not from the product category of the storage
        system.
      id: f8b07f6e-1058-4206-be79-e346c18fcef6
      type: scenario
      difficulty: 3
    - question: Two reports use different revenue definitions from the same warehouse. The team proposes moving
        all data to a lake to make the numbers agree. What should be addressed first?
      options:
      - Move the same conflicting calculations to a new storage format.
      - Align the metric definitions and transformations, then validate both report paths.
      - Rename both tables daily_revenue while keeping their different calculations.
      - Select whichever report shows the higher revenue without reconciling it.
      correct: 1
      explanation: The disagreement concerns meaning. Resolve the calculation rules before making an infrastructure
        change that may leave the conflict intact.
      id: 387f2ad5-4e42-4f51-a8a9-08d825c7eb36
      type: scenario
      difficulty: 4
  - id: choosing-storage-layers
    instruction: '**Storage-layer selection** balances recovery, query speed, cost, and access. Retaining raw inputs
      can support replay when logic changes. Curated outputs make routine queries easier and more consistent.


      Retention and access need explicit rules. Keeping every payload forever is a separate decision from choosing
      ETL, ELT, a lake, or a warehouse.'
    workedExample: A team retains restricted raw records for 30 days and keeps validated daily totals for two years.
      It can repair recent transformations while meeting its chosen retention policy.
    instructionContent:
    - type: callout
      title: Practice method
      body: State the requirement, trace the supplied evidence, and check whether your answer meets every stated
        constraint.
    workedExampleContent: []
    problems:
    - question: Which need most directly supports retaining replayable raw inputs?
      options:
      - Avoiding any retention decisions.
      - Guaranteeing that raw data is already a certified business metric.
      - Recomputing outputs after a transformation bug is fixed.
      - Making all source data public.
      correct: 2
      explanation: Raw inputs preserve evidence for replay. They still need access controls, retention rules, and
        interpretation.
      id: f811f787-24c3-48cf-a2e0-2fce67b918c0
      type: multiple_choice
      difficulty: 2
    - question: A calculation bug affected the last week. The pipeline retains raw inputs for 30 days and records
        transform versions. What recovery option does this enable?
      options:
      - Reprocess the affected inputs with the corrected transform and compare results.
      - Assume the existing totals are correct because raw data exists.
      - Recover years of discarded inputs without another source.
      - Recover the correct values merely by renaming the output table.
      correct: 0
      explanation: The retained inputs cover the affected week. Use them with the corrected logic and verify the
        replacement output.
      id: 6de1b028-f251-4353-9c6f-2fff9b5bb91b
      type: scenario
      difficulty: 3
    - question: A team needs daily aggregate reports for two years but only 14 days of detailed replay. Raw payloads
        include sensitive fields. Which design best fits those stated needs?
      options:
      - Apply restricted access and 14-day raw retention, with longer retention for the required aggregates.
      - Give every report viewer access to all detailed payloads.
      - Delete all raw data immediately and promise 14-day replay.
      - Keep every raw field forever because replay is sometimes useful.
      correct: 0
      explanation: Match retention and access to the separate use cases. Aggregated reporting does not require unlimited
        detailed retention.
      id: a421ded5-4997-4bfe-a48f-6da62593c26c
      type: scenario
      difficulty: 4
- id: transformation-etl-elt
  name: 'Transformation: ETL vs ELT'
  difficulty: 4
  estimatedMinutes: 15
  tags:
  - foundational
  - pipelines
  section: pipeline-architecture
  prerequisites:
  - storage-layers
  encompassing: []
  knowledgePoints:
  - id: what-transformation-does
    instruction: '**Transformation** changes data into a form or meaning required downstream. Examples include type
      conversion, normalization, enrichment, deduplication, and aggregation. Each rule should define how invalid
      and missing inputs are handled.


      Preserve enough evidence to explain output values. Quietly coercing a bad input to zero can corrupt an aggregate
      while making the job appear successful.'
    workedExample: A transform converts amount_cents = 1250 to amount_dollars = 12.50. If amount_cents contains
      "unknown", the row is rejected or quarantined under an explicit rule rather than counted as a zero-value sale.
    instructionContent:
    - type: callout
      title: Practice method
      body: State the requirement, trace the supplied evidence, and check whether your answer meets every stated
        constraint.
    workedExampleContent: []
    problems:
    - question: Which operation changes data meaning or structure as a transformation step?
      options:
      - Converting a documented cents field to dollars.
      - Retrying a failed network connection.
      - Copying identical bytes without changing their representation.
      - Granting an analyst access to a report.
      correct: 0
      explanation: The unit conversion changes the represented value using a defined rule. Transfer, retries, and
        access are different concerns.
      id: 0eb49ec7-815f-49a4-a5f9-53cd804c1a86
      type: multiple_choice
      difficulty: 2
    - question: A source stores 2,450 cents. The target requires dollars with two decimal places. What value should
        a correct conversion produce? Enter the number only.
      options: []
      correct:
        answer: '24.50'
        alternatives:
        - '24.5'
      explanation: Divide cents by 100. Check the unit contract before performing or validating an aggregation.
      type: fill_blank
      id: 07ea6504-d8b2-4ec9-a2c0-f2f9e1df7c8b
      difficulty: 3
    - question: A transform converts malformed amounts to zero, and its success count stays high while reported
        revenue falls. Which change best makes this failure visible?
      options:
      - Separate invalid rows with reasons, alert on their rate, and fix the source or mapping before replay.
      - Keep the zeros and suppress the revenue alert.
      - Multiply every result by an arbitrary adjustment factor.
      - Treat the job success count as proof of correct revenue.
      correct: 0
      explanation: Silent coercion hides rejected meaning. Track invalid inputs explicitly and repair the relevant
        rule using evidence.
      id: 8a934565-ea8d-4766-92e7-dffc0dbed878
      type: scenario
      difficulty: 4
  - id: etl-vs-elt
    instruction: '**ETL** transforms data before loading it into the target. **ELT** loads data into the target
      before transforming it there. The relevant target must be named when describing a flow.


      The acronym does not decide whether raw inputs are retained elsewhere. Choose the transformation boundary
      from sensitivity, compute, target constraints, and replay requirements.'
    workedExample: A pipeline removes unnecessary personal fields before loading the analytics warehouse. It can
      still retain an approved, restricted source archive under a separate policy. ETL does not imply that every
      raw copy is discarded.
    instructionContent:
    - type: link
      url: https://aws.amazon.com/what-is/etl/
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: What determines whether a flow is ETL or ELT relative to a named target?
      options:
      - Whether the team uses a dashboard.
      - Whether every raw copy is deleted.
      - Whether the data originates from an API.
      - Whether transformation occurs before or after loading into that target.
      correct: 3
      explanation: The order relative to the target is the defining distinction. Retention and source type are separate
        choices.
      id: 3de4ab8c-1420-465c-bd64-63695ba10fe4
      type: multiple_choice
      difficulty: 2
    - question: A warehouse must receive only cleaned data. Put these ETL stages in order. A separate source archive
        does not change the warehouse step order.
      options:
      - Load cleaned data into the warehouse
      - Extract source records
      - Transform the extracted records
      correct:
      - Extract source records
      - Transform the extracted records
      - Load cleaned data into the warehouse
      explanation: The warehouse receives transformed data, so this path is ETL. The archive does not change that
        step order.
      type: ordering
      id: 5c017bbb-a908-4307-89c0-b1aa24d0966c
      difficulty: 3
    - question: A warehouse must never receive payment card fields, and the extraction payload includes them. Which
        design meets that boundary requirement?
      options:
      - Remove those fields in a controlled step before loading into the warehouse, and verify the output schema.
      - Load everything first and promise to hide the fields in dashboards.
      - Treat the ELT label as permission to ignore the target restriction.
      - Rename the fields after analysts have access.
      correct: 0
      explanation: The requirement applies at entry to the warehouse. Enforce and validate the transformation before
        that boundary.
      id: 2d016cf3-ec8f-4ac1-b35e-5f00bdd83fd3
      type: scenario
      difficulty: 4
- id: orchestration-and-serving
  name: Orchestration & Serving Data
  difficulty: 3
  estimatedMinutes: 10
  tags:
  - foundational
  - pipelines
  section: pipeline-architecture
  prerequisites:
  - transformation-etl-elt
  encompassing: []
  knowledgePoints:
  - id: workflow-orchestration
    instruction: '**Orchestration** schedules work and enforces dependencies. A directed acyclic graph, or DAG,
      has directed edges and no dependency cycle. A task can run after its required predecessors succeed; independent
      branches can run in parallel.


      Retries, timeouts, and failure states belong in the workflow. A schedule alone does not guarantee that required
      input is ready.'
    workedExample: Extract feeds both Validate and Archive. Publish depends on Validate. Archive can run alongside
      Validate after Extract succeeds; Publish must wait for Validate.
    instructionContent:
    - type: callout
      title: Practice method
      body: State the requirement, trace the supplied evidence, and check whether your answer meets every stated
        constraint.
    workedExampleContent: []
    problems:
    - question: What makes a dependency graph acyclic?
      options:
      - Every task has exactly one predecessor.
      - Following directed dependency edges cannot lead back to the starting task.
      - Every task has the same execution time.
      - Every task runs at the same time.
      correct: 1
      explanation: A cycle would make tasks depend on a chain that returns to themselves. DAGs can still have branches
        and multiple predecessors.
      id: fd8360d9-cad9-4268-b9c8-288b48814476
      type: multiple_choice
      difficulty: 2
    - question: Extract must finish before Validate and Archive. Publish requires Validate. Extract has succeeded
        and the other tasks have not started. Which tasks are now eligible?
      options:
      - Validate and Archive.
      - Publish only.
      - All tasks regardless of dependencies.
      - Extract and Publish.
      correct: 0
      explanation: Both immediate dependents are ready. Publish still lacks its required Validate result.
      id: b1fea811-f54f-4bec-8a41-63118c52d8b5
      type: scenario
      difficulty: 3
    - question: A report is scheduled for 03:00, but its upstream import sometimes finishes at 03:20. The report
        occasionally uses yesterday's data. What should orchestration enforce?
      options:
      - Run publication after a successful import and freshness check, with a defined late-data response.
      - Retry the report continuously without checking which input it uses.
      - Start the report earlier to avoid the slow import.
      - Keep the fixed time and label all outputs current.
      correct: 0
      explanation: Use dependency and freshness evidence. A clock time alone cannot prove that the needed data is
        ready.
      id: 9cdb7993-f1d8-4ee4-b744-bbc389695cd0
      type: scenario
      difficulty: 4
  - id: serving-data
    instruction: '**Serving** exposes data in the form consumers need, such as a dashboard table, an API response,
      or a destination export. Define the contract: fields, meaning, freshness, access, and availability.


      A served dataset can be technically reachable yet unsuitable because it is stale or at the wrong level of
      detail. Validate the consumer''s actual use case.'
    workedExample: An executive report needs one row per account per day. A raw click stream has a different grain,
      so a serving table computes the agreed daily account measures.
    instructionContent:
    - type: callout
      title: Practice method
      body: State the requirement, trace the supplied evidence, and check whether your answer meets every stated
        constraint.
    workedExampleContent: []
    problems:
    - question: Which concern belongs in a serving contract?
      options:
      - Only the source connector's internal batch size.
      - A requirement to send every raw field to every consumer.
      - The output's meaning, grain, and freshness expected by its consumer.
      - Only the table's physical file format, without its business meaning.
      correct: 2
      explanation: A useful serving contract describes what the consumer receives and when it is valid for use.
      id: 362d6f07-3da5-4e20-b7b4-85adc61c4029
      type: multiple_choice
      difficulty: 2
    - question: A dashboard expects one row per account per day, but an export emits one row per click. What mismatch
        must be resolved?
      options:
      - The source event retention window alone.
      - The choice of account display name.
      - The destination's network retry interval.
      - The grain of the served data.
      correct: 3
      explanation: Grain means what one row represents. Aggregate or redesign the consumer deliberately so counts
        are interpreted correctly.
      id: eaabc15c-1ff1-45bb-9927-84e8e855d695
      type: scenario
      difficulty: 3
    - question: An API responds in 100 milliseconds but returns data last refreshed three days ago. The contract
        requires a one-hour maximum age. What does this evidence establish?
      options:
      - The contract passes because the API is fast.
      - The source data must be incorrect because the API is reachable.
      - Response latency passes, but freshness fails and needs its own check and recovery.
      - The only useful fix is a faster web server.
      correct: 2
      explanation: Availability, response latency, and data freshness are separate dimensions. Measure and repair
        the dimension that failed.
      id: 6985e879-1fa8-44cc-add1-3d9f8276a542
      type: scenario
      difficulty: 4
- id: pipeline-tradeoffs
  name: 'Pipeline Tradeoffs: Latency, Cost, Complexity'
  difficulty: 4
  estimatedMinutes: 15
  tags:
  - foundational
  - pipelines
  section: pipeline-architecture
  prerequisites:
  - orchestration-and-serving
  encompassing: []
  knowledgePoints:
  - id: three-tensions
    instruction: 'Pipeline design balances **freshness, cost, and operational complexity**. A shorter refresh interval
      can increase compute, source load, and monitoring needs. More recovery guarantees can require extra state
      and storage.


      Use measurable requirements and expected volume. Choose the least complex design that meets the actual need,
      then measure its behavior under load and failure.'
    workedExample: A daily staffing report needs yesterday's totals by 07:00. A tested nightly batch can satisfy
      this need with less operational work than a continuously running stream.
    instructionContent:
    - type: callout
      title: Practice method
      body: State the requirement, trace the supplied evidence, and check whether your answer meets every stated
        constraint.
    workedExampleContent: []
    problems:
    - question: Which information should anchor a choice between a nightly batch and a continuous stream?
      options:
      - Which option retains the most data, regardless of cost or purpose.
      - Which design has the shortest polling interval, regardless of need.
      - Which option has the lowest bill, even if it misses the required deadline.
      - Required data age, expected volume, recovery needs, and operating cost.
      correct: 3
      explanation: Compare the designs against measurable needs and constraints. A technology label alone does not
        establish suitability.
      id: 731e5159-6f99-485a-9129-659c90ffc3e8
      type: multiple_choice
      difficulty: 2
    - question: A fraud decision must use events within five seconds. A nightly batch costs less but makes data
        available the next morning. Which tradeoff matters most here?
      options:
      - Both have equal freshness because both eventually process events.
      - The batch misses the required freshness target despite its lower cost.
      - The lower cost proves the batch meets every requirement.
      - The report format decides whether five seconds is achievable.
      correct: 1
      explanation: A mandatory latency target constrains the design. Compare cost only among designs that can meet
        the required behavior.
      id: e2dabcf2-5e12-4142-9ab0-6a69905947e3
      type: scenario
      difficulty: 3
    - question: A team proposes subsecond updates for a monthly board report. The source has strict request limits,
        and no consumer needs intraday updates. Which recommendation fits the evidence?
      options:
      - Use a scheduled, validated extract aligned with the report deadline and leave room for retries.
      - Stop monitoring because the report is infrequent.
      - Adopt subsecond polling regardless of source limits.
      - Drop validation to compensate for the extra request volume.
      correct: 0
      explanation: The consumer gains no stated benefit from subsecond freshness. A scheduled design can meet the
        deadline with lower load and enough recovery time.
      id: 49d43876-02bd-446a-bff7-ea4f1faafa5b
      type: scenario
      difficulty: 4
  - id: operational-safety
    instruction: '**Idempotency** means repeating an operation has the same intended effect as doing it once. Stable
      source IDs and explicit update rules can make retries safe. A checkpoint records progress, but its relationship
      to committed output matters.


      Define how to handle partial failure, late records, and replay. Test those paths instead of relying only on
      a successful first run.'
    workedExample: An import upserts by source invoice ID. If the connection fails after some rows commit, retrying
      the batch updates those same records rather than adding duplicate invoices.
    instructionContent:
    - type: callout
      title: Practice method
      body: State the requirement, trace the supplied evidence, and check whether your answer meets every stated
        constraint.
    workedExampleContent: []
    problems:
    - question: What does an idempotent import allow you to do safely?
      options:
      - Discard record identities after every batch.
      - Skip all validation forever.
      - Repeat the same import without creating an extra intended record for each retry.
      - Guarantee that the source never changes.
      correct: 2
      explanation: Idempotency controls the effect of repetition. It does not remove the need for validation or
        change handling.
      id: f6b4a766-7e68-43f2-911c-f3ee46f42705
      type: multiple_choice
      difficulty: 2
    - question: A batch of 100 invoices commits 60 rows and then fails. It retries all 100 using an upsert keyed
        by stable invoice ID. With unchanged input, how many invoice records should exist after success? Enter the
        number only.
      options: []
      correct: '100'
      explanation: The retry updates the first 60 and inserts the remaining 40. Stable-key upserts prevent duplicate
        business records.
      type: fill_blank
      id: 9729efe3-65a7-484c-b7a6-d774a44a9662
      difficulty: 3
    - question: A job advances its checkpoint before writing output. It crashes after the checkpoint but before
        the write. What failure must the design prevent?
      options:
      - Skipping unwritten records on restart by coordinating durable output and checkpoint progress.
      - Reordering dashboard columns after restart.
      - Treating the advanced checkpoint as proof that output exists.
      - Giving every retry a new source record ID.
      correct: 0
      explanation: The checkpoint claims work is complete before it is durable. Coordinate commits or use a recovery
        protocol that can safely replay the uncertain interval.
      id: 77d3c3f2-6506-4800-b702-f8f30b7d3d2a
      type: scenario
      difficulty: 4
- id: ph-events
  name: 'PostHog Events: The Atomic Unit'
  difficulty: 3
  estimatedMinutes: 18
  tags:
  - posthog
  - data-model
  section: posthog-data-model
  prerequisites:
  - what-is-a-pipeline
  encompassing:
  - concept: entities
    weight: 0.35
  knowledgePoints:
  - id: what-is-a-posthog-event
    instruction: 'A **PostHog event** records an occurrence with an event name, a distinct ID, properties, and a
      timestamp. The stored record and the capture request have different contracts. For direct capture, supply
      the project token, event name, and distinct ID. The capture API can assign a timestamp when you omit one.


      Use an explicit occurrence timestamp for delayed historical events. A project token routes capture to a project;
      it is different from a personal API key used for administrative access.'
    workedExample: A server reports invoice_paid for user_42 with amount_cents = 2500. If it sends the event hours
      later, it supplies the actual payment time so time-based analysis reflects the occurrence.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/api/capture
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which statement correctly distinguishes a stored event from a direct capture request?
      options:
      - A capture request must always supply a timestamp or it is invalid.
      - The stored event has a timestamp, while the request can omit it and use the API default.
      - A project token is the event timestamp.
      - A stored event has no event name when capture omits a timestamp.
      correct: 1
      explanation: Check the request contract separately from the stored model. The API can supply a timestamp,
        but delayed events usually need their real occurrence time.
      id: 5c3615f5-3b8b-4c17-b654-354acad4518f
      type: multiple_choice
      difficulty: 2
    - question: A direct capture payload includes event = invoice_paid and properties.distinct_id = user_42, but
        no project token. Which required routing information is missing?
      options:
      - A session recording URL.
      - A group name for every event.
      - A person's email address.
      - The project token for the destination project.
      correct: 3
      explanation: The project token identifies the capture destination. Email, recordings, and group membership
        are not universal requirements for an event.
      id: 49ce3696-d902-45f3-8ece-5d4e9131dcf9
      type: scenario
      difficulty: 3
    - question: An offline integration uploads yesterday's purchases today. The purchase timestamps are available,
        but the payload omits them. Reports place the purchases at upload time. What should be corrected?
      options:
      - Send each purchase's validated occurrence timestamp and verify the historical time window.
      - Use upload time for all records and shift the entire chart back one day.
      - Change the report's timezone to compensate for a full day of delayed delivery.
      - Set every event's time to midnight yesterday, ignoring individual occurrence times.
      correct: 0
      explanation: The API default cannot infer an earlier occurrence time. Supply the known event time and check
        the resulting time-based analysis.
      id: c98c4c76-6ddf-4332-8837-5df746acdf3f
      type: scenario
      difficulty: 4
  - id: immutable-facts-and-default-events
    instruction: 'Treat **event facts** as records of what happened. A later state change should normally produce
      a new event or a separate current-state update. Do not assume an old event will silently change with the application
      record.


      Reserved names such as $pageview have defined SDK meanings. A capture plan should define custom business events
      and avoid double-counting the same occurrence through automatic and manual capture.'
    workedExample: An order is submitted and later canceled. order_submitted and order_canceled preserve the sequence.
      A current order-status field can separately show canceled.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/libraries/js/config
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which event name commonly represents a page view captured by the web SDK?
      options:
      - $groupidentify
      - $pageview
      - $identify
      - $set
      correct: 1
      explanation: Reserved event names have specific meanings. Page views, identity transitions, and property updates
        should not be substituted for each other.
      id: 7979d60f-7f7d-4a4f-8bd9-b04a870c4b25
      type: multiple_choice
      difficulty: 2
    - question: An order was submitted at 09:00 and canceled at 10:00. You need to analyze both actions. Which event
        design preserves that history?
      options:
      - Change the user's distinct ID when the order is canceled.
      - Replace the submitted event's name with canceled everywhere.
      - Keep order_submitted and capture a separate order_canceled occurrence.
      - Capture only the current status at midnight and infer the two action times.
      correct: 2
      explanation: Separate events preserve each occurrence and its time. Current state alone cannot reconstruct
        the action sequence.
      id: 3d21c364-3959-4612-933d-2e9dcaa4ab1d
      type: scenario
      difficulty: 3
    - question: Pageview counts double after a release. The web SDK has automatic pageview capture enabled, and
        the application now manually captures the same navigation. What should you validate and fix?
      options:
      - Trace one navigation, choose one intended capture path, and verify one pageview per occurrence.
      - Rename manual pageviews while continuing to sum both paths as visits.
      - Deduplicate all events sharing the same page URL, including legitimate repeat visits.
      - Change every visitor's distinct ID on navigation.
      correct: 0
      explanation: The evidence points to two capture paths for one occurrence. Fix the instrumentation and test
        a real navigation instead of deleting valid repeated visits.
      id: 55c33b7d-2067-4dfc-a066-b29f066733e7
      type: scenario
      difficulty: 4
  - id: custom-vs-autocapture
    instruction: '**Autocapture** records supported user interactions when enabled. A **custom event** names a business
      action that your code explicitly reports. DOM activity can show a button click, but the application must establish
      whether a business operation succeeded.


      Choose a stable semantic event for important outcomes. Verify SDK configuration and supported surfaces before
      relying on automatic collection.'
    workedExample: A checkout click can fail validation. Capture purchase_completed only after confirmed success,
      with an order ID that permits reconciliation against the source system.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/autocapture
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which event is the clearest semantic measure of a completed purchase?
      options:
      - A custom purchase_completed event emitted after confirmed success.
      - Any click on a button whose label contains Buy.
      - Any page view on a marketing page.
      - Any focus event on a payment input.
      correct: 0
      explanation: Completion requires business confirmation. UI interactions alone can occur before a failed or
        abandoned purchase.
      id: 133cb140-3943-4d5d-84e2-60098eda49a2
      type: multiple_choice
      difficulty: 2
    - question: An autocaptured submit click appears, but the API rejected the form. Which conclusion is supported?
      options:
      - The click occurred; successful submission still needs separate evidence.
      - The form was successfully saved because a click exists.
      - Autocapture automatically retries the business operation until success.
      - The rejection proves no click occurred.
      correct: 0
      explanation: Use the interaction event for interaction evidence. Check the application result or a success
        event before counting completion.
      id: fc906c9b-ca75-467c-92cb-f9f403fe24c9
      type: scenario
      difficulty: 3
    - question: A team uses a CSS selector for its core activation metric. A redesign changes the DOM, while the
        business milestone remains the same. What makes future measurement more stable?
      options:
      - Count every click as activation to avoid selector maintenance.
      - Keep guessing new selectors after every release without validation.
      - Move the CSS selector into the user's distinct ID.
      - Instrument the confirmed milestone as a documented custom event and compare it during migration.
      correct: 3
      explanation: A semantic event follows the business contract. Validate the migration so a change in instrumentation
        is not mistaken for a change in activation.
      id: 70b13c09-251b-4038-b54e-554796668b4f
      type: scenario
      difficulty: 4
- id: ph-event-properties
  name: 'Event Properties: Metadata on Events'
  difficulty: 3
  estimatedMinutes: 12
  tags:
  - posthog
  - data-model
  section: posthog-data-model
  prerequisites:
  - ph-events
  encompassing: []
  knowledgePoints:
  - id: default-vs-custom-properties
    instruction: '**Event properties** add context to an occurrence. SDKs can add default properties, while application
      code adds custom ones. Available defaults depend on the SDK and configuration. For web events, $current_url
      describes the full URL and $pathname describes its path.


      Define custom names, types, and units. A property with an inconsistent type is harder to filter and aggregate
      reliably. Property names are exact keys, so plan and Plan are different properties. Keep spelling and case
      consistent with the tracking contract.'
    workedExample: For https://app.example.com/pricing?plan=team, the path is /pricing. Use the full URL when the
      host or query string matters, and check that collection is appropriate for the data involved.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data/events
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: For a web event, which property should you inspect when you need the full URL including host and
        query string?
      options:
      - $host
      - $current_url
      - $pathname
      - The page's title property
      correct: 1
      explanation: The full URL and path serve different needs. A path alone does not contain the host or query
        string.
      id: 340ed8a8-f9c5-44fb-8252-b7d166e8144d
      type: multiple_choice
      difficulty: 2
    - question: You want one report row for /pricing across several hosts and query strings. Which available web
        property most directly represents that path?
      options:
      - $pathname
      - The page's title property
      - $current_url without normalization
      - $host
      correct: 0
      explanation: Use the property whose scope matches the question. Full URLs would split the path by host and
        query parameters unless normalized.
      id: 1af2d0d6-8e78-4cbd-b5af-fc2b166650e0
      type: scenario
      difficulty: 3
    - question: A custom amount property is numeric in the backend and formatted as "$20" in the frontend. Aggregation
        results differ by source. What should the tracking contract define?
      options:
      - One numeric representation with a named currency and unit, plus validation across both sources.
      - A separate arbitrary meaning for each SDK.
      - A different event name for every amount value.
      - A display string as the canonical numeric measure.
      correct: 0
      explanation: Align types and units at capture. Display formatting should not change the meaning or queryability
        of the underlying measure.
      id: a5f9951a-b9fe-4c09-affd-5f83b714a64b
      type: scenario
      difficulty: 4
    - question: The tracking contract defines plan, but one client sends Plan. Events arrive, and the report filters
        the exact key plan. Why are values from that client missing from the filter?
      options:
      - The two keys must be interchangeable because their spelling sounds the same.
      - The property keys differ in case; correct the emitter and assess whether historical data needs a query-side
        compatibility rule.
      - Changing the person distinct ID will make both event-property keys identical.
      - Increasing the date range automatically renames all historical property keys.
      correct: 1
      explanation: Property names are exact keys. Repair the capture contract and handle existing inconsistent data
        deliberately rather than assuming a spelling correction rewrites history.
      id: 5a35b5be-449c-4b03-b1a0-77db0589b09e
      type: scenario
      difficulty: 4
  - id: event-vs-person-properties
    instruction: '**Event properties** describe the occurrence. **Person properties** describe a person profile
      and can change. Store an explicit event-time snapshot when analysis must use the value at that moment. Person-property
      query behavior can depend on how properties are stored and selected, so inspect the actual query field.


      Account-level facts may belong to a group. Decide the owner and time meaning before choosing where to set
      a property.'
    workedExample: A purchase event includes plan_at_purchase = free. The person's current plan later becomes paid.
      A report of purchase-time plan uses the explicit event property.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/person-properties
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which field unambiguously represents the plan used when a particular purchase occurred?
      options:
      - An event property explicitly captured as plan_at_purchase.
      - The report's creation date.
      - The person's latest display name.
      - A mutable current-plan field with no historical contract.
      correct: 0
      explanation: An explicit event-time snapshot gives the required time meaning. Inspect the field used rather
        than assuming all person-property queries mean current or historical state.
      id: 02ba0319-8cf9-43a0-9a53-acca68566d07
      type: multiple_choice
      difficulty: 2
    - question: A person bought on the free plan, then upgraded. The event stores plan_at_purchase = free and the
        current profile says paid. Which value should a purchase-time segmentation use?
      options:
      - The current profile value, paid, for every historical purchase.
      - The plan most common across all users during the report period.
      - The latest value found on any later purchase by that person.
      - The event's plan_at_purchase value, free.
      correct: 3
      explanation: The analysis asks about the occurrence, so use the recorded event-time value. The two fields
        answer different time questions.
      id: 8246c7e1-29c7-428a-97e6-8fc548c1cf35
      type: scenario
      difficulty: 3
    - question: A dashboard changed historical segments after a profile update. The team assumed its selected field
        was an event-time snapshot. What should you inspect first?
      options:
      - Only the report's date range, assuming every property source has the same time meaning.
      - Whether replaying the current profile value onto all old events makes the chart stable.
      - The query's exact property source and time semantics, then use an explicit captured snapshot if required.
      - Only the display label of the selected property.
      correct: 2
      explanation: Trace which property the query actually reads. A label alone cannot establish whether the value
        is current, joined, or captured on the event.
      id: ea506686-0021-4e3d-b196-5263acaaf84e
      type: scenario
      difficulty: 4
- id: ph-persons
  name: Persons & Person Profiles
  difficulty: 4
  estimatedMinutes: 18
  tags:
  - posthog
  - data-model
  section: posthog-data-model
  prerequisites:
  - ph-events
  - keys-and-identity
  - relationships
  encompassing:
  - concept: keys-and-identity
    weight: 0.7
  - concept: relationships
    weight: 0.45
  knowledgePoints:
  - id: what-is-a-person
    instruction: 'A **person profile** connects identifiers and stores person properties. An event can be captured
      without creating a stored profile. In the web SDK''s identified_only mode, a fresh anonymous capture with
      inline $set does not itself create a profile. An explicit profile-triggering action, such as identify or setPersonProperties,
      changes that behavior.


      A person represents an identity in analytics, which must be designed carefully for shared devices and multiple
      systems.'
    workedExample: A fresh anonymous browser emits a pageview under identified_only. The event can appear even though
      there is no corresponding stored person profile yet.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data/anonymous-vs-identified-events
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which observation is possible in PostHog?
      options:
      - A person profile can have no relationship to any identifier.
      - A person profile is the same object as a session.
      - An event exists for a distinct ID without a stored person profile.
      - Every accepted event must already have a full email-based profile.
      correct: 2
      explanation: Event capture and stored profile creation are separate. Do not infer a complete profile merely
        from an accepted event.
      id: 9c9b15c8-47fa-453a-b448-d4e7b7a022c4
      type: multiple_choice
      difficulty: 2
    - question: 'A fresh browser uses identified_only and captures a pageview with inline $set: {plan: "free"}.
        No profile-triggering helper has run. What should you expect from that capture alone?'
      options:
      - It merges every free-plan visitor into one person.
      - It necessarily creates a profile because $set appears in the payload.
      - It necessarily identifies the person by their plan name.
      - The event can be captured without creating a person profile.
      correct: 3
      explanation: Inline property data alone does not trigger profile creation in this stated mode. Check the SDK
        action and processing mode.
      id: 4f7418bb-aac3-4837-aa07-ef3252dd77a5
      type: scenario
      difficulty: 3
    - question: A TAM sees anonymous events but no person entries and concludes ingestion is broken. The payloads
        arrive correctly and use identified_only before any profile-triggering action. What is the best diagnosis?
      options:
      - Replay every event with a fabricated email address.
      - Treat the absence of profiles as proof that all event data is lost.
      - Use one shared identified ID to make the people list populate.
      - The evidence fits intentional anonymous capture; confirm the required use case before changing profile creation.
      correct: 3
      explanation: The configured behavior explains the observation. Match profile creation to the customer's identity
        needs rather than inventing identities.
      id: 2159e4d3-19b8-4e72-93b9-a0068f558e60
      type: scenario
      difficulty: 4
  - id: what-person-profiles-enable
    instruction: '**Stored profiles** support person-property analysis and stored profile-based targeting. Anonymous
      feature flag evaluation can use a distinct ID and explicitly supplied properties without a stored profile.
      The evaluation inputs and unit of assignment still need a stable design.


      For a flag or experiment question, distinguish assignment, supplied targeting inputs, persisted profile properties,
      and recorded exposure. A generic claim that every flag requires a profile is inaccurate.'
    workedExample: An anonymous visitor receives a percentage rollout using a persistent distinct ID. A server-side
      rule that needs a saved subscription status must obtain that value through a supported profile or explicit-property
      path.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/feature-flags/best-practices
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which requirement specifically depends on having stored person-property data available?
      options:
      - Recording an event timestamp.
      - Capturing any event name.
      - Filtering people by a property saved on their person profiles.
      - Evaluating every possible percentage flag for an anonymous distinct ID.
      correct: 2
      explanation: Stored property analysis needs stored data. Anonymous capture and some flag evaluations can operate
        without a persisted profile.
      id: c0a8727a-9d99-43f5-a198-075aa15568ba
      type: multiple_choice
      difficulty: 2
    - question: An anonymous percentage flag uses a persistent distinct ID and no person-property rule. Must the
        application create a stored person profile solely to evaluate that rule?
      options:
      - Yes, every anonymous visitor must share one profile.
      - Yes, every percentage flag requires a saved email address.
      - No, this evaluation can use the distinct ID without a stored profile.
      - No, and therefore the distinct ID can change on every evaluation without consequences.
      correct: 2
      explanation: Anonymous flag evaluation is supported. A stable assignment still requires consistent inputs,
        especially the distinct ID.
      id: 45c3016d-acb8-48c8-ac34-cb40e198e038
      type: scenario
      difficulty: 3
    - question: A flag rule uses subscription_tier. Anonymous evaluations return the default, and the application
        has neither stored the tier nor supplied it to evaluation. What should the investigation establish?
      options:
      - Whether all anonymous flags are unsupported.
      - Whether creating any blank profile guarantees the tier is correct.
      - Whether changing the event timestamp creates the missing tier.
      - Where the rule obtains subscription_tier, whether that input is present, and which identity is evaluated.
      correct: 3
      explanation: Targeting needs the actual rule input. Verify its source and identity rather than assuming that
        a blank profile or generic identify call supplies every property.
      id: 42927796-7854-418b-ae8f-e5b4c9322227
      type: scenario
      difficulty: 4
  - id: viewing-person-profiles
    instruction: '**Profile inspection** combines identifiers, properties, and event history. Search using the known
      identifier, confirm the project, and inspect which distinct IDs belong to the person. Display names and emails
      can be missing or repeated.


      Treat the UI as a view of collected evidence. An empty filtered history can result from the chosen time range,
      project, identity, or query, so check those before drawing a conclusion.'
    workedExample: Support provides user_73. Search that ID in the expected project, verify the profile's identifiers,
      and set the event time range to the reported incident.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/identify
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which value is the strongest starting point for finding a reported user when the application provides
        its canonical PostHog distinct ID?
      options:
      - That exact distinct ID in the expected project.
      - A matching subscription plan alone.
      - Any profile with the same first name.
      - The newest profile in any project.
      correct: 0
      explanation: Use the known identity and project. Human-readable properties can be shared or absent.
      id: c2ad1f38-f7ac-4e56-a297-353c3302a062
      type: multiple_choice
      difficulty: 2
    - question: A user reports an incident last month, but their profile event view is filtered to the last 24 hours.
        What should you adjust before concluding the event is missing?
      options:
      - The event name to match the profile title.
      - The project token in all production captures.
      - The user's ID to an arbitrary new value.
      - The time range to include the reported occurrence.
      correct: 3
      explanation: The current filter excludes the incident. Validate the query scope before changing instrumentation.
      id: af184ba0-fd3f-4349-bc78-11392ba0666a
      type: scenario
      difficulty: 3
    - question: Two profiles share the same email property, but the application expects one canonical user. What
        evidence should you gather before proposing an identity repair?
      options:
      - Their distinct IDs, identify transitions, source systems, and whether they represent the same real user.
      - Only each profile's current plan.
      - Only the email text, because matching properties automatically prove safe merging.
      - Only which profile was created most recently.
      correct: 0
      explanation: Matching descriptive properties do not establish a valid identity link. Trace how each profile
        was formed before attempting a repair.
      id: e2c05973-ca5a-4481-9fdd-bd7e572c0af7
      type: scenario
      difficulty: 4
- id: ph-person-properties
  name: 'Person Properties: $set and $set_once'
  difficulty: 4
  estimatedMinutes: 18
  tags:
  - posthog
  - data-model
  section: posthog-data-model
  prerequisites:
  - ph-persons
  encompassing: []
  knowledgePoints:
  - id: setting-person-properties
    instruction: '**$set** updates person properties; **$set_once** fills values that have not already been set.
      Use current-state properties for current facts and first-value properties for facts whose first accepted value
      should remain.


      For supported SDKs, identify can include property updates. The web helper setPersonProperties can explicitly
      trigger profile creation. Inline $set on a fresh anonymous capture in identified_only has different creation
      behavior, as taught in the person-profile lesson.'
    workedExample: After a known user upgrades, update current_plan with $set. Keep initial_referrer under $set_once
      so a later visit does not overwrite the first accepted value.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/person-properties
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which update operation changes an existing current_plan person property?
      options:
      - Changing only the chart label
      - $set_once when current_plan already exists
      - $set
      - Changing only an event's name
      correct: 2
      explanation: Use $set for a value that should track current state. $set_once intentionally preserves an existing
        value.
      id: 98b0db52-009d-484e-a32d-4032482ed55d
      type: multiple_choice
      difficulty: 2
    - question: A known profile has current_plan = free and initial_referrer = search. A later update sets current_plan
        to paid and tries to set_once initial_referrer to email. What should remain?
      options:
      - current_plan = paid and initial_referrer = search.
      - Both properties disappear.
      - Both values change to email.
      - current_plan = free and initial_referrer = email.
      correct: 0
      explanation: The ordinary set updates current state. The set-once operation leaves the already present first
        value intact.
      id: e7e47f7e-3d1b-4a6b-8af9-22a644f151eb
      type: scenario
      difficulty: 3
    - question: An integration uses set_once for current_plan. Upgrades are captured, but profiles keep showing
        free. What should be corrected?
      options:
      - Use a current-state update for current_plan and keep any separate initial-plan field under set_once.
      - Rename free to paid in all historical events.
      - Retry the same set_once indefinitely.
      - Change every user's distinct ID after an upgrade.
      correct: 0
      explanation: The write operation conflicts with the intended current-state meaning. Separate current and initial
        facts so each has the appropriate update rule.
      id: 372f9c93-1106-5da6-8ac8-c43a1c8993d1
      type: scenario
      difficulty: 4
  - id: choosing-person-property-updates
    instruction: '**Property update order** follows processing, so out-of-order arrivals can make current state
      stale. A set-once value is the first accepted value, which may differ from the event with the earliest occurrence
      timestamp.


      For authoritative current state, define which system owns the property and how delayed writes are handled.
      Backfills need special care because historical events can carry old profile values.'
    workedExample: A delayed free-plan event arrives after a paid-plan update and carries $set for current_plan.
      Inspect whether it overwrote the current value, then remove stale state writes from the backfill or reconcile
      from the authoritative source.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/person-properties
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: What does set_once establish when events arrive out of occurrence-time order?
      options:
      - The first accepted value, which need not come from the earliest event timestamp.
      - Always the lexicographically smallest value.
      - Always the value from the earliest historical timestamp.
      - A value that changes on every later event.
      correct: 0
      explanation: Processing order and occurrence time differ. Do not use set_once as an automatic historical minimum
        calculation.
      id: e427f7eb-d198-4eb1-9e09-3c800da30cec
      type: multiple_choice
      difficulty: 2
    - question: A newer paid-plan update is processed, then an old backfill writes current_plan = free with $set.
        Which result must you guard against?
      options:
      - The occurrence timestamp automatically blocking every stale profile update.
      - The old profile value being ignored solely because the distinct ID already exists.
      - The backfill automatically consulting current billing state before applying $set.
      - The late old write replacing the intended current state.
      correct: 3
      explanation: Late processing can apply an old value as a new write. Plan backfills so they do not silently
        regress current properties.
      id: 66ca9299-c11f-42ba-b0e2-4072b9cbcab6
      type: scenario
      difficulty: 3
    - question: Billing and frontend code both write subscription_status, and delayed browser events sometimes restore
        canceled accounts to active. Which design addresses the conflict?
      options:
      - Let whichever client retries most often define the truth.
      - Assign a new distinct ID for each subscription status.
      - Make billing the authoritative writer and define reconciliation and stale-event handling.
      - Use set_once so the first status can never change.
      correct: 2
      explanation: The property needs clear ownership and ordering rules. A permanent first value would also fail
        for a status that legitimately changes.
      id: 52c5d327-a184-4c50-83ca-f1d053804d1b
      type: scenario
      difficulty: 4
- id: ph-distinct-id
  name: 'distinct_id: Linking Events to Persons'
  difficulty: 5
  estimatedMinutes: 18
  tags:
  - posthog
  - data-model
  section: posthog-data-model
  prerequisites:
  - ph-persons
  - keys-and-identity
  encompassing:
  - concept: keys-and-identity
    weight: 0.8
  knowledgePoints:
  - id: what-is-distinct-id
    instruction: 'A **distinct ID** is the identifier attached to events for identity resolution. It is scoped to
      the project and must distinguish the intended users. A generated anonymous browser ID and a stable application
      user ID can later be connected through a valid identify transition.


      Avoid shared placeholders and mutable values. Validate the value before sending it, including empty or missing
      IDs.'
    workedExample: Use user_105 from the application's user database for that known user. A value like logged_in_user
      would incorrectly collapse unrelated users into one identifier.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/identify
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: What is the main purpose of an event's distinct ID?
      options:
      - Identify the project receiving the event.
      - Define the session inactivity timeout.
      - Identify the actor for PostHog identity resolution.
      - Name the type of business action that occurred.
      correct: 2
      explanation: The distinct ID carries actor identity. Other context belongs in appropriate properties.
      id: c9144e1c-f65c-4394-989b-ef43a6129593
      type: multiple_choice
      difficulty: 2
    - question: All signed-in customers are captured with distinct_id = logged_in_user. What measurement problem
        does this create?
      options:
      - Every customer automatically receives a unique identity.
      - Unrelated customers share an analytics identity.
      - Only page URLs are affected.
      - The value automatically expands into each customer's database ID.
      correct: 1
      explanation: A shared placeholder cannot distinguish people. Send the stable, unique ID for the actual actor.
      id: ca8c5969-1210-42e1-a239-febbe2ea4346
      type: scenario
      difficulty: 3
    - question: A system has user ID 81 in two tenants. IDs are only tenant-unique, but events share one PostHog
        project. Which canonical identity scheme avoids collisions?
      options:
      - The bare number 81 for both users.
      - The users' first names.
      - A stable tenant-and-user identifier or an existing globally unique user ID.
      - A new random ID on every event.
      correct: 2
      explanation: Respect the source ID namespace. A stable globally unique representation preserves continuity
        while separating different users.
      id: edea591a-b780-4786-bbf9-9161aa0f4210
      type: scenario
      difficulty: 4
  - id: frontend-vs-backend-distinct-id
    instruction: 'The **web SDK** normally maintains an anonymous browser ID. Backend capture for a known user should
      use the same canonical ID that the frontend uses after identification. Exact method signatures and optional-ID
      behavior vary by SDK version.


      When tracing anonymous server-side activity, propagate a suitable browser ID explicitly under the application''s
      data policy. A backend request does not inherently know which browser identity produced it.'
    workedExample: After login, the frontend identifies user_31. A payment job captures payment_completed using
      user_31 from trusted application data. Both use the same canonical identity.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/identify
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: For an authenticated user, which value should backend capture normally share with the identified
        frontend?
      options:
      - The project token as the user ID.
      - The same canonical application user ID.
      - The backend machine's hostname for all users.
      - A fresh random ID for each backend event.
      correct: 1
      explanation: Consistent canonical identity links the known user's events across sources. A server or project
        identifier describes a different entity.
      id: 54c64a35-594f-49c0-88bf-16a8e244d900
      type: multiple_choice
      difficulty: 2
    - question: Frontend identify uses user_31, while backend payment events use email alex@example.com. No link
        connects these IDs. What mismatch should be corrected?
      options:
      - The frontend runs in a browser.
      - The systems use different identifiers for the same intended user.
      - The backend timestamp has seconds.
      - The event names are different, which always prevents identity resolution.
      correct: 1
      explanation: Different event names are normal. Align identity values or establish a valid deliberate link
        rather than assuming the email property connects them.
      id: 61385373-5766-483a-b2c0-bf42c4a5bcee
      type: scenario
      difficulty: 3
    - question: An unauthenticated API action needs to join the same browser journey. The backend has no browser
        ID and no authenticated user. What must the design establish?
      options:
      - An invented email address for every request.
      - One common distinct ID for all anonymous API callers.
      - A guarantee that the server SDK automatically reads the browser's local storage.
      - An explicit, validated identity propagation path or a deliberate separate anonymous identity model.
      correct: 3
      explanation: The backend needs evidence of identity. Design how an allowed identifier crosses the boundary
        instead of assuming the browser state is available.
      id: a2fdf2d4-44ba-46b0-857f-f538ed63b547
      type: scenario
      difficulty: 4
  - id: multiple-distinct-ids
    instruction: 'One **person** can have multiple linked distinct IDs. Valid identity transitions can connect an
      anonymous device ID to the known application ID. Counting raw distinct IDs therefore need not equal counting
      resolved people.


      A shared email property alone does not establish that link. Inspect the identity records and transition events
      when counts differ.'
    workedExample: A person uses two devices. Each starts with its own anonymous ID, and both later identify to
      user_52. A resolved-person count can treat the linked history as one person even though several raw IDs exist.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/identify
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Can one resolved PostHog person have several distinct IDs?
      options:
      - No, every person can have only one identifier for all time.
      - Yes, but only if every event has the same name.
      - Yes, when valid identity links connect those identifiers.
      - Yes, because any matching first name automatically merges people.
      correct: 2
      explanation: A person can have multiple identifiers. The link comes from identity resolution, not arbitrary
        descriptive similarity.
      id: 8647eeda-f58a-4c3a-9efe-62c13c403c4a
      type: multiple_choice
      difficulty: 2
    - question: Two browser IDs are validly linked to user_52. A query counts three raw distinct IDs. What should
        you check before reporting three people?
      options:
      - Whether the metric should count resolved people instead of raw identifiers.
      - Whether all three IDs should be treated as separate people despite the valid links.
      - Whether event names should be made identical to combine people.
      - Whether dividing every identifier count by three works for all users.
      correct: 0
      explanation: Identifier count and person count have different units. Use the metric that matches the business
        question.
      id: b7e9ca90-8ba4-4b1c-a771-79dffe6b7ccf
      type: scenario
      difficulty: 3
    - question: A unique-user report changes after known identity links are added. Event volume stays constant.
        Which explanation should you test?
      options:
      - The unchanged event count proves unique-person counts cannot change.
      - The chart must be counting project tokens as users.
      - The links must have deleted every anonymous event.
      - Several raw identities now resolve to the same people, changing the counting unit without removing events.
      correct: 3
      explanation: Resolution can change which identifiers belong to one person. Compare raw IDs and resolved-person
        logic before concluding that ingestion lost data.
      id: dd4e47c7-8fe2-4f7c-bcb2-c9cdd8bb0edd
      type: scenario
      difficulty: 4
- id: ph-sessions
  name: 'Sessions: Grouping Events by Visit'
  difficulty: 3
  estimatedMinutes: 12
  tags:
  - posthog
  - data-model
  section: posthog-data-model
  prerequisites:
  - ph-events
  - ph-distinct-id
  encompassing: []
  knowledgePoints:
  - id: how-sessions-work
    instruction: 'A **session** groups activity from an interaction period. Web SDK defaults include a 30-minute
      inactivity timeout and a 24-hour maximum; configuration can change the inactivity threshold. A reset starts
      a new session. Sessions can be shared across tabs in the same browser.


      Backend events do not automatically inherit a browser session. If the analysis needs that link, propagate
      the appropriate $session_id through a supported path.'
    workedExample: With the default inactivity timeout, a browser event after a 40-minute idle gap starts a new
      session. A later backend event needs explicit session context if it should join that browser session.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data/sessions
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Under the default web session behavior, what does a 40-minute inactivity gap imply for the next
        activity?
      options:
      - It starts a new session because the default idle threshold is 30 minutes.
      - It merges all browser tabs from every device.
      - It must remain in the same session until the user closes the account.
      - It changes the project token.
      correct: 0
      explanation: Use the configured inactivity threshold. The default is 30 minutes, but a project can configure
        a different value.
      id: 975fe691-68fa-426c-a579-a8b486db830f
      type: multiple_choice
      difficulty: 2
    - question: A backend SDK captures an event with the correct user ID, but no $session_id and no session-propagation
        middleware. Is it guaranteed to join the active browser session?
      options:
      - Yes. Every known-user event always gets the active browser session.
      - No. Backend events can never receive session context.
      - No. Matching the person ID alone does not supply the browser session ID.
      - Yes. The event name determines its browser session.
      correct: 2
      explanation: Person identity and session identity are distinct. Supported explicit propagation can link backend
        activity to the desired session.
      id: d2c1dc27-69db-4373-bd7f-3c6918d629e2
      type: scenario
      difficulty: 3
    - question: A customer expects every browser tab to create a new session, but two tabs share a session ID. They
        use the normal web SDK configuration in one browser. What should you explain and verify?
      options:
      - Count tabs by reusing the project token as a session ID.
      - Change the user ID on every tab focus.
      - Tabs can share the browser session; verify timing and configuration against the intended session metric.
      - Each tab must have a unique session, so all data is corrupt.
      correct: 2
      explanation: The observed behavior can be expected. Define whether the business metric concerns browser sessions,
        tabs, or users before changing instrumentation.
      id: 409eec2d-a672-46b9-8657-918ecedb7468
      type: scenario
      difficulty: 4
    - question: In an SPA, session IDs change on every route navigation despite continuous activity. Instrumentation
        logs show reset() immediately before each change. What should the team investigate first?
      options:
      - A rule that every route must create a separate browser session regardless of SDK behavior.
      - The default 30-minute inactivity timeout, even though no inactivity interval occurred.
      - Why the route handler resets analytics identity and session state, and whether reset should be limited to
        the intended account lifecycle.
      - A requirement that a page title change always rotates the session ID.
      correct: 2
      explanation: The reset calls are direct evidence at the failure boundary. Check the lifecycle code and verify
        session continuity after correcting unintended resets.
      id: 34670fea-8e9f-451e-aad6-b5dd13110601
      type: scenario
      difficulty: 4
  - id: session-properties
    instruction: '**Session properties** summarize a session, such as duration and entry URL. A session metric needs
      an explicit definition. For PostHog web analytics, the default bounce definition uses one pageview, no autocapture
      interactions, and duration below the configured threshold, normally 10 seconds.


      A one-page session can still be engaged. Always check the applicable metric settings and collected signals.'
    workedExample: A visitor reads one page for 45 seconds. A rule that marks every one-page session as a bounce
      would disagree with the default duration-based bounce definition.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/web-analytics/dashboard
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Why is a one-page session alone insufficient to apply PostHog's default bounce definition?
      options:
      - A bounce is defined only by a person's plan.
      - Only the number of browser tabs determines a bounce.
      - Duration and autocapture interactions also matter.
      - Every one-page session is always a bounce under every configuration.
      correct: 2
      explanation: Use all conditions in the defined metric. Pageview count alone omits engagement signals.
      id: 96a9869e-85e6-4b51-b487-c2ed16e295f4
      type: multiple_choice
      difficulty: 2
    - question: Using the default 10-second bounce threshold, a session has one pageview, no autocapture interactions,
        and a duration of 6 seconds. How is it classified?
      options:
      - Two sessions.
      - A new person profile.
      - An engaged session solely because a pageview exists.
      - A bounce.
      correct: 3
      explanation: 'All stated bounce conditions hold: one pageview, no autocapture interactions, and duration below
        the threshold.'
      id: 9cd4eb04-dfce-4a0a-8921-033a8e15cf73
      type: scenario
      difficulty: 3
    - question: Bounce rate rises after autocapture is disabled, while session duration and navigation patterns
        are stable. What should be investigated before claiming engagement fell?
      options:
      - Assume stable navigation proves that an interaction-dependent metric cannot change.
      - Whether the changed interaction signals altered how the bounce definition is evaluated.
      - Compare only the count of identified people, ignoring bounce inputs.
      - Lower the bounce threshold until the old percentage returns, without validating behavior.
      correct: 1
      explanation: An instrumentation change can affect a metric that depends on those signals. Compare the definition
        and signal coverage before interpreting a behavior change.
      id: 224ad4be-4308-4b12-bd93-3701efa0181c
      type: scenario
      difficulty: 4
- id: ph-actions
  name: 'Actions: Grouping Events for Analysis'
  difficulty: 3
  estimatedMinutes: 14
  tags:
  - posthog
  - data-model
  section: posthog-data-model
  prerequisites:
  - ph-events
  - ph-event-properties
  encompassing: []
  knowledgePoints:
  - id: what-are-actions
    instruction: 'A **PostHog action** groups matching events under a reusable definition. Its conditions can select
      events and properties, including autocaptured interactions. The underlying events remain available.


      An action is a query definition over captured evidence. It cannot create a missing business fact. Editing
      its conditions can change which historical events match, so record metric-definition changes.'
    workedExample: An action named Contact interest matches clicks on two contact buttons. It can measure those
      interactions, while a confirmed form submission needs a success signal.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data/actions
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: What does a PostHog action define?
      options:
      - A command that guarantees a business operation succeeds.
      - A permanent rewrite of every original event payload.
      - A new identity for every user.
      - A reusable set of conditions that match captured events.
      correct: 3
      explanation: An action groups evidence by conditions. It does not replace event identity or create a missing
        outcome.
      id: 573c4e49-7057-456b-b21d-c0d3c6c15ca7
      type: multiple_choice
      difficulty: 2
    - question: An action matches event = contact_clicked and location = header. An event has contact_clicked with
        location = footer. Does it match those conditions?
      options:
      - Only if the person has an email address.
      - Yes, because the event name matches part of the rule.
      - No, the location condition does not match.
      - Yes, because all contact events automatically belong to every action.
      correct: 2
      explanation: Evaluate the whole rule. A matching event name does not override a failed property condition.
      id: a1a3252f-f5bd-458f-9a3a-11f24bbdfff0
      type: scenario
      difficulty: 3
    - question: An action's selector is broadened and last month's count rises even though no events were added.
        What should the report owner assess?
      options:
      - The changed matching definition and its effect on historical comparability.
      - Whether user identities must be reset.
      - Whether the action necessarily created new historical events.
      - Whether the original events all changed their timestamps.
      correct: 0
      explanation: A query definition can select more existing events. Document the definition change and compare
        the old and new rules against the same evidence.
      id: ab88393b-2fcd-56bd-86a6-b948dfc0a73f
      type: scenario
      difficulty: 4
  - id: actions-vs-custom-events
    instruction: 'Choose an **action** when a reusable rule over existing events captures the intended meaning.
      Choose new instrumentation when the required fact was never recorded. For a metric migration, run the definitions
      side by side and reconcile differences before replacing a report.


      An action built from clicks can be useful, but its name should reflect the evidence it actually matches.'
    workedExample: Existing events record two successful export names from old and new clients. An action can combine
      those known success signals into one report definition.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data/actions
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which requirement can an action satisfy without new application instrumentation?
      options:
      - Create valid user identity links from display names.
      - Combine two already captured success-event names into one reusable metric.
      - Recover missing transaction amounts from no source.
      - Determine a server-side result that was never recorded.
      correct: 1
      explanation: An action can reuse available evidence. Missing facts require instrumentation or another trustworthy
        data source.
      id: 3671bfea-ac88-4742-83fd-b46255f058f1
      type: multiple_choice
      difficulty: 2
    - question: Old clients emit export_done and new clients emit export_completed. Both mean the same verified
        success. What is a suitable temporary reporting approach?
      options:
      - Change the distinct ID for every old client.
      - Count all export button clicks as successful exports.
      - Ignore the old clients before measuring their traffic.
      - Define one action matching either success event and validate the combined count.
      correct: 3
      explanation: A union of equivalent captured signals supports the migration. Check overlap so one occurrence
        is not counted twice.
      id: abc5dab5-474b-4aab-8363-c58c4e389049
      type: scenario
      difficulty: 3
    - question: A team wants to replace a paid_order event with an action matching checkout clicks. The click can
        lead to failed payment, and no success result is captured. What should the review require?
      options:
      - Treat every click as paid revenue.
      - Keep or add confirmed payment instrumentation and validate any replacement against actual orders.
      - Use the person's current plan as proof that this payment succeeded.
      - Approve the replacement because both names mention checkout.
      correct: 1
      explanation: The proposed evidence does not establish payment. Protect the metric's meaning and reconcile
        it against the authoritative outcome.
      id: 1df433ca-ff0d-4703-9c9b-ac647aeb20b8
      type: scenario
      difficulty: 4
- id: ph-event-capture
  name: 'Event Capture: SDKs, API, and Autocapture'
  difficulty: 3
  estimatedMinutes: 15
  tags:
  - posthog
  - ingestion
  section: posthog-ingestion
  prerequisites:
  - ph-events
  - ph-event-properties
  encompassing: []
  knowledgePoints:
  - id: how-events-enter-posthog
    instruction: '**Capture surfaces** include supported SDKs and the capture API. SDK behavior depends on its platform,
      version, and configuration. A web SDK can collect browser context and enabled automatic events; a backend
      SDK relies on information supplied by the application.


      Check the project token, ingestion region or host, payload, and SDK transport behavior. An HTTP acceptance
      response does not by itself prove that an event is queryable.'
    workedExample: A backend payment event supplies a trusted user ID and amount. A web pageview can include browser
      context from the web SDK. Both must route to the intended project and ingestion host.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/libraries
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which expectation about a backend capture SDK requires explicit application support?
      options:
      - Using a configured project token.
      - Knowing the browser's active user and session context.
      - Sending an event payload through its supported transport.
      - Reporting an error through its documented error path.
      correct: 1
      explanation: The backend cannot infer browser state automatically. Supply trusted identity and session context
        when the use case needs it.
      id: 266e804a-34e3-4942-b5eb-be3d8080cc53
      type: multiple_choice
      difficulty: 2
    - question: The backend capture payload is valid but uses the token of a test project. The team searches the
        production project and sees no event. What should be corrected?
      options:
      - The user's email property while retaining the test token.
      - The capture destination configuration and the project used for verification.
      - The event's amount unit before checking routing.
      - The production query's time range while continuing to send only to the test project.
      correct: 1
      explanation: The token routes capture. Confirm the intended project and host before investigating unrelated
        properties.
      id: f2f95f34-f982-41f2-aed3-4a0ee9ca3319
      type: scenario
      difficulty: 3
    - question: A serverless function creates a capture event immediately before exiting. Some events never arrive.
        What SDK behavior should be checked?
      options:
      - Buffering and the supported flush or shutdown procedure within the function's lifetime.
      - Whether changing the chart time range guarantees transport completion.
      - Whether a person profile can resend an event that never left the function.
      - Whether a longer event name forces immediate delivery.
      correct: 0
      explanation: Some SDKs buffer asynchronously. Follow the platform's documented flush behavior and verify delivery
        before the execution context ends.
      id: cc083f13-cb81-5225-b389-f6c8e07e4ccc
      type: scenario
      difficulty: 4
  - id: choosing-a-capture-surface
    instruction: '**Capture placement** should match the source of truth for the action. A confirmed payment belongs
      at the trusted success boundary, often a server or payment callback. A browser interaction belongs where that
      interaction is observable.


      PostHog also imports external data through warehouse sources. Event capture is a push flow, while a source
      connector can fetch external data. Choose from the actual data movement requirement.'
    workedExample: A checkout page click measures intent. A verified payment callback measures payment completion.
      A warehouse source can import existing billing records for analysis without pretending that each row is a
      fresh browser interaction.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data-warehouse
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: An application has no supported SDK for its runtime, but it can send authenticated HTTPS requests
        with the required capture fields. Which surface can it evaluate?
      options:
      - A browser-only autocapture script running inside an unrelated customer page.
      - A query API call that only reads existing events.
      - An action definition that attempts to generate events from no input.
      - The documented capture API, with explicit payload construction and delivery handling.
      correct: 3
      explanation: The capture API provides a direct ingestion surface. The integration must implement its request
        contract and reliable delivery behavior.
      id: e0d68cea-846b-48e4-8f94-d583ef73479c
      type: multiple_choice
      difficulty: 2
    - question: A team wants existing CRM tables imported into PostHog on a schedule. Does this requirement mean
        the CRM must push each row through the event capture API?
      options:
      - No. Evaluate a supported warehouse source and its sync contract.
      - Yes. Every PostHog data source must use browser-style event push.
      - Yes. Each CRM row must first become an identified browser session.
      - No. Therefore connector permissions and deletion handling are irrelevant.
      correct: 0
      explanation: Capture and external-source import are different surfaces. Select and validate the supported
        connector for the required data.
      id: 5ff6b702-7b8c-4075-8abe-0cad9fcd9876
      type: scenario
      difficulty: 3
    - question: Both the browser and payment webhook emit purchase_completed for one order, causing double counts.
        Which design change preserves separate useful evidence?
      options:
      - Keep both completion paths and divide every report by two.
      - Use one authoritative completion event with a stable order reference, while recording UI intent separately.
      - Assign a new person ID to each webhook retry.
      - Remove order references so duplicates are harder to detect.
      correct: 1
      explanation: Define one source of truth for the outcome and handle retries by stable identity. UI intent can
        remain a distinct signal.
      id: b2245f19-d74b-4416-98c2-612c323dc3b0
      type: scenario
      difficulty: 4
- id: ph-ingestion-pipeline
  name: 'The Ingestion Pipeline: Kafka to ClickHouse'
  difficulty: 5
  estimatedMinutes: 18
  tags:
  - posthog
  - ingestion
  section: posthog-ingestion
  prerequisites:
  - ph-event-capture
  - storage-layers
  encompassing: []
  knowledgePoints:
  - id: why-not-straight-to-db
    instruction: 'A **buffered ingestion path** separates accepting events from processing and writing them to analytical
      storage. A durable queue can absorb bursts and support retries within its retention limits. Consumers process
      queued records; lag measures how far they are behind.


      Durability is conditional on configured retention and failure handling. Acceptance, consumption, and query
      visibility are different milestones.'
    workedExample: A short traffic spike raises queue lag while storage remains healthy. Consumers catch up after
      the spike, provided capacity and retention are sufficient.
    instructionContent:
    - type: callout
      title: Practice method
      body: State the requirement, trace the supplied evidence, and check whether your answer meets every stated
        constraint.
    workedExampleContent: []
    problems:
    - question: What is one reason to put a durable queue between event acceptance and analytical storage?
      options:
      - Guarantee unlimited retention under every failure.
      - Remove the need to validate event payloads.
      - Buffer bursts and let consumers process records independently of request arrival.
      - Make every accepted event immediately visible in every query.
      correct: 2
      explanation: A queue decouples stages and can help recovery. It does not remove capacity, retention, or validation
        limits.
      id: 4a7ad01c-f353-4167-93aa-428fdeda700b
      type: multiple_choice
      difficulty: 2
    - question: Events are accepted into the queue, but the storage consumer is paused. What should happen to unprocessed
        work while retention remains sufficient?
      options:
      - The event timestamps change to the consumer's restart time.
      - Every accepted request is automatically rejected retroactively.
      - It remains pending and consumer lag grows.
      - It is necessarily already queryable in analytical storage.
      correct: 2
      explanation: Acceptance and processing are distinct. A paused consumer accumulates backlog that must later
        be processed.
      id: 8cd8e404-ae9a-4d4f-b48a-a9688192f6fc
      type: scenario
      difficulty: 3
    - question: A traffic burst creates a backlog that continues growing after traffic returns to normal. What evidence
        distinguishes a temporary burst from an ongoing capacity problem?
      options:
      - Only the number of successful capture HTTP responses.
      - Only average query latency, which does not establish consumer catch-up capacity.
      - Compare sustained arrival and processing rates, oldest pending age, errors, and retention headroom.
      - Only the current queue length, with no rate or age information.
      correct: 2
      explanation: A healthy recovery needs processing to exceed arrivals long enough to drain the backlog. Age
        and retention show whether recovery time is adequate.
      id: 731deb09-d683-4c4b-8b55-48dcc63c609e
      type: scenario
      difficulty: 4
  - id: the-full-flow
    instruction: 'Use this **scoped ingestion model** for the exercises: capture endpoint → durable queue → validation
      and enrichment consumer → analytical storage → query. It is a teaching model, not a promise of permanent internal
      service or table names.


      An offset is a position in the queue. Consumer progress and lag show whether records have passed that boundary.
      Trace one event ID through adjacent stages before changing unrelated settings.'
    workedExample: Event e17 is accepted at queue position 510. The consumer has only reached 480. Its absence from
      storage is consistent with the observed backlog; query filters cannot make an unprocessed record appear.
    instructionContent:
    - type: callout
      title: Practice method
      body: State the requirement, trace the supplied evidence, and check whether your answer meets every stated
        constraint.
    workedExampleContent: []
    problems:
    - question: Put the stages of this lesson's supplied ingestion model in data-flow order.
      options:
      - Analytical storage
      - Capture endpoint
      - Query
      - Validation and enrichment consumer
      - Durable queue
      correct:
      - Capture endpoint
      - Durable queue
      - Validation and enrichment consumer
      - Analytical storage
      - Query
      explanation: The supplied model separates acceptance, buffering, processing, storage, and reads. Use this
        order to locate the first boundary where event evidence stops.
      type: ordering
      id: 03bdd097-7f10-45dd-a93b-65e9b862e4d7
      difficulty: 2
    - question: In this flow, event e17 is at queue offset 510 and the consumer has reached 480. Storage has no
        e17 yet. What is the first boundary to inspect?
      options:
      - The source transport, assuming acceptance at a known queue position proves no enqueue occurred.
      - The dashboard filter, before the event has reached storage.
      - The distributed query router, assuming it can read an event the consumer has not processed.
      - The queue-to-consumer backlog.
      correct: 3
      explanation: The consumer has not reached the event. Investigate lag and progress before diagnosing query
        filtering.
      id: 98e30148-c815-4da9-a83d-ac43dca32c70
      type: scenario
      difficulty: 3
    - question: The consumer has passed e17's offset without a recorded rejection, storage contains e17, but a dashboard
        omits it. What should the next investigation target?
      options:
      - The query's project, time range, filters, and aggregation against the stored event.
      - The source transport alone, ignoring the storage evidence.
      - Replay all project events before checking the query.
      - Reset the consumer to an earlier offset even though e17 is already stored.
      correct: 0
      explanation: The event has crossed the earlier boundaries. Trace the remaining storage-to-query boundary using
        its actual values.
      id: 67134f07-6f8f-4fbc-857f-b6b4f0d805bf
      type: scenario
      difficulty: 4
- id: ph-clickhouse-storage
  name: 'ClickHouse Storage: Tables and Sharding'
  difficulty: 6
  estimatedMinutes: 18
  tags:
  - posthog
  - ingestion
  section: posthog-ingestion
  prerequisites:
  - ph-ingestion-pipeline
  - ph-distinct-id
  encompassing: []
  knowledgePoints:
  - id: table-roles
    instruction: 'A **distributed analytical store** can separate routing from local storage. In this lesson''s
      model, a distributed query surface reads across shards, and each shard stores a subset of event rows locally.
      A replica holds a copy for availability.


      These are roles in a supplied model. Production names and implementations can change, so verify live architecture
      before diagnosing a specific deployment.'
    workedExample: The model has two shards. Shard A holds events e1 and e3; shard B holds e2 and e4. A distributed
      read can query both. A local read on A sees only its own subset.
    instructionContent:
    - type: callout
      title: Practice method
      body: State the requirement, trace the supplied evidence, and check whether your answer meets every stated
        constraint.
    workedExampleContent: []
    problems:
    - question: In the supplied model, what is the role of a distributed query surface?
      options:
      - Choose a user's canonical identity from their profile name.
      - Store the only authoritative copy of all events outside the local shards.
      - Keep every unique event on every shard regardless of routing.
      - Route or combine reads across the relevant shards.
      correct: 3
      explanation: Distributed reads cover multiple storage subsets. Local reads and replicas have different roles.
      id: 8924c10d-9156-45fe-b42d-37a530e71419
      type: multiple_choice
      difficulty: 2
    - question: Shard A holds e1 and e3, and shard B holds e2 and e4. A query reads only the local table on A. Which
        event set can it return from those rows?
      options:
      - No events unless every shard has identical data.
      - e2 and e4 only.
      - All four events solely because the system has two shards.
      - e1 and e3.
      correct: 3
      explanation: A local read covers its local subset. Use the intended distributed surface when the query requires
        all shards.
      id: d3181fff-49ba-4b69-a652-ebd50a988ef4
      type: scenario
      difficulty: 3
    - question: A diagnostic count from one local shard is half a distributed count. The engineer concludes that
        half the events were dropped. What must be checked first?
      options:
      - Replay the apparently missing half before comparing query scope.
      - Sum every replica as if each contains additional unique events.
      - Treat a single local count as the total across all shards.
      - Whether the two queries cover the same shards, replicas, filters, and counting scope.
      correct: 3
      explanation: Different query scope can explain the difference. Compare like-for-like coverage before claiming
        loss, and avoid counting replicas as new data.
      id: 2306ab92-7bf7-464d-b429-f1ae0e85513a
      type: scenario
      difficulty: 4
    - question: In the supplied storage model, a shard has two up-to-date replicas. One replica becomes unavailable
        while the other remains healthy. Which response uses replication for its intended purpose?
      options:
      - Treat the remaining copy as unusable solely because another copy failed.
      - Replay all captured events immediately because the shard's data must be entirely lost.
      - Count the healthy replica as a new shard containing additional unique events.
      - Route reads to the healthy copy through the supported failover path and verify availability.
      correct: 3
      explanation: A replica is a copy for availability. Confirm that the surviving copy is current and use the
        supported routing path before assuming data loss or replaying records.
      id: b5271cb6-ba38-487c-8e08-7a4c3e571167
      type: scenario
      difficulty: 4
  - id: reads-writes-and-sharding
    instruction: '**Shard routing** chooses where data is written according to a specified key. For these exercises
      only, the system routes by a hash of project ID and raw distinct ID. Do not infer a production routing rule
      from this teaching model.


      One resolved person can have several raw distinct IDs. Those IDs need not route to the same shard. A complete
      person-history query must account for identity links and the relevant storage scope.'
    workedExample: Under the supplied routing rule, anonymous ID a1 lands on shard A and known ID user_9 lands on
      shard B. A valid identity link can connect their person history even though the raw events are stored separately.
    instructionContent:
    - type: callout
      title: Practice method
      body: State the requirement, trace the supplied evidence, and check whether your answer meets every stated
        constraint.
    workedExampleContent: []
    problems:
    - question: Under the supplied project-ID-plus-raw-distinct-ID routing model, what determines an event's shard?
      options:
      - Only the resolved person's current profile ID after later merges.
      - The configured hash of those routing inputs.
      - Only the event name, regardless of its distinct ID.
      - The shard selected by the first query that reads the event.
      correct: 1
      explanation: Use the stated routing key. Do not substitute descriptive properties or query presentation.
      id: 10679bec-2dbb-4f1e-8df7-d7f68781fff5
      type: multiple_choice
      difficulty: 2
    - question: The model routes a1 to shard A and user_9 to shard B. They later resolve to one person. Where can
        that person's raw events remain?
      options:
      - Necessarily only on shard B before any query.
      - Only in the browser's local storage.
      - Across both shards.
      - Necessarily only on shard A after every identity link.
      correct: 2
      explanation: Resolved identity does not by itself prove physical colocation. Read the relevant shards and
        apply the appropriate identity logic.
      id: 04ef150b-8b20-47c8-9f38-bfae891e3164
      type: scenario
      difficulty: 3
    - question: A support query restricts a person's history to the shard selected by their current ID. It misses
        older anonymous events on another shard. What should the query design address?
      options:
      - A new random user ID to move the history.
      - Only the current profile name.
      - A claim that all aliases must hash to the same shard.
      - All linked identifiers and the required distributed read scope, according to the actual deployment.
      correct: 3
      explanation: The query used an unjustified colocation assumption. Include the relevant identity and storage
        scope, then verify against known events.
      id: 1a74eb6b-080d-4c17-90aa-b28d53ed33a4
      type: scenario
      difficulty: 4
- id: ph-person-processing
  name: 'Person Processing: Resolving Events to Profiles'
  difficulty: 5
  estimatedMinutes: 17
  tags:
  - posthog
  - ingestion
  section: posthog-ingestion
  prerequisites:
  - ph-ingestion-pipeline
  - ph-persons
  - ph-distinct-id
  - person-modes
  encompassing:
  - concept: ph-persons
    weight: 0.55
  - concept: ph-distinct-id
    weight: 0.65
  knowledgePoints:
  - id: how-person-processing-works
    instruction: '**Person processing** handles identity and profile-related work during ingestion when enabled.
      It can resolve distinct IDs, apply supported profile updates, and enforce identity safeguards. Event acceptance
      does not prove every attempted identity operation succeeded.


      Use ingestion warnings and before-and-after identity evidence. Invalid or conflicting identity operations
      require correction at their source. If an ordinary event explicitly skips person processing, its event properties
      can still be present while a requested profile write is not applied.'
    workedExample: A capture request is accepted, but a proposed identity merge violates a safeguard. Inspect the
      warning and identifiers before telling the customer that the merge completed.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data/ingestion-warnings
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which task belongs to person processing?
      options:
      - Guaranteeing that every requested merge is accepted.
      - Routing every event solely by its event name.
      - Generating a trusted authenticated user from any arbitrary event label.
      - Resolving identity links and applying supported person-property updates.
      correct: 3
      explanation: Person processing operates on identity and profile data with safeguards. It cannot turn invalid
        identity evidence into a trustworthy link.
      id: 3470a60b-d502-46b2-a6f2-b014d595503b
      type: multiple_choice
      difficulty: 2
    - question: An identify request uses a disallowed placeholder ID and produces an ingestion warning. What should
        the implementation do?
      options:
      - Treat the placeholder as a successfully merged person.
      - Send a validated stable user ID when available and fix the path that emitted the placeholder.
      - Use one other shared placeholder for every affected user.
      - Retry the same invalid value until it is accepted.
      correct: 1
      explanation: Fix invalid identity at the producer. Warnings are evidence that an attempted operation did not
        meet its contract.
      id: 67eb4a22-32e7-454f-8fd0-5add451b488a
      type: scenario
      difficulty: 3
    - question: In a test, event e1 is visible with its ordinary event properties, but the same payload's intended
        profile update is absent. The payload explicitly skips person processing. Where should the diagnosis focus?
      options:
      - The dashboard date range alone, assuming it can make an unprocessed profile write appear.
      - The conflict between skipping person processing and expecting a stored-profile update.
      - The event-name spelling, assuming every property write is determined by the event name.
      - The capture transport, assuming a missing profile property means e1 never arrived.
      correct: 1
      explanation: The stored event proves arrival. The skip setting explains why a separate profile-processing
        effect is absent; verify and correct the intended processing contract.
      id: d681254e-ad32-4093-b8d0-733a20770e04
      type: scenario
      difficulty: 4
  - id: cost-control-and-skip-rules
    instruction: '**Person-processing controls** can reduce profile work when the use case does not need it. The
      server-side event property $process_person_profile = false requests that person processing be skipped. Identity
      operations that require person processing are incompatible with that choice.


      Validate processing behavior end to end. In the web SDK, use its documented profile mode and helpers; inline
      $set alone does not create a profile for a fresh anonymous identified_only capture.'
    workedExample: A high-volume event only needs event-level analysis. The team tests the skip setting against
      that use case, confirms the absence of profile-dependent operations, and checks resulting data and warnings.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data/anonymous-vs-identified-events
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: What does $process_person_profile = false request on a server-side capture?
      options:
      - Create a new identified profile on every retry.
      - Skip person-profile processing for that event.
      - Merge all distinct IDs in the project.
      - Drop every event property from storage.
      correct: 1
      explanation: The flag controls person processing. Verify its compatibility with the operations and analyses
        the event needs.
      id: 6b200b99-1e81-4780-9da6-9d91421ca757
      type: multiple_choice
      difficulty: 2
    - question: A payload sets $process_person_profile = false while attempting an identity operation that requires
        person processing. What should the integration review identify?
      options:
      - A reason to treat every warning as a success message.
      - A conflicting contract that must be corrected and tested using the supported identity path.
      - A way to force a merge by adding more arbitrary properties.
      - A guarantee that the skip flag still permits every identity mutation.
      correct: 1
      explanation: Skipping required processing and requesting an identity operation are incompatible. Choose the
        intended behavior and follow its supported path.
      id: ae8b994b-91f6-432d-80fb-9896bfde5eef
      type: scenario
      difficulty: 3
    - question: A cost change disables profile processing globally. Event totals still match, but reports that require
        stored person properties lose coverage. How should the change be evaluated?
      options:
      - By assigning one shared person to every event.
      - Against both cost and required feature coverage, restoring or scoping person processing where needed.
      - By relabeling missing property values without changing the data flow.
      - As fully successful because total event counts match.
      correct: 1
      explanation: Volume parity is insufficient. Verify the intended analyses and scope the optimization so it
        preserves required behavior.
      id: 72524bbd-2522-40a8-b3d9-a6d94a391076
      type: scenario
      difficulty: 4
- id: anonymous-vs-identified
  name: Anonymous vs Identified Events
  difficulty: 4
  estimatedMinutes: 16
  tags:
  - posthog
  - identification
  section: identification
  prerequisites:
  - ph-person-properties
  encompassing: []
  knowledgePoints:
  - id: two-modes-of-events
    instruction: '**Anonymous and identified event processing** have different capabilities and costs. Anonymous
      events can support event-based analysis without a stored person profile. Person processing supports identity
      resolution and stored person properties.


      A human can still be unknown by name while an SDK action triggers person processing. Inspect configuration
      and event flags instead of assuming that every event before login is anonymous.


      Anonymous analysis can still use a stable browser distinct ID. A new ID on every event prevents repeat-browser
      counts, while one shared ID for all browsers collapses visitors.'
    workedExample: A public-page event can be analyzed by event URL without creating a person profile. A helper
      that explicitly sets person properties can change how subsequent events are processed.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data/anonymous-vs-identified-events
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which statement correctly distinguishes human login state from PostHog person processing?
      options:
      - An event name containing login is sufficient proof of a trusted identity.
      - A stored profile always proves that the application authenticated the visitor.
      - A visitor can be unknown by name while an SDK operation enables person processing.
      - All events before authentication must skip person processing.
      correct: 2
      explanation: Authentication and analytics processing are different signals. Inspect the SDK operations and
        configuration instead of inferring one from the other.
      id: 2676741b-b563-4395-a3a6-05a3e6b3eea5
      type: multiple_choice
      difficulty: 2
    - question: A visitor has not logged in, but application code has called a profile-triggering person-property
        helper. Is login status alone enough to classify all later events as anonymous processing?
      options:
      - No. Inspect the SDK mode and profile-triggering actions.
      - Yes. All pre-login events always bypass person processing.
      - Yes. A helper can never affect profile creation.
      - No. Every pre-login event must use an email address.
      correct: 0
      explanation: Human recognition and processing mode are different dimensions. Check what the SDK actually sends
        and what operations have run.
      id: 0004f85a-eef5-4f04-b86f-2bfd2948858a
      type: scenario
      difficulty: 3
    - question: A site avoids stored person profiles but needs to count repeat visits from the same anonymous browser.
        Its custom capture code generates a new distinct ID for every event. What should change?
      options:
      - Use one shared anonymous ID for every browser.
      - Create a fake authenticated account for each event.
      - Keep changing the ID because anonymous events cannot support repeat-visitor analysis.
      - Retain a stable anonymous browser identifier for the intended measurement period, while keeping the chosen
        no-profile policy.
      correct: 3
      explanation: Anonymous describes the identity or processing state, not a requirement to discard continuity.
        Stable per-browser IDs support the stated metric; shared or per-event IDs distort it.
      id: 6e8d7305-a646-4cfb-a038-61f99dbdf142
      type: scenario
      difficulty: 4
  - id: choosing-when-to-identify
    instruction: '**Identify when a trusted stable user identity becomes available**, such as after successful login
      or account creation. Delay is appropriate when the application still lacks a valid ID. Avoid identifying with
      empty values, form guesses, or shared placeholders.


      For an existing authenticated session on a page load, identify once the trusted user record is available.
      Decide separately what anonymous analysis and flag evaluation need.'
    workedExample: A login request succeeds and returns user_64. The application then identifies user_64. A failed
      login supplies no trusted identity and should not identify the typed email as a verified account.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/identify
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which event provides a sound trigger for identifying a user?
      options:
      - A button becoming visible.
      - A failed request with no user record.
      - A visitor typing an unverified email into a form.
      - Successful authentication that supplies the stable application user ID.
      correct: 3
      explanation: Identify from a trusted identity transition. User input alone can be incomplete, invalid, or
        belong to someone else.
      id: cd970c79-a382-4c85-b384-f060e4748327
      type: multiple_choice
      difficulty: 2
    - question: A login form contains pat@example.com, but authentication fails. What should the client do with
        respect to identification?
      options:
      - Identify all failed logins as user_unknown.
      - Reuse the last successful user's ID even after logout.
      - Identify every failed attempt as the typed email.
      - Retain the existing anonymous state until a valid user identity is established.
      correct: 3
      explanation: A failed login does not prove identity. Avoid creating links from unverified form data or stale
        account state.
      id: 6a1339ac-6c65-4e3b-a50f-2102d5872d3a
      type: scenario
      difficulty: 3
    - question: The app identifies with user.id during startup, before the asynchronous user request completes.
        Some calls have a missing ID. What change addresses the timing fault?
      options:
      - Run identification only after a validated user record is available, and handle unauthenticated startup explicitly.
      - Send the call more often while the request is pending.
      - Use the project ID as a fallback user ID.
      - Convert every missing value to the literal string undefined.
      correct: 0
      explanation: Gate the transition on a real identity value. A shared placeholder would create a different and
        more serious identity error.
      id: 1bd01b6f-1d4a-5777-9b12-0ce19fc14315
      type: scenario
      difficulty: 4
- id: identify-call
  name: The Identify Call
  difficulty: 5
  estimatedMinutes: 18
  tags:
  - posthog
  - identification
  section: identification
  prerequisites:
  - anonymous-vs-identified
  encompassing:
  - concept: anonymous-vs-identified
    weight: 0.6
  knowledgePoints:
  - id: how-identify-works
    instruction: 'A valid web **identify transition** links the current anonymous browser ID to a known user ID.
      Later events use the identified state. Identity safeguards restrict invalid merges, so identify is not a general
      command for combining any two established people.


      Inspect the anonymous ID, known ID, and emitted transition when a journey fails to connect.'
    workedExample: A browser captures signup_started under anonymous ID a7, then identifies user_70 after signup.
      The valid transition supplies the evidence connecting a7 with user_70.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/identify
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: What link does the normal web identify transition establish?
      options:
      - Any two existing identified people without restriction.
      - Every session in the project to one user.
      - The current anonymous browser identity to a known user identity.
      - Every user with the same plan to one profile.
      correct: 2
      explanation: The normal transition has a specific identity context. Safeguards prevent arbitrary merges of
        established people.
      id: a5072b40-06af-431a-b738-17cd97c627ce
      type: multiple_choice
      difficulty: 2
    - question: A browser captures signup_started as a7, then validly identifies user_70 and captures signup_finished.
        Which evidence connects the two stages?
      options:
      - The fact that both events have an email-shaped property.
      - The identify transition relating a7 to user_70.
      - Their shared page URL and close timestamps alone.
      - Their shared event-name prefix.
      correct: 1
      explanation: The identity transition provides the link. Similar event metadata alone is not reliable identity
        evidence.
      id: 34927f55-fa3d-41bf-af75-99e41c9ff7c7
      type: scenario
      difficulty: 3
    - question: An integration discards the anonymous browser state immediately before identify. The previous anonymous
        events no longer connect as expected. What should be traced?
      options:
      - Whether the intended anonymous ID was still available when the identify transition was emitted.
      - Whether forcing every browser to use one anonymous ID would connect the funnel.
      - Whether the two histories should be joined solely by timestamp proximity.
      - Whether the known user's display name matches the anonymous event name.
      correct: 0
      explanation: The transition must carry the correct identity context. Trace the before-and-after IDs and avoid
        clearing the evidence before linking.
      id: 366b9fec-2829-4b7d-a090-6f0094166675
      type: scenario
      difficulty: 4
  - id: identify-best-practices
    instruction: '**Identity hygiene** keeps capture state aligned with the active account. On logout or a change
      between unrelated users on a shared device, use the SDK reset flow before identifying the next user. Validate
      the new ID.


      The web SDK can suppress repeated identical identify calls on the same page, but this is not a guarantee of
      zero overhead across page reloads. Use an intentional authentication lifecycle.'
    workedExample: User A logs out on a shared tablet. The app resets analytics state. User B then logs in and is
      identified with B's stable ID, keeping B's journey separate from A's.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/identify
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which identity lifecycle step helps separate two unrelated users who use the same browser in sequence?
      options:
      - Keep the first user's identity for the next login.
      - Use the current plan as the distinct ID.
      - Use one shared ID for the device's entire lifetime.
      - Reset analytics identity on logout before the next user is identified.
      correct: 3
      explanation: Reset clears the previous identity context. The next authenticated user can then establish their
        own identity.
      id: a51a65b7-350b-4dc7-a889-cbe843aba0aa
      type: multiple_choice
      difficulty: 2
    - question: An app repeats the same identify call three times on one page, then reloads and calls it again.
        Which claim is safe?
      options:
      - Every duplicate always creates a new person.
      - Same-page duplicates may be suppressed, while reloads can still cause another request.
      - The SDK guarantees repeated calls have no cost in every environment.
      - No identify request can occur again for that user on any future page.
      correct: 1
      explanation: Deduplication has a scope. Do not generalize same-page suppression into an unlimited guarantee.
      id: 85095977-d224-46b0-a239-4c0c47721f02
      type: scenario
      difficulty: 3
    - question: A support agent impersonates several customer accounts in one browser. Events leak between identities
        during switches. What should the application design enforce?
      options:
      - An identify call for each click using whichever ID is cached first.
      - One shared support ID for all customer behavior without labeling that design.
      - Explicit account-switch boundaries, reset where appropriate, and validation of the active analytics identity
        before capture.
      - Only a more readable database ID while retaining stale client state.
      correct: 2
      explanation: Canonical IDs alone cannot repair stale lifecycle state. Verify the switch sequence and identity
        at capture, and decide how impersonated actions should be represented.
      id: a9833208-1f2b-4e41-b72d-8287d375417e
      type: scenario
      difficulty: 4
- id: person-merging
  name: 'Person Merging: Linking Identities'
  difficulty: 6
  estimatedMinutes: 15
  tags:
  - posthog
  - identification
  section: identification
  prerequisites:
  - identify-call
  - ph-distinct-id
  encompassing:
  - concept: identify-call
    weight: 0.5
  - concept: ph-distinct-id
    weight: 0.45
  knowledgePoints:
  - id: how-merging-works
    instruction: '**Identity merging** combines identifiers when a supported transition establishes that they represent
      one person. Equality of email properties is not sufficient. Already identified people and IDs previously linked
      elsewhere can trigger safeguards.


      Inspect the supported identity operation and its result. A request being sent does not prove that the proposed
      merge was accepted.'
    workedExample: A normal anonymous-to-known transition can connect a device journey. A request to combine two
      established accounts requires careful investigation of identity rules and must not be assumed to succeed.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/identify
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: What evidence is stronger than a matching email property for explaining an accepted identity merge?
      options:
      - The same browser version.
      - Equal display names on two profiles.
      - The same subscription tier.
      - A supported identity transition that validly links the IDs.
      correct: 3
      explanation: Merge logic uses identity operations and safeguards. Descriptive similarities do not establish
        a valid link.
      id: f70ec693-fd7a-4196-a767-a50eb61afdaf
      type: multiple_choice
      difficulty: 2
    - question: An integration tries to combine two already identified people and sees an ingestion warning. What
        should it check?
      options:
      - Whether matching display names are enough to override the warning.
      - Whether repeating the same rejected operation more frequently will bypass the restriction.
      - Whether a successful HTTP request proves the identity operation was accepted.
      - The merge restriction and the identities involved, rather than assuming the request succeeded.
      correct: 3
      explanation: An emitted request can be rejected by identity safeguards. Read the warning and reconstruct the
        transition.
      id: 4c137eb0-d16f-4186-8a6e-acc387c3a5d0
      type: scenario
      difficulty: 3
    - question: A customer proposes merging all profiles with a shared household email. The database has separate
        accounts for family members. What is the correct review outcome?
      options:
      - Merge them because a shared descriptive property always proves one person.
      - Delete the oldest account to remove the ambiguity.
      - Keep those identities separate unless reliable evidence and the intended identity model establish they are
        one person.
      - Use the household email as the ID for all future events without assessing the effect.
      correct: 2
      explanation: The application models different people. A shared contact address is insufficient evidence to
        combine their analytics identities.
      id: 61767d7e-96c3-441d-97b3-993464a89b39
      type: scenario
      difficulty: 4
  - id: when-merging-goes-wrong
    instruction: '**Merge recovery** starts by stopping the faulty identity writes and identifying the affected
      IDs and period. PostHog''s Split IDs operation can separate future behavior, but recovery of historical events
      is not guaranteed.


      Keep evidence and verify the actual result. Do not promise a complete historical undo without checking the
      supported recovery path for the specific case.'
    workedExample: A shared placeholder caused two users' events to connect. Fix capture first, preserve the incident
      details, and validate future identities after the supported repair.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/identify
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which promise is unsafe when proposing Split IDs as an identity repair?
      options:
      - That future behavior should be verified after repair.
      - That affected identifiers should be recorded for investigation.
      - That it will always restore every historical event to the correct person.
      - That the faulty capture code should be fixed first.
      correct: 2
      explanation: Historical reconstruction is not guaranteed. Describe the supported behavior and verify the result
        for the affected data.
      id: 01d454b6-8f23-43e7-9243-bad73d4a7e50
      type: multiple_choice
      difficulty: 2
    - question: A shared placeholder is still being sent while a team repairs merged profiles. What should be done
        first?
      options:
      - Change only the profile display name.
      - Repeat the split while leaving the faulty writes active.
      - Stop or correct the faulty identity writes so the damage does not continue.
      - Assume a one-time repair overrides all future bad capture.
      correct: 2
      explanation: Repair cannot stay effective while the source keeps recreating the problem. Correct and validate
        the capture path first.
      id: 38cd7eae-f285-4d39-a6b5-4815657d598a
      type: scenario
      difficulty: 3
    - question: After a split, new test events remain separate, but historical reports still show mixed activity.
        What should the TAM report?
      options:
      - All future events must still be merged because history is mixed.
      - The split restored all history because one new test passed.
      - The historical events can be assigned confidently without supporting identity evidence.
      - Future separation is verified; historical recovery remains incomplete and needs case-specific investigation.
      correct: 3
      explanation: Separate the evidence for future behavior from the evidence for old data. Avoid claiming a complete
        undo from a forward-only test.
      id: 531adde2-c362-4f2c-aa91-5bf35151e290
      type: scenario
      difficulty: 4
- id: person-modes
  name: 'Person Modes: identified_only vs Always'
  difficulty: 5
  estimatedMinutes: 15
  tags:
  - posthog
  - identification
  section: identification
  prerequisites:
  - anonymous-vs-identified
  encompassing: []
  knowledgePoints:
  - id: choosing-a-mode
    instruction: 'The web **person_profiles** setting controls profile creation policy. identified_only limits automatic
      profiles until a qualifying action. always creates profiles for ordinary captures. never prevents person-profile
      processing and excludes features that require it.


      Choose the mode from the required analyses and identity operations. Verify the actual SDK version and configuration
      before assuming a default.'
    workedExample: A site needs event-level page analytics but no saved profiles. It can evaluate a restricted profile
      mode, while checking separately whether planned group or profile-based features need person processing.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data/anonymous-vs-identified-events
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which web person_profiles mode is intended to prevent person-profile processing?
      options:
      - always
      - A project's display name
      - An event's URL path
      - never
      correct: 3
      explanation: The mode controls profile policy. Confirm the consequences for the features the application intends
        to use.
      id: 278d4bfc-a015-4c4d-823c-15ab130ddb6c
      type: multiple_choice
      difficulty: 2
    - question: A customer needs known-user profiles after login but wants ordinary fresh anonymous pageviews to
        avoid automatic profile creation. Which web mode fits that policy?
      options:
      - A different project token on every pageview.
      - never while expecting stored profiles after identify.
      - identified_only, with a valid identification flow for known users.
      - always for every anonymous pageview.
      correct: 2
      explanation: identified_only supports this boundary. The application still needs an explicit, valid profile-triggering
        transition.
      id: 82367bd0-4163-4b00-9af9-f450c2eea2d1
      type: scenario
      difficulty: 3
    - question: A team chooses never, then plans stored person-property analysis and group analytics. What should
        the implementation review resolve?
      options:
      - Store the project token in a person property to bypass the mode.
      - The conflict between the mode and required features, using a tested configuration that supports the intended
        use cases.
      - Change only the feature names in the tracking plan.
      - Assume the features work because event capture works.
      correct: 1
      explanation: Capture success does not establish profile or group capability. Align the mode with the required
        operations and verify the resulting payloads.
      id: 70647733-2595-4d13-983c-3b6000ce63e1
      type: scenario
      difficulty: 4
  - id: mode-gotchas
    instruction: '**Profile-triggering helpers** matter when estimating identified_only behavior. In the web SDK,
      helpers such as identify, alias, group, and setPersonProperties can enable person processing. Inline $set
      on a fresh anonymous capture does not itself do so.


      If a flag needs properties without a saved profile, use the supported flag-property input path and test the
      actual payloads. Do not substitute a profile-writing helper without considering its side effects.'
    workedExample: A team wants anonymous flag targeting by a supplied country value. It uses the supported flag-property
      setter instead of creating stored person properties solely for that evaluation.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data/anonymous-vs-identified-events
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which distinction matters in identified_only mode for a fresh anonymous web visitor?
      options:
      - An inline capture $set and the setPersonProperties helper have different profile-creation behavior.
      - Every object containing a property automatically identifies the visitor.
      - Only a successful login can ever trigger person processing.
      - A flag name is automatically used as the person ID.
      correct: 0
      explanation: The helper operation matters. Identified-only does not mean that login is the sole possible profile
        trigger.
      id: 9ac10227-87a4-40e3-9e85-17bf2fcac981
      type: multiple_choice
      difficulty: 2
    - question: A page only needs an anonymous flag rule with an explicitly supplied country. It must avoid creating
        a stored profile solely for this input. Which approach should it evaluate?
      options:
      - The supported flag-property input API, with a test that confirms no unwanted profile creation.
      - A fabricated email-based identify call.
      - setPersonProperties solely because its name contains properties.
      - A shared country string as every visitor's distinct ID.
      correct: 0
      explanation: Supply the flag input through the intended evaluation path. Profile writes and identity changes
        introduce separate effects.
      id: 3e3697e1-e592-4361-b92b-fe39d44b89b7
      type: scenario
      difficulty: 3
    - question: Anonymous-profile counts increase after a frontend release. The mode remains identified_only, but
        a new helper now sets person properties on every page. What evidence should the investigation compare?
      options:
      - Before-and-after helper calls, processing flags, and profile creation for a fresh browser.
      - The assumption that identified_only forbids profiles before authentication under all helper calls.
      - Only whether a login form is present, because helpers cannot affect processing.
      - Only whether the event name remained $pageview.
      correct: 0
      explanation: The new helper can change processing despite an unchanged mode. Reproduce with fresh state and
        inspect the resulting behavior.
      id: d596e372-6eb0-5587-98a3-9bb84733834a
      type: scenario
      difficulty: 4
- id: identification-pitfalls
  name: Common Identification Pitfalls
  difficulty: 6
  estimatedMinutes: 18
  tags:
  - posthog
  - identification
  section: identification
  prerequisites:
  - person-merging
  - person-modes
  encompassing: []
  knowledgePoints:
  - id: duplicate-profiles-across-devices
    instruction: '**Cross-device identity** requires a shared canonical ID and valid links from each device''s anonymous
      state. Before a device identifies, its anonymous activity can remain separate. A stored email property alone
      is not a device link.


      Test the transition on each device. Distinguish a temporary anonymous journey from a genuinely conflicting
      known-user ID. A resolved person can have separate sessions on separate devices; matching session IDs are
      not required for a person link.'
    workedExample: A laptop identifies user_24 after login. A phone stays anonymous until its own login, then identifies
      the same user_24. Each device needs its own valid transition.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/identify
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Why can one real person initially have separate anonymous journeys on two devices?
      options:
      - The same email property automatically links device identities.
      - Each device can start with its own anonymous identity before a linking transition.
      - A shared IP address always resolves both devices to one person.
      - Any events within the same minute are automatically one person.
      correct: 1
      explanation: Anonymous device state does not by itself prove a shared person. A valid identity transition
        supplies that connection.
      id: a44853d6-fbfe-40b1-bb51-dd5f0f5a24fb
      type: multiple_choice
      difficulty: 2
    - question: Two devices validly identify the same canonical user. They retain different browser session IDs.
        Does the session difference establish an identity-link failure?
      options:
      - No. Therefore the devices must be counted as one simultaneous session.
      - No. A shared person can have separate sessions on different devices.
      - Yes. Correct identity resolution requires one session ID across all devices.
      - Yes. The second device must overwrite the first device's session ID.
      correct: 1
      explanation: Person identity and session identity have different scopes. Verify the person link independently
        of each device's session.
      id: 45f3da78-eb86-464e-add6-5e9591c52da5
      type: scenario
      difficulty: 3
    - question: A phone's anonymous events remain separate while the laptop is already identified. The phone has
        never logged in. What is the best next test?
      options:
      - Copy the laptop's session ID into all phones.
      - Conclude the laptop's identify call must have failed.
      - Perform a valid login on the phone and trace its anonymous-to-canonical transition.
      - Merge every anonymous visitor who viewed the same page.
      correct: 2
      explanation: A transition on one device does not automatically establish another device's unknown identity.
        Test the missing link on the affected device.
      id: ff908738-1abe-4b1e-91d0-b4d95439517a
      type: scenario
      difficulty: 4
  - id: canonical-ids-across-systems
    instruction: 'A **canonical ID contract** specifies the exact value each system uses for a known actor. Include
      namespace, type conversion, and ownership. Values such as 42, user_42, and an email address are different
      strings unless deliberately linked.


      Use trusted authentication or application records as the source. Instrumentation tests should compare the
      actual IDs emitted by every participating system.'
    workedExample: The identity contract says tenant_5:user_42. Frontend login, API capture, and background jobs
      all derive that same value from trusted tenant and user records.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/identify
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: What should a cross-system canonical ID contract specify?
      options:
      - A different service-specific ID with no namespace or linking rules.
      - Only the person's current display name.
      - A fresh random ID for each event to guarantee uniqueness.
      - The exact stable representation and namespace used for each actor.
      correct: 3
      explanation: An exact contract prevents collisions and string mismatches. Display names and presentation do
        not define identity.
      id: 313e3777-e22f-45ac-9ad1-fd7b0e77f2b2
      type: multiple_choice
      difficulty: 2
    - question: The frontend emits tenant_5:user_42, but a worker emits user_42 and tenants can share user numbers.
        What needs correction?
      options:
      - The worker must follow the tenant-aware canonical ID contract.
      - Both systems must use the same session ID for every event.
      - The worker should use the job queue name as the actor.
      - The frontend must remove tenant scope even though IDs can collide.
      correct: 0
      explanation: The missing namespace changes identity and can cause collisions. Align the worker with the established
        source-of-truth contract.
      id: 5438ab68-2ade-4fcc-9f3e-17b0291b7ec2
      type: scenario
      difficulty: 3
    - question: A migration changes canonical ID format. Historical events use the old format, and two services
        will roll out on different days. What must the rollout plan include?
      options:
      - A deliberate supported identity-transition strategy, compatibility tests, and monitoring for split identities
        during overlap.
      - An assumption that similar-looking strings merge automatically.
      - A different random prefix for each service release.
      - Only a change to profile display names.
      correct: 0
      explanation: An ID-format migration changes identity, not just formatting. Plan and test the transition while
        old and new emitters coexist.
      id: adbd34df-35aa-4c8d-8dfe-53e888a0dbcd
      type: scenario
      difficulty: 4
  - id: cross-device-gaps
    instruction: '**Journey-gap diagnosis** checks each event''s project, distinct ID, time, and identity transition.
      Backend activity can arrive before frontend identification when it already uses the correct canonical ID.
      The useful requirement is a valid eventual link, rather than a universal frontend-first order.


      Person identity and session identity remain separate. A connected person history does not imply one session
      across devices.'
    workedExample: A backend signup event arrives as user_90. The browser later identifies its anonymous ID to user_90.
      Investigate the validity of that link instead of treating arrival order alone as a failure.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/identify
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Does backend capture always have to wait for frontend identify when the backend already knows the
        canonical user ID?
      options:
      - Yes. Every earlier backend event is permanently unusable.
      - No. It can capture under that ID; the frontend still needs its valid identity link.
      - No. Therefore any arbitrary backend ID will connect automatically.
      - Yes. The backend must use the browser's anonymous ID even when the canonical user ID is known.
      correct: 1
      explanation: Canonical identity and valid linking matter. Arrival order alone does not determine whether the
        history can connect.
      id: 3ffb0b49-e210-4ee9-8fcb-03f79089d8a2
      type: multiple_choice
      difficulty: 2
    - question: A server records signup_completed as user_90 before the browser validly identifies to user_90. Which
        outcome is supported?
      options:
      - The server event must belong to a different person forever solely because it arrived first.
      - The server must rewrite its ID to the old anonymous browser ID.
      - The two events must share one browser session automatically.
      - The known-user events can belong to the same resolved person once the valid link is processed.
      correct: 3
      explanation: A valid link to the same canonical identity can connect person history. Session membership is
        a separate question.
      id: c96cf4c7-730e-4781-aa25-eb0b543fd436
      type: scenario
      difficulty: 3
    - question: Browser events and server events use the same canonical ID but are sent to different projects. A
        user journey report in one project lacks the other events. What should you fix or clarify first?
      options:
      - The intended project routing and whether both sources should feed the same analysis project.
      - The event names first, assuming matching IDs join data across independent projects.
      - A profile merge within production before locating the events in the other project.
      - The user's browser session timeout, while ignoring project routing.
      correct: 0
      explanation: Identity is scoped to project data. Check routing before trying to repair an identity link that
        cannot cross the current project boundary.
      id: 586cdc39-eb10-40db-a3f8-ff23e1c6b0be
      type: scenario
      difficulty: 4
- id: group-types
  name: 'Group Types: Modeling Organizations'
  difficulty: 4
  estimatedMinutes: 15
  tags:
  - posthog
  - groups
  section: group-analytics
  prerequisites:
  - ph-persons
  - ph-event-properties
  - relationships
  encompassing: []
  knowledgePoints:
  - id: what-are-groups
    instruction: '**Groups** let analysis aggregate events by an entity such as a company or project. A group type
      names the category; a group key identifies one instance. A cohort selects people who meet conditions, which
      serves a different analytical purpose.


      Decide what one counted unit should represent before building a metric.'
    workedExample: For weekly active companies, the unit is company. Several users' qualifying events can contribute
      to one active company when each event carries the appropriate company group context.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/group-analytics
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: In group analytics, what is the difference between a group type and a group key?
      options:
      - The key is the number of events captured in the group.
      - The type is a category such as company; the key identifies an individual company.
      - The type identifies one user, and the key is always their email.
      - They are two names for the same project token.
      correct: 1
      explanation: Category and instance identity are separate. Keep type names consistent and use stable keys for
        instances.
      id: e9c92dec-e2f3-4216-8e1d-30804d4b56f7
      type: multiple_choice
      difficulty: 2
    - question: Three people from company A and two from company B perform the qualifying action. All events carry
        correct company group context. How many active companies does this represent? Enter the number only.
      options: []
      correct: '2'
      explanation: Count the chosen entity. Five active people across two companies represent two active companies.
      type: fill_blank
      id: cb981fe5-8559-4c8b-8519-5910baa634ee
      difficulty: 3
    - question: A stakeholder asks whether accounts complete onboarding even when different employees perform the
        steps. Which analytical unit should the design evaluate?
      options:
      - Session IDs used as permanent company identifiers.
      - Individual users only, while assuming employees are interchangeable without group context.
      - Company groups with correctly attributed events and a company-level funnel.
      - A cohort of people used as if it were one company entity.
      correct: 2
      explanation: The business outcome belongs to the account. Group attribution lets several people contribute
        to that account's journey.
      id: 660d110c-28a0-48b5-886e-ef41ada57f8b
      type: scenario
      difficulty: 4
  - id: modeling-with-groups
    instruction: '**Group modeling** selects business entities worth aggregating. Use stable keys, and keep properties
      at their correct owner: company plan on the company, user preference on the person, and action context on
      the event.


      An event can connect a person and group through captured context. This is evidence of activity, not a complete
      authoritative membership directory.'
    workedExample: A contractor works in two organizations. Events identify the active organization for each action;
      the application's membership database remains the authority for access rights.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/group-analytics
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which property most naturally belongs to a company group?
      options:
      - A browser session's start time.
      - A user's personal interface language.
      - One click's horizontal coordinate.
      - The company's subscription tier.
      correct: 3
      explanation: Put facts on the entity they describe. Company subscription state can apply to many users in
        that company.
      id: 7c640b67-d613-4f2c-b5af-f330c6604d55
      type: multiple_choice
      difficulty: 2
    - question: A consultant performs one action for company A and another for company B. How should company context
        be modeled?
      options:
      - Create one combined company AB without a business requirement.
      - Attribute each event to the company active for that action.
      - Assign every event forever to the first company visited.
      - Use the consultant's email as both company keys.
      correct: 1
      explanation: The event context determines which company the action concerns. A person can act in different
        groups over time.
      id: eca1ab0b-9e01-455d-812d-a8e8757da289
      type: scenario
      difficulty: 3
    - question: A security team wants to use the list of people associated with a PostHog group as the complete
        current access-control list. What limitation should be explained?
      options:
      - Every group automatically removes users the moment application access is revoked.
      - Group analytics guarantees a complete inventory of all account members.
      - A user who has never emitted a group event must have no access.
      - The association is based on captured activity and does not replace the authoritative membership and permission
        system.
      correct: 3
      explanation: Activity evidence can omit inactive members or include historical participants. Authorization
        needs the application's actual membership records.
      id: 45e37c38-19e8-48f1-915e-4b07a26f5505
      type: scenario
      difficulty: 4
- id: group-identify
  name: Group Identify & Group Properties
  difficulty: 5
  estimatedMinutes: 15
  tags:
  - posthog
  - groups
  section: group-analytics
  prerequisites:
  - group-types
  - identify-call
  encompassing:
  - concept: group-types
    weight: 0.7
  - concept: identify-call
    weight: 0.45
  knowledgePoints:
  - id: creating-groups-and-properties
    instruction: '**Group identification** creates or updates a group''s properties. The web group helper also associates
      subsequent events with that group. The group-identify event can create the type when it does not exist; a
      separate manual type-registration step is not universally required.


      Use a stable key instead of an editable display name. Set descriptive properties such as name or plan separately.'
    workedExample: The web app calls group for type company, key org_8, and properties name = Acme. Acme can later
      rename without changing org_8.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/group-analytics
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which value is the better key for a company whose display name can change?
      options:
      - Its current display name if names can repeat.
      - Its stable internal company ID.
      - The email of whichever employee first visited.
      - Its current subscription tier shared by many companies.
      correct: 1
      explanation: A group key carries identity. Mutable or repeated labels belong in descriptive properties.
      id: 9bd4ddaf-ea78-492d-922d-ac79cf91b958
      type: multiple_choice
      difficulty: 2
    - question: Company org_8 changes its name from Acme to Acme Labs. Which update preserves its group identity?
      options:
      - Update the name property for key org_8.
      - Change every member's user ID to Acme Labs.
      - Use the new name as the project token.
      - Create a new key Acme Labs and stop referring to org_8 without a migration.
      correct: 0
      explanation: Keep the stable key and update the description. Changing identity for a rename can split the
        company's history.
      id: 3b870662-1b4a-4da0-9db1-1ee895ae547d
      type: scenario
      difficulty: 3
    - question: A new integration says it must manually register every group type in project settings before a supported
        group-identify call can work. How should this be reviewed?
      options:
      - Assign every new company a new group type to avoid setup.
      - 'Check the supported SDK path: a group-identify operation can create the type, so validate that flow and
        its limits.'
      - Skip group identification and assume a display label creates properties.
      - Accept the universal requirement without testing the SDK behavior.
      correct: 1
      explanation: Use the documented creation path. Types describe categories, so individual companies should usually
        share one company type.
      id: df93f153-61ba-425c-a05c-2491b89da26b
      type: scenario
      difficulty: 4
  - id: backend-group-identify-pattern
    instruction: '**Backend group updates** and event attribution are separate operations. A group-identify call
      updates the group. A backend capture should explicitly supply the group context for that event through the
      SDK''s supported argument.


      A long-lived backend client serves many accounts. Do not assume it retains the correct active group from a
      previous request.'
    workedExample: 'A worker updates company org_8''s plan with groupIdentify. When it captures invoice_paid, it
      also passes company: org_8 in that event''s groups argument.'
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/group-analytics
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: What does a backend group-identify call primarily establish?
      options:
      - The browser's current session ID.
      - The specified group's existence or properties.
      - A permanent implicit group for every future server request.
      - A merge of all users of the backend client.
      correct: 1
      explanation: Group property writes and capture context serve different purposes. Supply event attribution
        explicitly in backend capture.
      id: c3934a69-838b-45f4-a259-97c2d641acb9
      type: multiple_choice
      difficulty: 2
    - question: A worker sends groupIdentify for org_8, then captures invoice_paid without group context. What is
        missing for reliable group attribution of that event?
      options:
      - A duplicate person ID for every company employee.
      - The company's name inside the event name only.
      - The capture call's company group key.
      - A new group type for the invoice number.
      correct: 2
      explanation: The property update does not establish an implicit per-request company for later backend captures.
        Pass the intended group on the event.
      id: 5f58ac0f-4735-4b27-856e-2297dc6d5539
      type: scenario
      difficulty: 3
    - question: A shared server client handles simultaneous requests for companies A and B. A helper keeps the last
        company in a global variable. What design prevents cross-account attribution?
      options:
      - Use company A for every event to make results consistent.
      - Create a new person profile whenever the global value changes.
      - Derive and pass group context from each request or job's trusted data.
      - Keep the global variable and hope requests finish in order.
      correct: 2
      explanation: Request-local context avoids concurrency races. The shared client's last value cannot reliably
        identify the current event's company.
      id: 5a7c31e4-0a9a-4fbd-ae82-aa3d9ec71ce4
      type: scenario
      difficulty: 4
- id: linking-events-to-groups
  name: Linking Events to Groups
  difficulty: 5
  estimatedMinutes: 15
  tags:
  - posthog
  - groups
  section: group-analytics
  prerequisites:
  - group-identify
  encompassing:
  - concept: group-identify
    weight: 0.55
  knowledgePoints:
  - id: frontend-vs-backend-patterns
    instruction: '**Frontend group context** can persist for subsequent captures after the web group helper. Backend
      SDKs use explicit group context per event. Keep these patterns distinct when sharing utility code.


      For a frontend workspace switch, update or clear the relevant context before the next action is captured.
      Test that the emitted event contains the intended group key.'
    workedExample: A browser switches from org_A to org_B. The group state changes before project_opened is captured.
      A server job independently supplies org_B from the job payload.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/group-analytics
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which implementation detail requires attention when porting web group-tracking code to a backend
        service?
      options:
      - The backend event name automatically creates all group properties.
      - The backend must use one group type per request.
      - Backend groups always use a person's email as the key.
      - The web helper's subsequent-event context should not be assumed to exist on backend captures.
      correct: 3
      explanation: SDK state behavior differs by environment. Preserve the intended attribution explicitly when
        moving capture code.
      id: 6219b950-5bc8-4ce8-8e53-2b4608df7431
      type: multiple_choice
      difficulty: 2
    - question: A browser was associated with org_A. The user switches to org_B, but project_opened is captured
        before group context changes. Which company can receive the event?
      options:
      - org_A, because the stale context was still active at capture.
      - Neither, because web group context never persists.
      - Both companies always receive every event.
      - org_B automatically because the UI title changed.
      correct: 0
      explanation: Capture uses the context present at that moment. Update the context before capturing the action
        for the new workspace.
      id: d5ba6433-f796-4d77-94e5-15babffaacf8
      type: scenario
      difficulty: 3
    - question: Frontend events show org_B correctly after a switch, but backend events still show org_A. What should
        you trace?
      options:
      - The backend request or job context and its per-event group argument independently of frontend state.
      - A new group type for org_B instead of correcting the per-event group key.
      - A forced merge of the user's identities before inspecting group attribution.
      - Only the browser's group call, assuming it changes server state automatically.
      correct: 0
      explanation: A browser update does not update a separate server's context. Trace the boundary and the actual
        backend payload.
      id: 348e86d4-d470-4352-9081-e55ffa44b0b3
      type: scenario
      difficulty: 4
  - id: group-linking-constraints
    instruction: '**Group attribution is attached to events.** An event can contain keys for several group types,
      such as company and project. Within one type, its group context identifies one key. A person can emit different
      events for different groups of the same type.


      Group context is not retroactively inferred from a later membership change. Validate it at capture.'
    workedExample: 'An event can carry company: org_8 and project: project_2. Another event by the same person can
      carry company: org_9 when that action concerns another organization.'
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/group-analytics
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which group context fits one event that belongs to company org_8 and project project_2?
      options:
      - One company key and one project key under their respective group types.
      - Two different company keys packed into one comma-separated company value.
      - No event context because a person can have only one permanent group.
      - The company name substituted for the user's ID.
      correct: 0
      explanation: Different group types can coexist on one event. Each type's key should identify the intended
        instance.
      id: eb3d6dd2-ee5d-4f6f-9fe4-4d5ef6ef1a1f
      type: multiple_choice
      difficulty: 2
    - question: 'An event carries company: "org_A,org_B" as one string. The author intended it to count independently
        for both company keys. What is the issue?'
      options:
      - The SDK automatically copies the event into every company in the project.
      - That string is a single key, not two separate company associations.
      - The comma guarantees two valid group links.
      - The value changes only the person's email.
      correct: 1
      explanation: A group key is an identifier. Define the analytical requirement explicitly instead of encoding
        multiple same-type groups in a string.
      id: 00c394fe-6b57-4938-9ff0-edd2adfb470f
      type: scenario
      difficulty: 3
    - question: A person joins company B today. Their older events explicitly carry company A. The customer expects
        those old events to move to B automatically. What should you explain?
      options:
      - Historical event attribution records the company context captured for those actions; a later membership
        change does not automatically reassign it.
      - The latest company always replaces every historical group key.
      - Changing the group's display name moves the old events to B.
      - All historical group context is ignored in analysis.
      correct: 0
      explanation: Group context describes the occurrence. Distinguish activity history from current membership
        before proposing any data correction.
      id: 5c070e22-f023-4bb3-bc8b-353b1d8bfb02
      type: scenario
      difficulty: 4
- id: group-gotchas
  name: Group Analytics Gotchas
  difficulty: 5
  estimatedMinutes: 15
  tags:
  - posthog
  - groups
  section: group-analytics
  prerequisites:
  - linking-events-to-groups
  - person-modes
  encompassing: []
  knowledgePoints:
  - id: important-limitations
    instruction: '**Group troubleshooting** separates group properties, event attribution, processing mode, and
      UI visibility. A group can be absent from a list when it has no descriptive properties. The current documentation
      requires at least one property for a group to appear in People and groups.


      In a profile-restricted setup, check the supported group helper and person-processing behavior. Inspect payloads
      and warnings before assuming the group key alone proves success.'
    workedExample: An event contains a company key, but the group list is empty. Inspect the group-identify operation
      and its properties, then confirm the event's processing path and project.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/group-analytics
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which documented condition can explain why a group with a known key does not appear in the People
        and groups list?
      options:
      - A guarantee that event attribution automatically creates all descriptive group properties.
      - A requirement that every group have at least ten active users.
      - No group property has been set.
      - A requirement that the group key equal its display name.
      correct: 2
      explanation: Check the group's property record and the documented visibility requirement. A list view alone
        is not a full test of event attribution.
      id: aee4e521-4e41-471a-a2df-75533a5eb8ce
      type: multiple_choice
      difficulty: 2
    - question: A group-identify payload sets company org_8 with name = Acme, but the event being investigated carries
        company org_9. What should be checked first?
      options:
      - Whether the property update and event refer to the same intended group key.
      - Whether identical group types imply that all their keys share properties.
      - Whether changing org_8's display name also changes org_9's key.
      - Whether the event can inherit properties from the most recently updated group regardless of its key.
      correct: 0
      explanation: Compare identifiers across the two operations. Properties written to org_8 do not describe org_9.
      id: 83334e44-4eef-49b1-87ff-3989caa85023
      type: scenario
      difficulty: 3
    - question: Group reports are empty after a team disables person processing and manually adds $groups to captures.
        What is the best investigation?
      options:
      - Create more group types without checking the existing payloads.
      - Assume the presence of $groups alone proves group processing succeeded.
      - Add random group properties until a chart changes.
      - Verify the supported group flow, processing mode, payloads, and ingestion warnings with a controlled test.
      correct: 3
      explanation: The full processing path must support the intended feature. Inspect configuration and warnings
        before changing the entity model.
      id: 067c966e-9994-4b92-b757-755d47af246c
      type: scenario
      difficulty: 4
  - id: limits-and-feature-constraints
    instruction: '**Group type limits** apply to categories, rather than the number of individual companies. Current
      documentation permits up to five group types per project. Use one company type with many stable company keys
      instead of a type per customer.


      Group analytics also has product and billing requirements. Check current availability and pricing for a customer
      rather than promising a fixed cost from a training example.'
    workedExample: A SaaS product models company and workspace as two types. Thousands of company keys still use
      one company type.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/product-analytics/group-analytics
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Under the documented five-group-type limit, what consumes one type?
      options:
      - Each person associated with a company.
      - Each individual company key.
      - A category such as company.
      - Each event attributed to a company.
      correct: 2
      explanation: The limit is on entity categories. Many instances can share the same group type.
      id: e00a15ef-d859-4216-beb1-ed42913ca544
      type: multiple_choice
      difficulty: 2
    - question: A project has company and project group types, with 4,000 company keys. How many group types does
        that design use? Enter the number only.
      options: []
      correct: '2'
      explanation: Count categories, not instances. The number of company keys does not create additional group
        types.
      type: fill_blank
      id: d00da6ea-b5ff-4eff-ae9d-bd9af2f2c2db
      difficulty: 3
    - question: A customer proposes a separate type for each of 200 customer accounts and asks for a cost guarantee.
        What should the TAM recommend?
      options:
      - Guarantee pricing from an old screenshot without checking current terms.
      - Use stable keys under an appropriate shared type and verify current feature access and billing for the project.
      - Use one group type per user to reduce the account count.
      - Promise that 200 types are supported under the five-type limit.
      correct: 1
      explanation: The model confuses categories with instances. Correct that first, then assess current commercial
        and feature requirements.
      id: a840dbb7-ef09-4f04-9316-5f3cd41c529e
      type: scenario
      difficulty: 4
- id: ph-cdp-overview
  name: 'PostHog CDP: Sources, Transformations, Destinations'
  difficulty: 4
  estimatedMinutes: 16
  tags:
  - posthog
  - cdp
  section: posthog-cdp
  prerequisites:
  - transformation-etl-elt
  encompassing:
  - concept: transformation-etl-elt
    weight: 0.4
  knowledgePoints:
  - id: three-pieces
    instruction: 'PostHog''s **customer data platform workflow** connects sources, transformations, and destinations.
      Sources bring data in, transformations prepare events, and destinations send data to other systems. Warehouse
      connectors and event destinations solve different timing and data-shape needs.


      Name the required source, output, and latency before choosing a surface.'
    workedExample: A product event enters from an SDK, receives an allowed-field transformation, and is sent to
      a support destination. A nightly warehouse sync is a separate data movement use case.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/cdp
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which part of a data flow sends processed events to another system?
      options:
      - An insight that only queries already stored events.
      - A source that imports records from that other system.
      - A destination.
      - A transformation that only changes fields within the incoming payload.
      correct: 2
      explanation: The destination is the outbound surface. Source access and transformation have different roles.
      id: 22da55bf-2a34-4849-be4a-ada9ff619875
      type: multiple_choice
      difficulty: 2
    - question: A flow receives a signup event, removes an unnecessary property, then sends it to a CRM. Which step
        is the transformation?
      options:
      - The CRM receiving the result.
      - Removing the unnecessary property.
      - The source emitting signup.
      - The user choosing a password.
      correct: 1
      explanation: Identify the step that changes the payload. Ingestion and outbound delivery are separate boundaries.
      id: c755d87d-cb8b-4093-bb17-217d94eaafd4
      type: scenario
      difficulty: 3
    - question: A CRM needs selected signup events within minutes, but a proposed design only refreshes a warehouse
        table nightly. What should be reassessed?
      options:
      - The outbound event delivery surface and its latency against the CRM requirement.
      - Whether all warehouse rows should be sent as signup notifications regardless of event meaning.
      - Whether calling a nightly schedule real time is enough to meet the deadline.
      - Only the warehouse refresh job's success status, without measuring delivery time.
      correct: 0
      explanation: Choose a flow that serves the required event and timing contract. A nightly table refresh does
        not automatically satisfy a near-real-time event destination need.
      id: 6f770cea-c4f7-42ab-aa71-5b83824cc21e
      type: scenario
      difficulty: 4
  - id: choosing-the-cdp-surface
    instruction: '**Surface selection** follows direction, shape, and timing. Event destinations deliver selected
      events outward. Batch exports move event data in scheduled batches to supported storage or warehouse targets.
      Warehouse sources import external data for analysis.


      Confirm the supported connector, fields, update behavior, and failure handling for the concrete use case.'
    workedExample: A team wants daily event files in its own storage. It evaluates a batch export. A team wants
      external billing tables available for joins in PostHog and evaluates a warehouse source.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/cdp
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which use case fits an external warehouse source into PostHog?
      options:
      - Rename a PostHog person profile.
      - Send a signup alert to another application.
      - Import billing tables so they can be analyzed alongside product data.
      - Export PostHog events into the customer's object storage.
      correct: 2
      explanation: A source brings external data into the analysis environment. Destinations and exports move data
        outward.
      id: b8e38d69-47ac-4218-9a75-cc4fc49f030e
      type: multiple_choice
      difficulty: 2
    - question: A data team wants scheduled batches of PostHog events in its own supported storage destination.
        Which surface should it evaluate first?
      options:
      - A person identify call.
      - A cohort name change.
      - An anonymous feature-flag property override.
      - Batch exports.
      correct: 3
      explanation: Batch exports match scheduled outbound data movement. Confirm the destination and delivery contract
        before setup.
      id: 5fdac325-c62c-46fc-bf83-07dada9faf4c
      type: scenario
      difficulty: 3
    - question: An integration request says "sync Salesforce" but omits direction and purpose. What information
        is necessary before selecting a connector?
      options:
      - Only whether the team calls the work ETL, without a data contract.
      - Only the API token type, without the records or latency requirements.
      - Whether data must enter PostHog or leave it, which records are involved, and the required freshness.
      - Only the source system's name, assuming one connector covers all directions.
      correct: 2
      explanation: The same product name can appear on either side of a flow. Resolve the data contract before choosing
        the surface.
      id: c45c100d-ee27-4077-bbee-fe7207a334f6
      type: scenario
      difficulty: 4
- id: ph-destinations-exports
  name: Destinations & Batch Exports
  difficulty: 4
  estimatedMinutes: 15
  tags:
  - posthog
  - cdp
  section: posthog-cdp
  prerequisites:
  - ph-cdp-overview
  encompassing:
  - concept: ph-cdp-overview
    weight: 0.55
  knowledgePoints:
  - id: realtime-vs-batch
    instruction: '**Delivery latency** describes how quickly data becomes usable downstream. Event-driven delivery
      can serve timely operational reactions. Batch export supports bounded data windows and bulk processing. Neither
      label alone guarantees end-to-end freshness or exactly-once effects.


      Account for queueing, retries, destination processing, and late events. Define the measurable deadline at
      the consumer.'
    workedExample: A support notification must appear within two minutes of a signup. Measure the time from event
      occurrence through destination acceptance and final visibility, including retry cases.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/cdp/batch-exports
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which measurement establishes end-to-end delivery freshness?
      options:
      - Time from the relevant occurrence to usable data at the consumer.
      - Only the time to enqueue an outbound request.
      - Only the dashboard query duration.
      - Only the connector's configured schedule label.
      correct: 0
      explanation: The consumer deadline includes every stage. Queue acceptance or a schedule name alone is incomplete
        evidence.
      id: b9a9b4fc-5dba-466d-8f34-2734a4b73fca
      type: multiple_choice
      difficulty: 2
    - question: Events enter an outbound queue within one second, but the destination processes them ten minutes
        later. A two-minute consumer deadline is required. Does queue speed prove the requirement is met?
      options:
      - No. Therefore the source event timestamp must be removed.
      - Yes. Only enqueue time counts for every freshness contract.
      - Yes. All destinations have zero processing time by definition.
      - No. Usability at minute 10 exceeds the two-minute deadline by eight minutes.
      correct: 3
      explanation: Measure the whole path against the defined deadline. The downstream processing stage currently
        prevents compliance.
      id: 6bf3ab57-ef07-4bb0-a7a4-c293654990dc
      type: scenario
      difficulty: 3
    - question: An operational alert needs minute-level updates and the analytics archive needs daily files. What
        design best fits the separate requirements?
      options:
      - Send all archive rows as urgent notifications to the support channel.
      - Discard the archive because one consumer needs low latency.
      - Use a suitable timely event path for alerts and a validated batch export for the archive.
      - Force both through a daily batch and label alerts immediate.
      correct: 2
      explanation: Different consumers can justify different serving paths. Define and verify each path's contract
        independently.
      id: daabcbb7-7ebb-40a8-9234-fccee48b7252
      type: scenario
      difficulty: 4
  - id: operating-exports
    instruction: '**Export operations** require more than an enabled configuration. Inspect run status, covered
      time windows, destination records, and errors. A successful retry can repeat delivery, so downstream processing
      should handle duplicates according to the connector''s actual guarantees.


      For a backfill, define the missing interval and compare source and destination evidence. Do not claim a complete
      repair from a green status alone.'
    workedExample: A daily export fails for Tuesday. After credentials are repaired, the team reruns the Tuesday
      interval and reconciles stable event IDs or equivalent completeness checks at the destination.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/cdp/batch-exports
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which evidence most directly shows that an expected export interval reached its destination?
      options:
      - The destination name exists in a menu.
      - The export toggle is enabled.
      - The destination contains the expected records for that interval, supported by run evidence.
      - An unrelated interval succeeded last week.
      correct: 2
      explanation: Configuration is intent. Verify the relevant run and destination data for the interval being
        investigated.
      id: 3682f3cc-97d6-473e-9320-53e90c5d2aa8
      type: multiple_choice
      difficulty: 2
    - question: Monday and Wednesday exports exist, while Tuesday failed with an expired credential. After fixing
        access, what should the recovery target?
      options:
      - The missing Tuesday interval, followed by destination validation.
      - Every interval since project creation without assessing duplicate delivery.
      - Only Thursday's future schedule.
      - Only the failed run's status label, leaving the missing destination interval untouched.
      correct: 0
      explanation: Repair the access cause and the actual coverage gap. Future success does not fill a past missing
        interval automatically.
      id: d8c98ae2-e088-410b-9615-133f30a098ed
      type: scenario
      difficulty: 3
    - question: A retry delivers some records twice and the destination appends them into revenue totals. What should
        the integration design establish?
      options:
      - A rule to delete arbitrary rows until the total looks plausible.
      - A new random record ID on each retry.
      - Stable record identity and a deduplication or idempotent load rule consistent with delivery guarantees.
      - A guarantee that retries can never happen.
      correct: 2
      explanation: Repeated delivery must have a defined effect. Use identity-based handling and reconcile results
        rather than guessing which rows to remove.
      id: 0ddc2d24-5701-49dd-82a2-c4743289813a
      type: scenario
      difficulty: 4
- id: cohorts
  name: 'Cohorts: Static and Dynamic User Groups'
  difficulty: 4
  estimatedMinutes: 15
  tags:
  - posthog
  - querying
  section: querying
  prerequisites:
  - ph-person-properties
  - ph-event-properties
  encompassing:
  - concept: ph-person-properties
    weight: 0.45
  knowledgePoints:
  - id: static-vs-dynamic
    instruction: 'A **static cohort** is a selected set of people. A **dynamic cohort** computes membership from
      rules. Stored cohort membership can take time to refresh, so the visible list need not react instantly to
      a new event.


      Choose a fixed list for a defined invitation group and a rule-based cohort for a changing analytical population.
      Check refresh behavior when diagnosing membership.'
    workedExample: A pilot invitation list uses a static cohort. A report of people active during a rolling period
      uses a dynamic rule whose computed membership changes as the window moves.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data/cohorts
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: What distinguishes a dynamic cohort from a static one?
      options:
      - Dynamic membership is determined by rules that can be reevaluated.
      - Static cohorts automatically include every future matching person.
      - Static and dynamic cohorts always refresh at the same instant.
      - Dynamic cohorts always identify companies instead of people.
      correct: 0
      explanation: The membership mechanism differs. Refresh behavior is a separate operational property to check.
      id: 25ad966f-4bf4-4dd9-b3fb-f927ffc41a5a
      type: multiple_choice
      difficulty: 2
    - question: A team must invite exactly the 150 people approved for a pilot, even if their later behavior changes.
        Which cohort approach fits?
      options:
      - A rule selecting every visitor in the project.
      - A company group type used as if it were an invitation list.
      - A static cohort containing the approved list.
      - A rolling activity rule that adds new people automatically.
      correct: 2
      explanation: The requirement is a fixed selected population. A dynamic behavior rule could change that population.
      id: 306db1a1-2d0f-4e30-81ec-2c107d40a037
      type: scenario
      difficulty: 3
    - question: A new event matches a dynamic cohort's rule, but the saved member list has not updated yet. What
        should be checked before changing capture code?
      options:
      - Only whether the event is visible in any project, without checking the cohort's scope.
      - The exact rule, time window, identity, and cohort calculation or refresh status.
      - Change the cohort name while keeping its rule and calculation state unchanged.
      - Assume every dynamic cohort refreshes immediately and replay the event repeatedly.
      correct: 1
      explanation: Membership depends on the rule and its evaluation. Verify those boundaries before assuming event
        capture failed.
      id: f7c010c6-e73f-4792-8769-50690784dea5
      type: scenario
      difficulty: 4
  - id: cohorts-for-analysis-vs-rollout
    instruction: '**Analysis cohorts and rollout targeting** have different support rules. Standard dynamic behavioral
      or lifecycle cohorts are not generally supported for flag targeting. Person-property cohort conditions can
      be supported. An early real-time-cohort feature can support some event conditions, so check availability and
      exact restrictions.


      For an immediate rollout condition, use a supported targeting input with a clear update path instead of assuming
      every analysis cohort is eligible.'
    workedExample: A project without the real-time-cohort feature analyzes people who purchased yesterday. Before
      using that segment for a flag, the team checks supported targeting conditions and may maintain an authoritative
      eligibility property.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/data/cohorts
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: In a project without the real-time-cohort feature, which assumption about standard behavioral cohorts
        is unsafe?
      options:
      - Person-property inputs can be relevant to flag rules.
      - A saved cohort can have a refresh delay.
      - Supported targeting conditions should be checked.
      - Every behavioral analysis cohort can directly target a feature flag.
      correct: 3
      explanation: Analysis support does not imply rollout support. Check current cohort and flag constraints for
        the project.
      id: c24fc7ac-a02a-42d6-952c-ac3224282e55
      type: multiple_choice
      difficulty: 2
    - question: A project has no real-time-cohort feature and wants a flag for people who completed an event. It
        already has a trustworthy eligibility property updated by the application. Which approach should it evaluate?
      options:
      - Direct use of any standard behavioral cohort without checking support.
      - A rule that assumes a chart filter automatically becomes flag targeting.
      - Changing the event's name to the flag key.
      - A supported flag rule using that eligibility property and a verified update path.
      correct: 3
      explanation: Use an input supported by the flag system. Verify that its value and identity reach evaluation
        in time.
      id: e7af7bd2-b92b-47f3-9996-5f1e965842c8
      type: scenario
      difficulty: 3
    - question: A customer needs immediate event-based eligibility and points to an early real-time-cohort feature.
        What must be verified before promising the rollout?
      options:
      - Project access, supported event conditions, update latency, and end-to-end evaluation behavior.
      - Assume access to a beta feature guarantees the required update latency.
      - Only whether the standard analysis cohort has a nonzero member count.
      - Assume every historical cohort rule is supported by the early feature.
      correct: 0
      explanation: An early feature can have limited scope. Confirm the concrete rule and timing in the customer's
        environment before committing to the design.
      id: de57edd7-25d3-4372-87e5-a97a8c0f5525
      type: scenario
      difficulty: 4
- id: hogql-basics
  name: 'HogQL: SQL in PostHog'
  difficulty: 5
  estimatedMinutes: 16
  tags:
  - posthog
  - querying
  section: querying
  prerequisites:
  - ph-events
  - ph-event-properties
  - ph-persons
  encompassing:
  - concept: ph-events
    weight: 0.35
  - concept: ph-event-properties
    weight: 0.45
  - concept: ph-persons
    weight: 0.3
  knowledgePoints:
  - id: sql-expressions-and-insights
    instruction: '**HogQL** is PostHog''s SQL dialect for querying analytics data. A query must use the intended
      row grain, filters, time range, and aggregation. count() over event rows counts events, while a distinct-actor
      calculation answers a different question.


      Check field types and joins. A one-to-many join can multiply event rows and inflate aggregates unless the
      query accounts for the new grain.'
    workedExample: A user performs three purchase events. Counting event rows returns three purchases; a distinct-user
      measure returns one purchasing user. Name the metric according to its actual unit.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/sql
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: What does counting rows in an event table normally measure before any row-multiplying join?
      options:
      - The number of companies regardless of group context.
      - The number of event rows selected by the filters.
      - The number of unique people in every case.
      - The number of sessions regardless of session IDs.
      correct: 1
      explanation: Aggregation follows row grain. Unique people, groups, and sessions require the relevant identity
        and counting logic.
      id: d9277cc0-6901-4d07-ad22-37aedcd34319
      type: multiple_choice
      difficulty: 2
    - question: Three users each produce two matching events in a period. No joins duplicate rows. What does an
        event-row count return? Enter the number only.
      options: []
      correct: '6'
      explanation: 'The unit is events: three users times two events gives six rows. A distinct-user count would
        answer a different question.'
      type: fill_blank
      id: 93455aba-7aec-4a84-9ec6-de64cea74848
      difficulty: 3
    - question: Revenue doubles after joining each purchase to a table containing two matching contact records per
        account. What should you inspect and correct?
      options:
      - Join cardinality and aggregation grain, using an appropriate deduplicated or preaggregated join strategy.
      - Divide all joined totals by two as a permanent fix even when contact counts vary.
      - Use DISTINCT on the revenue amount alone, which can collapse legitimate equal-value purchases.
      - Round the revenue result to fewer decimal places.
      correct: 0
      explanation: The join multiplies purchase rows. Restore the intended grain before summing money; display formatting
        cannot fix the underlying duplication.
      id: 379a72a7-515f-4a96-add9-b268fb7c1372
      type: scenario
      difficulty: 4
  - id: when-to-use-hogql
    instruction: 'Use **SQL when the question needs explicit logic** such as a specialized join, derived metric,
      or validation that the standard insight builder cannot express well. A standard insight remains useful for
      supported common analyses.


      Make custom queries reviewable: document the unit, time window, filters, and denominator. Compare a small
      known sample before relying on a production result.


      To include accounts with zero usage, start from the full account population and left join usage aggregated
      by account. A left join retains accounts with no matching usage row. Treat a missing usage value as zero only
      when absence really means no recorded activity.'
    workedExample: A paying-accounts table contains A, B, and C. Usage totals exist for A and C. Starting from paying
      accounts and left joining usage preserves B; an inner join would omit it. Convert B's missing total to zero
      only after confirming that missing means no captured usage, rather than a failed data load.
    instructionContent:
    - type: link
      url: https://posthog.com/docs/sql
      title: Official reference
      description: Check the current documented behavior and platform-specific details.
    workedExampleContent: []
    problems:
    - question: Which requirement is a strong reason to use a custom SQL query?
      options:
      - A specific join and metric calculation that the standard insight configuration cannot express adequately.
      - A preference to make a simple supported chart harder to maintain.
      - A requirement to avoid documenting the denominator.
      - A belief that writing SQL automatically guarantees correct metrics.
      correct: 0
      explanation: Choose SQL for needed expressive control. Correctness still depends on data meaning, joins, and
        validation.
      id: 95cc7119-bd72-4862-9ed3-70da4bff23b7
      type: multiple_choice
      difficulty: 2
    - question: A conversion query divides purchasers by all event rows. The intended metric is purchasing users
        divided by eligible users. What needs correction?
      options:
      - Keep the event denominator and rename the output user conversion.
      - Both numerator and denominator must use the intended user populations and identity logic.
      - Count distinct event names as the denominator.
      - Use all pageviews as the denominator regardless of eligibility.
      correct: 1
      explanation: Define the populations and unit before calculating the ratio. Event counts and user counts are
        not interchangeable.
