brand:
  id: posthog
  name: PostHog TAM
  domain: posthog-tam.vercel.app
  tagline: Reason through PostHog data and identity
  faviconUrl: /favicon.ico
  orgSlug: posthog-tam
theme:
  preset: orange
  radius: 0.5rem
landing:
  hero:
    headline: Build evidence for technical customer answers
    subheadline: 'For PostHog TAMs: inspect capture payloads, trace identities, validate account metrics, and
      diagnose missing events with bounded evidence.'
    ctaText: Create an account
  features:
    heading: Capabilities you will practice
    subheading: Four connected foundation courses with worked traces, required applied practice, and separate
      exam cases.
    items:
    - title: Tracking contracts
      description: Check occurrence time, actor identity, numeric units, and authoritative business success.
      icon: Database
    - title: Identity and account attribution
      description: Trace anonymous-to-known transitions, logout boundaries, tenant IDs, and event group keys.
      icon: UserCheck
    - title: SQL metrics with evidence
      description: Work through query fragments, join multiplicity, zero-usage accounts, and independent result
        fixtures.
      icon: Brain
    - title: Bounded ingestion recovery
      description: Inspect capture responses, quota evidence, source retention, and the checks needed before replay
        or closure.
      icon: Workflow
  howItWorks:
    heading: How it works
    items:
    - title: Find the next foundation
      description: A diagnostic estimates your starting point across the connected concepts.
    - title: Study one step at a time
      description: Read or listen to a rule, follow a worked trace, then apply it to concrete evidence.
    - title: Check transfer
      description: Required applied practice and separate exam cases test whether you can use the rule with unfamiliar
        evidence.
  faq:
  - question: Who is this for?
    answer: PostHog TAMs and technical colleagues who want a stronger data, identity, querying, and ingestion
      foundation for customer investigations.
  - question: What does it cover?
    answer: Four foundation courses cover relational models, pipelines, PostHog events/persons/groups, identity,
      CDP delivery, cohorts, SQL reasoning, and ingestion diagnosis. This is a data and identity foundation. Full
      experimentation, replay, security, and solution-design curricula are outside this release.
  - question: How long does it take?
    answer: Study time depends on your prior knowledge and how much practice you need. You can return to the course
      at your own pace.
  bottomCta:
    headline: Practice the evidence behind your answer
    subheadline: Start with a foundation, then test it against payloads, identity traces, query results, and delivery
      signals.
seo:
  title: PostHog TAM data and identity foundation
  description: Practice capture contracts, identity transitions, account attribution, SQL metric validation, and
    bounded ingestion recovery in four connected PostHog TAM foundation courses.
  keywords:
  - posthog
  - technical account manager
  - onboarding
  - data model
  - ingestion pipeline
  - analytics
pricing:
  monthly: 0
  currency: usd
  trialDays: 0
