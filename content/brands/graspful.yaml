brand:
  id: graspful
  name: Graspful
  domain: graspful.vercel.app
  tagline: Build courses with practice and review
  logoUrl: /images/logo-graspful.svg
  faviconUrl: /favicon.ico
  ogImageUrl: /images/og-graspful.png
  orgSlug: graspful
theme:
  preset: purple
  radius: 0.625rem
landing:
  hero:
    headline: Build a course that responds to each learner.
    subheadline: >-
      Turn your source material into lessons, worked examples, and practice questions. Graspful uses learner answers to
      guide practice and schedule review.
    ctaText: Start a course draft
  features:
    heading: From source material to practice
    subheading: Keep the course content in files you can inspect and edit.
    items:
      - title: Author with your agent
        description: >-
          Use Claude, Codex, or another agent with the CLI or MCP tools to write a course from your source material. The
          CLI creates a draft scaffold for you to complete.
        icon: Bot
      - title: Inspect before publishing
        description: >-
          Review the lessons, worked examples, answers, and prerequisite graph. Run automated checks to find structural
          issues before you publish.
        icon: ShieldCheck
      - title: Guide practice and review
        description: >-
          Learner answers update progress estimates. Prerequisites guide lesson order, and review questions return on a
          schedule.
        icon: Brain
  howItWorks:
    heading: How it works
    items:
      - title: Start with source material
        description: >-
          Give your notes or course outline to your external agent. Use Graspful tools to create a YAML draft and add
          the lessons and practice questions.
      - title: Review the course
        description: >-
          Check the facts and answer explanations against your sources. Run validation and quality checks, then fix the
          findings.
      - title: Import, then publish
        description: Import the reviewed files as a draft. Inspect the result and publish when it is ready for learners.
  faq:
    - question: What is Graspful?
      answer: >-
        Graspful lets you publish courses with lessons, practice questions, prerequisite tracking, and scheduled review.
        Course content is stored in YAML files and managed through a CLI or MCP tools.
    - question: How is the course written?
      answer: >-
        You or your external agent, such as Claude or Codex, write the course from source material. Graspful tools
        create draft scaffolds, validate the files, and import them. Review the content before publishing.
    - question: What setup do I need?
      answer: >-
        You need an agent that can run CLI commands or use MCP tools. The quickstart explains tool setup, account
        registration, and the draft-to-publish workflow.
    - question: Can I sell a course yet?
      answer: >-
        Paid subscriptions and creator payouts are not available yet. Billing setup and verification are required before
        accepting payments.
    - question: Can I use my own branding?
      answer: >-
        A brand configuration controls the course landing page, colors, and copy. A custom domain also requires domain
        and hosting configuration.
    - question: How do students learn?
      answer: >-
        Students answer diagnostic questions, work through lessons and examples, and answer practice questions. Their
        answers update progress estimates and help schedule later review.
  bottomCta:
    headline: Start with one course draft
    subheadline: Bring a source document and an agent. Follow the quickstart to build, review, and import your first draft.
seo:
  title: "Graspful: Build courses with practice and review"
  description: >-
    Create courses from source material with your agent and Graspful CLI or MCP tools. Review and publish lessons with
    practice questions and scheduled review.
  keywords:
    - course creation
    - adaptive learning
    - practice questions
    - course authoring
    - CLI
    - MCP
    - spaced repetition
pricing:
  monthly: 0
  currency: usd
  trialDays: 0
