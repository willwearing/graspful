name: Publish packages to npm

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - cli
          - mcp
      dry_run:
        description: 'Dry run (no actual publish)'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'packages/cli/**'
      - 'packages/mcp/**'
      - 'packages/shared/**'
      - 'packages/client/**'
    tags:
      - 'v*'
      - 'cli@*'
      - 'mcp@*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.8.0

      - run: bun install --frozen-lockfile

      - name: Determine target
        id: target
        run: |
          TAG="${GITHUB_REF_NAME:-}"
          INPUT="${{ github.event.inputs.package }}"
          if [ -n "$INPUT" ]; then
            echo "target=$INPUT" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == cli@* ]]; then
            echo "target=cli" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == mcp@* ]]; then
            echo "target=mcp" >> "$GITHUB_OUTPUT"
          else
            echo "target=all" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package dependencies
        run: |
          bun run --cwd packages/shared build
          bun run --cwd packages/client build
          bun run --cwd packages/cli build
          bun run --cwd packages/mcp build

      - name: Test packages
        run: bun test --preload ./packages/client/test-support/preload.ts packages/shared/src packages/client/src packages/cli/src packages/mcp/src

      - name: Resolve workspace protocol for npm publish
        run: node packages/client/scripts/resolve-workspace-dependencies.cjs

      - name: Publish @graspful/shared
        if: github.event.inputs.dry_run != 'true'
        run: |
          cd packages/shared
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@graspful/shared@$VERSION" version >/dev/null 2>&1; then
            echo "@graspful/shared@$VERSION is already published"
          else
            npm publish --access public
          fi
      - name: Publish @graspful/client
        if: github.event.inputs.dry_run != 'true'
        run: |
          cd packages/client
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@graspful/client@$VERSION" version >/dev/null 2>&1; then
            echo "@graspful/client@$VERSION is already published"
          else
            npm publish --access public
          fi

      - name: Publish @graspful/cli
        if: (steps.target.outputs.target == 'all' || steps.target.outputs.target == 'cli') && github.event.inputs.dry_run != 'true'
        run: |
          cd packages/cli
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@graspful/cli@$VERSION" version >/dev/null 2>&1; then
            echo "@graspful/cli@$VERSION is already published"
          else
            npm publish --access public
          fi

      - name: Publish @graspful/mcp
        id: mcp_npm
        if: (steps.target.outputs.target == 'all' || steps.target.outputs.target == 'mcp') && github.event.inputs.dry_run != 'true'
        run: |
          cd packages/mcp
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@graspful/mcp@$VERSION" version >/dev/null 2>&1; then
            echo "@graspful/mcp@$VERSION is already published"
          else
            npm publish --access public
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      # List the current @graspful/mcp version in the official MCP Registry if it is missing
      # (registry.modelcontextprotocol.io). Directories such as PulseMCP read from it.
      - name: Install cosign
        if: (steps.target.outputs.target == 'all' || steps.target.outputs.target == 'mcp') && github.event.inputs.dry_run != 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Publish @graspful/mcp to the MCP Registry
        if: (steps.target.outputs.target == 'all' || steps.target.outputs.target == 'mcp') && github.event.inputs.dry_run != 'true'
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
        run: |
          set -euo pipefail
          cd packages/mcp
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(jq -r .name server.json)
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0/servers/${NAME/\//%2F}/versions/$VERSION")
          if [ "$status" = "200" ]; then
            echo "$NAME@$VERSION is already in the MCP Registry"
            exit 0
          fi
          # The registry checks npm, and a new npm version can take a few minutes to appear.
          for i in $(seq 1 60); do
            npm view "@graspful/mcp@$VERSION" version >/dev/null 2>&1 && break
            echo "Waiting for @graspful/mcp@$VERSION on npm ($i/60)"
            sleep 10
          done
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Dry run shared dependencies
        if: github.event.inputs.dry_run == 'true'
        run: |
          cd packages/shared && npm publish --access public --dry-run
          cd ../client && npm publish --access public --dry-run

      - name: Dry run CLI
        if: (steps.target.outputs.target == 'all' || steps.target.outputs.target == 'cli') && github.event.inputs.dry_run == 'true'
        run: cd packages/cli && npm publish --access public --dry-run

      - name: Dry run MCP
        if: (steps.target.outputs.target == 'all' || steps.target.outputs.target == 'mcp') && github.event.inputs.dry_run == 'true'
        run: cd packages/mcp && npm publish --access public --dry-run
