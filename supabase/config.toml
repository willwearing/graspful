# Supabase Auth configuration — pushed to remote via `supabase config push`
# This is the source of truth for auth redirect URLs.

[auth]
enabled = true
site_url = "https://graspful.ai"

# Wildcard covers ALL brand subdomains (deer-academy.graspful.ai, etc.)
# No manual updates needed when new brands are created.
additional_redirect_urls = [
  "http://localhost:3000/**",
  "http://localhost:3001/**",
  "https://graspful.ai/**",
  "https://graspful.vercel.app/**",
  "https://graspful-site.vercel.app/**",
  "https://*.graspful.ai/**",
  "https://posthog-tam.vercel.app/**",
  "https://firefighterprep.vercel.app/**",
  "https://electricianprep.vercel.app/**",
  "https://javascriptprep.vercel.app/**",
]

# Token hashes let the server verify email links in any browser, including resends.
[auth.email]
enable_signup = true
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Confirm your Graspful email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Graspful password"
content_path = "./supabase/templates/recovery.html"
